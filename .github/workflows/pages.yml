      - name: Patch Generator v0.17 to v0.19
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_v019.py <<'PY'
          from pathlib import Path
          import base64, re

          src_path=Path('work/index.html')
          s=src_path.read_text(encoding='utf-8')
          base64_hwpx=base64.b64encode(Path('/tmp/kfe-generic-base.hwpx').read_bytes()).decode('ascii')

          s=s.replace('HWPX 생성기 v0.17 · GitHub Pages','HWPX 생성기 v0.19 · GitHub Pages')
          s=s.replace('HWPX 생성기 v0.17</h1>','HWPX 생성기 v0.19</h1>')

          old="""function docxTableRowsRobust(tbl){
            const rows=[];
            for(const tr of pChildEls(tbl,'tr')){
              const cells=[];
              for(const tc of pChildEls(tr,'tc')) cells.push(directDescendantText(tc));
              if(cells.some(Boolean)) rows.push(cells);
            }
            return rows;
          }"""
          new="""function docxTableRobust(tbl){
            const rows=[];
            const rowWidths=[];
            for(const tr of pChildEls(tbl,'tr')){
              const cells=[],widths=[];
              for(const tc of pChildEls(tr,'tc')){
                cells.push(directDescendantText(tc));
                const tcW=pDescendants(tc,'tcW')[0];
                const w=Number(attrLocal(tcW,'w')||0);
                widths.push(Number.isFinite(w)&&w>0?w:0);
              }
              if(cells.some(Boolean)){
                rows.push(cells);
                rowWidths.push(widths);
              }
            }
            let colWidths=[];
            const first=rowWidths.find(r=>r.some(x=>x>0));
            if(first) colWidths=first.slice();
            if(!colWidths.length){
              const grid=pDescendants(tbl,'tblGrid')[0];
              if(grid) colWidths=pChildEls(grid,'gridCol').map(x=>Number(attrLocal(x,'w')||0));
            }
            return {rows,colWidths};
          }"""
          if old not in s: raise SystemExit('old table reader not found')
          s=s.replace(old,new)
          s=s.replace("""        const rows=docxTableRowsRobust(ch);
                  if(rows.length) blocks.push({type:'table',rows});""",
                      """        const t=docxTableRobust(ch);
                  if(t.rows.length) blocks.push({type:'table',rows:t.rows,colWidths:t.colWidths});""")

          start=s.index('function genericCleanTitle(')
          end=s.index('function validateTargetChoice',start)
          replacement=f'''const GENERIC_TEMPLATE_B64='{base64_hwpx}';

          function genericCleanTitle(s){{return cleanTitleText(String(s||'').replace(/[□■◆◇▶▷]+\\s*$/g,'').trim());}}
          function genericBlockText(block){{
            if(!block)return '';
            if(block.text)return cleanText(block.text);
            return '';
          }}
          function genericVisualLen(text){{
            let n=0;
            for(const ch of String(text||'')) n+=(ch.charCodeAt(0)<128?0.55:1);
            return n;
          }}
          function genericSetSingleRun(p,text,charPrId=null,paraPrId=null){{
            if(paraPrId!==null&&paraPrId!==undefined)p.setAttribute('paraPrIDRef',String(paraPrId));
            const runs=directRuns(p);
            if(runs.length){{
              if(charPrId!==null&&charPrId!==undefined)runs[0].setAttribute('charPrIDRef',String(charPrId));
              setRunText(runs[0],cleanText(text));
              runs.slice(1).forEach(r=>setRunText(r,''));
            }}else setFirstText(p,cleanText(text));
            clearLines(p);
            return p;
          }}
          function genericSetTitle(titleP,title){{
            const tbl=descendants(titleP,'tbl')[0];
            if(!tbl){{setFirstText(titleP,title);clearLines(titleP);return;}}
            const rows=direct(tbl,'tr');
            const mid=rows[Math.floor(rows.length/2)];
            const tc=mid&&direct(mid,'tc')[0];
            const sub=tc&&descendants(tc,'subList')[0];
            const p=sub&&direct(sub,'p')[0];
            if(!p)throw new Error('기본 양식 제목 셀을 찾지 못했습니다.');
            const runs=directRuns(p);
            if(!runs.length)throw new Error('기본 양식 제목 run을 찾지 못했습니다.');
            setRunText(runs[0],title);
            runs.slice(1).forEach(r=>setRunText(r,''));
            clearLines(p);
            clearLines(titleP);
          }}
          function genericMakeTablePara(tableParaTpl,block){{
            const rows=asArray(block?.rows);
            const p=clone(tableParaTpl),tbl=descendants(p,'tbl')[0];
            if(!tbl)throw new Error('기본 양식 표 골격을 찾지 못했습니다.');
            const originalRows=direct(tbl,'tr');
            if(originalRows.length<2)throw new Error('기본 양식 표 행 골격이 부족합니다.');
            const headerTrTpl=clone(originalRows[0]),bodyTrTpl=clone(originalRows[1]);
            const headerCells=direct(headerTrTpl,'tc'),bodyCells=direct(bodyTrTpl,'tc');
            originalRows.forEach(x=>x.parentNode.removeChild(x));
            const colCnt=Math.max(1,Math.min(12,Math.max(...rows.map(r=>asArray(r).length),1)));
            const tblSz=descendants(tbl,'sz')[0];
            const totalWidth=Number(tblSz?.getAttribute('width')||49486);
            let weights=asArray(block?.colWidths).slice(0,colCnt).map(x=>Number(x)||0);
            if(weights.length<colCnt||!weights.some(x=>x>0))weights=Array.from({{length:colCnt}},()=>1);
            const sum=weights.reduce((a,b)=>a+(b>0?b:1),0)||colCnt;
            let widths=weights.map(x=>Math.max(1,Math.floor(totalWidth*((x>0?x:1)/sum))));
            widths[widths.length-1]+=totalWidth-widths.reduce((a,b)=>a+b,0);
            tbl.setAttribute('rowCnt',String(rows.length));
            tbl.setAttribute('colCnt',String(colCnt));
            tbl.setAttribute('repeatHeader',rows.length>1?'1':'0');
            tbl.setAttribute('noAdjust','1');
            function chooseHeader(c){{
              if(c===0)return headerCells[0];
              if(c===colCnt-1)return headerCells[headerCells.length-1];
              return headerCells[Math.min(1,headerCells.length-1)];
            }}
            function chooseBody(c){{
              if(c===0)return bodyCells[0];
              if(c===colCnt-1)return bodyCells[bodyCells.length-1];
              return bodyCells[Math.min(2,bodyCells.length-1)];
            }}
            function rowHeight(vals){{
              let lines=1;
              for(let c=0;c<colCnt;c++){{
                const usable=Math.max(4,Math.floor(widths[c]/1150));
                lines=Math.max(lines,Math.ceil(genericVisualLen(vals[c]??'')/usable));
              }}
              return Math.max(3815,1500+lines*1500);
            }}
            function setCell(tc,r,c,text,height,isHeader){{
              const addr=descendants(tc,'cellAddr')[0],span=descendants(tc,'cellSpan')[0],cs=descendants(tc,'cellSz')[0];
              if(addr){{addr.setAttribute('colAddr',String(c));addr.setAttribute('rowAddr',String(r));}}
              if(span){{span.setAttribute('colSpan','1');span.setAttribute('rowSpan','1');}}
              if(cs){{cs.setAttribute('width',String(widths[c]));cs.setAttribute('height',String(height));}}
              const sub=descendants(tc,'subList')[0],ps=sub?direct(sub,'p'):descendants(tc,'p');
              const p0=ps[0];if(!p0)return;
              ps.slice(1).forEach(x=>x.parentNode.removeChild(x));
              const runs=directRuns(p0);
              if(runs.length){{
                runs[0].setAttribute('charPrIDRef',isHeader?'31':'32');
                setRunText(runs[0],cleanText(text));
                runs.slice(1).forEach(x=>setRunText(x,''));
              }}else setFirstText(p0,cleanText(text));
              clearLines(p0);
            }}
            let totalHeight=0;
            rows.forEach((row,r)=>{{
              const vals=asArray(row),isHeader=rows.length>1&&r===0,h=rowHeight(vals);totalHeight+=h;
              const tr=clone(isHeader?headerTrTpl:bodyTrTpl);
              direct(tr,'tc').forEach(x=>x.parentNode.removeChild(x));
              for(let c=0;c<colCnt;c++){{
                const tc=clone(isHeader?chooseHeader(c):chooseBody(c));
                setCell(tc,r,c,vals[c]??'',h,isHeader);
                tr.appendChild(tc);
              }}
              tbl.appendChild(tr);
            }});
            if(tblSz)tblSz.setAttribute('height',String(Math.max(totalHeight,3815)));
            clearLines(p);
            return p;
          }}
          function processGenericCommon(xml,common){{
            const doc=parseXml(xml),root=doc.documentElement,ps=topParagraphs(root);
            if(ps.length<21)throw new Error('한글 양식.hwpx 골격을 찾지 못했습니다.');
            const titleP=ps[0],meta=ps[1],blankTpl=clone(ps[2]),headingTpl=clone(ps[3]),bodyTpl=clone(ps[3]),subHeadingTpl=clone(ps[3]);
            const tableParaTpl=clone(ps.find(p=>{{const t=descendants(p,'tbl')[0];return t&&Number(t.getAttribute('colCnt')||0)===4;}}));
            if(!tableParaTpl)throw new Error('한글 양식.hwpx 표 골격을 찾지 못했습니다.');
            genericSetSingleRun(bodyTpl,'','22','33');
            genericSetSingleRun(subHeadingTpl,'','21','33');
            const title=genericCleanTitle(common?.document?.title||common?.facts?.event_name||'범용 검토');
            genericSetTitle(titleP,title);
            const old=textOf(meta),m=old.match(/\/\s*([^>]+)>/),dept=m?m[1].trim():'국제협력실';
            const mr=directRuns(meta)[0];
            if(mr)setRunText(mr,`< ${{formatFullDate(todaySeoul())}} / ${{dept}} >`);else setFirstText(meta,`< ${{formatFullDate(todaySeoul())}} / ${{dept}} >`);
            clearLines(meta);
            topParagraphs(root).slice(2).forEach(p=>root.removeChild(p));
            const blank=clone(blankTpl);setFirstText(blank,'');clearLines(blank);root.appendChild(blank);
            const append=(tpl,text,charPr=null,paraPr=null)=>{{
              const t=cleanText(text);if(!t)return;
              const p=clone(tpl);genericSetSingleRun(p,t,charPr,paraPr);root.appendChild(p);
            }};
            let emitted=0;
            for(const b of asArray(common?.blocks)){{
              if(!b)continue;
              if(b.type==='heading'){{
                const t=genericBlockText(b);if(!t||genericCleanTitle(t)===title)continue;
                if(Number(b.level||1)<=1)append(headingTpl,t,'27','33');
                else append(subHeadingTpl,t,'21','33');
                emitted++;continue;
              }}
              if(b.type==='paragraph'){{
                const t=genericBlockText(b);if(!t||genericCleanTitle(t)===title)continue;
                append(bodyTpl,t,'22','33');emitted++;continue;
              }}
              if(b.type==='table'&&Array.isArray(b.rows)&&b.rows.length){{
                root.appendChild(genericMakeTablePara(tableParaTpl,b));emitted+=b.rows.length;continue;
              }}
              if(Array.isArray(b.children))for(const c of b.children){{const t=genericBlockText(c);if(t){{append(bodyTpl,t,'22','33');emitted++;}}}}
            }}
            if(!emitted){{
              const f=common?.facts||{{}};
              const fallback=[...(f.main_content||[]),...(f.purpose||[])].map(x=>x?.text||x).filter(Boolean);
              fallback.forEach(t=>append(bodyTpl,t,'22','33'));emitted=fallback.length;
            }}
            if(!emitted)append(bodyTpl,'원문에서 표시할 본문을 추출하지 못했습니다.','22','33');
            return {{xml:serializeXml(doc),preview:makePreviewText(root)}};
          }}
          async function generateGenericHwpx(common){{
            const src=await JSZip.loadAsync(GENERIC_TEMPLATE_B64,{{base64:true}});
            const sec=src.file('Contents/section0.xml');if(!sec)throw new Error('범용 기본 HWPX 템플릿 오류');
            const processed=processGenericCommon(await sec.async('string'),common);
            const out=new JSZip();
            if(src.file('mimetype'))out.file('mimetype',await src.file('mimetype').async('uint8array'),{{compression:'STORE'}});
            for(const name of Object.keys(src.files)){{
              if(name==='mimetype')continue;const e=src.files[name];
              if(e.dir){{out.folder(name);continue;}}
              if(name==='Contents/section0.xml')out.file(name,processed.xml,{{compression:'DEFLATE'}});
              else if(name==='Preview/PrvText.txt')out.file(name,processed.preview,{{compression:'DEFLATE'}});
              else out.file(name,await e.async('uint8array'),{{compression:'DEFLATE'}});
            }}
            const blob=await out.generateAsync({{type:'blob',mimeType:'application/haansofthwpx',compression:'DEFLATE'}});
            return {{blob,name:safeName(genericCleanTitle(common?.document?.title||'범용검토')+'_범용검토')+'.hwpx',tid:'kfe-generic-review-v1'}};
          }}
          '''
          s=s[:start]+replacement+s[end:]

          # strict-but-compatible local font registration
          start=s.index('async function registerPdfFonts(')
          end=s.index('async function renderGeneratedHwpxToPdf',start)
          fontfunc=r'''async function registerPdfFonts(fontsRequired){
            if(typeof RhwpToPdf.registerPdfFont!=='function')throw new Error('PDF 폰트 등록 기능이 없는 렌더러입니다.');
            RhwpToPdf.clearPdfFonts?.();
            const queryFn=typeof window.queryLocalFonts==='function'?()=>window.queryLocalFonts():(navigator.fonts&&typeof navigator.fonts.query==='function'?()=>navigator.fonts.query():null);
            if(!queryFn)throw new Error('실제 한글 미리보기에는 Chrome/Edge의 로컬 글꼴 접근이 필요합니다.');
            let locals;try{locals=await queryFn();}catch(e){throw new Error('로컬 글꼴 접근이 거부되었습니다. 브라우저에서 글꼴 권한을 허용해 주세요.');}
            const norm=s=>String(s||'').toLowerCase().replace(/[\s_\-]/g,'');
            const alias=(req,fam)=>{
              const r=norm(req),f=norm(fam);if(!r||!f)return false;if(r===f||f.includes(r)||r.includes(f))return true;
              if(/hy헤드라인|hyheadline/i.test(req))return /(hy|한양).*(헤드라인|headline)/i.test(fam);
              if(/한양중고딕|hy.*중고딕|hanyang.*jung|hy.*gothic/i.test(req))return /(한양|hanyang|hy).*(중고딕|jung|gothic)/i.test(fam);
              if(/휴먼명조|human.*myeong|human.*myung/i.test(req))return /(휴먼|human).*(명조|myeong|myung)/i.test(fam);
              return false;
            };
            const req=Array.from(fontsRequired||[]).map(x=>String(x).trim()).filter(Boolean);
            const core=['HY헤드라인M','한양중고딕','휴먼명조'];
            const picked=[],seen=new Set();
            const add=f=>{const key=(f.fullName||f.family||'')+'|'+(f.style||'');if(!seen.has(key)){seen.add(key);picked.push(f);}};
            const findFont=name=>locals.find(f=>alias(name,String(f.family||f.fullName||'')));
            const missing=[];
            for(const name of core){const f=findFont(name);if(f)add(f);else missing.push(name);}
            if(missing.length)throw new Error('기본 양식 글꼴을 찾지 못했습니다: '+missing.join(', ')+' · 대체 글꼴로 미리보기를 만들지 않습니다.');
            for(const name of req){const f=findFont(name);if(f)add(f);}
            let ok=0;for(const f of picked.slice(0,24)){try{const b=await f.blob();RhwpToPdf.registerPdfFont(new Uint8Array(await b.arrayBuffer()));ok++;}catch(_e){}}
            if(ok<core.length)throw new Error('기본 양식 글꼴 등록에 실패했습니다.');
            return picked.slice(0,24).map(f=>f.family||f.fullName).filter(Boolean);
          }
          '''
          s=s[:start]+fontfunc+s[end:]

          src_path.write_text(s,encoding='utf-8')
          print('patched',src_path,len(s))
          PY

          python3 /tmp/patch_v019.py

          test -s work/index.html
          grep -q "HWPX 생성기 v0.19" work/index.html
          grep -q "GENERIC_TEMPLATE_B64" work/index.html
          grep -q "function docxTableRobust" work/index.html
          grep -q "function genericMakeTablePara" work/index.html
          grep -q "async function generateGenericHwpx" work/index.html
          grep -q "기본 양식 글꼴을 찾지 못했습니다" work/index.html

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail

          cp work/index.html site/index.html
          test ! -s work/README.md || cp work/README.md site/README.md
          test ! -s work/NOTICE.md || cp work/NOTICE.md site/NOTICE.md
          touch site/.nojekyll

      - name: Download pinned rhwptopdf renderer
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --retry 3 --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd.js \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd.js

          curl -L --fail --retry 3 --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd_bg.wasm \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd_bg.wasm

          echo "7913400eae742e9f15f320fc377d5961a63216840f290a4c280fbe731ec3c0cd  site/vendor/rhwptopdf.umd.js" | sha256sum -c -
          echo "7a3e1e3e3a8d2a5bea64feac7bd8a2b556687a70874003fcf2aa6677e92f83a7  site/vendor/rhwptopdf.umd_bg.wasm" | sha256sum -c -

      - name: Verify site before deploy
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/vendor/rhwptopdf.umd.js
          test -s site/vendor/rhwptopdf.umd_bg.wasm

          grep -q "vendor/rhwptopdf.umd.js" site/index.html
          grep -q "rhwptopdf.umd_bg.wasm" site/index.html
          grep -q "HWPX 생성기 v0.19" site/index.html

          python3 -m http.server 8765 --bind 127.0.0.1 --directory site \
            >/tmp/hwpx-pages-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/hwpx-pages-http.log || true
            exit 1
          fi

          curl -fsS -o /dev/null http://127.0.0.1:8765/
          curl -fsS -o /dev/null http://127.0.0.1:8765/vendor/rhwptopdf.umd.js
          curl -fsS -o /dev/null http://127.0.0.1:8765/vendor/rhwptopdf.umd_bg.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy HWPX Generator to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy HWPX Generator to Pages"
            echo
            echo "- Workflow: pages.yml"
            echo "- Version: V9"
            echo "- Generator: HWPX Generator v0.19"
            echo "- Generic base: 한글 양식.hwpx"
            echo "- Generic title: HY헤드라인M 19pt"
            echo "- Generic meta: 한양중고딕 12pt"
            echo "- Generic heading: HY헤드라인M 16pt Bold"
            echo "- Generic body: 휴먼명조 15pt"
            echo "- Generic table: 한양중고딕 12pt"
            echo "- Renderer: rhwptopdf v0.2.2"
            echo "- Deployment: actions/deploy-pages@v4"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
