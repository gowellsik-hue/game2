name: Deploy HWPX Generator to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -eux

          rm -rf _site
          mkdir -p _site/vendor

          cp index.html _site/index.html

          curl -L --fail --retry 3 \
            -o _site/vendor/rhwptopdf.umd.js \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd.js

          curl -L --fail --retry 3 \
            -o _site/vendor/rhwptopdf.umd_bg.wasm \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd_bg.wasm

          test -s _site/index.html
          test -s _site/vendor/rhwptopdf.umd.js
          test -s _site/vendor/rhwptopdf.umd_bg.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
