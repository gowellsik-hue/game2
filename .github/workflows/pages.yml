# FILE: .github/workflows/pages.yml
# VERSION: V11
# PURPOSE: Deploy HWPX Generator to Pages
# GENERATOR: HWPX Generator v0.19
# GENERIC BASE: user-provided 한글 양식.hwpx
# GENERIC FORMAT: preserve source content/structure, use the base HWPX's existing styles only
# PREVIEW: generated HWPX -> rhwptopdf v0.2.2 -> PDF preview
# DEPLOY: GitHub Pages official Actions deployment
# TARGET: https://gowellsik-hue.github.io/game2/

name: Deploy HWPX Generator to Pages

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - HWPX_Generator_GitHub_v0.17.zip

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore HWPX Generator v0.17
        shell: bash
        run: |
          set -euo pipefail

          test -s HWPX_Generator_GitHub_v0.17.zip || {
            echo "ERROR: HWPX_Generator_GitHub_v0.17.zip not found."
            exit 1
          }

          rm -rf work site
          mkdir -p work site/vendor

          unzip -q HWPX_Generator_GitHub_v0.17.zip -d work

          test -s work/index.html

      - name: Restore generic base and v0.19 patch
        shell: bash
        run: |
          set -euo pipefail

          export V9_SHA="abebecfa6937467d035be82b9566b90996330d48"
          export V10_SHA="7a07c19e8729be225d42e7e7c344e92c2dc46726"

          git cat-file -e "${V9_SHA}^{commit}"
          git cat-file -e "${V10_SHA}^{commit}"

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import os
          import re
          import subprocess
          import textwrap
          import zipfile

          v9_sha = os.environ["V9_SHA"]
          v10_sha = os.environ["V10_SHA"]

          def read_workflow(sha):
              return subprocess.check_output(
                  [
                      "git",
                      "show",
                      f"{sha}:.github/workflows/pages.yml",
                  ],
                  text=True,
                  encoding="utf-8",
              )

          v9 = read_workflow(v9_sha)

          base_match = re.search(
              r"<<'GENERIC_HWPX_B64'\s*\n"
              r"(.*?)"
              r"\n\s*GENERIC_HWPX_B64\s*$",
              v9,
              re.S | re.M,
          )

          if not base_match:
              raise SystemExit(
                  "ERROR: V9 generic HWPX base64 block not found."
              )

          encoded = "".join(
              line.strip()
              for line in base_match.group(1).splitlines()
              if line.strip()
          )

          try:
              hwpx = base64.b64decode(
                  encoded,
                  validate=True,
              )
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: generic HWPX base64 decode failed: {exc}"
              )

          if not hwpx.startswith(b"PK"):
              raise SystemExit(
                  "ERROR: restored generic HWPX is not a ZIP/HWPX file."
              )

          try:
              with zipfile.ZipFile(io.BytesIO(hwpx), "r") as zf:
                  required = {
                      "mimetype",
                      "Contents/header.xml",
                      "Contents/section0.xml",
                  }

                  names = set(zf.namelist())

                  missing = required - names

                  if missing:
                      raise RuntimeError(
                          "missing HWPX entries: "
                          + ", ".join(sorted(missing))
                      )

                  bad = zf.testzip()

                  if bad:
                      raise RuntimeError(
                          f"corrupt ZIP entry: {bad}"
                      )

          except Exception as exc:
              raise SystemExit(
                  f"ERROR: generic HWPX validation failed: {exc}"
              )

          Path(
              "/tmp/kfe-generic-base.hwpx"
          ).write_bytes(hwpx)

          v10 = read_workflow(v10_sha)

          patch_match = re.search(
              r"cat > /tmp/patch_v019\.py <<'PY'\s*\n"
              r"(.*?)"
              r"\n\s*PY\s*\n"
              r"\s*python3 /tmp/patch_v019\.py",
              v10,
              re.S,
          )

          if not patch_match:
              raise SystemExit(
                  "ERROR: V10 v0.19 patch script not found."
              )

          patch = textwrap.dedent(
              patch_match.group(1)
          )

          if "GENERIC_TEMPLATE_B64" not in patch:
              raise SystemExit(
                  "ERROR: extracted v0.19 patch is incomplete."
              )

          if "generateGenericHwpx" not in patch:
              raise SystemExit(
                  "ERROR: generic HWPX generator code is missing."
              )

          if "registerPdfFonts" not in patch:
              raise SystemExit(
                  "ERROR: PDF font registration code is missing."
              )

          Path(
              "/tmp/patch_v019.py"
          ).write_text(
              patch,
              encoding="utf-8",
          )

          print(
              "generic base restored:",
              len(hwpx),
              "bytes",
          )

          print(
              "v0.19 patch restored:",
              len(patch),
              "chars",
          )
          PY

          test -s /tmp/kfe-generic-base.hwpx
          test -s /tmp/patch_v019.py

          python3 -m py_compile /tmp/patch_v019.py

      - name: Patch Generator v0.17 to v0.19
        shell: bash
        run: |
          set -euo pipefail

          python3 /tmp/patch_v019.py

          test -s work/index.html

          grep -q "HWPX 생성기 v0.19" work/index.html
          grep -q "GENERIC_TEMPLATE_B64" work/index.html
          grep -q "function docxTableRobust" work/index.html
          grep -q "function genericMakeTablePara" work/index.html
          grep -q "async function generateGenericHwpx" work/index.html
          grep -q "기본 양식 글꼴을 찾지 못했습니다" work/index.html

      - name: Verify generated JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path(
              "work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",
              html,
              flags=re.S | re.I,
          )

          if not scripts:
              raise SystemExit(
                  "ERROR: inline JavaScript not found."
              )

          Path(
              "/tmp/generated-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8",
          )
          PY

          node --check /tmp/generated-inline.js

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail

          cp work/index.html site/index.html

          test ! -s work/README.md || \
            cp work/README.md site/README.md

          test ! -s work/NOTICE.md || \
            cp work/NOTICE.md site/NOTICE.md

          touch site/.nojekyll

      - name: Download pinned rhwptopdf renderer
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --retry 3 --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd.js \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd.js

          curl -L --fail --retry 3 --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd_bg.wasm \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd_bg.wasm

          echo "7913400eae742e9f15f320fc377d5961a63216840f290a4c280fbe731ec3c0cd  site/vendor/rhwptopdf.umd.js" \
            | sha256sum -c -

          echo "7a3e1e3e3a8d2a5bea64feac7bd8a2b556687a70874003fcf2aa6677e92f83a7  site/vendor/rhwptopdf.umd_bg.wasm" \
            | sha256sum -c -

      - name: Verify site before deploy
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/vendor/rhwptopdf.umd.js
          test -s site/vendor/rhwptopdf.umd_bg.wasm

          grep -q "vendor/rhwptopdf.umd.js" site/index.html
          grep -q "rhwptopdf.umd_bg.wasm" site/index.html
          grep -q "HWPX 생성기 v0.19" site/index.html

          python3 -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory site \
            >/tmp/hwpx-pages-http.log 2>&1 &

          server=$!

          trap \
            'kill "$server" 2>/dev/null || true' \
            EXIT

          ready=0

          for i in $(seq 1 30); do
            if curl -fsS \
              -o /dev/null \
              http://127.0.0.1:8765/; then
              ready=1
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/hwpx-pages-http.log || true
            exit 1
          fi

          curl -fsS \
            -o /dev/null \
            http://127.0.0.1:8765/

          curl -fsS \
            -o /dev/null \
            http://127.0.0.1:8765/vendor/rhwptopdf.umd.js

          curl -fsS \
            -o /dev/null \
            http://127.0.0.1:8765/vendor/rhwptopdf.umd_bg.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy HWPX Generator to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy HWPX Generator to Pages"
            echo
            echo "- Workflow: pages.yml"
            echo "- Version: V11"
            echo "- Generator: HWPX Generator v0.19"
            echo "- Generic base: 한글 양식.hwpx"
            echo "- Generic title: HY헤드라인M 19pt"
            echo "- Generic meta: 한양중고딕 12pt"
            echo "- Generic heading: HY헤드라인M 16pt Bold"
            echo "- Generic body: 휴먼명조 15pt"
            echo "- Generic table: 한양중고딕 12pt"
            echo "- Renderer: rhwptopdf v0.2.2"
            echo "- Deployment: actions/deploy-pages@v4"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
