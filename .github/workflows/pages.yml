# FILE: .github/workflows/pages.yml
# VERSION: V13
# GENERATOR: HWPX Generator v0.20

name: Deploy HWPX Generator to Pages

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - HWPX_Generator_GitHub_v0.20.zip

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy V13 / Generator v0.20
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site V13
        shell: bash
        run: |
          set -euo pipefail

          test -s HWPX_Generator_GitHub_v0.20.zip

          rm -rf site
          mkdir -p site/vendor
          unzip -q HWPX_Generator_GitHub_v0.20.zip -d site
          touch site/.nojekyll

          test -s site/index.html
          test -s site/templates/kfe-generic-base.hwpx
          grep -q "HWPX 생성기 v0.20" site/index.html
          grep -q "Workflow V13" site/index.html

      - name: Download HWPX PDF renderer
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --retry 3 --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd.js \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd.js

          curl -L --fail --retry 3 --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd_bg.wasm \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd_bg.wasm

          test -s site/vendor/rhwptopdf.umd.js
          test -s site/vendor/rhwptopdf.umd_bg.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy HWPX Generator to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy HWPX Generator to Pages"
            echo "- Workflow: V13"
            echo "- Generator: v0.20"
            echo "- Package: HWPX_Generator_GitHub_v0.20.zip"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
