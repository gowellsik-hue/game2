# FILE: .github/workflows/pages.yml
# VERSION: V5
# PURPOSE: Deploy HWPX Generator to Pages
# SOURCE: HWPX_Generator_GitHub_v0.17.zip
# PREVIEW: Generated HWPX -> rhwptopdf v0.2.2 -> PDF preview
# TARGET: https://gowellsik-hue.github.io/game2/

name: Deploy HWPX Generator to Pages

"on":
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - HWPX_Generator_GitHub_v0.17.zip

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generator package
        shell: bash
        run: |
          set -euo pipefail

          test -s HWPX_Generator_GitHub_v0.17.zip || {
            echo "ERROR: HWPX_Generator_GitHub_v0.17.zip not found."
            exit 1
          }

          echo "Generator package found."
          ls -lh HWPX_Generator_GitHub_v0.17.zip

      - name: Extract HWPX Generator
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          unzip -q HWPX_Generator_GitHub_v0.17.zip -d site

          rm -rf site/.github

          test -s site/index.html || {
            echo "ERROR: index.html not found after extraction."
            exit 1
          }

          mkdir -p site/vendor
          touch site/.nojekyll

          echo "Generator extracted."
          ls -lh site/index.html

      - name: Download rhwptopdf v0.2.2
        shell: bash
        run: |
          set -euo pipefail

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd.js \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd.js

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd_bg.wasm \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd_bg.wasm

          test -s site/vendor/rhwptopdf.umd.js || {
            echo "ERROR: rhwptopdf.umd.js download failed."
            exit 1
          }

          test -s site/vendor/rhwptopdf.umd_bg.wasm || {
            echo "ERROR: rhwptopdf.umd_bg.wasm download failed."
            exit 1
          }

          echo "rhwptopdf renderer downloaded."

      - name: Verify generator files
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/vendor/rhwptopdf.umd.js
          test -s site/vendor/rhwptopdf.umd_bg.wasm

          grep -q "./vendor/rhwptopdf.umd.js" site/index.html || {
            echo "ERROR: index.html does not reference rhwptopdf.umd.js."
            exit 1
          }

          grep -q "./vendor/rhwptopdf.umd_bg.wasm" site/index.html || {
            echo "ERROR: index.html does not reference rhwptopdf.umd_bg.wasm."
            exit 1
          }

          grep -q "HWPX" site/index.html || {
            echo "ERROR: HWPX Generator content not detected."
            exit 1
          }

          echo "Static file verification passed."

      - name: Test site locally
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server \
            8765 \
            --bind 127.0.0.1 \
            --directory site \
            >/tmp/hwpx-pages-http.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
          }

          trap cleanup EXIT

          ready=0

          for i in $(seq 1 30); do
            if curl -fsS \
              -o /dev/null \
              http://127.0.0.1:8765/; then
              ready=1
              break
            fi

            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            echo "ERROR: local test server did not start."
            cat /tmp/hwpx-pages-http.log || true
            exit 1
          fi

          curl -fsS \
            -o /dev/null \
            http://127.0.0.1:8765/

          curl -fsS \
            -o /dev/null \
            http://127.0.0.1:8765/vendor/rhwptopdf.umd.js

          curl -fsS \
            -o /dev/null \
            http://127.0.0.1:8765/vendor/rhwptopdf.umd_bg.wasm

          echo "Local HTTP verification passed."

      - name: Deploy HWPX Generator to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: false
          force_orphan: true
          enable_jekyll: false

      - name: Report deployment
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy HWPX Generator to Pages"
            echo
            echo "- Workflow: pages.yml"
            echo "- Version: V5"
            echo "- Generator: HWPX_Generator_GitHub_v0.17.zip"
            echo "- Renderer: rhwptopdf v0.2.2"
            echo "- Publish branch: gh-pages"
            echo "- URL: https://gowellsik-hue.github.io/game2/"
          } >> "$GITHUB_STEP_SUMMARY"
