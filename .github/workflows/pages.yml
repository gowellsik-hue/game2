# FILE: .github/workflows/pages.yml
# VERSION: V16
# GENERATOR: HWPX Generator v0.20

name: Deploy HWPX Generator to Pages
run-name: "V16 / HWPX v0.20"

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - HWPX_Generator_GitHub_v0.17.zip
      - kfe-generic-base.hwpx

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: V16 / HWPX v0.20
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout V16
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify generic base HWPX
        shell: bash
        run: |
          set -euo pipefail

          echo "===== V16 / VERIFY BASE HWPX ====="

          test -s kfe-generic-base.hwpx || {
            echo "::error::V16: kfe-generic-base.hwpx missing from repository root"
            exit 1
          }

          echo "c7518eaf74ecb6d30da55339ea5344a2fba32e71c9ebdb084c94cdb73ae40624  kfe-generic-base.hwpx" | sha256sum -c -

          unzip -tq kfe-generic-base.hwpx >/dev/null

          cp kfe-generic-base.hwpx /tmp/kfe-generic-base.hwpx

          test -s /tmp/kfe-generic-base.hwpx

          echo "===== V16 BASE HWPX OK ====="

      - name: Build V16 / HWPX v0.20
        shell: bash
        run: |
          set -euo pipefail

          echo "===== V16 / HWPX v0.20 ====="

          test -s HWPX_Generator_GitHub_v0.17.zip || {
            echo "::error::V16: HWPX_Generator_GitHub_v0.17.zip missing"
            exit 1
          }

          rm -rf work site
          mkdir -p work site/vendor

          unzip -q HWPX_Generator_GitHub_v0.17.zip -d work

          test -s work/index.html || {
            echo "::error::V16: index.html missing from v0.17 package"
            exit 1
          }

          export PATCH_SHA="7a07c19e8729be225d42e7e7c344e92c2dc46726"

          git cat-file -e "${PATCH_SHA}^{commit}" || {
            echo "::error::V16: patch source commit not found"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import textwrap

          patch_sha = os.environ["PATCH_SHA"]

          workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{patch_sha}:.github/workflows/pages.yml",
              ],
              text=True,
              encoding="utf-8",
          )

          match = re.search(
              r"cat > /tmp/patch_v019\.py <<'PY'\s*\n"
              r"(.*?)"
              r"\n\s*PY\s*\n"
              r"\s*python3 /tmp/patch_v019\.py",
              workflow,
              re.S,
          )

          if not match:
              raise SystemExit(
                  "V16: v0.19 generator patch not found in source commit"
              )

          patch = textwrap.dedent(match.group(1))

          Path("/tmp/patch_v019.py").write_text(
              patch,
              encoding="utf-8",
          )
          PY

          python3 -m py_compile /tmp/patch_v019.py
          python3 /tmp/patch_v019.py

          test -s work/index.html || {
            echo "::error::V16: patched index.html missing"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path("work/index.html")
          html = path.read_text(encoding="utf-8")

          html = html.replace(
              "HWPX 생성기 v0.19 · GitHub Pages",
              "HWPX 생성기 v0.20 · Workflow V16 · GitHub Pages",
          )

          html = html.replace(
              "HWPX 생성기 v0.19</h1>",
              "HWPX 생성기 v0.20</h1>",
          )

          badge = (
              '<div id="buildVersion" '
              'style="position:fixed;top:8px;left:8px;z-index:99999;'
              'background:#111;color:#fff;border:2px solid #fff;'
              'border-radius:6px;padding:8px 12px;'
              'font:700 14px/1.2 Arial,sans-serif;'
              'box-shadow:0 2px 8px #0006">'
              'V16 · HWPX v0.20'
              '</div>'
          )

          if '<body>' in html:
              html = html.replace(
                  '<body>',
                  '<body>' + badge,
                  1,
              )

          elif '<body ' in html:
              start = html.find('<body ')
              end = html.find('>', start)

              if end < 0:
                  raise SystemExit(
                      "V16: malformed body tag"
                  )

              html = (
                  html[:end + 1]
                  + badge
                  + html[end + 1:]
              )

          else:
              raise SystemExit(
                  "V16: body tag not found"
              )

          path.write_text(
              html,
              encoding="utf-8",
          )
          PY

          grep -q "V16 · HWPX v0.20" work/index.html || {
            echo "::error::V16: visible version badge missing"
            exit 1
          }

          grep -q "HWPX 생성기 v0.20" work/index.html || {
            echo "::error::V16: generator version text missing"
            exit 1
          }

          grep -q "GENERIC_TEMPLATE_B64" work/index.html || {
            echo "::error::V16: generic HWPX template not embedded"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path(
              "work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r'<script'
              r'(?![^>]*\bsrc=)'
              r'[^>]*>'
              r'(.*?)'
              r'</script>',
              html,
              flags=re.S | re.I,
          )

          if not scripts:
              raise SystemExit(
                  "V16: inline JavaScript not found"
              )

          Path(
              "/tmp/v16-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8",
          )
          PY

          node --check /tmp/v16-inline.js

          cp work/index.html site/index.html

          if [ -s work/README.md ]; then
            cp work/README.md site/README.md
          fi

          if [ -s work/NOTICE.md ]; then
            cp work/NOTICE.md site/NOTICE.md
          fi

          touch site/.nojekyll

          echo "===== V16 BUILD OK / HWPX v0.20 ====="

      - name: Download HWPX PDF renderer
        shell: bash
        run: |
          set -euo pipefail

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd.js \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd.js

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o site/vendor/rhwptopdf.umd_bg.wasm \
            https://github.com/sanguneo/rhwptopdf/releases/download/v0.2.2/rhwptopdf.umd_bg.wasm

          test -s site/vendor/rhwptopdf.umd.js || {
            echo "::error::V16: rhwptopdf JS download failed"
            exit 1
          }

          test -s site/vendor/rhwptopdf.umd_bg.wasm || {
            echo "::error::V16: rhwptopdf WASM download failed"
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy V16 / HWPX v0.20
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report V16
        if: always()
        shell: bash
        run: |
          {
            echo "# V16 / HWPX v0.20"
            echo ""
            echo "- Workflow: V16"
            echo "- Generator: v0.20"
            echo "- Base HWPX: kfe-generic-base.hwpx"
            echo "- Page badge: V16 · HWPX v0.20"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
