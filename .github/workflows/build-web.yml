
name: "build-web.yml | V30 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V30 | Original Sanctuary engine runtime test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read

concurrency:
  group: build-web-yml-v30-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v30:
    name: "build-web.yml | V30 | Run ORIGINAL Lineage client, no HTML replacement"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V30 | Checkout game2"
        uses: actions/checkout@v4

      - name: "V30 | Download original Sanctuary archive (46 volumes)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gowellsik-hue/game2'
          mkdir -p original native reports
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original --clobber
          test "$(find original -maxdepth 1 -type f | wc -l)" -eq 46
          for i in $(seq -w 1 45); do
            test -s "original/Sanctuary.of.Aden.-.Copy.z${i}"
          done
          test -s original/Sanctuary.of.Aden.-.Copy.zip

      - name: "V30 | Install original client test dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            p7zip-full file binutils wine wine64 wine32:i386 \
            xvfb x11-utils imagemagick curl locales fonts-nanum
          sudo locale-gen ko_KR.UTF-8
          wine --version | tee reports/V30-wine-version.txt
          df -h . > reports/V30-free-space-before-extract.txt

      - name: "V30 | Extract ALL original data including maps and sound"
        shell: bash
        run: |
          set -euo pipefail
          archive='original/Sanctuary.of.Aden.-.Copy.zip'
          7z l -slt "$archive" > reports/V30-original-archive-list.txt
          7z x "$archive" -onative -y \
            > reports/V30-all-assets-extract.log
          root='native/Sanctuary of Aden - Copy'
          for exe in Lineage.exe Login.exe Launcher.exe; do
            test -s "$root/$exe"
            file "$root/$exe" >> reports/V30-original-binary-types.txt
          done
          for asset in Sprite.pak Sprite.idx Tile.pak Tile.idx \
                       Text.pak Sprite00.pak Sprite15.pak; do
            test -s "$root/$asset"
          done
          test -d "$root/map"
          test -d "$root/sound"
          test "$(find "$root/map" -type f | wc -l)" -gt 100
          test "$(find "$root/sound" -type f | wc -l)" -gt 100
          find "$root" -type f | wc -l \
            > reports/V30-extracted-file-count.txt
          du -sh native > reports/V30-extracted-size.txt
          df -h . > reports/V30-free-space-after-extract.txt
          rm -rf original

      - name: "V30 | Install Wine Mono and run original EXEs on Xvfb"
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export WINEARCH=win32
          export WINEPREFIX="$RUNNER_TEMP/v30-original-wine"
          export LANG=ko_KR.UTF-8
          export LC_ALL=ko_KR.UTF-8
          export WINEDEBUG=+mscoree,+seh
          mkdir -p "$WINEPREFIX"

          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp \
            > reports/V30-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'wineserver -k >/dev/null 2>&1 || true; kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 3
          timeout --kill-after=5s 90s wineboot --init \
            > reports/V30-wineboot.log 2>&1 || true

          mono_file="$RUNNER_TEMP/wine-mono-9.0.0-x86.msi"
          curl --fail --location --silent --show-error \
            --retry 3 --max-time 240 \
            'https://dl.winehq.org/wine/wine-mono/9.0.0/wine-mono-9.0.0-x86.msi' \
            -o "$mono_file"
          test "$(stat -c %s "$mono_file")" -gt 50000000
          mono_rc=0
          timeout --kill-after=10s 240s \
            wine msiexec /i "$mono_file" /qn /norestart \
            > reports/V30-mono-install.log 2>&1 || mono_rc=$?
          echo "mono_install_exit_code=$mono_rc" \
            > reports/V30-mono-observed.txt
          wine uninstaller --list > reports/V30-mono-registry.txt 2>&1 || true
          rm -f "$mono_file"
          wineserver -k >/dev/null 2>&1 || true
          sleep 3

          root="$PWD/native/Sanctuary of Aden - Copy"
          for exe in Lineage.exe Login.exe Launcher.exe; do
            label="${exe%.exe}"
            echo "V30: testing ORIGINAL ${exe} with full data"
            (
              cd "$root"
              timeout --kill-after=5s 50s wine "./$exe"
            ) > "reports/V30-${label}-wine.log" 2>&1 &
            pid=$!
            sleep 18
            alive=no
            if kill -0 "$pid" 2>/dev/null; then alive=yes; fi
            ps -eo pid,ppid,comm,args \
              > "reports/V30-${label}-processes.txt"
            xwininfo -root -tree \
              > "reports/V30-${label}-windows.txt" 2>&1 || true
            import -window root "reports/V30-${label}-screen.png" \
              > "reports/V30-${label}-screenshot.log" 2>&1 || true
            colors=0
            if test -s "reports/V30-${label}-screen.png"; then
              colors=$(identify -format '%k' \
                "reports/V30-${label}-screen.png" 2>/dev/null || echo 0)
            fi
            native_window=no
            if grep -Ei "$label" "reports/V30-${label}-windows.txt" \
              | grep -Eq '[[:space:]][0-9]{2,}x[0-9]{2,}\+'; then
              native_window=yes
            fi
            rendered=no
            if test "$colors" -ge 16 && test "$native_window" = yes; then
              rendered=yes
            fi
            {
              echo "original_executable=$exe"
              echo 'observation_seconds=18'
              echo "process_alive_at_capture=$alive"
              echo "native_visible_window=$native_window"
              echo "screenshot_unique_colors=$colors"
              echo "rendered_window=$rendered"
            } > "reports/V30-${label}-observed.txt"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            wineserver -k >/dev/null 2>&1 || true
            sleep 3
          done

      - name: "V30 | Report actual native runtime evidence"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REPORT'
          from pathlib import Path
          import os

          root = Path('reports')
          root.mkdir(exist_ok=True)
          mono_result = root / 'V30-mono-observed.txt'
          mono_status = (
              mono_result.read_text().strip()
              if mono_result.exists() else 'mono_install_not_tested'
          )
          lines = [
              '# build-web.yml | V30 | ORIGINAL engine runtime evidence',
              '',
              'V30 restores full original game data, including maps and sound.',
              f'Official WineHQ Wine Mono MSI: {mono_status}',
              '',
              '| Original EXE | Alive after 18 s | Colors | Rendered GUI |',
              '|---|---|---:|---|',
          ]
          for label in ('Lineage', 'Login', 'Launcher'):
              info = {}
              file = root / f'V30-{label}-observed.txt'
              if file.exists():
                  for row in file.read_text().splitlines():
                      if '=' in row:
                          key, value = row.split('=', 1)
                          info[key] = value
              lines.append(
                  f'| {label}.exe | '
                  f'{info.get("process_alive_at_capture", "not tested")} | '
                  f'{info.get("screenshot_unique_colors", "unknown")} | '
                  f'{info.get("rendered_window", "not tested")} |'
              )
          lines += [
              '',
              '**Render detection requires a named original window and 16 colors; '
              'a blank black screenshot is NOT a successful render.**',
              '',
              'This is a real Windows PE client running under Wine on Linux.',
              'It is NOT web gameplay or a GitHub Pages browser port.',
              'Original engine logic is unchanged. No substitute HTML engine.',
              'No EULA agreement is automatically clicked.',
              'Server authentication and in-game map movement are NOT proven.',
          ]
          result = '\n'.join(lines) + '\n'
          (root / 'V30-summary.md').write_text(result, encoding='utf-8')
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write(result)
          PY_REPORT

      - name: "V30 | Upload original native runtime screenshots and logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Engine-V30-Runtime-Evidence
          path: reports/
          retention-days: 90
          if-no-files-found: error

      - name: "V30 | Fail if any original executable has no rendered GUI"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'mono_install_exit_code=0' \
            reports/V30-mono-observed.txt || {
              echo 'V30 FAIL: Wine Mono MSI installation was not successful'
              exit 1
            }
          for label in Lineage Login Launcher; do
            test -s "reports/V30-${label}-observed.txt"
            if ! grep -qx 'rendered_window=yes' \
              "reports/V30-${label}-observed.txt"; then
              echo "V30 FAIL: ${label}.exe rendered no visible GUI"
              exit 1
            fi
          done
          echo 'V30 PASS: all three original executables rendered visible UI.'
