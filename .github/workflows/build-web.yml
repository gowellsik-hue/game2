
name: "build-web.yml | V33 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V33 | Original Sanctuary engine runtime test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read

concurrency:
  group: build-web-yml-v33-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v33:
    name: "build-web.yml | V33 | Run ORIGINAL Lineage client, no HTML replacement"
    runs-on: windows-2025
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "V33 | Checkout game2"
        uses: actions/checkout@v4

      - name: "V33 | Download original Sanctuary archive (46 volumes)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force original, native, reports | Out-Null
          if ($env:GITHUB_REPOSITORY -ne 'gowellsik-hue/game2') {
            throw 'Unexpected repository'
          }
          gh release download v1.0.0 -R gowellsik-hue/Game `
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $count = @(Get-ChildItem original -File).Count
          if ($count -ne 46) { throw "Expected 46 volumes, found $count" }
          1..45 | ForEach-Object {
            $part = ('Sanctuary.of.Aden.-.Copy.z{0:d2}' -f $_)
            if (-not (Test-Path (Join-Path original $part))) {
              throw "Missing archive part: $part"
            }
          }
          if (-not (Test-Path 'original/Sanctuary.of.Aden.-.Copy.zip')) {
            throw 'Missing final ZIP volume'
          }
          Get-PSDrive C | Out-File reports/V33-disk-before.txt

      - name: "V33 | Restore original executable environment without edits"
        run: |
          $ErrorActionPreference = 'Stop'
          $seven = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $seven) {
            $seven = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path $seven)) {
            throw '7-Zip is not installed on this Windows runner'
          }
          & $seven x 'original/Sanctuary.of.Aden.-.Copy.zip' '-onative' '-y' `
            '-ir!*.exe' '-ir!*.dll' '-ir!*.ocx' '-ir!*.bin' `
            '-ir!*.ini' '-ir!*.cfg' '-ir!*.config' '-ir!*.manifest' `
            '-ir!*.idx' '-ir!*.pak' *> reports/V33-extract.log
          if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction failed' }
          $root = Join-Path $PWD 'native/Sanctuary of Aden - Copy'
          foreach ($file in @('Lineage.exe', 'lin.bin', 'TW13032701.exe')) {
            if (-not (Test-Path (Join-Path $root $file))) {
              throw "Original executable missing: $file"
            }
          }
          Get-PSDrive C | Out-File reports/V33-disk-after.txt
          $data = foreach ($file in @('Lineage.exe', 'lin.bin', 'TW13032701.exe')) {
            $path = Join-Path $root $file
            $item = Get-Item $path
            $sig = Get-AuthenticodeSignature -FilePath $path
            [pscustomobject]@{
              name = $file
              bytes = $item.Length
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash
              file_version = $item.VersionInfo.FileVersion
              company = $item.VersionInfo.CompanyName
              signature_status = [string]$sig.Status
            }
          }
          $data | ConvertTo-Json -Depth 5 | Set-Content `
            reports/V33-native-binary-inventory.json -Encoding utf8

      - name: "V33 | Test original runtime on NATIVE Windows (not Wine)"
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class V33Windows {
              private delegate bool Callback(IntPtr hwnd, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern bool EnumWindows(Callback callback, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern bool EnumChildWindows(IntPtr parent, Callback callback, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int length);
              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)]
              private static extern IntPtr SendMessageTimeout(
                  IntPtr hwnd, uint message, IntPtr wparam,
                  StringBuilder text, uint flags, uint timeout, out IntPtr result);
              private static string ReadText(IntPtr hwnd) {
                  var buffer = new StringBuilder(1024);
                  GetWindowText(hwnd, buffer, buffer.Capacity);
                  if (buffer.Length == 0) {
                      IntPtr result;
                      SendMessageTimeout(hwnd, 0x000D, (IntPtr)buffer.Capacity,
                          buffer, 0x0002, 200, out result);
                  }
                  return buffer.ToString();
              }
              public static string[] CaptionsFor(int pid) {
                  var found = new List<string>();
                  EnumWindows((hwnd, unused) => {
                      uint owner;
                      GetWindowThreadProcessId(hwnd, out owner);
                      if (owner != (uint)pid || !IsWindowVisible(hwnd)) return true;
                      var title = ReadText(hwnd);
                      if (!String.IsNullOrWhiteSpace(title)) found.Add("WINDOW: " + title);
                      EnumChildWindows(hwnd, (child, unused2) => {
                          var text = ReadText(child);
                          if (!String.IsNullOrWhiteSpace(text)) found.Add("CONTROL: " + text);
                          return true;
                      }, IntPtr.Zero);
                      return true;
                  }, IntPtr.Zero);
                  return found.ToArray();
              }
          }
          '@
          $root = Join-Path $PWD 'native/Sanctuary of Aden - Copy'
          $results = @()
          foreach ($exe in @('Lineage.exe', 'lin.bin', 'TW13032701.exe')) {
            $path = Join-Path $root $exe
            $samples = @()
            $pidValue = $null
            $launchError = $null
            $exitCode = $null
            $aliveAtEnd = $false
            $process = $null
            try {
              $start = New-Object System.Diagnostics.ProcessStartInfo
              $start.FileName = $path
              $start.WorkingDirectory = $root
              $start.UseShellExecute = $false
              $process = [System.Diagnostics.Process]::Start($start)
              if ($null -eq $process) { throw 'Process.Start returned null' }
              $pidValue = $process.Id
              for ($i = 1; $i -le 8; $i++) {
                Start-Sleep -Seconds 3
                $process.Refresh()
                $alive = -not $process.HasExited
                $captions = @()
                if ($alive) {
                  $captions = @([V33Windows]::CaptionsFor($process.Id))
                }
                $samples += [pscustomobject]@{
                  seconds = $i * 3
                  process_alive = $alive
                  window_and_control_text = $captions
                }
                if (-not $alive) {
                  $exitCode = $process.ExitCode
                  break
                }
              }
              $process.Refresh()
              $aliveAtEnd = -not $process.HasExited
            } catch {
              $launchError = $_.Exception.Message
            } finally {
              if ($null -ne $process) {
                try {
                  $process.Refresh()
                  if (-not $process.HasExited) { $process.Kill($true) }
                } catch { }
                $process.Dispose()
              }
            }
            $allText = (@($samples | ForEach-Object {
              $_.window_and_control_text
            }) -join ' ')
            $results += [pscustomobject]@{
              original_file = $exe
              process_id = $pidValue
              launch_error = $launchError
              early_exit_code = $exitCode
              alive_after_observation = $aliveAtEnd
              runtime_expired_text_observed = `
                ($allText -match 'RunTime Expired|Reinstall Lineage')
              observations = $samples
            }
          }
          $results | ConvertTo-Json -Depth 9 | Set-Content `
            reports/V33-native-process-results.json -Encoding utf8

      - name: "V33 | Distinguish native runtime from browser execution"
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'reports/V33-native-process-results.json'
          $lines = @(
            '# build-web.yml | V33 | NATIVE Windows original-client verification',
            '',
            'V32 Wine test: lin.bin showed "RunTime Expired - Reinstall Lineage."',
            'V33 executes original files on a GitHub-hosted Windows runner.',
            'The original binaries and system clock are NOT modified.',
            'No license checks, protection, EULA, or login are bypassed.',
            '',
            '| Original file | Started | Alive at 24 s | Expired text detected |',
            '|---|---|---|---|'
          )
          if (Test-Path $path) {
            $results = @(Get-Content $path -Raw | ConvertFrom-Json)
            foreach ($r in $results) {
              $started = $null -ne $r.process_id
              $lines += "| $($r.original_file) | $started | $($r.alive_after_observation) | $($r.runtime_expired_text_observed) |"
              if ($r.launch_error) {
                $lines += "- $($r.original_file) start error: $($r.launch_error)"
              }
              $captions = @($r.observations | ForEach-Object {
                $_.window_and_control_text
              } | Where-Object { $_ } | Select-Object -Unique)
              foreach ($caption in $captions | Select-Object -First 20) {
                $lines += "- $($r.original_file) UI: $caption"
              }
            }
          } else {
            $lines += '| Not tested | false | false | unknown |'
          }
          $lines += @(
            '',
            '## Interpretation limits',
            '- GitHub-hosted Windows runners are not guaranteed to have an interactive desktop.',
            '- Missing window captions cannot prove that no dialog appeared.',
            '- A running process or window does not prove game-world rendering.',
            '- Expired text detected by a window probe is positive evidence only.',
            '- This is a native Windows test, NOT HTML or GitHub Pages gameplay.',
            '- Full world data and audio were not required for this startup check.',
            '- A valid original runtime/license and compatible browser architecture remain necessary.'
          )
          $summary = $lines -join "`n"
          $summary | Set-Content reports/V33-summary.md -Encoding utf8
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Output $summary

      - name: "V33 | Upload original Windows-native runtime evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Engine-V33-Runtime-Evidence
          path: reports/
          retention-days: 90
          if-no-files-found: error

      - name: "V33 | Verify the real client tests were recorded"
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'V33-native-binary-inventory.json',
            'V33-native-process-results.json',
            'V33-summary.md'
          )) {
            if (-not (Test-Path (Join-Path 'reports' $file))) {
              throw "Missing required evidence: $file"
            }
          }
          $results = @(Get-Content `
            reports/V33-native-process-results.json -Raw | ConvertFrom-Json)
          if ($results.Count -ne 3) { throw 'Expected three original-runtime tests' }
          Write-Output 'V33 PASS: Windows-native original runtime evidence collected.'
          Write-Output 'Gameplay and browser execution are NOT yet verified.'
