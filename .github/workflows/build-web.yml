# THREE ROLES: FRONT (visual), BACK (visual), BASE (collision).
# WALL BASE: native tile 385 and physical bottom contact.
# Visual wall front/back must not block walkable native tile 384.
# 1F: allow 94,78 -> 94,82 behind wall.
# 1F: block 97,70 -> 97,69 across physical wall base.
# Preserve original map events, images, monsters, loot and saves.
name: build-slknight-web.yml | V229R65 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R65 Restore successful R64 full game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40093849653
          name: github-pages
          github-token: ${{ github.token }}
          path: r64

      - name: V229R65 Set up native image analysis
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: V229R65 Install pinned image processing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow==11.3.0 numpy==2.2.6

      - name: V229R65 Recover original R64 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r64/artifact.tar
          tar -xf r64/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          assert 'V229R64' in (root/'index.html').read_text('utf-8')
          p=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='02e472171f7af3e96f843a8b3f4374779018052bfcae98a52c1b9221857d15b0'
          original={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(original)==5517,len(original)
          Path('build/r65-baseline.json').write_text(json.dumps(original,sort_keys=True))
          print('PASS R64 exact 5517-file baseline')
          PY_BASE

      - name: V229R65 Extract original ground, wall directions and spawns
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r65_export.rb <<'RB_EXPORT'
          require 'zlib'
          require 'json'
          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def [](x,y,z)
              w,h=@raw.byteslice(4,8).unpack('L<L<')
