
name: "build-web.yml | V81 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V81 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v81-native-sdl-rect
  cancel-in-progress: false

jobs:
  original_client_v81:
    name: "build-web.yml | V81 | Correct 8-byte SDL_Rect ABI"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V81 | Checkout game2 full history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V81 | Keep successful V70 Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V81 | Checkout original Sanctuary C++ client"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V81 | Set up V70-compatible Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V81 | Restore V80 original resource and C++ stages"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports

          cat > /tmp/v81-restore.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          previous='6940d9e0ac557b82b3b1349e8e2c58117e715af0'

          content=subprocess.check_output(
              ['git','show',previous+':.github/workflows/build-web.yml'],
              text=True
          )

          workflow=yaml.safe_load(content)
          steps=workflow['jobs']['original_client_v80']['steps']
          scripts={s['name']:s['run'] for s in steps if 'run' in s}

          stages=[
              'V80 | Restore verified V79 archive and native build stages',
              'V80 | Install clipped native SDL tile compositor'
          ]

          assert all(name in scripts for name in stages)

          for i,name in enumerate(stages,1):
              script=scripts[name].replace('V80','V81').replace('v80','v81')
              print('V81 original pipeline',i,name,flush=True)

              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',script],
                  check=True
              )

          for f in ('/tmp/v81-extract.sh','/tmp/v81-build.sh'):
              assert Path(f).is_file(),f
              subprocess.run(['bash','-n',f],check=True)

          for f in ('/tmp/v81-sdl-bridge.py','/tmp/v81-native-viewport.py'):
              assert Path(f).is_file(),f
              subprocess.run(['python3','-m','py_compile',f],check=True)

          assert '/tmp/v81-sdl-bridge.py' in Path('/tmp/v81-build.sh').read_text()

          print(
              'V81 preserved V80 archive, C++ compile and SDL hooks.',
              flush=True
          )
          PY

          python3 -m py_compile /tmp/v81-restore.py
          python3 -u /tmp/v81-restore.py \
            2>&1 | tee reports/V81-restore.log

      - name: "V81 | Repair the original SDL_Rect memory layout"
        shell: bash
        run: |
          set -euo pipefail

          # Original native SDL_Rect occupies eight bytes:
          # signed 16-bit x/y and unsigned 16-bit w/h.
          # The V80 browser bridge read four 32-bit values instead.

          cat >> /tmp/v81-sdl-bridge.py <<'PY'
          from pathlib import Path
          import subprocess
          import struct

          js=Path('dist/lineage-v81.js')
          source=js.read_text(encoding='utf-8')

          begin='  loadRect(rect) {'
          end='  intersectionOfRects(first, second) {'

          assert source.count(begin)==1, (
              'loadRect',source.count(begin)
          )
          assert source.count(end)==1, (
              'intersectionOfRects',source.count(end)
          )

          start=source.index(begin)
          stop=source.index(end,start)
          old=source[start:stop]

          assert old.count('GROWABLE_HEAP_I32()')>=8, (
              'Expected old 32-bit SDL_Rect implementation'
          )

          replacement='''  loadRect(rect) {
              // Original SDL1 C++ ABI:
              // Sint16 x,y; Uint16 w,h; 8 bytes total.
              var r = {
                x: GROWABLE_HEAP_I16()[rect >> 1],
                y: GROWABLE_HEAP_I16()[(rect + 2) >> 1],
                w: GROWABLE_HEAP_U16()[(rect + 4) >> 1],
                h: GROWABLE_HEAP_U16()[(rect + 6) >> 1]
              };

              if (r.w === 24 && r.h === 24 &&
                  (SDL.v81RectSamples || 0) < 3) {
                SDL.v81RectSamples =
                  (SDL.v81RectSamples || 0) + 1;

                out('V81: native SDL_Rect ' +
                    [r.x, r.y, r.w, r.h].join(','));
              }

              return r;
            },

            updateRect(rect, r) {
              GROWABLE_HEAP_I16()[rect >> 1] = r.x;
              GROWABLE_HEAP_I16()[(rect + 2) >> 1] = r.y;
              GROWABLE_HEAP_U16()[(rect + 4) >> 1] = r.w;
              GROWABLE_HEAP_U16()[(rect + 6) >> 1] = r.h;
            },
          '''

          source=source[:start]+replacement+source[stop:]

          assert source.count('V81: native SDL_Rect ')==1
          assert source.count('  loadRect(rect) {')==1
          assert source.count('  updateRect(rect, r) {')==1

          assert 'function GROWABLE_HEAP_I16()' in source
          assert 'function GROWABLE_HEAP_U16()' in source

          js.write_text(source,encoding='utf-8')

          subprocess.run(
              ['node','--check',str(js)],
              check=True
          )

          # V80 read the two 16-bit dimensions (24,24)
          # as one 32-bit coordinate: 1572888.
          sample=struct.pack('<hhHH',-400,191,24,24)

          assert len(sample)==8
          assert struct.unpack('<hhHH',sample)==(-400,191,24,24)
          assert struct.unpack_from('<I',sample,4)[0]==1572888

          print(
              'V81 corrected 8-byte SDL_Rect reader/writer and JS syntax.',
              flush=True
          )
          PY

          python3 -m py_compile /tmp/v81-sdl-bridge.py

          python3 - <<'PY'
          from pathlib import Path
          import struct

          r=struct.pack('<hhHH',-400,191,24,24)

          assert struct.unpack('<hhHH',r)==(-400,191,24,24)
          assert struct.unpack_from('<I',r,4)[0]==1572888

          assert '/tmp/v81-sdl-bridge.py' in Path(
              '/tmp/v81-build.sh'
          ).read_text()

          print('V81 16-bit rectangle ABI preflight passed.')
          PY

          bash -n /tmp/v81-build.sh

      - name: "V81 | Build original client and test native map pixels"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash /tmp/v81-extract.sh \
            2>&1 | tee reports/V81-extract-stage.log

          bash /tmp/v81-build.sh \
            2>&1 | tee reports/V81-build-stage.log

          python3 - <<'PY'
          import json
          from pathlib import Path

          r=json.loads(
              Path('reports/V81-browser.json').read_text()
          )

          assert r['character_saved']
          assert r['character_restored']
          assert r['native_game_ready']
          assert r['passed']

          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02

          assert Path(
              'reports/V81-map-canvas.png'
          ).stat().st_size>500

          print(
              'V81 original native map pixels verified:',
              r['native_map_nonblack_fraction']
          )
          PY

      - name: "V81 | Save all SDL map and browser diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V81-Original-Map
          path: |
            reports/V81-restore.log
            reports/V81-preflight.log
            reports/V81-bridge-preflight.log
            reports/V81-extract-stage.log
            reports/V81-build-stage.log
            reports/V81-browser.json
            reports/V81-map-canvas.png
            reports/V81-mobile.png
            reports/V81-http.txt
            assets/v81/v81-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V81 | Publish only after real original map rendering"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          r=json.loads(
              Path('reports/V81-browser.json').read_text()
          )

          assert r['passed']
          assert r['native_game_ready']
          assert r['character_saved']
          assert r['character_restored']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02

          before=Path(
              'published/lineage-v70.data'
          ).stat().st_size

          after=Path(
              'published/lineage-v81.data'
          ).stat().st_size

          assets=sum(
              x.stat().st_size
              for x in Path('assets/v81/lineage').rglob('*')
              if x.is_file()
          )

          assert before<after<=before+assets+2000000
          PY

          git -C published add -- \
            index.html \
            v81.html \
            lineage-v81.js \
            lineage-v81.wasm \
            lineage-v81.data

          git -C published config user.name \
            'github-actions[bot]'

          git -C published config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V81: correct Sanctuary SDL_Rect 16-bit ABI'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V81 | Report exact outcome"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V81 | Sanctuary game2 GitHub Pages'
            echo 'V80 read two packed 16-bit dimensions as a 32-bit coordinate.'
            echo 'V81 reads and writes native SDL1 rectangles as 8 bytes.'
            echo 'Original .s32 maps and Tile.pak are used without coordinate adjustments.'
            echo 'Original C++ engine and character persistence remain.'
            echo 'Deployment requires visible map pixels and character entry.'
            echo 'V70 Pages remains deployed if V81 fails.'
          } >> "$GITHUB_STEP_SUMMARY"
