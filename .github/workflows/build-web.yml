
name: "build-web.yml | V34 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V34 | Original Sanctuary engine runtime test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read

concurrency:
  group: build-web-yml-v34-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v34:
    name: "build-web.yml | V34 | Run ORIGINAL Lineage client, no HTML replacement"
    runs-on: windows-2025
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "V34 | Checkout game2"
        uses: actions/checkout@v4

      - name: "V34 | Download original Sanctuary archive (46 volumes)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force original, native, reports | Out-Null
          if ($env:GITHUB_REPOSITORY -ne 'gowellsik-hue/game2') {
            throw 'Unexpected repository'
          }
          gh release download v1.0.0 -R gowellsik-hue/Game `
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Original release download failed' }
          if (@(Get-ChildItem original -File).Count -ne 46) {
            throw 'Expected exactly 46 original archive volumes'
          }
          1..45 | ForEach-Object {
            $part = 'Sanctuary.of.Aden.-.Copy.z{0:d2}' -f $_
            if (-not (Test-Path (Join-Path original $part))) {
              throw "Missing archive part: $part"
            }
          }
          if (-not (Test-Path 'original/Sanctuary.of.Aden.-.Copy.zip')) {
            throw 'Missing final ZIP volume'
          }
          Get-PSDrive -PSProvider FileSystem |
            Out-File reports/V34-disk-before.txt

      - name: "V34 | Restore original startup files without modification"
        run: |
          $ErrorActionPreference = 'Stop'
          $seven = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $seven) { $seven = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $seven)) { throw '7-Zip unavailable' }
          & $seven x 'original/Sanctuary.of.Aden.-.Copy.zip' '-onative' '-y' `
            '-ir!*.exe' '-ir!*.dll' '-ir!*.ocx' '-ir!*.bin' `
            '-ir!*.ini' '-ir!*.cfg' '-ir!*.config' '-ir!*.manifest' `
            '-ir!*.idx' '-ir!*.pak' *> reports/V34-original-extract.log
          if ($LASTEXITCODE -ne 0) { throw 'Original extraction failed' }
          $root = Join-Path $PWD 'native/Sanctuary of Aden - Copy'
          foreach ($file in @('Lineage.exe', 'lin.bin', 'Sprite.pak', 'Tile.pak')) {
            if (-not (Test-Path (Join-Path $root $file))) {
              throw "Missing original file: $file"
            }
          }
          $path = Join-Path $root 'lin.bin'
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash
          $hash | Set-Content reports/V34-lin-original-sha256.txt
          Get-PSDrive -PSProvider FileSystem |
            Out-File reports/V34-disk-after.txt
          Remove-Item original -Recurse -Force

      - name: "V34 | Install official Microsoft Visual C++ 2012 Update 4 x86"
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:WINDIR 'SysWOW64\MSVCP110.dll'
          "msvcp110_present_before=$(Test-Path $dll)" |
            Set-Content reports/V34-runtime-before.txt
          $url = 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x86.exe'
          $expected = 'B924AD8062EAF4E70437C8BE50FA612162795FF0839479546CE907FFA8D6E386'
          $installer = Join-Path $env:RUNNER_TEMP 'v34-vcredist2012-x86.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 5
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Microsoft installer SHA256 mismatch: $actual"
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft installer signature invalid: $($signature.Status)"
          }
          "installer_sha256=$actual" |
            Set-Content reports/V34-installer-verification.txt
          "installer_signature=$($signature.Status)" |
            Add-Content reports/V34-installer-verification.txt
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/quiet /norestart' -PassThru -Wait
          "installer_exit_code=$($process.ExitCode)" |
            Set-Content reports/V34-runtime-install.txt
          Remove-Item $installer -Force
          if ($process.ExitCode -notin @(0, 3010, 1638)) {
            throw "Microsoft VC++ x86 installation failed: $($process.ExitCode)"
          }
          if (-not (Test-Path $dll)) {
            throw 'MSVCP110.dll still absent from SysWOW64'
          }
          foreach ($name in @('MSVCP110.dll', 'MSVCR110.dll')) {
            $path = Join-Path (Split-Path $dll) $name
            if (-not (Test-Path $path)) { throw "Missing x86 runtime: $name" }
            $file = Get-Item $path
            $sig = Get-AuthenticodeSignature -FilePath $path
            "$name | version=$($file.VersionInfo.FileVersion) | signature=$($sig.Status) | sha256=$((Get-FileHash $path -Algorithm SHA256).Hash)" |
              Add-Content reports/V34-runtime-install.txt
          }

      - name: "V34 | Run original lin.bin with restored x86 runtime"
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class V34Windows {
              private delegate bool Callback(IntPtr hwnd, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern bool EnumWindows(Callback callback, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern bool EnumChildWindows(IntPtr parent, Callback callback, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int length);
              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)]
              private static extern IntPtr SendMessageTimeout(
                  IntPtr hwnd, uint message, IntPtr wparam,
                  StringBuilder text, uint flags, uint timeout, out IntPtr result);
              private static string ReadText(IntPtr hwnd) {
                  var buffer = new StringBuilder(1024);
                  GetWindowText(hwnd, buffer, buffer.Capacity);
                  if (buffer.Length == 0) {
                      IntPtr result;
                      SendMessageTimeout(hwnd, 0x000D, (IntPtr)buffer.Capacity,
                          buffer, 0x0002, 200, out result);
                  }
                  return buffer.ToString();
              }
              public static string[] CaptionsFor(int pid) {
                  var found = new List<string>();
                  EnumWindows((hwnd, unused) => {
                      uint owner;
                      GetWindowThreadProcessId(hwnd, out owner);
                      if (owner != (uint)pid || !IsWindowVisible(hwnd)) return true;
                      var title = ReadText(hwnd);
                      if (!String.IsNullOrWhiteSpace(title)) found.Add("WINDOW: " + title);
                      EnumChildWindows(hwnd, (child, unused2) => {
                          var text = ReadText(child);
                          if (!String.IsNullOrWhiteSpace(text)) found.Add("CONTROL: " + text);
                          return true;
                      }, IntPtr.Zero);
                      return true;
                  }, IntPtr.Zero);
                  return found.ToArray();
              }
          }
          '@
          $root = Join-Path $PWD 'native/Sanctuary of Aden - Copy'
          $path = Join-Path $root 'lin.bin'
          $process = $null
          $samples = @()
          $launchError = $null
          $earlyExitCode = $null
          $pidValue = $null
          $aliveAtEnd = $false
          try {
            $start = New-Object System.Diagnostics.ProcessStartInfo
            $start.FileName = $path
            $start.WorkingDirectory = $root
            $start.UseShellExecute = $false
            $process = [System.Diagnostics.Process]::Start($start)
            if ($null -eq $process) { throw 'Process.Start returned null' }
            $pidValue = $process.Id
            for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 3
              $process.Refresh()
              $alive = -not $process.HasExited
              $captions = @()
              if ($alive) { $captions = @([V34Windows]::CaptionsFor($process.Id)) }
              $samples += [pscustomobject]@{
                seconds = $i * 3
                process_alive = $alive
                window_and_control_text = $captions
              }
              if (-not $alive) {
                $earlyExitCode = $process.ExitCode
                break
              }
            }
            $process.Refresh()
            $aliveAtEnd = -not $process.HasExited
          } catch {
            $launchError = $_.Exception.Message
          } finally {
            if ($null -ne $process) {
              try {
                $process.Refresh()
                if (-not $process.HasExited) { $process.Kill($true) }
              } catch { }
              $process.Dispose()
            }
          }
          $capturedText = (@($samples | ForEach-Object {
            $_.window_and_control_text
          }) -join ' ')
          $observed = [pscustomobject]@{
            version = 'V34'
            original_file = 'lin.bin'
            process_id = $pidValue
            launch_error = $launchError
            early_exit_code = $earlyExitCode
            alive_after_observation = $aliveAtEnd
            missing_msvcp110_observed = `
              ($capturedText -match 'Cannot find.*MSVCP110[.]dll')
            runtime_expired_observed = `
              ($capturedText -match 'RunTime Expired|Reinstall Lineage')
            observations = $samples
          }
          $observed | ConvertTo-Json -Depth 9 | Set-Content `
            reports/V34-lin-runtime-results.json -Encoding utf8
          $hashAfter = (Get-FileHash $path -Algorithm SHA256).Hash
          $hashBefore = (Get-Content reports/V34-lin-original-sha256.txt -Raw).Trim()
          if ($hashAfter -ne $hashBefore) {
            throw 'Original lin.bin hash changed during test'
          }

      - name: "V34 | Report real native runtime outcome"
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'reports/V34-lin-runtime-results.json'
          $lines = @(
            '# build-web.yml | V34 | ORIGINAL engine x86 runtime test',
            '',
            'V33 native lin.bin showed: Cannot find MSVCP110.dll.',
            'V34 installs the official Microsoft Visual C++ 2012 Update 4 x86 runtime.',
            'No protected file, system clock, or licensing mechanism was changed.',
            ''
          )
          if (Test-Path 'reports/V34-runtime-install.txt') {
            $lines += '## Runtime installation'
            $lines += @(Get-Content reports/V34-runtime-install.txt)
            $lines += ''
          }
          if (Test-Path $report) {
            $result = Get-Content $report -Raw | ConvertFrom-Json
            $lines += @(
              '## Original lin.bin after installation',
              "- Process started: $($null -ne $result.process_id)",
              "- Alive at observation end: $($result.alive_after_observation)",
              "- MSVCP110.dll missing message: $($result.missing_msvcp110_observed)",
              "- RunTime Expired message: $($result.runtime_expired_observed)",
              "- Launch exception: $($result.launch_error)",
              ''
            )
            $messages = @($result.observations | ForEach-Object {
              $_.window_and_control_text
            } | Where-Object { $_ } | Select-Object -Unique)
            $lines += '## Actual Windows UI text'
            if ($messages.Count -eq 0) { $lines += '- No UI text detected' }
            foreach ($message in $messages | Select-Object -First 45) {
              $lines += "- $message"
            }
          } else {
            $lines += '- lin.bin test did not complete; inspect earlier step.'
          }
          $lines += @(
            '',
            '## Limits',
            '- Running an EXE or observing a window does not prove gameplay.',
            '- Runtime expiration, if observed, remains a blocker requiring authorized resolution.',
            '- No EULA clicks, server credentials, or logins were automated.',
            '- This is native Windows execution, NOT web or GitHub Pages gameplay.',
            '- No substitute HTML engine was created.'
          )
          $summary = $lines -join "`n"
          $summary | Set-Content reports/V34-summary.md -Encoding utf8
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Output $summary

      - name: "V34 | Upload original engine runtime evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Engine-V34-Runtime-Evidence
          path: reports/
          retention-days: 90
          if-no-files-found: error

      - name: "V34 | Verify native runtime test evidence"
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'V34-runtime-install.txt',
            'V34-lin-runtime-results.json',
            'V34-summary.md'
          )) {
            if (-not (Test-Path (Join-Path reports $file))) {
              throw "Missing evidence: $file"
            }
          }
          $result = Get-Content reports/V34-lin-runtime-results.json `
            -Raw | ConvertFrom-Json
          if ($null -eq $result.process_id) {
            throw "Original lin.bin failed to start: $($result.launch_error)"
          }
          if ($result.missing_msvcp110_observed) {
            throw 'The original MSVCP110.dll error persists after installation'
          }
          Write-Output 'V34 PASS: Microsoft x86 runtime installed and original lin.bin retested.'
          Write-Output 'This does NOT establish working gameplay or browser execution.'
