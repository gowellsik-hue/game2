# FILE: .github/workflows/build-web.yml
# VERSION: V91
# V90 failed before extraction: 'preflight' was both the syntax-check command
# and the real runner-generation stage. The latter never ran.
# Pin V90 stages and use 'check' for validation, 'preflight' for execution.
# Preserve original SPR, map, actor separation, and browser verification gates.
name: "build-web.yml | V91 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V91 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v91-native-player
  cancel-in-progress: false

jobs:
  original_client_v91:
    name: "build-web.yml | V91 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V91 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V91 | Preserve previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V91 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V91 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V91 | Recover exact V90 pipeline and correct command conflict"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports /tmp/v91
          cat > /tmp/v91-loader.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          import yaml

          PIN='9e78c0bc899fb3c30d24634294e1324a8b1e565c'
          raw=subprocess.check_output(
              ['git','show',PIN+':.github/workflows/build-web.yml'],
              text=True
          )
          previous=yaml.safe_load(raw)
          assert previous['name']=='build-web.yml | V90 | Sanctuary game2 GitHub Pages'
          original={s['name']:s['run'] for s in
              previous['jobs']['original_client_v90']['steps'] if 'run' in s}
          stages={
              'prepare':'V90 | Recover verified V89 stage scripts',
              'bootstrap':'V90 | Generate original stage executor',
              'restore':'V90 | Restore source map and SDL pipeline',
              'sprites':'V90 | Prepare genuine male knight SPR extraction',
              'wire':'V90 | Create native actor implementation',
              'separate':'V90 | Separate offline initialization from actor injection',
              'runner':'V90 | Precompile actual generated native runner before resource download',
              'build':'V90 | Extract real SPR and map and compile native client',
              'smoke':'V90 | Verify real SPR pixels and directional movement',
              'preserve':'V90 | Save generated sources and failure logs',
              'publish':'V90 | Publish only after authentic player tests pass',
              'report':'V90 | Record verified scope',
          }
          assert len(stages)==len(set(stages.values()))
          assert all(name in original for name in stages.values())
          root=Path('/tmp/v91')
          for stage,title in stages.items():
              source=original[title].replace('V90','V91').replace('v90','v91')
              if stage=='prepare':
                  # The actual V90 defect: this branch intercepted the
                  # required 'preflight' stage and only repeated bash -n.
                  old="if phase=='preflight':"
                  assert source.count(old)==1,('V90 dispatcher',source.count(old))
                  source=source.replace(old,"if phase=='check':",1)
                  old='python3 -u /tmp/v91-stages.py preflight'
                  assert source.count(old)==1,('Initial check command',source.count(old))
                  source=source.replace(old,'python3 -u /tmp/v91-stages.py check',1)
                  assert "if stage=='preflight':" in source
              matches=list(re.finditer(
                  r"(?ms)^(?:cat >|cat >>) (/tmp/[\w-]+\.py) <<'PY'\n(.*?)\nPY$",
                  source
              ))
              for match in matches:
                  ast.parse(match.group(2),filename=match.group(1))
              path=root/(stage+'.sh')
              path.write_text(source,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
              print('V91 verified:',stage,'Python:',len(matches),flush=True)
          print('V91: check and preflight are now separate commands.',flush=True)
          PY
          python3 -m py_compile /tmp/v91-loader.py
          python3 -u /tmp/v91-loader.py \
            2>&1 | tee reports/V91-loader.log
          test -s /tmp/v91/runner.sh
          test -s /tmp/v91/prepare.sh

      - name: "V91 | Generate real V85 stage executor"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/prepare.sh 2>&1 | tee reports/V91-prepare.log
          test -s /tmp/v91-stages.py
          grep -Fq "if phase=='check':" /tmp/v91-stages.py
          bash /tmp/v91/bootstrap.sh 2>&1 | tee reports/V91-bootstrap.log
          test -s /tmp/v91-execute.py
          python3 -m py_compile /tmp/v91-execute.py

      - name: "V91 | Restore original map and SDL compiler scripts"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/restore.sh 2>&1 | tee reports/V91-restore.log
          test -s /tmp/v91-extract.sh
          test -s /tmp/v91-build.sh

      - name: "V91 | Prepare original male knight sprite extraction"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/sprites.sh 2>&1 | tee reports/V91-sprites.log
          test -s /tmp/v91-extract.sh

      - name: "V91 | Generate native actor and directional movement code"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/wire.sh 2>&1 | tee reports/V91-wiring.log
          test -s /tmp/v91-native.py

      - name: "V91 | Keep offline entry and actor patch separate"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/separate.sh 2>&1 | tee reports/V91-separation.log
          test -s /tmp/v91-actor.py
          test ! -e /tmp/v91-native.py
          grep -Fq "/tmp/v91-actor.py" /tmp/v91-build.sh

      - name: "V91 | Execute real runner-generation preflight"
        shell: bash
        run: |
          set -euo pipefail
          # 'preflight' now runs the real generator, not just the syntax loop.
          bash /tmp/v91/runner.sh 2>&1 | tee reports/V91-runner-preflight.log
          test -s /tmp/v91-run.py
          test -s /tmp/v91-actor.py
          python3 -m py_compile /tmp/v91-run.py /tmp/v91-actor.py
          grep -Fq "final generated Python syntax passed" reports/V91-runner-preflight.log
          echo 'V91: actual final runner compiled before ZIP extraction.'

      - name: "V91 | Extract original map and SPR and compile native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v91/build.sh 2>&1 | tee reports/V91-build-and-browser.log

      - name: "V91 | Verify real sprite pixels and keyboard movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/smoke.sh 2>&1 | tee reports/V91-native-player-test.log

      - name: "V91 | Save complete generated sources on failure"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v91/preserve.sh; then
            bash /tmp/v91/preserve.sh
          fi
          mkdir -p reports
          for file in /tmp/v91-stages.py /tmp/v91-loader.py; do
            if test -s "$file"; then
              cp "$file" "reports/V91-generated-$(basename "$file")"
            fi
          done

      - name: "V91 | Upload build logs and diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V91-Native-Player
          path: |
            reports/V91-*.log
            reports/V91-*.json
            reports/V91-*.png
            reports/V91-*.txt
            reports/V91-generated-*
            assets/v91/v91-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V91 | Publish only verified native character and movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v91/publish.sh 2>&1 | tee reports/V91-deploy.log

      - name: "V91 | State exact verified scope"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v91/report.sh; then
            bash /tmp/v91/report.sh
          fi
          {
            echo 'V90 failed because preflight was intercepted by a syntax-check branch.'
            echo 'V91 uses check for syntax verification and preflight for runner generation.'
            echo 'Male knight SPR 61 is verified in original L1J C++ source.'
            echo 'Original Sprite.pak extraction passed in V89; complete native runtime not yet verified.'
            echo 'Original SDL sprite pixels and player movement remain mandatory for publication.'
          } >> "$GITHUB_STEP_SUMMARY"
