# FILE: .github/workflows/build-web.yml
# VERSION: V99
# V98 extracted genuine resources but C++ compilation rejected the native
# RWops callbacks: seek/read/write must use int, not long/size_t.
# Correct callback signatures only. Preserve original SPR frame decoding,
# SDL map pipeline and existing deployment verification gates.
name: "build-web.yml | V99 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V99 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v99-native-player
  cancel-in-progress: false

jobs:
  original_client_v99:
    name: "build-web.yml | V99 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V99 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V99 | Preserve previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V99 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V99 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V99 | Restore V90 stage definitions with separate runner dispatcher"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports /tmp/v99
          cat > /tmp/v99-loader.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          import yaml

          PIN='9e78c0bc899fb3c30d24634294e1324a8b1e565c'
          raw=subprocess.check_output(
              ['git','show',PIN+':.github/workflows/build-web.yml'],text=True
          )
          previous=yaml.safe_load(raw)
          assert previous['name']=='build-web.yml | V90 | Sanctuary game2 GitHub Pages'
          original={s['name']:s['run'] for s in
              previous['jobs']['original_client_v90']['steps'] if 'run' in s}
          stages={
              'prepare':'V90 | Recover verified V89 stage scripts',
              'bootstrap':'V90 | Generate original stage executor',
              'restore':'V90 | Restore source map and SDL pipeline',
              'sprites':'V90 | Prepare genuine male knight SPR extraction',
              'wire':'V90 | Create native actor implementation',
              'separate':'V90 | Separate offline initialization from actor injection',
              'runner':'V90 | Precompile actual generated native runner before resource download',
              'build':'V90 | Extract real SPR and map and compile native client',
              'smoke':'V90 | Verify real SPR pixels and directional movement',
              'preserve':'V90 | Save generated sources and failure logs',
              'publish':'V90 | Publish only after authentic player tests pass',
              'report':'V90 | Record verified scope',
          }
          assert len(stages)==len(set(stages.values()))
          assert all(name in original for name in stages.values())
          root=Path('/tmp/v99')
          for stage,title in stages.items():
              source=original[title].replace('V90','V99').replace('v90','v99')
              if stage=='prepare':
                  old="if phase=='preflight':"
                  assert source.count(old)==1,('V90 dispatcher',source.count(old))
                  source=source.replace(old,"if phase=='check':",1)
                  old='python3 -u /tmp/v99-stages.py preflight'
                  assert source.count(old)==1,('Initial check command',source.count(old))
                  source=source.replace(old,'python3 -u /tmp/v99-stages.py check',1)
                  assert "if stage=='preflight':" in source
              if stage=='runner':
                  # /tmp/v99-stages.py is overwritten by the nested V89 bootstrap.
                  # The saved outer dispatcher alone knows V89's real 'preflight'.
                  old='python3 -u /tmp/v99-stages.py preflight'
                  assert source.count(old)==1,('Real runner command',source.count(old))
                  source=source.replace(
                      old,'python3 -u /tmp/v99-outer-stages.py preflight',1
                  )
              matches=list(re.finditer(
                  r"(?ms)^(?:cat >|cat >>) (/tmp/[\w-]+\.py) <<'PY'\n(.*?)\nPY$",
                  source
              ))
              for match in matches:
                  ast.parse(match.group(2),filename=match.group(1))
              path=root/(stage+'.sh')
              path.write_text(source,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
              print('V99 verified:',stage,'Python:',len(matches),flush=True)
          print('V99: saved outer executor will perform real preflight.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-loader.py
          python3 -u /tmp/v99-loader.py 2>&1 | tee reports/V99-loader.log
          test -s /tmp/v99/runner.sh
          test -s /tmp/v99/prepare.sh
          grep -Fq '/tmp/v99-outer-stages.py preflight' /tmp/v99/runner.sh

      - name: "V99 | Preserve outer dispatcher before nested bootstrap overwrites it"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/prepare.sh 2>&1 | tee reports/V99-prepare.log
          test -s /tmp/v99-stages.py
          grep -Fq "if phase=='check':" /tmp/v99-stages.py
          grep -Fq "'preflight':'V89 | Fix native hook" /tmp/v99-stages.py
          cp /tmp/v99-stages.py /tmp/v99-outer-stages.py
          python3 -m py_compile /tmp/v99-outer-stages.py
          bash /tmp/v99/bootstrap.sh 2>&1 | tee reports/V99-bootstrap.log
          test -s /tmp/v99-execute.py
          test -s /tmp/v99-outer-stages.py
          python3 -m py_compile /tmp/v99-execute.py

      - name: "V99 | Restore original map and SDL build scripts"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/restore.sh 2>&1 | tee reports/V99-restore.log
          test -s /tmp/v99-extract.sh
          test -s /tmp/v99-build.sh

      - name: "V99 | Prepare original male knight SPR resources"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/sprites.sh 2>&1 | tee reports/V99-sprites.log
          test -s /tmp/v99-extract.sh

      - name: "V99 | Repair original ZIP central records before SPR lookup"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v99-zip-repair.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path

          path=Path('/tmp/v99-extract.sh')
          assert path.is_file(), 'Original archive extractor was not generated'
          source=path.read_text(encoding='utf-8')

          # V92 used 'records' for the ZIP central-directory dictionaries,
          # then reused it for packed tile index bytes. The subsequent SPR
          # lookup must use the original dictionary records, never tile bytes.
          anchor='assert len(records)==nitems,(len(records),nitems)'
          assert source.count(anchor)==1, ('ZIP directory anchor',source.count(anchor))
          source=source.replace(anchor,anchor+'\nzip_records=tuple(records)',1)
          lookup=(
              r"r for r in records(?=\n[ \t]*if r\['name'\]"
              r"\.lower\(\)\.endswith\()"
          )
          matches=list(re.finditer(lookup,source))
          assert len(matches)==1,('SPR lookup count',len(matches))
          source=re.sub(lookup,'r for r in zip_records',source,count=1)

          assert source.index('zip_records=tuple(records)') < source.index('compact=bytearray()')
          assert source.count('r for r in zip_records')==1
          assert source.count("bank='Sprite'")==1
          assert source.count('sources=extract_selected(source_bank,needed)')==1
          m=re.search(
              r"(?ms)^cat > /tmp/v99-extract\.py <<'PY'\n(.*?)\nPY$",
              source
          )
          assert m,'Generated ZIP extractor source not found'
          ast.parse(m.group(1),filename='/tmp/v99-extract.py')
          path.write_text(source,encoding='utf-8')
          subprocess.run(['bash','-n',str(path)],check=True)

          # Minimal regression check for the actual V92 error type.
          records=[{'name':'Original/Sprite.pak'}]
          zip_records=tuple(records)
          records=[b'packed tile index bytes']
          assert isinstance(records[0],bytes)
          assert next(r for r in zip_records if r['name'].endswith('Sprite.pak'))
          print('V99: ZIP directory dictionaries are independent of tile index bytes.',flush=True)
          print('V99: genuine original Sprite.pak lookup repaired before download.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-zip-repair.py
          python3 -u /tmp/v99-zip-repair.py \
            2>&1 | tee reports/V99-zip-repair.log
          test -s /tmp/v99-extract.sh

      - name: "V99 | Wire original C++ actor and keyboard movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/wire.sh 2>&1 | tee reports/V99-wiring.log
          test -s /tmp/v99-native.py

      - name: "V99 | Separate offline entry from native actor patch"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/separate.sh 2>&1 | tee reports/V99-separation.log
          test -s /tmp/v99-actor.py
          test ! -e /tmp/v99-native.py
          grep -Fq '/tmp/v99-actor.py' /tmp/v99-build.sh

      - name: "V99 | Fix original C++ sprite_data shadowing before native build"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v99-fix-actor.py <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          actor=Path('/tmp/v99-actor.py')
          assert actor.is_file(),'V99 actor injection script not generated'
          code=actor.read_text(encoding='utf-8')
          before='sprite_data.override(v99actor,v99def);'
          after='this->sprite_data.override(v99actor,v99def);'
          assert code.count(before)==1,('V93 C++ compiler failure site',code.count(before))
          code=code.replace(before,after,1)
          assert code.count(after)==1
          ast.parse(code,filename=str(actor))
          actor.write_text(code,encoding='utf-8')
          subprocess.run(['python3','-m','py_compile',str(actor)],check=True)

          header=Path('upstream-l1j/src/sdl_user.h').read_text(encoding='utf-8')
          cpp=Path('upstream-l1j/src/sdl_user.cpp').read_text(encoding='utf-8')
          assert 'server_resource<sprite_definition> sprite_data;' in header
          assert 'unsigned char *sprite_data;' in cpp
          assert 'this->sprite_data.override(v99actor,v99def);' in code
          print('V99: original C++ sprite resource is now accessed via this->.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-fix-actor.py
          python3 -u /tmp/v99-fix-actor.py 2>&1 | tee reports/V99-fix-actor.log
          grep -Fq 'this->sprite_data.override(v99actor,v99def);' /tmp/v99-actor.py

      - name: "V99 | Instrument native original SPR loader before compiling"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v99-spr-diagnostics.py <<'PY'
          from pathlib import Path
          import subprocess

          path=Path('upstream-l1j/src/widgets/sprite_motion.cpp')
          source=path.read_text(encoding='utf-8')
          start=source.index('void sprite_motion::load(int x, int y, char *filename, sdl_user *loader)')
          finish=source.index('\n//arg2 + frames[frame_num]',start)
          code=source[start:finish]

          def replace_one(old,new):
              global code
              assert code.count(old)==1,('Original SPR decoder anchor',old,code.count(old))
              code=code.replace(old,new,1)

          replace_one(
              '\twhile (SDL_mutexP(delay_mtx) == -1) {};',
              r'''printf("V99_SPR stage=enter file=%s\n",filename);
              fflush(stdout);
              while (SDL_mutexP(delay_mtx) == -1) {};'''
          )
          replace_one(
              '\tif (data == 0)\n\t\tdata = (char*)loader->getfiles->load_file(filename, &size, FILE_SPRITEPACK, 0);',
              r'''printf("V99_SPR stage=checked_split file=%s found=%d\n",filename,data?1:0);
              fflush(stdout);
              if (data == 0)
                  data = (char*)loader->getfiles->load_file(filename, &size, FILE_SPRITEPACK, 0);
              printf("V99_SPR stage=checked_base file=%s found=%d\n",filename,data?1:0);
              fflush(stdout);'''
          )
          replace_one(
              '\tSDL_RWops *file = SDL_RWFromMem(data, size);',
              r'''if (size<8) {
                  printf("V99_SPR_FATAL stage=invalid_length file=%s bytes=%d\n",filename,size);
                  fflush(stdout);
                  SDL_mutexV(delay_mtx);
                  throw "V99 genuine SPR file length invalid";
              }
              printf("V99_SPR stage=loaded file=%s bytes=%d header=%02x,%02x,%02x,%02x,%02x\n",
                     filename,size,(unsigned char)data[0],(unsigned char)data[1],
                     (unsigned char)data[2],(unsigned char)data[3],(unsigned char)data[4]);
              fflush(stdout);
              SDL_RWops *file = SDL_RWFromMem(data, size);
              printf("V99_SPR stage=rwops file=%s allocated=%d seek=%d read=%d close=%d\n",
                     filename,file?1:0,file&&file->seek?1:0,
                     file&&file->read?1:0,file&&file->close?1:0);
              fflush(stdout);
              if (!file || !file->seek || !file->read || !file->close) {
                  printf("V99_SPR_FATAL stage=missing_rwops_callbacks file=%s\n",filename);
                  fflush(stdout);
                  SDL_mutexV(delay_mtx);
                  throw "V99 genuine SPR SDL reader has missing callbacks";
              }'''
          )
          replace_one(
              '\tSDL_RWread(file, &mystery1, 1, 1);\n\t\n\tif (mystery1 < 0)',
              r'''printf("V99_SPR stage=before_first_read file=%s\n",filename);
              fflush(stdout);
              SDL_RWread(file, &mystery1, 1, 1);
              printf("V99_SPR stage=after_first_read file=%s byte=%d\n",filename,(int)mystery1);
              fflush(stdout);
              if (mystery1 < 0)'''
          )
          replace_one(
              '\tnum_frames = mystery1;',
              r'''num_frames = mystery1;
              printf("V99_SPR stage=frame_count file=%s frames=%d\n",filename,num_frames);
              fflush(stdout);'''
          )
          replace_one(
              '\tSDL_RWread(file, &num_tiles, 4, 1);',
              r'''printf("V99_SPR stage=before_tile_count file=%s\n",filename);
              fflush(stdout);
              SDL_RWread(file, &num_tiles, 4, 1);
              printf("V99_SPR stage=after_tile_count file=%s raw=%d\n",filename,num_tiles);
              fflush(stdout);'''
          )

          source=source[:start]+code+source[finish:]
          path.write_text(source,encoding='utf-8')
          print('V99: native original SPR reader instrumentation installed.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-spr-diagnostics.py
          python3 - <<'PY'
          from pathlib import Path
          import ast
          actor=Path('/tmp/v99-actor.py')
          assert actor.is_file(),'Original actor patch must exist'
          source=actor.read_text(encoding='utf-8')
          marker="subprocess.run(['python3','/tmp/v99-spr-diagnostics.py'],check=True)"
          assert marker not in source
          source += '\nimport subprocess\n'+marker+'\n'
          ast.parse(source,filename=str(actor))
          actor.write_text(source,encoding='utf-8')
          print('V99: SPR reader probes run after original actor patch, before compilation.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-actor.py
          grep -Fq '/tmp/v99-spr-diagnostics.py' /tmp/v99-actor.py

      - name: "V99 | Replace incompatible SDL1 SPR memory handle with native RWops"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v99-native-rwops.py <<'PY'
          from pathlib import Path

          path=Path('upstream-l1j/src/widgets/sprite_motion.cpp')
          source=path.read_text(encoding='utf-8')
          original='SDL_RWops *file = SDL_RWFromMem(data, size);'
          assert source.count(original)==1,(
              'Original SDL1 memory handle',source.count(original)
          )
          include='#include "sprite_motion.h"'
          assert source.count(include)==1
          assert 'V99_NATIVE_SPR_RWOPS' not in source

          # Emscripten 3.1.74's SDL1 compatibility layer returns an index
          # from SDL_RWFromMem; this client dereferences SDL_RWops callbacks.
          # The actual compiler requires int signatures for seek/read/write.
          # Keep the genuine SPR bytes and original parser unchanged.
          implementation=r'''
          // V99_NATIVE_SPR_RWOPS: native SDL1 memory reader for real SPR bytes.
          #include <cstring>
          #include <cstdint>

          static int SDLCALL v99_spr_seek(SDL_RWops *ctx,int offset,int whence) {
              if (!ctx) return -1;
              const Uint8 *base=ctx->hidden.mem.base;
              const Uint8 *here=ctx->hidden.mem.here;
              const Uint8 *stop=ctx->hidden.mem.stop;
              if (!base || here<base || stop<here) return -1;
              const int64_t total=(int64_t)(stop-base);
              const int64_t current=(int64_t)(here-base);
              int64_t next=0;
              if (whence==RW_SEEK_SET) next=(int64_t)offset;
              else if (whence==RW_SEEK_CUR) next=current+(int64_t)offset;
              else if (whence==RW_SEEK_END) next=total+(int64_t)offset;
              else return -1;
              if (next<0 || next>total) return -1;
              ctx->hidden.mem.here=ctx->hidden.mem.base+(size_t)next;
              return (int)next;
          }

          static int SDLCALL v99_spr_read(SDL_RWops *ctx,void *dst,
                                         int width,int count) {
              if (!ctx || !dst || width<=0 || count<=0) return 0;
              Uint8 *here=ctx->hidden.mem.here;
              Uint8 *stop=ctx->hidden.mem.stop;
              if (!here || stop<here) return 0;
              const size_t item_size=(size_t)width;
              const size_t available=(size_t)(stop-here)/item_size;
              const size_t requested=(size_t)count;
              const size_t n=available<requested?available:requested;
              if (n) {
                  std::memcpy(dst,here,n*item_size);
                  ctx->hidden.mem.here=here+n*item_size;
              }
              return (int)n;
          }

          static int SDLCALL v99_spr_write(SDL_RWops *,const void *,
                                          int,int) { return 0; }

          static int SDLCALL v99_spr_close(SDL_RWops *ctx) {
              delete ctx;
              return 0;
          }

          static SDL_RWops *v99_spr_from_mem(Uint8 *bytes,int length) {
              if (!bytes || length<=0) return 0;
              SDL_RWops *ctx=new SDL_RWops();
              std::memset(ctx,0,sizeof(*ctx));
              ctx->seek=&v99_spr_seek;
              ctx->read=&v99_spr_read;
              ctx->write=&v99_spr_write;
              ctx->close=&v99_spr_close;
              ctx->hidden.mem.base=bytes;
              ctx->hidden.mem.here=bytes;
              ctx->hidden.mem.stop=bytes+(size_t)length;
              return ctx;
          }
          '''
          source=source.replace(include,include+'\n'+implementation,1)
          source=source.replace(
              original,
              'SDL_RWops *file = v99_spr_from_mem((Uint8*)data, size);',1
          )
          assert source.count('V99_NATIVE_SPR_RWOPS')==1
          assert source.count('SDL_RWops *file = v99_spr_from_mem(')==1
          assert original not in source
          path.write_text(source,encoding='utf-8')
          print('V99: real SDL_RWops callbacks installed for original SPR data.',flush=True)
          PY

          python3 -m py_compile /tmp/v99-native-rwops.py
          python3 - <<'PY'
          import ast
          from pathlib import Path

          actor=Path('/tmp/v99-actor.py')
          assert actor.is_file()
          source=actor.read_text(encoding='utf-8')
          previous="subprocess.run(['python3','/tmp/v99-spr-diagnostics.py'],check=True)"
          assert source.count(previous)==1
          hook="subprocess.run(['python3','/tmp/v99-native-rwops.py'],check=True)"
          assert hook not in source
          source=source.replace(previous,previous+'\n'+hook,1)
          ast.parse(source,filename=str(actor))
          actor.write_text(source,encoding='utf-8')
          print('V99: native RWops runs after original SPR instrumentation, before C++ compilation.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-actor.py
          grep -Fq '/tmp/v99-native-rwops.py' /tmp/v99-actor.py

      - name: "V99 | Accept two SDL tile compositor anchors in the generated bridge"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v99-fix-compositor.py <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          bridge=Path('/tmp/v99-sdl-bridge.py')
          assert bridge.is_file(), 'Original SDL bridge must exist after actor wiring'
          code=bridge.read_text(encoding='utf-8')

          # V95's actual JS contained TWO copies of the original 24x24
          # compositor anchor. The renderer already uses replace(...,1),
          # so it injects only a single composed-buffer presentation hook.
          check="assert part.count(needle)==1,("
          fixed="assert part.count(needle) in (1,2),("
          assert code.count(check)==1, ('SDL compositor assertion',code.count(check))
          assert code.count("'Original tile compositor missing'")==1
          assert code.count("part=part.replace(needle,native+needle,1)")==1
          assert code.count("needle='if (srcData.width===24 && srcData.height===24 &&'")==1
          code=code.replace(check,fixed,1)
          ast.parse(code,filename=str(bridge))
          bridge.write_text(code,encoding='utf-8')
          subprocess.run(['python3','-m','py_compile',str(bridge)],check=True)
          print('V99: SDL original tile anchor count allows the verified 2 occurrences.',flush=True)
          print('V99: only the first anchor receives the composed buffer hook.',flush=True)
          PY
          python3 -m py_compile /tmp/v99-fix-compositor.py
          python3 -u /tmp/v99-fix-compositor.py \
            2>&1 | tee reports/V99-compositor-fix.log
          test -s /tmp/v99-sdl-bridge.py

      - name: "V99 | Run actual final Python generator before archive downloads"
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/v99-outer-stages.py
          bash /tmp/v99/runner.sh 2>&1 | tee reports/V99-runner-preflight.log
          test -s /tmp/v99-run.py
          test -s /tmp/v99-actor.py
          python3 -m py_compile /tmp/v99-run.py /tmp/v99-actor.py
          grep -Fq 'final generated Python syntax passed' reports/V99-runner-preflight.log
          echo 'V99: real generated runner syntax verified.'

      - name: "V99 | Extract authentic map and SPR then build native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v99/build.sh 2>&1 | tee reports/V99-build-and-browser.log

      - name: "V99 | Require actual SPR pixels and player movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/smoke.sh 2>&1 | tee reports/V99-native-player-test.log

      - name: "V99 | Save all generated build scripts"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v99/preserve.sh; then
            bash /tmp/v99/preserve.sh
          fi
          mkdir -p reports
          for file in /tmp/v99-stages.py /tmp/v99-outer-stages.py \
                      /tmp/v99-loader.py /tmp/v99-zip-repair.py \
                      /tmp/v99-extract.sh /tmp/v99-extract.py \
                      /tmp/v99-actor.py /tmp/v99-fix-actor.py \
                      /tmp/v99-sdl-bridge.py /tmp/v99-fix-compositor.py \
                      /tmp/v99-spr-diagnostics.py \
                      /tmp/v99-native-rwops.py \
                      /tmp/v99-run.py /tmp/v99-build.sh; do
            if test -s "$file"; then
              cp "$file" "reports/V99-generated-$(basename "$file")"
            fi
          done

      - name: "V99 | Upload diagnostics regardless of outcome"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V99-Native-Player
          path: |
            reports/V99-*.log
            reports/V99-*.json
            reports/V99-*.png
            reports/V99-*.txt
            reports/V99-generated-*
            assets/v99/v99-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V99 | Publish only verified original sprite and movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v99/publish.sh 2>&1 | tee reports/V99-deploy.log

      - name: "V99 | Report actual validation scope"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v99/report.sh; then
            bash /tmp/v99/report.sh
          fi
          {
            echo 'V97 loaded genuine male-knight 61-0.spr (5209 bytes) from original Sprite.pak.'
            echo 'Emscripten SDL1 SDL_RWFromMem returns a JavaScript handle instead of native SDL_RWops.'
            echo 'V99 installs native C++ seek/read/close callbacks without altering original SPR frames.'
            echo 'Real browser SPR rendering, directional animation and native movement still require verification.'
          } >> "$GITHUB_STEP_SUMMARY"
