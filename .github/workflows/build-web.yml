
name: "build-web.yml | V74 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V74 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v74-original-map
  cancel-in-progress: false

jobs:
  original_client_v74:
    name: "build-web.yml | V74 | Fix map script quoting and verify real screen"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V74 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V74 | Checkout successful V70 deployed resources"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V74 | Checkout original Sanctuary client"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V74 | Set up successful V70 Emscripten toolchain"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V74 | Check nested source syntax before downloading original maps"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports
          cat > /tmp/v74-prepare.py <<'PY'
          import ast
          import json
          import subprocess
          from pathlib import Path
          import yaml

          # Reuse the V73 workflow that repaired tile references and viewport
          # rendering. V73 never reached its work: the embedded optimizer's
          # Python triple-single-quoted string ended at an inner visible='''.
          commit='0a272763fdb97e560b43cde1f0524975b04b95a2'
          raw=subprocess.check_output(
              ['git','show',commit+':.github/workflows/build-web.yml'],
              text=True
          )
          workflow=yaml.safe_load(raw)
          steps=workflow['jobs']['original_client_v73']['steps']
          source_step=next(
              step['run'] for step in steps
              if step['name']=='V73 | Extract all referenced tiles and repair original renderer'
          )

          opening="cat > /tmp/v73-orchestrate.py <<'PY'\n"
          ending='\nPY\npython3 -m py_compile /tmp/v73-orchestrate.py'
          assert source_step.count(opening)==1
          assert source_step.count(ending)==1
          program=source_step.split(opening,1)[1].split(ending,1)[0]

          # Use double-quote delimiters for the outer optimizer template.
          # All of its inner triple-single-quoted C++ fragments then remain
          # intact. Do not edit the actual original-game code here.
          outer="optimizer = r'''"
          closing="\n'''\n\n# Insert the optimizer as a distinct script."
          assert program.count(outer)==1
          assert program.count(closing)==1
          program=program.replace(outer,'optimizer = r"""',1)
          program=program.replace(
              closing,
              '\n"""\n\n# Insert the optimizer as a distinct script.',
              1
          )
          program=program.replace('V73','V74').replace('v73','v74')

          # Compile the COMPLETE outer orchestrator and its two nested source
          # templates. This is the specific validation missing from V73.
          tree=ast.parse(program,filename='/tmp/v74-orchestrate.py')
          values={}
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id in (
                          'optimizer','reference_patch'
                      ):
                          values[target.id]=ast.literal_eval(node.value)
          assert set(values)=={'optimizer','reference_patch'}
          for key,code in values.items():
              ast.parse(code,filename='V74-'+key+'.py')
              assert 'V74' in code

          assert 'cat > /tmp/v74-map-opt.py' in program
          assert "'/tmp/v74-map-opt.py'" in program
          assert 'V74 additional original tile banks:' in program
          assert 'V74 native map pixel sample:' in program
          assert 'V74-map-canvas.png' in program
          assert 'V74 original native map visible:' in program

          Path('/tmp/v74-orchestrate.py').write_text(program+'\n')
          Path('reports/V74-preflight.json').write_text(
              json.dumps({
                  'version':'V74',
                  'previous_failure':'V73 optimizer nested triple quote',
                  'outer_python':'syntax_pass',
                  'embedded_optimizer':'syntax_pass',
                  'embedded_original_map_references':'syntax_pass',
                  'reference_commit':commit
              },indent=2)
          )
          print('V74: outer and embedded Python syntax checks passed.',flush=True)
          PY
          python3 -m py_compile /tmp/v74-prepare.py
          python3 -u /tmp/v74-prepare.py | tee reports/V74-preflight.log
          python3 -m py_compile /tmp/v74-orchestrate.py

      - name: "V74 | Run original map extraction, compile and mobile screen test"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u /tmp/v74-orchestrate.py \
            2>&1 | tee reports/V74-execution.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/V74-browser.json').read_text())
          assert report['passed']
          assert report['character_saved']
          assert report['character_restored']
          assert report['native_game_ready']
          assert report['native_map_unique_colors']>=8
          assert report['native_map_nonblack_fraction']>0.02
          assert Path('reports/V74-map-canvas.png').is_file()
          print('V74 ORIGINAL SDL MAP VISIBLE:',report['native_map_nonblack_fraction'])
          PY

      - name: "V74 | Upload failed-run logs and actual rendered canvas"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V74-Original-Map-Diagnostics
          path: |
            reports/V74-preflight.json
            reports/V74-preflight.log
            reports/V74-execution.log
            reports/V74-extract.log
            reports/V74-build-test.log
            reports/V74-browser.json
            reports/V74-build.txt
            reports/V74-mobile.png
            reports/V74-map-canvas.png
            reports/V74-http.txt
            assets/v74/v74-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V74 | Publish only after real original map pixels pass"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V74-browser.json').read_text())
          assert r['passed'] and r['character_saved'] and r['character_restored']
          assert r['native_game_ready']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          original=Path('published/lineage-v70.data').stat().st_size
          current=Path('published/lineage-v74.data').stat().st_size
          map_bytes=sum(
              x.stat().st_size for x in Path('assets/v74/lineage').rglob('*')
              if x.is_file()
          )
          assert original<current<=original+map_bytes+2000000
          assert Path('reports/V74-map-canvas.png').stat().st_size>500
          print('V74 real original native map verified; data bytes:',current)
          PY
          git -C published add -- index.html v74.html \
            lineage-v74.js lineage-v74.wasm lineage-v74.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V74: repair original map optimizer quoting and verify native canvas'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V74 | Record exact outcome"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V74 | Sanctuary game2 GitHub Pages'
            echo 'V73 failed before map extraction due to an embedded Python quoting error.'
            echo 'V74 precompiles the outer Python and both nested map templates.'
            echo 'Reuses V73 authentic Tile.pak and .s32 extraction logic with bank 42.'
            echo 'Reuses original V70 character creation, selection and SDL engine.'
            echo 'The music file is not replaced or transcoded.'
            echo 'No fake image can pass the native canvas pixel check.'
            echo 'A failed build never overwrites the successful V70 Pages deployment.'
            echo 'Gameplay movement and combat are not yet claimed complete.'
          } >> "$GITHUB_STEP_SUMMARY"
