
name: "build-web.yml | V79 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V79 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v79-native-map
  cancel-in-progress: false

jobs:
  original_client_v79:
    name: "build-web.yml | V79 | Repair native SDL tile clipping and pixels"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V79 | Checkout game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V79 | Preserve V70 GitHub Pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V79 | Checkout exact original Sanctuary C++ source"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V79 | Set up verified Emscripten toolchain"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V79 | Restore successful V78 build and original map extraction"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports

          cat > /tmp/v79-restore.py <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          baseline='6f7fa6f3cf9b550e7e75c6396a91adc5a2a2ef72'

          raw=subprocess.check_output(
              ['git','show',
               baseline+':.github/workflows/build-web.yml'],
              text=True
          )

          workflow=yaml.safe_load(raw)
          steps=workflow['jobs']['original_client_v78']['steps']
          scripts={step['name']:step['run']
                   for step in steps if 'run' in step}

          stages=[
              'V78 | Restore V77 native compiler and original map extraction',
              'V78 | Inspect original decoded tile pixels before SDL transfer',
              'V78 | Repair SDL tile blits and present the real map buffer'
          ]

          assert all(name in scripts for name in stages)

          for number,name in enumerate(stages,1):
              script=scripts[name]
              script=script.replace('V78','V79')
              script=script.replace('v78','v79')

              print('V79 restore',number,name,flush=True)

              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',script],
                  check=True
              )

          required=[
              '/tmp/v79-extract.sh',
              '/tmp/v79-build.sh',
              '/tmp/v79-native-viewport.py',
              '/tmp/v79-sdl-bridge.py'
          ]

          for filename in required:
              assert Path(filename).is_file(),filename

          for filename in required[:2]:
              subprocess.run(
                  ['bash','-n',filename],check=True
              )

          for filename in required[2:]:
              subprocess.run(
                  ['python3','-m','py_compile',filename],
                  check=True
              )

          print('V79: V78 C++ and asset build stages restored.',
                flush=True)
          PY

          python3 -m py_compile /tmp/v79-restore.py
          python3 -u /tmp/v79-restore.py \
            2>&1 | tee reports/V79-restore.log

      - name: "V79 | Correct original SDL tile clipping and destination pixels"
        shell: bash
        run: |
          set -euo pipefail

          cat >> /tmp/v79-sdl-bridge.py <<'PY'
          from pathlib import Path
          import subprocess

          target=Path('dist/lineage-v79.js')
          source=target.read_text(encoding='utf-8')

          begin='  blitSurface(src, srcrect, dst, dstrect, scale) {'
          end='  downFingers: {},'

          assert source.count(begin)==1
          start=source.index(begin)
          finish=source.index(end,start)
          section=source[start:finish]

          # Insert before Emscripten SDL clips or rewrites the
          # original SDL_Rect. V78 attempted recovery afterward
          # and required a completely visible 24x24 rectangle.
          marker='    if (dstData.clipRect) {'
          assert section.count(marker)==1

          repair=r'''
              if (srcData.width===24 &&
                  srcData.height===24 &&
                  dstData.width===640 &&
                  dstData.height===380 &&
                  !scale &&
                  sr.x===0 && sr.y===0 &&
                  sr.w===24 && sr.h===24) {

                SDL.v79TileCount=(SDL.v79TileCount||0)+1;

                var v79x=dr.x|0;
                var v79y=dr.y|0;

                var left=Math.max(0,v79x);
                var top=Math.max(0,v79y);
                var right=Math.min(dstData.width,v79x+24);
                var bottom=Math.min(dstData.height,v79y+24);

                var painted=0;
                var width=right-left;
                var height=bottom-top;
                var firstVisible=false;

                if (width>0 && height>0) {
                  try {
                    var tilePixels=srcData.ctx.getImageData(
                      0,0,24,24
                    ).data;

                    var destination=dstData.ctx.getImageData(
                      left,top,width,height
                    );

                    var pixels=destination.data;

                    for (var yy=0;yy<height;yy++) {
                      for (var xx=0;xx<width;xx++) {
                        var sx=left+xx-v79x;
                        var sy=top+yy-v79y;

                        var si=(sy*24+sx)*4;
                        var di=(yy*width+xx)*4;

                        var alpha=tilePixels[si+3]/255;
                        if (alpha<=0) continue;

                        painted++;

                        if (alpha>=1) {
                          pixels[di]=tilePixels[si];
                          pixels[di+1]=tilePixels[si+1];
                          pixels[di+2]=tilePixels[si+2];
                          pixels[di+3]=255;
                        } else {
                          var oldAlpha=pixels[di+3]/255;
                          var outAlpha=
                            alpha+oldAlpha*(1-alpha);

                          if (outAlpha>0) {
                            for (var c=0;c<3;c++) {
                              pixels[di+c]=(
                                tilePixels[si+c]*alpha+
                                pixels[di+c]*oldAlpha*
                                  (1-alpha)
                              )/outAlpha;
                            }
                            pixels[di+3]=outAlpha*255;
                          }
                        }
                      }
                    }

                    if (painted>0) {
                      dstData.ctx.putImageData(
                        destination,left,top
                      );

                      SDL.v79PaintedPixels=
                        (SDL.v79PaintedPixels||0)+painted;

                      firstVisible=!SDL.v79FirstVisible;
                      SDL.v79FirstVisible=true;

                      // Genuine C++ SDL viewport, not an HTML map.
                      SDL.v79NativeMapViewport=dstData.canvas;

                      if (!SDL.v79PresenterInstalled) {
                        SDL.v79PresenterInstalled=true;

                        var presentNativeViewport=function() {
                          var canvas=Module["canvas"];
                          var nativeMap=
                            SDL.v79NativeMapViewport;

                          if (canvas && nativeMap) {
                            var ctx=canvas.getContext("2d");

                            ctx.drawImage(
                              nativeMap,
                              0,0,640,380,
                              0,0,canvas.width,
                              Math.round(
                                canvas.height*380/480
                              )
                            );
                          }

                          requestAnimationFrame(
                            presentNativeViewport
                          );
                        };

                        requestAnimationFrame(
                          presentNativeViewport
                        );

                        out(
                          "V79: native SDL tile presenter started"
                        );
                      }
                    }

                    if (SDL.v79TileCount<=4 ||
                        SDL.v79TileCount%128===0 ||
                        firstVisible) {
                      out(
                        "V79: tile="+SDL.v79TileCount+
                        " x="+v79x+
                        " y="+v79y+
                        " area="+width+"x"+height+
                        " painted="+painted+
                        " total="+
                          (SDL.v79PaintedPixels||0)
                      );
                    }

                    // The original SDL image was used, with
                    // proper partial clipping and alpha blending.
                    // Avoid sending the same tile through the
                    // previously broken compatibility blit.
                    return 0;

                  } catch (error) {
                    if (!SDL.v79ErrorReported) {
                      SDL.v79ErrorReported=true;
                      err(
                        "V79: native tile pixel copy failed: "+
                        error
                      );
                    }
                  }
                }

                if (SDL.v79TileCount<=4 ||
                    SDL.v79TileCount%128===0) {
                  out(
                    "V79: offscreen tile="+
                    SDL.v79TileCount+
                    " x="+v79x+
                    " y="+v79y+
                    " visible="+width+"x"+height
                  );
                }
              }

          '''

          section=section.replace(
              marker,repair+marker,1
          )

          source=source[:start]+section+source[finish:]

          assert source.count(
              'V79: native SDL tile presenter started'
          )==1
          assert source.count('V79: tile=')==1
          assert source.count('V79: offscreen tile=')==1

          target.write_text(source,encoding='utf-8')

          subprocess.run(
              ['node','--check',str(target)],
              check=True
          )

          print(
              'V79: native SDL tile compositor verified.',
              flush=True
          )
          PY

          python3 -m py_compile /tmp/v79-sdl-bridge.py

          python3 - <<'PY'
          from pathlib import Path

          script=Path('/tmp/v79-build.sh').read_text()

          assert '/tmp/v79-native-viewport.py' in script
          assert '/tmp/v79-sdl-bridge.py' in script
          assert 'align_sdl_proxy_indices' in script

          print('V79: original C++ and SDL hooks present.')
          PY

          bash -n /tmp/v79-build.sh

      - name: "V79 | Extract original maps and verify real game canvas"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash /tmp/v79-extract.sh \
            2>&1 | tee reports/V79-extraction.log

          bash /tmp/v79-build.sh \
            2>&1 | tee reports/V79-build-test.log

          python3 - <<'PY'
          import json
          from pathlib import Path

          result=json.loads(
              Path('reports/V79-browser.json').read_text()
          )

          assert result['character_saved']
          assert result['character_restored']
          assert result['native_game_ready']
          assert result['passed']

          assert result['native_map_unique_colors']>=8
          assert result['native_map_nonblack_fraction']>0.02

          assert Path(
              'reports/V79-map-canvas.png'
          ).stat().st_size>500

          print(
              'V79 original map visible:',
              result['native_map_nonblack_fraction'],
              flush=True
          )
          PY

      - name: "V79 | Upload real original-map diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V79-Native-Map
          path: |
            reports/V79-restore.log
            reports/V79-preflight.log
            reports/V79-bridge-preflight.log
            reports/V79-extraction.log
            reports/V79-build-test.log
            reports/V79-extract.log
            reports/V79-browser.json
            reports/V79-map-canvas.png
            reports/V79-mobile.png
            reports/V79-http.txt
            assets/v79/v79-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V79 | Publish only when original C++ map pixels are visible"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          r=json.loads(
              Path('reports/V79-browser.json').read_text()
          )

          assert r['passed']
          assert r['character_saved']
          assert r['character_restored']
          assert r['native_game_ready']

          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02

          original=Path(
              'published/lineage-v70.data'
          ).stat().st_size

          current=Path(
              'published/lineage-v79.data'
          ).stat().st_size

          assets=sum(
              p.stat().st_size
              for p in Path('assets/v79/lineage').rglob('*')
              if p.is_file()
          )

          assert original<current<=original+assets+2000000

          assert Path(
              'reports/V79-map-canvas.png'
          ).stat().st_size>500

          print('V79 deployment gate passed.')
          PY

          git -C published add -- \
            index.html \
            v79.html \
            lineage-v79.js \
            lineage-v79.wasm \
            lineage-v79.data

          git -C published config user.name \
            'github-actions[bot]'
          git -C published config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V79: fix genuine SDL tile clipping and alpha composition'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V79 | Record measured rendering results"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V79 | Sanctuary game2 GitHub Pages'
            echo
            echo 'V78 successfully decoded original RGB555 tile pixels.'
            echo 'V78 source tiles had 288 opaque and colored pixels.'
            echo 'V78 destination tiles remained transparent.'
            echo 'V79 clips original SDL tiles against the viewport.'
            echo 'V79 composites authentic RGBA tile pixels.'
            echo 'V79 reports actual destination coordinates and painted pixels.'
            echo 'Original C++ engine, characters and map data are retained.'
            echo 'Publishing requires nonblank original-map canvas pixels.'
            echo 'A failure leaves the successful V70 deployment unchanged.'
            echo 'Movement and combat are not yet verified.'
          } >> "$GITHUB_STEP_SUMMARY"
