# FILE: .github/workflows/build-web.yml
# VERSION: V104
# PURPOSE: Actual unmodified Sanctuary Login.exe in the browser, not an image or L1J.
# FIX: V50 used the stripped Boxedwine filesystem lacking oledlg/dbghelp/wineboot.
# NEW ROOT: Official published Wine 11 web filesystem v17, SHA-256 pinned.
# GATE: Verify genuine emulator canvas against V103 native Win32 capture,
#       then perform actual pointer interaction and report its observed outcome.
# DEPLOY: Only on genuine login screen verification, preserving older Pages files.
name: "build-web.yml | V104 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V104 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v104-real-windows-web
  cancel-in-progress: false

jobs:
  original_browser_v104:
    name: "build-web.yml | V104 | Real original Login.exe in Boxedwine"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "V104 | Checkout game2 and preserve published Pages"
        uses: actions/checkout@v4

      - name: "V104 | Install ZIP, verification and browser tools"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq p7zip-full unzip zip
          python3 -m pip install --quiet 'playwright==1.56.0' 'opencv-python-headless==4.11.0.86' 'Pillow==11.3.0'
          python3 -m playwright install --with-deps chromium
          mkdir -p work/archive work/official work/original reports site/v104

      - name: "V104 | Restore official unmodified Boxedwine 26R1 web emulator"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 26R1.0 -R danoon2/Boxedwine \
            -p 'Boxedwine26R1Web.zip' -D work --clobber
          test "$(stat -c %s work/Boxedwine26R1Web.zip)" -eq 122244710
          unzip -q work/Boxedwine26R1Web.zip -d work/official
          mapfile -t matches < <(find work/official -type f -name 'boxedwine.html' | sort)
          test "${#matches[@]}" -ge 1
          found=''
          for item in "${matches[@]}"; do
            base="$(dirname "$item")"
            if test -s "$base/boxedwine.js" && test -s "$base/boxedwine.wasm" \
              && test -s "$base/boxedwine-shell.js" && test -s "$base/boxedwine.css"; then
              found="$base"
              break
            fi
          done
          test -n "$found" || { echo 'Official release has no matching web runtime quartet' >&2; exit 1; }
          for name in boxedwine.html boxedwine.js boxedwine.wasm boxedwine-shell.js boxedwine.css; do
            cp "$found/$name" "site/v104/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          file=Path('site/v104/boxedwine-shell.js')
          source=file.read_text(encoding='utf-8')
          # Do not reuse V50's persisted/partially initialized Wine prefix.
          old='Config.storageMode = STORAGE_INDEXED_DB;'
          assert source.count(old)==1,('Boxedwine storage anchor changed',source.count(old))
          source=source.replace(old,'Config.storageMode = STORAGE_MEMORY;',1)
          old='Config.persist_d_drive = true;'
          assert source.count(old)==1
          source=source.replace(old,'Config.persist_d_drive = false;',1)
          file.write_text(source,encoding='utf-8')
          print('V104: official Boxedwine runtime, isolated fresh guest filesystem.')
          PY
          node --check site/v104/boxedwine-shell.js
          sha256sum site/v104/boxedwine.wasm > reports/V104-emulator-sha256.txt

      - name: "V104 | Replace stripped Wine root with full published Wine 11 web root"
        shell: bash
        run: |
          set -euo pipefail
          # v17 is the published full web runtime. The former 49 MB demo root
          # lacks DLLs required by the original Sanctuary Login.exe.
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 400 \
            --output site/v104/boxedwine.zip \
            'https://boxedwine.org/v2/17/TinyCore15Wine11.0-web.zip'
          test "$(stat -c %s site/v104/boxedwine.zip)" -eq 99486076
          echo '262671189dddccac04c537715fd5030f23ac08a5bc6742d15206004eeeb9f29d  site/v104/boxedwine.zip' | sha256sum -c
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          archive=Path('site/v104/boxedwine.zip')
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None,'Wine root CRC mismatch'
              names=[i.filename.lower() for i in z.infolist() if not i.is_dir()]
          required=['oledlg.dll','dbghelp.dll','wineboot.exe','shell32.dll']
          found={n:[p for p in names if p.endswith('/'+n)] for n in required}
          Path('reports/V104-wine-root-audit.json').write_text(
              json.dumps({'source':'Boxedwine Wine 11 web v17','files':len(names),
                          'dependencies':found},indent=2),encoding='utf-8')
          for name,locations in found.items():
              print('V104 Wine dependency',name,locations[:4],flush=True)
              assert locations,'Full Wine web root lacks '+name
          assert any(p.endswith('/bin/wine') for p in names),'Wine executable absent'
          print('V104: missing Wine DLL and wineboot errors from V50 checked before browser run.')
          PY
          sha256sum site/v104/boxedwine.zip >> reports/V104-emulator-sha256.txt

      - name: "V104 | Extract unchanged Sanctuary startup files from all 46 original volumes"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.*' -D work/archive --clobber
          test "$(find work/archive -maxdepth 1 -type f | wc -l)" -eq 46
          7z x work/archive/Sanctuary.of.Aden.-.Copy.zip \
            -owork/original -y '-ir!*.exe' '-ir!*.bin' '-ir!*.dll' \
            '-ir!*.ini' '-ir!*.cfg' '-ir!*.dat' '-ir!*.sys' '-ir!*.vxd' \
            '-ir!*.png' '-ir!*.bmp' '-ir!*.jpg' '-ir!*.gif' \
            '-ir!*.fnt' '-ir!*.tbl' '-ir!*.xml' \
            > reports/V104-extract.log
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('work/original/Sanctuary of Aden - Copy')
          required={
              'Login.exe':'995a4752b7e2da7782a95445f2ce7b07ec5e19c72c4b0387c5373dd3f2d06741',
              'Lineage.exe':'2124b3da5f53123e0f94a85bd7f9edb2344925fdb4f53d0fc0653ea5c9241414',
              'lin.bin':'0d40fdf84d19e0ecc043766455fb9c5a215a5c39bbac858ca602f0bf5259f19e',
          }
          for name,sha in required.items():
              path=root/name
              assert path.is_file(),'Missing unmodified original '+name
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual==sha,(name,actual,sha)
          files=sorted(p for p in root.rglob('*') if p.is_file())
          manifest={'source':'gowellsik-hue/Game release v1.0.0 original 46 ZIP volumes',
                    'verified_original_hashes':required,'file_count':len(files),
                    'total_bytes':sum(p.stat().st_size for p in files)}
          archive=Path('site/v104/sanctuary-v104.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=False) as z:
              for file in files:
                  # Exact original bytes, preserved paths and names, no substitute UI.
                  z.write(file,file.relative_to(root).as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert all(n in z.namelist() for n in required)
          # GitHub Pages limits a single published file to 100 MiB.
          assert archive.stat().st_size < 100_000_000,(
              'Unmodified startup archive exceeds Pages per-file limit',archive.stat().st_size)
          manifest['packaged_bytes']=archive.stat().st_size
          Path('reports/V104-original-files.json').write_text(json.dumps(manifest,indent=2))
          print('V104: verified original Windows files:',manifest,flush=True)
          PY
          sha256sum site/v104/sanctuary-v104.zip > reports/V104-original-sha256.txt

      - name: "V104 | Prepare genuine Login.exe browser entry point"
        shell: bash
        run: |
          set -euo pipefail
          # This page only launches the official Boxedwine emulator. It never
          # draws or simulates a login screen, world or character.
          cat > site/v104/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary | Original Login.exe | V104</title>
          <meta http-equiv="refresh" content="0;url=./boxedwine.html?app=sanctuary-v104&amp;p=Login.exe&amp;auto=true&amp;sound=false&amp;disableHideCursor=true">
          </head><body><a href="./boxedwine.html?app=sanctuary-v104&amp;p=Login.exe&amp;auto=true&amp;sound=false&amp;disableHideCursor=true">Original Login.exe</a></body></html>
          HTML
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=./v104/"></head>
          <body><a href="./v104/">Original Sanctuary Login.exe</a></body></html>
          HTML
          touch site/.nojekyll site/v104/.nojekyll
          test -s site/v104/boxedwine.wasm
          test -s site/v104/boxedwine.zip
          test -s site/v104/sanctuary-v104.zip

      - name: "V104 | Restore V103 native screenshot for authentic pixel comparison"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40268037307 -R gowellsik-hue/game2 \
            -n Sanctuary-V103-Real-Windows-Login -D reports/native-reference
          test -s reports/native-reference/V103-Login-0-DesktopCapture.png
          python3 - <<'PY'
          from PIL import Image
          p='reports/native-reference/V103-Login-0-DesktopCapture.png'
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              assert im.size==(692,460),('Original login reference changed',im.size)
          print('V104: original Win32 Login.exe reference is 692x460.',flush=True)
          PY

      - name: "V104 | Test actual Windows login pixels and mouse interaction in Chromium"
        shell: bash
        run: |
          set -euo pipefail
          cat > work/v104-browser-test.py <<'PY'
          import asyncio
          import json
          import time
          from pathlib import Path
          import cv2
          import numpy as np
          from playwright.async_api import async_playwright

          report=Path('reports')
          original=cv2.imread(str(report/'native-reference/V103-Login-0-DesktopCapture.png'))
          assert original is not None and original.shape[:2]==(460,692)
          sift=cv2.SIFT_create(nfeatures=1800)
          ref_kp,ref_des=sift.detectAndCompute(cv2.cvtColor(original,cv2.COLOR_BGR2GRAY),None)
          assert ref_des is not None and len(ref_kp)>25

          def match_original(image):
              # Match actual emulator-canvas pixels, not a background image or HTML mock.
              if image is None or min(image.shape[:2])<200:
                  return None
              kp,des=sift.detectAndCompute(cv2.cvtColor(image,cv2.COLOR_BGR2GRAY),None)
              if des is None or len(kp)<12:return None
              pairs=cv2.BFMatcher(cv2.NORM_L2).knnMatch(ref_des,des,k=2)
              good=[m for m,n in pairs if m.distance<0.72*n.distance]
              if len(good)<15:return None
              src=np.float32([ref_kp[m.queryIdx].pt for m in good]).reshape(-1,1,2)
              dst=np.float32([kp[m.trainIdx].pt for m in good]).reshape(-1,1,2)
              H,mask=cv2.findHomography(src,dst,cv2.RANSAC,5.0)
              if H is None or mask is None:return None
              count=int(mask.sum())
              if count<12:return None
              corners=np.float32([[[0,0]],[[692,0]],[[692,460]],[[0,460]]])
              projected=cv2.perspectiveTransform(corners,H).reshape(4,2)
              area=abs(float(cv2.contourArea(projected.astype(np.float32))))
              if not 0.18*692*460<area<2.1*692*460:return None
              center=cv2.perspectiveTransform(np.float32([[[225,135]]]),H)[0,0]
              x,y=float(center[0]),float(center[1])
              if not (0<x<image.shape[1] and 0<y<image.shape[0]):return None
              return {'inliers':count,'matches':len(good),'projected_area':area,
                      'server_click_canvas':[round(x,1),round(y,1)]}

          async def main():
              evidence={'version':'V104','engine':'Official Boxedwine 26R1.0',
                        'wine_root':'Published full Wine 11 web v17',
                        'program':'Unmodified Sanctuary Login.exe',
                        'original_login_pixels_verified':False,
                        'mouse_input_sent_to_real_canvas':False,
                        'post_click_transition_verified':False,
                        'console':[],'errors':[]}
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(headless=True,args=[
                      '--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
                      '--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                  page=await browser.new_page(viewport={'width':1100,'height':850},device_scale_factor=1)
                  def log(txt):
                      if len(evidence['console'])<500:evidence['console'].append(str(txt)[:500])
                  page.on('console',lambda msg:log(msg.text))
                  page.on('pageerror',lambda err:evidence['errors'].append(str(err)[:500]))
                  page.on('requestfailed',lambda req:evidence['errors'].append('request failed '+req.url))
                  page.on('response',lambda res:evidence['errors'].append('HTTP '+str(res.status)+' '+res.url)
                          if res.status>=400 else None)
                  try:
                      url='http://127.0.0.1:8765/v104/boxedwine.html?app=sanctuary-v104&p=Login.exe&auto=true&sound=false&disableHideCursor=true'
                      await page.goto(url,wait_until='domcontentloaded',timeout=40000)
                      box=page.locator('#canvas')
                      await box.wait_for(state='visible',timeout=30000)
                      start=time.monotonic()
                      located=None
                      while time.monotonic()-start<125:
                          await asyncio.sleep(4)
                          await box.screenshot(path=str(report/'V104-emulator-canvas.png'),timeout=20000)
                          image=cv2.imread(str(report/'V104-emulator-canvas.png'))
                          located=match_original(image)
                          if located:break
                          output=await page.locator('#output').input_value(timeout=3000)
                          if 'oledlg.dll' in output.lower() and 'not found' in output.lower():
                              break
                      evidence['emulator_output']=await page.locator('#output').input_value(timeout=5000)
                      evidence['login_image_match']=located
                      evidence['original_login_pixels_verified']=bool(located)
                      await page.screenshot(path=str(report/'V104-browser-before-click.png'),full_page=True)
                      if not located:
                          raise AssertionError('Real Login.exe pixels NOT found in Boxedwine canvas; refusing deployment')
                      bad=['library oledlg.dll','library dbghelp.dll','wineboot c0000135','importing dlls for']
                      low=evidence['emulator_output'].lower()
                      assert not any(x in low for x in bad),'Broken Wine imports still present'
                      # Measure genuine idle animation first. Ordinary redraws
                      # must not be mistaken for a server-button response.
                      previous=cv2.imread(str(report/'V104-emulator-canvas.png'))
                      await asyncio.sleep(2)
                      await box.screenshot(path=str(report/'V104-idle-canvas.png'),timeout=20000)
                      idle_image=cv2.imread(str(report/'V104-idle-canvas.png'))
                      idle_delta=float(np.mean(cv2.absdiff(previous,idle_image)))
                      evidence['idle_canvas_mean_delta']=round(idle_delta,3)
                      coords=located['server_click_canvas']
                      rect=await box.bounding_box()
                      assert rect is not None
                      # Coordinates derive from genuine Win32 UI features.
                      await page.mouse.dblclick(rect['x']+coords[0],rect['y']+coords[1],delay=130)
                      evidence['mouse_input_sent_to_real_canvas']=True
                      changes=[]
                      for delay in [2,4,6,8]:
                          await asyncio.sleep(delay)
                          await box.screenshot(path=str(report/'V104-emulator-after-click.png'),timeout=20000)
                          newer=cv2.imread(str(report/'V104-emulator-after-click.png'))
                          if newer is not None and newer.shape==idle_image.shape:
                              changed=float(np.mean(cv2.absdiff(idle_image,newer)))
                              changes.append(round(changed,3))
                      evidence['post_click_canvas_mean_delta']=changes
                      threshold=max(3.0,idle_delta*1.8+1.5)
                      evidence['server_click_delta_threshold']=round(threshold,3)
                      evidence['post_click_transition_verified']=bool(changes and max(changes)>threshold)
                      evidence['emulator_output_after_click']=await page.locator('#output').input_value(timeout=5000)
                      await page.screenshot(path=str(report/'V104-browser-after-click.png'),full_page=True)
                      # No authentication is claimed. This verifies the original
                      # server-list interaction produced a real rendering response.
                      assert evidence['post_click_transition_verified'],(
                          'Server selection produced no observable UI response',changes)
                  finally:
                      (report/'V104-browser.json').write_text(json.dumps(evidence,indent=2,ensure_ascii=False),encoding='utf-8')
                      await browser.close()
              print('V104 verified actual original browser login and click:',
                    evidence['login_image_match'],evidence['post_click_canvas_mean_delta'],flush=True)

          asyncio.run(main())
          PY
          python3 -m py_compile work/v104-browser-test.py
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site \
            > reports/V104-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/v104/boxedwine.html; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/v104/boxedwine.html
          python3 -u work/v104-browser-test.py 2>&1 | tee reports/V104-browser-test.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('reports/V104-browser.json').read_text(encoding='utf-8'))
          assert e['original_login_pixels_verified']
          assert e['mouse_input_sent_to_real_canvas']
          assert e['post_click_transition_verified']
          assert Path('reports/V104-browser-after-click.png').stat().st_size>15000
          print('V104 strict original browser login gate passed')
          PY

      - name: "V104 | Upload evidence even if the browser cannot run original Login.exe"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V104-Original-Browser-Login
          path: |
            reports/V104-*
            reports/native-reference/V103-Login-0-DesktopCapture.png
          retention-days: 30
          if-no-files-found: warn

      - name: "V104 | Deploy only the actually verified original browser login"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          enable_jekyll: false

      - name: "V104 | Report what really works"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V104 | Original Sanctuary Windows Login.exe in browser'
            echo 'This workflow does not use L1J or a hand-drawn substitute login.'
            echo 'Wine root: Boxedwine published full Wine 11 web v17, hash verified.'
            echo 'Original EXEs: unchanged release v1.0.0 SHA-256 verified.'
            if test -s reports/V104-browser.json; then
              python3 - <<'PY'
          import json,os
          e=json.load(open('reports/V104-browser.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              for key in ['original_login_pixels_verified','mouse_input_sent_to_real_canvas',
                          'post_click_transition_verified']:
                  f.write(f'- {key}: {e.get(key)}\n')
          PY
            fi
            echo 'Actual server authentication, account creation and game world loading are NOT verified.'
            echo 'If this build fails, GitHub Pages remains on the previous build.'
          } >> "$GITHUB_STEP_SUMMARY"
