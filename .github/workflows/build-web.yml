
name: "build-web.yml | V45 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V45 | Original Sanctuary engine runtime test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: build-web-yml-v45-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v45:
    name: "build-web.yml | V45 | Compile existing l1j-client main() to WebAssembly"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "V45 | Checkout existing game2"
        uses: actions/checkout@v4

      - name: "V45 | Checkout existing l1j-client C++ engine, unchanged"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V45 | Set up Emscripten for the original C++ source"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V45 | Compile ALL existing C++ and C source objects"
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream-l1j/Makefile.am
          test -s upstream-l1j/COPYING
          emcc --version | head -1
          mkdir -p build/objects dist reports
          cat > /tmp/v45-build-sources.py <<'PY_BUILD'
          import pathlib, re, subprocess
          src=pathlib.Path('upstream-l1j')
          txt=(src/'Makefile.am').read_text()
          m=re.search(r'^Lineage_SOURCES\s*=\s*\\\s*\n(.*?)\nif MAC',txt,re.M|re.S)
          if not m: raise SystemExit('The upstream Lineage_SOURCES declaration changed')
          files=re.findall(r'src/[\w./-]+\.(?:cpp|c)\b',m.group(1))
          if len(files)<55: raise SystemExit('Unexpectedly small engine source list: '+str(len(files)))
          (pathlib.Path('reports')/'V45-source-list.txt').write_text('\n'.join(files)+'\n')
          flags=['-O1','-g0','-pthread','-fexceptions','-sUSE_SDL=1',
                 '-sUSE_SDL_IMAGE=1','-sUSE_SDL_MIXER=1',
                 '-Iupstream-l1j/src','-Iupstream-l1j/src/resources','-Iupstream-l1j/include']
          objects=[]
          for n,rel in enumerate(files):
              file=src/rel
              if not file.is_file():raise SystemExit('Missing original client file: '+str(file))
              obj='build/objects/%03d.o'%n
              compiler='emcc' if rel.endswith('.c') else 'em++'
              staging=file
              if rel == 'src/resources/global_files.cpp':
                  # The unmodified original client expects PAKs to exist during
                  # global_files::init(). Prepare lazy originals in its worker.
                  source=file.read_text()
                  target='void global_files::init()\n{\n'
                  assert source.count(target)==1
                  source=source.replace(target,target+'\tif (!v45_prepare_pak_files())\n\t\tprintf("V45: lazy PAK mount unavailable\\n");\n',1)
                  source='extern "C" int v45_prepare_pak_files();\n'+source
                  staging=pathlib.Path('build/v45-staged-global_files.cpp')
                  staging.write_text(source)
              elif rel == 'src/resources/pack.cpp':
                  # Missing full-volume packages must be reported, not fed to
                  # fseek(NULL) / fread(NULL), which crashes as call_indirect.
                  source=file.read_text()
                  target='\topen_data();\t//open the data file it is not already\n\tint num_invalid = 0;'
                  assert source.count(target)==1
                  source=source.replace(target,'\topen_data();\t//open the data file it is not already\n\tif (!data_buf) {\n\t\tprintf("V45 MISSING ORIGINAL PAK: %s\\n", data_file);\n\t\treturn 1;\n\t}\n\tint num_invalid = 0;',1)
                  target='unsigned char* pack::load_file(int which, int decrypting)\n{\n\tunsigned char *buf;\n\topen_data();\n'
                  assert source.count(target)==1
                  source=source.replace(target,target+'\tif (!data_buf) return 0;\n',1)
                  staging=pathlib.Path('build/v45-staged-pack.cpp')
                  staging.write_text(source)
              elif rel == 'src/resources/music.cpp':
                  # Mix_LoadMUS can return NULL. Never pass NULL to
                  # Mix_PlayMusic because Emscripten SDL dereferences it.
                  source=file.read_text()
                  target='\t\t\tMix_PlayMusic(cur_music, -1);'
                  assert source.count(target)==1
                  replacement=('\t\t\tif (cur_music) {\n'
                               '\t\t\t\tif (Mix_PlayMusic(cur_music, -1) < 0)\n'
                               '\t\t\t\t\tprintf("V45: Audio playback unavailable; continuing game.\\n");\n'
                               '\t\t\t} else {\n'
                               '\t\t\t\tprintf("V45: Music load unavailable; continuing game.\\n");\n'
                               '\t\t\t}')
                  source=source.replace(target,replacement,1)
                  staging=pathlib.Path('build/v45-staged-music.cpp')
                  staging.write_text(source)
              argv=[compiler,*flags,'-c',str(staging),'-o',obj]
              print('Compiling',rel,flush=True)
              subprocess.run(argv,check=True)
              objects.append(obj)
          pathlib.Path('build/objects-list.txt').write_text('\n'.join(objects))
          print('Original sources compiled:',len(objects))
          PY_BUILD
          python3 /tmp/v45-build-sources.py 2>&1 | tee reports/V45-compile-log.txt
          test -s build/objects-list.txt
          test -z "$(git -C upstream-l1j status --porcelain)" || {
            echo 'Upstream original sources were unexpectedly altered' >&2
            exit 1
          }

      - name: "V45 | Cache original startup resources including music"
        id: startup_cache
        uses: actions/cache@v4
        with:
          key: original-sanctuary-v45-indexes-text-sprite00-music0-v1
          path: original-startup/

      - name: "V45 | Fetch original Sanctuary startup data on first run"
        if: steps.startup_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq p7zip-full
          mkdir -p original-download original-startup
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original-download --clobber
          test "$(find original-download -type f | wc -l)" -eq 46
          7z x original-download/Sanctuary.of.Aden.-.Copy.zip \
            -ooriginal-startup -y '-ir!*.idx' '-ir!*.fnt' '-ir!Text.pak' '-ir!Sprite00.pak' '-ir!music0.mp3' \
            > reports/V45-startup-extract-log.txt
          rm -rf original-download

      - name: "V45 | Split original boot PAK files for GitHub Pages byte ranges"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pakchunks
          cat > /tmp/v45-split-original.py <<'PY_SPLIT'
          import hashlib, json, pathlib
          base=pathlib.Path('original-startup/Sanctuary of Aden - Copy')
          output=pathlib.Path('dist/pakchunks')
          chunk_size=16*1024*1024
          original_paks={'Text.pak':24846904,'Sprite00.pak':218172787}
          manifest={'version':'V45','chunkSize':chunk_size,'files':{}}
          for name,expected in original_paks.items():
              original=base/name
              assert original.is_file(), f'Missing ORIGINAL PAK {name}'
              assert original.stat().st_size==expected, f'Incorrect original {name} size'
              digest=hashlib.sha256()
              count=0
              with original.open('rb') as inp:
                  while True:
                      part=inp.read(chunk_size)
                      if not part: break
                      digest.update(part)
                      (output/(name+'.part'+f'{count:03d}')).write_bytes(part)
                      count+=1
              with original.open('rb') as inp:
                  for i in [0,expected//2,expected-1]:
                      inp.seek(i)
                      want=inp.read(1)
                      shard=(output/(name+'.part'+f'{i//chunk_size:03d}'))
                      with shard.open('rb') as sh:
                          sh.seek(i%chunk_size)
                          assert want==sh.read(1), f'Part differs at {name} {i}'
              manifest['files'][name]={'size':expected,'sha256':digest.hexdigest(),'parts':count}
              print(f'Original PAK {name}: {expected} bytes, {count} shards, sha256={digest.hexdigest()}',flush=True)
          (pathlib.Path('dist')/'v45-paks.json').write_text(json.dumps(manifest,indent=2)+'\n')
          total=sum(p.stat().st_size for p in output.iterdir())
          assert total==sum(original_paks.values())
          assert total<300*1024*1024,'Refuse excessive GH Pages data'
          PY_SPLIT
          python3 /tmp/v45-split-original.py 2>&1 | tee reports/V45-pak-shards-log.txt

      - name: "V45 | Link the original client main() without recreated game logic"
        shell: bash
        run: |
          set -euo pipefail
          base='original-startup/Sanctuary of Aden - Copy'
          original_idx="$base/Sprite00.idx"
          original_font="$base/font/eng.fnt"
          original_small_font="$base/font/small.fnt"
          original_music="$base/sound/music0.mp3"
          if [[ ! -s "$original_idx" || ! -s "$original_font" || ! -s "$original_small_font" || ! -s "$original_music" ]]; then
            echo 'V45 | Missing startup resources; actual extracted file paths:' >&2
            find original-startup -type f | sort >&2
            echo "Sprite00.idx present: $(test -s "$original_idx" && echo yes || echo no)" >&2
            echo "font/eng.fnt present: $(test -s "$original_font" && echo yes || echo no)" >&2
            echo "font/small.fnt present: $(test -s "$original_small_font" && echo yes || echo no)" >&2
            echo "sound/music0.mp3 present: $(test -s "$original_music" && echo yes || echo no)" >&2
            exit 1
          fi
          mkdir -p runtime/lineage/Font runtime/lineage/sound
          find "$base" -maxdepth 1 -type f -iname '*.idx' \
            -exec cp -a '{}' runtime/lineage/ ';'
          for idx in Text.idx Tile.idx Sprite.idx Sprite00.idx Sprite15.idx; do
            test -s "runtime/lineage/$idx" || { echo "Missing original index $idx"; exit 1; }
          done
          cp -a "$original_font" runtime/lineage/Font/eng.fnt
          cp -a "$original_small_font" runtime/lineage/Font/SMALL.FNT
          cp -a "$original_music" runtime/lineage/sound/music0.mp3
          cmp -s "$original_idx" runtime/lineage/Sprite00.idx
          cmp -s "$original_font" runtime/lineage/Font/eng.fnt
          cmp -s "$original_small_font" runtime/lineage/Font/SMALL.FNT
          cmp -s "$original_music" runtime/lineage/sound/music0.mp3
          test "$(stat -c %s runtime/lineage/sound/music0.mp3)" -eq 1632319
          sha256sum "$original_idx" "$original_font" "$original_small_font" "$original_music" > reports/V45-original-startup-hashes.txt
          printf 'V45: original music0.mp3=%s bytes\n' "$(stat -c %s "$original_music")"

          cat > runtime/Lineage.ini <<'INI'
          Path = /lineage/
          NumServers = 1
          Original Client Test
              Port = 2001
              GamePort = 2000
              Names = 127.0.0.1
          INI

          test -s upstream-l1j/src/sprite_table.txt

          cat > build/v45-sdl12-compat.cpp <<'CPP_COMPAT'
          #include <SDL/SDL.h>
          #include <SDL/SDL_image.h>
          #include <cstring>
          #include <cstdarg>
          #include <pthread.h>
          #include <new>
          #include <cstdio>
          #include <emscripten.h>

          struct SDL_Thread {
            pthread_t native;
            int (SDLCALL *callback)(void *);
            void *argument;
            int result;
          };
          struct SDL_mutex { pthread_mutex_t native; };

          static void *v45_sdl_thread_entry(void *opaque) {
            SDL_Thread *t = static_cast<SDL_Thread *>(opaque);
            t->result = t->callback(t->argument);
            return nullptr;
          }

          EM_JS(int, v45_register_original_paks, (), {
            if (!ENVIRONMENT_IS_WORKER) {
              console.error('V45: lazy PAK mount requires the WASM worker');
              return 0;
            }
            var original = ['Text.pak','Sprite00.pak'];
            for (var i=0; i<original.length; ++i) {
              var fname = original[i];
              try {
                if (!FS.analyzePath('/lineage/'+fname).exists) {
                  var remote = new URL('v45pak/'+fname, self.location.href).href;
                  FS.createLazyFile('/lineage', fname, remote, true, false);
                  console.log('V45 ORIGINAL PAK (lazy): '+fname+' -> '+remote);
                }
              } catch(e) {
                console.error('V45 failed to mount original '+fname+': '+e);
                return 0;
              }
            }
            return 1;
          });
          extern "C" int v45_prepare_pak_files(void) {
            return v45_register_original_paks();
          }

          extern "C" {
          SDL_Thread * SDLCALL SDL_CreateThread(int (SDLCALL *fn)(void *), void *data) {
            if (!fn) return nullptr;
            SDL_Thread *t = new (std::nothrow) SDL_Thread{};
            if (!t) return nullptr;
            t->callback = fn;
            t->argument = data;
            const int rc = pthread_create(&t->native, nullptr, v45_sdl_thread_entry, t);
            if (rc != 0) {
              std::fprintf(stderr, "V45 SDL_CreateThread pthread_create error=%d\n", rc);
              delete t;
              return nullptr;
            }
            std::fprintf(stderr, "V45 SDL_CreateThread: pthread started\n");
            return t;
          }

          void SDLCALL SDL_WaitThread(SDL_Thread *t, int *status) {
            if (!t) return;
            const int rc = pthread_join(t->native, nullptr);
            if (status) *status = rc == 0 ? t->result : -1;
            if (rc != 0) std::fprintf(stderr, "V45 SDL_WaitThread error=%d\n", rc);
            delete t;
          }

          SDL_mutex * SDLCALL SDL_CreateMutex(void) {
            SDL_mutex *m = new (std::nothrow) SDL_mutex{};
            if (!m) return nullptr;
            pthread_mutexattr_t attr;
            int rc = pthread_mutexattr_init(&attr);
            if (rc == 0) {
              rc = pthread_mutexattr_settype(&attr, PTHREAD_MUTEX_RECURSIVE);
              if (rc == 0) rc = pthread_mutex_init(&m->native, &attr);
              pthread_mutexattr_destroy(&attr);
            }
            if (rc != 0) {
              std::fprintf(stderr, "V45 SDL_CreateMutex error=%d\n", rc);
              delete m;
              return nullptr;
            }
            return m;
          }

          int SDLCALL SDL_mutexP(SDL_mutex *m) {
            return m && pthread_mutex_lock(&m->native) == 0 ? 0 : -1;
          }

          int SDLCALL SDL_mutexV(SDL_mutex *m) {
            return m && pthread_mutex_unlock(&m->native) == 0 ? 0 : -1;
          }

          void SDLCALL SDL_DestroyMutex(SDL_mutex *m) {
            if (!m) return;
            pthread_mutex_destroy(&m->native);
            delete m;
          }

          int SDLCALL SDL_WaitEvent(SDL_Event *event) {
            if (!event) return 0;
            for (;;) {
              const int result = SDL_PollEvent(event);
              if (result != 0) return result;
              SDL_Delay(10);
            }
          }

          int SDLCALL IMG_isPNG(SDL_RWops *source) {
            if (!source) return 0;
            const int pos = SDL_RWtell(source);
            if (pos < 0) return 0;
            unsigned char signature[8] = {0};
            const int got = SDL_RWread(source, signature, 1, sizeof(signature));
            SDL_RWseek(source, pos, SEEK_SET);
            const unsigned char expected[8] = {137, 80, 78, 71, 13, 10, 26, 10};
            return got == sizeof(signature) &&
                   std::memcmp(signature, expected, sizeof(expected)) == 0;
          }

          SDL_Surface * SDLCALL IMG_LoadPNG_RW(SDL_RWops *source) {
            return source ? IMG_Load_RW(source, 0) : nullptr;
          }
          }
          CPP_COMPAT

          em++ -O1 -pthread -fexceptions \
            -Iupstream-l1j/src -Iupstream-l1j/src/resources -Iupstream-l1j/include \
            -sUSE_SDL=1 -sUSE_SDL_IMAGE=1 -sUSE_SDL_MIXER=1 \
            -c build/v45-sdl12-compat.cpp -o build/v45-sdl12-compat.o

          mapfile -t objects < build/objects-list.txt
          test "${#objects[@]}" -eq 60

          em++ "${objects[@]}" build/v45-sdl12-compat.o -o dist/lineage-v45.js \
            -O1 -pthread -fexceptions \
            -sUSE_SDL=1 -sUSE_SDL_IMAGE=1 -sUSE_SDL_MIXER=1 \
            -sSTB_IMAGE=1 \
            -sMODULARIZE=1 -sEXPORT_NAME=createLineage \
            -sENVIRONMENT=web,worker -sPROXY_TO_PTHREAD=1 \
            -sPTHREAD_POOL_SIZE=5 -sALLOW_MEMORY_GROWTH=1 \
            -sINITIAL_MEMORY=201326592 -sSTACK_SIZE=5242880 \
            -sEXIT_RUNTIME=0 -sFORCE_FILESYSTEM=1 -sASSERTIONS=1 \
            --profiling-funcs \
            -sEXPORTED_RUNTIME_METHODS=FS \
            --embed-file runtime/Lineage.ini@/Lineage.ini \
            --embed-file upstream-l1j/src/sprite_table.txt@/sprite_table.txt \
            --preload-file runtime/lineage@/lineage \
            2>&1 | tee reports/V45-link-log.txt

          cat > dist/index.html <<'HTML_ENTRYPOINT'
          <!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
          <meta name="theme-color" content="#111820">
          <title>Sanctuary — V45 Original Client Web Runtime</title>
          <style>
          :root{color-scheme:dark;font:14px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
          *{box-sizing:border-box}body{margin:0;background:#0c1118;color:#eef3fa}
          header{height:49px;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0 14px;background:#182230;border-bottom:1px solid #2b394c}
          header strong{font-size:14px}#state{font-size:12px;color:#9db6cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          #stage{position:relative;display:flex;align-items:center;justify-content:center;height:calc(100dvh - 49px - env(safe-area-inset-bottom));overflow:hidden;background:#06090c}
          #canvas{display:block;width:min(100%,calc((100dvh - 145px)*4/3));height:auto;max-height:calc(100dvh - 145px);aspect-ratio:4/3;object-fit:contain;image-rendering:pixelated;background:#050505;outline:none;touch-action:none}
          #overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;padding:22px;text-align:center;background:rgba(6,9,12,.93)}
          #overlay.hidden{display:none}#overlay h1{font-size:18px;font-weight:700;margin:0}#overlay p{max-width:440px;margin:0;color:#c1ccda;font-size:13px;word-break:break-word}
          #overlay button,.controls button{border:1px solid #61758a;background:#2a3b4f;color:white;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}
          #logbox{position:absolute;left:10px;top:8px;width:min(520px,calc(100% - 20px));max-height:25vh;padding:8px 10px;font:11px/1.4 ui-monospace,monospace;overflow:auto;white-space:pre-wrap;background:rgba(0,0,0,.77);border-radius:7px;display:none;pointer-events:none}
          #logbox.visible{display:block}
          #controls{display:none;position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));pointer-events:none;justify-content:space-between;padding:0 max(10px,env(safe-area-inset-left))}
          .controls{display:grid;grid-template-columns:repeat(3,52px);gap:5px;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
          .controls button{min-width:51px;min-height:47px;padding:2px;font-weight:700;background:rgba(34,53,75,.76);touch-action:none}
          .controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
          #rightkeys{display:flex;align-items:end;pointer-events:auto;gap:8px}
          #rightkeys button{font-size:13px}
          #tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}#tools button{font-size:11px;background:rgba(30,49,66,.88);color:#bcd7f0;border:1px solid #40546b;border-radius:6px;padding:5px 8px}
          @media (pointer:coarse){#controls{display:flex}#canvas{max-height:calc(100dvh - 49px)}.controls{grid-template-columns:repeat(3,44px)}.controls button{min-width:43px;min-height:44px}}
          </style>
          </head>
          <body>
          <header><strong>Sanctuary | Original Client Runtime · V45 (auto-start / original audio)</strong><span id="state" role="status" aria-live="polite">초기화 전</span></header>
          <main id="stage">
            <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="기존 클라이언트가 그리는 실제 SDL 화면"></canvas>
            <div id="overlay" role="alert">
              <h1 id="head">원본 클라이언트 자동 실행</h1>
              <p id="desc">원본 C++ 클라이언트를 자동으로 실행합니다. 원본 Text·Sprite00 PAK와 music0.mp3를 사용합니다.</p>
            </div>
            <pre id="logbox"></pre>
            <div id="tools"><button id="logBtn" type="button">로그</button><button id="fullBtn" type="button">전체화면</button></div>
            <div id="controls">
              <div class="controls" aria-label="키보드 방향키">
                <button data-key="ArrowUp" class="up" aria-label="위">▲</button>
                <button data-key="ArrowLeft" class="left" aria-label="왼쪽">◀</button>
                <button data-key="ArrowDown" class="down" aria-label="아래">▼</button>
                <button data-key="ArrowRight" class="right" aria-label="오른쪽">▶</button>
              </div>
              <div id="rightkeys" class="controls"><button data-key="Escape">ESC</button><button data-key="Enter">ENTER</button></div>
            </div>
          </main>
          <script>
          'use strict';
          const canvas=document.getElementById('canvas');
          const overlay=document.getElementById('overlay');
          const state=document.getElementById('state');
          const head=document.getElementById('head');
          const desc=document.getElementById('desc');
          const logbox=document.getElementById('logbox');
          let launched=false;
          function status(message){state.textContent=message;}
          function log(message){const line=String(message??'');logbox.textContent+=(line+'\n');if(logbox.textContent.length>24000)logbox.textContent=logbox.textContent.slice(-16000);logbox.scrollTop=logbox.scrollHeight;console.log('[Lineage]',line);}
          function problem(message){status('실행 장애');head.textContent='클라이언트 실행 실패';desc.textContent=message;overlay.classList.remove('hidden');launched=false;log(message);logbox.classList.add('visible');}
          function showRuntime(){status('WebAssembly 런타임 초기화 완료 (게임 진입 별도 확인)');overlay.classList.add('hidden');canvas.focus({preventScroll:true});}
          async function checkCrossOriginIsolation(){
            if(!('serviceWorker' in navigator) || !isSecureContext)return false;
            try{
              await navigator.serviceWorker.register('./coi-serviceworker-v45.js',{scope:'./'});
              await navigator.serviceWorker.ready;
              if(navigator.serviceWorker.controller===null){
                const once='sanctuary-coi-v45-reload';
                if(sessionStorage.getItem(once)!=='1'){
                  sessionStorage.setItem(once,'1');
                  location.reload();
                  return null;
                }
              }
              const ctl=navigator.serviceWorker.controller;
              if(!ctl || !ctl.scriptURL.includes('coi-serviceworker-v45.js')){
                const key='v45-worker-upgrade';
                if(!sessionStorage.getItem(key)){
                  sessionStorage.setItem(key,'1'); location.reload(); return null;
                }
                throw Error('V45 Service Worker upgrade pending; close other game2 tabs and reload.');
              }
              sessionStorage.removeItem('v45-worker-upgrade');
              return crossOriginIsolated;
            }catch(err){log('Isolation: '+err);throw err;}
          }
          function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error(src+' 파일을 찾거나 실행하지 못했습니다.'));document.head.append(s);});}
          async function startEngine(){
            if(launched)return;
            launched=true;status('엔진 로딩 중');head.textContent='원본 C++ 클라이언트 로딩 중';desc.textContent='컴파일된 lineage-v45.js / lineage-v45.wasm 파일을 확인합니다.';
            try{
              if(location.protocol==='file:')throw Error('GitHub Pages 또는 로컬 HTTP 서버에서 실행해야 합니다.');
              const isolated=await checkCrossOriginIsolation();
              if(isolated===null)return;
              if(!isolated)throw Error('WebAssembly 스레드 실행을 위한 브라우저 격리 설정이 필요합니다.');
              const idx=await fetch('./v45-paks.json',{cache:'no-store'});
              if(!idx.ok)throw Error('V45 original PAK manifest is missing');
              const manifest=await idx.json();
              for(const name of Object.keys(manifest.files)){
                const check=await fetch('./v45pak/'+name,{method:'HEAD',cache:'no-store'});
                if(!check.ok || Number(check.headers.get('content-length'))!==manifest.files[name].size)
                  throw Error('Original PAK streaming unavailable: '+name);
                log('V45 original '+name+': '+manifest.files[name].size+' bytes (HTTP ranges)');
              }
              const response=await fetch('./lineage-v45.js',{method:'HEAD',cache:'no-store'});
              if(!response.ok)throw Error('lineage-v45.js가 없습니다. 아직 WebAssembly 빌드·배포가 완료되지 않았습니다.');
              if(typeof window.createLineage!=='function')await loadScript('./lineage-v45.js');
              if(typeof window.createLineage!=='function')throw Error('lineage-v45.js에 createLineage() 엔트리 포인트가 없습니다.');
              status('원본 클라이언트 main() 실행 요청');
              await window.createLineage({
                canvas, noInitialRun:false, locateFile:(file,prefix)=>'./'+file,
                print:(...x)=>log(x.join(' ')), printErr:(...x)=>log('STDERR '+x.join(' ')),
                setStatus:status,
                onRuntimeInitialized:showRuntime,
                onAbort:(what)=>problem('WebAssembly abort: '+what),
                onExit:(code)=>problem('원본 클라이언트 프로세스 종료 (exit='+code+')'),
                monitorRunDependencies:(n)=>status(n?'원본 데이터 로딩 중 ('+n+')':'데이터 초기화 완료')
              });
            }catch(err){problem(err?.message||String(err));}
          }
          window.addEventListener('load',()=>{startEngine();},{once:true});
          window.addEventListener('error',event=>{if(launched)problem(event.message||'알 수 없는 런타임 오류');});
          window.addEventListener('unhandledrejection',event=>{
            const reason=event.reason;
            if(reason?.name==='NotAllowedError'){
              event.preventDefault();
              log('V45: 브라우저에서 음악 자동재생이 제한됐지만 게임은 계속 실행합니다.');
              return;
            }
            if(launched)problem(reason?.message||String(reason));
          });
          document.getElementById('logBtn').addEventListener('click',()=>logbox.classList.toggle('visible'));
          document.getElementById('fullBtn').addEventListener('click',()=>{if(!document.fullscreenElement)document.getElementById('stage').requestFullscreen?.();else document.exitFullscreen?.();});
          function keyEvent(key,type){const code=key==='Escape'?'Escape':key==='Enter'?'Enter':key;const ev=new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true});window.dispatchEvent(ev);document.dispatchEvent(ev);canvas.dispatchEvent(ev);}
          for(const button of document.querySelectorAll('[data-key]')){
            button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keyEvent(button.dataset.key,'keydown');});
            for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,e=>{e.preventDefault();keyEvent(button.dataset.key,'keyup');});
          }
          </script>
          </body></html>
          HTML_ENTRYPOINT

          cp dist/index.html dist/v45.html
          cp upstream-l1j/COPYING dist/L1J-SOURCE-LICENSE.txt
          cat > dist/source.txt <<'TEXT'
          Engine: uglyoldbob/l1j-client, C/C++ sources unchanged
          Source revision: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          This is not the original Sanctuary Windows executable.
          The original client depends on map/animation archives and a compatible game server.
          No synthetic player, monsters, portals, or map logic has been introduced.
          TEXT

      - name: "V45 | Serve original PAK ranges from versioned Pages shards"
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/coi-serviceworker-v45.js <<'SW'
          'use strict';
          const CHUNK_SIZE=16777216;
          const PACKS={'Text.pak':24846904,'Sprite00.pak':218172787};
          self.addEventListener('install',event=>event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate',event=>event.waitUntil(self.clients.claim()));
          const iso=(extra={})=>new Headers({
            'Cross-Origin-Embedder-Policy':'require-corp',
            'Cross-Origin-Opener-Policy':'same-origin',
            'Cross-Origin-Resource-Policy':'same-origin',
            ...extra
          });
          async function rangeResponse(req,name) {
            const total=PACKS[name];
            const accept={'Accept-Ranges':'bytes','Content-Type':'application/octet-stream','Cache-Control':'no-store'};
            if(req.method==='HEAD'){
              return new Response(null,{status:200,headers:iso({...accept,'Content-Length':String(total)})});
            }
            if(req.method!=='GET')return new Response('Method not allowed',{status:405});
            const match=/^bytes=(\d+)-(\d*)$/.exec(req.headers.get('range')||'');
            if(!match)return new Response('Range required',{status:416});
            const from=Number(match[1]);
            const to=match[2] ? Number(match[2]):Math.min(total-1,from+1048575);
            if(!Number.isSafeInteger(from)||!Number.isSafeInteger(to)||from<0||to<from||to>=total||to-from>2097151){
              return new Response('Bad byte range',{status:416,headers:iso({'Content-Range':'bytes */'+total})});
            }
            const result=new Uint8Array(to-from+1);
            let position=from;
            while(position<=to){
              const chunkNo=Math.floor(position/CHUNK_SIZE);
              const localOffset=position%CHUNK_SIZE;
              const count=Math.min(to-position+1,CHUNK_SIZE-localOffset);
              const chunkName='pakchunks/'+name+'.part'+String(chunkNo).padStart(3,'0');
              const url=new URL(chunkName,self.registration.scope);
              const response=await fetch(url,{
                headers:{Range:'bytes='+localOffset+'-'+(localOffset+count-1)},
                cache:'force-cache'
              });
              if(!response.ok || (response.status!==200 && response.status!==206)){
                throw Error('Original PAK shard unavailable: '+chunkName+' ('+response.status+')');
              }
              const bytes=new Uint8Array(await response.arrayBuffer());
              const data=response.status===206?bytes:bytes.subarray(localOffset,localOffset+count);
              if(data.length!==count)throw Error('Incorrect PAK shard length: '+chunkName);
              result.set(data,position-from);
              position+=count;
            }
            return new Response(result,{status:206,headers:iso({
              ...accept,'Content-Length':String(result.byteLength),
              'Content-Range':'bytes '+from+'-'+to+'/'+total
            })});
          }
          self.addEventListener('fetch',event=>{
            const req=event.request;
            const u=new URL(req.url);
            if(u.origin!==self.location.origin)return;
            const packPrefix=new URL('v45pak/',self.registration.scope).pathname;
            if(u.pathname.startsWith(packPrefix)){
              const name=decodeURIComponent(u.pathname.slice(packPrefix.length));
              if(!Object.prototype.hasOwnProperty.call(PACKS,name)){
                event.respondWith(Promise.resolve(new Response('Original PAK not published in V45',{status:404})));
              }else{
                event.respondWith(rangeResponse(req,name).catch(e=>{
                  console.error('V45 PAK range:',e);
                  return new Response(String(e),{status:502});
                }));
              }
              return;
            }
            event.respondWith(fetch(req).then(res=>{
              if(!res.ok || res.type==='opaque')return res;
              const headers=new Headers(res.headers);
              headers.set('Cross-Origin-Embedder-Policy','require-corp');
              headers.set('Cross-Origin-Opener-Policy','same-origin');
              headers.set('Cross-Origin-Resource-Policy','same-origin');
              return new Response(res.body,{status:res.status,statusText:res.statusText,headers});
            }));
          });
          SW
          node --check dist/coi-serviceworker-v45.js
          test -s dist/index.html
          test -s dist/v45.html
          test -s dist/v45-paks.json
          test -s dist/lineage-v45.js
          test -s dist/lineage-v45.wasm
          test -s dist/lineage-v45.data
          sha256sum dist/lineage-v45.js dist/lineage-v45.wasm dist/lineage-v45.data > reports/V45-runtime-hashes.txt
          du -sh dist dist/pakchunks > reports/V45-deployment-sizes.txt

      - name: "V45 | Upload actual engine compilation and HTML files"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Existing-Client-Wasm-V45
          path: |
            reports/
            dist/
          retention-days: 60
          if-no-files-found: warn

      - name: "V45 | Publish existing-client WebAssembly HTML to gh-pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: "V45 | Report actual execution-route status"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V45 | Existing l1j-client WebAssembly route'
            echo 'Kept existing build-web.yml, without any new workflow.'
            echo 'All 60 upstream source files remain byte-for-byte unchanged.'
            echo 'V45 keeps original PAK byte-range streaming.'
            echo 'V45 automatically starts the client without a button.'
            echo 'Original music0.mp3 included; missing or blocked audio is nonfatal.'
            echo 'Actual browser runtime and game server connection remain unverified.'
            if test -s dist/lineage-v45.wasm; then
              echo 'WebAssembly output created.'
              echo 'Browser entrypoint: gh-pages/v45.html.'
              echo 'Additional full original PAK archives and a compatible game server remain necessary.'
            else
              echo 'WebAssembly build failed: inspect compile/link logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
