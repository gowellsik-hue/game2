
name: "build-web.yml | V58 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V58 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v58-v45-success
  cancel-in-progress: false

jobs:
  restore_v45_success:
    name: "build-web.yml | V58 | Preserve working V45 audio runtime"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "V58 | Checkout successful game2 Pages baseline"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V58 | Verify original V45 runtime and audio data"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gowellsik-hue/game2'
          for file in v45.html lineage-v45.js lineage-v45.wasm lineage-v45.data \
                      coi-serviceworker-v45.js v45-paks.json; do
            test -s "published/$file"
          done
          grep -Fq 'music0.mp3' published/lineage-v45.js
          grep -Fq 'lineage-v45.js' published/v45.html
          grep -Fq 'coi-serviceworker-v45.js' published/v45.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('published')
          data = json.loads((root / 'v45-paks.json').read_text())
          assert data['version'] == 'V45'
          assert set(data['files']) == {'Text.pak', 'Sprite00.pak'}
          for name, info in data['files'].items():
              parts = [root / 'pakchunks' / f'{name}.part{i:03d}'
                       for i in range(info['parts'])]
              assert all(p.is_file() for p in parts), name
              assert sum(p.stat().st_size for p in parts) == info['size'], name
          print('V58: unchanged V45 engine, audio and original PAK shards')
          PY
          node --check published/lineage-v45.js
          node --check published/coi-serviceworker-v45.js

      - name: "V58 | Restore V45 success page without rebuilding engine"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('published')
          original = (root / 'v45.html').read_text(encoding='utf-8')
          title = 'V45 Original Client Web Runtime'
          heading = 'V45 (auto-start / original audio)'
          assert original.count(title) == 1
          assert original.count(heading) == 1
          updated = original.replace(title, 'V58 Original Client Web Runtime', 1)
          updated = updated.replace(heading, 'V58 (V45 original audio baseline)', 1)
          assert 'lineage-v45.js' in updated
          assert 'coi-serviceworker-v45.js' in updated
          assert 'v45-paks.json' in updated
          assert 'music0.mp3' in updated
          assert 'boxedwine' not in updated.lower()
          (root / 'index.html').write_text(updated, encoding='utf-8')
          (root / 'v58.html').write_text(updated, encoding='utf-8')
          PY
          cmp published/index.html published/v58.html

      - name: "V58 | Publish only restored HTML entrypoints"
        shell: bash
        run: |
          set -euo pipefail
          git -C published add -- index.html v58.html
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'build-web.yml V58: restore V45 successful audio baseline'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V58 | Check live GitHub Pages entrypoint"
        shell: bash
        run: |
          set -euo pipefail
          url='https://gowellsik-hue.github.io/game2/index.html'
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
              "${url}?v58=${GITHUB_RUN_ID}-${i}" -o /tmp/v58-live.html; then
              if grep -Fq 'V58 Original Client Web Runtime' /tmp/v58-live.html && \
                 grep -Fq 'lineage-v45.js' /tmp/v58-live.html && \
                 ! grep -qi 'boxedwine' /tmp/v58-live.html; then
                echo 'V58 deployed with unchanged V45 WebAssembly and audio assets'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'V58 Pages entrypoint was not published in time' >&2
          exit 1

      - name: "V58 | Summary"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V58 | Sanctuary game2 GitHub Pages'
            echo 'Based on the successfully deployed V53 workflow and sound-working V45 runtime.'
            echo 'No C++ rebuilding, SDL replacement, audio patch or PAK remount.'
            echo 'Only index.html and v58.html are published.'
            echo 'Graphics rendering and gameplay are not yet fixed or verified.'
          } >> "$GITHUB_STEP_SUMMARY"
