# FILE: .github/workflows/build-web.yml
# VERSION: V95
# V94 failed at bootstrap because the V93 stage loader was run twice.
# Restore the exact V93 pipeline that extracted the original SPR and compiled C++.
# Fix its sole observed C++ compiler error: shadowed sprite_data access.
name: "build-web.yml | V95 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V95 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v95-native-player
  cancel-in-progress: false

jobs:
  original_client_v95:
    name: "build-web.yml | V95 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V95 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V95 | Preserve previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V95 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V95 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V95 | Restore V90 stage definitions with separate runner dispatcher"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports /tmp/v95
          cat > /tmp/v95-loader.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          import yaml

          PIN='9e78c0bc899fb3c30d24634294e1324a8b1e565c'
          raw=subprocess.check_output(
              ['git','show',PIN+':.github/workflows/build-web.yml'],text=True
          )
          previous=yaml.safe_load(raw)
          assert previous['name']=='build-web.yml | V90 | Sanctuary game2 GitHub Pages'
          original={s['name']:s['run'] for s in
              previous['jobs']['original_client_v90']['steps'] if 'run' in s}
          stages={
              'prepare':'V90 | Recover verified V89 stage scripts',
              'bootstrap':'V90 | Generate original stage executor',
              'restore':'V90 | Restore source map and SDL pipeline',
              'sprites':'V90 | Prepare genuine male knight SPR extraction',
              'wire':'V90 | Create native actor implementation',
              'separate':'V90 | Separate offline initialization from actor injection',
              'runner':'V90 | Precompile actual generated native runner before resource download',
              'build':'V90 | Extract real SPR and map and compile native client',
              'smoke':'V90 | Verify real SPR pixels and directional movement',
              'preserve':'V90 | Save generated sources and failure logs',
              'publish':'V90 | Publish only after authentic player tests pass',
              'report':'V90 | Record verified scope',
          }
          assert len(stages)==len(set(stages.values()))
          assert all(name in original for name in stages.values())
          root=Path('/tmp/v95')
          for stage,title in stages.items():
              source=original[title].replace('V90','V95').replace('v90','v95')
              if stage=='prepare':
                  old="if phase=='preflight':"
                  assert source.count(old)==1,('V90 dispatcher',source.count(old))
                  source=source.replace(old,"if phase=='check':",1)
                  old='python3 -u /tmp/v95-stages.py preflight'
                  assert source.count(old)==1,('Initial check command',source.count(old))
                  source=source.replace(old,'python3 -u /tmp/v95-stages.py check',1)
                  assert "if stage=='preflight':" in source
              if stage=='runner':
                  # /tmp/v95-stages.py is overwritten by the nested V89 bootstrap.
                  # The saved outer dispatcher alone knows V89's real 'preflight'.
                  old='python3 -u /tmp/v95-stages.py preflight'
                  assert source.count(old)==1,('Real runner command',source.count(old))
                  source=source.replace(
                      old,'python3 -u /tmp/v95-outer-stages.py preflight',1
                  )
              matches=list(re.finditer(
                  r"(?ms)^(?:cat >|cat >>) (/tmp/[\w-]+\.py) <<'PY'\n(.*?)\nPY$",
                  source
              ))
              for match in matches:
                  ast.parse(match.group(2),filename=match.group(1))
              path=root/(stage+'.sh')
              path.write_text(source,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
              print('V95 verified:',stage,'Python:',len(matches),flush=True)
          print('V95: saved outer executor will perform real preflight.',flush=True)
          PY
          python3 -m py_compile /tmp/v95-loader.py
          python3 -u /tmp/v95-loader.py 2>&1 | tee reports/V95-loader.log
          test -s /tmp/v95/runner.sh
          test -s /tmp/v95/prepare.sh
          grep -Fq '/tmp/v95-outer-stages.py preflight' /tmp/v95/runner.sh

      - name: "V95 | Preserve outer dispatcher before nested bootstrap overwrites it"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/prepare.sh 2>&1 | tee reports/V95-prepare.log
          test -s /tmp/v95-stages.py
          grep -Fq "if phase=='check':" /tmp/v95-stages.py
          grep -Fq "'preflight':'V89 | Fix native hook" /tmp/v95-stages.py
          cp /tmp/v95-stages.py /tmp/v95-outer-stages.py
          python3 -m py_compile /tmp/v95-outer-stages.py
          bash /tmp/v95/bootstrap.sh 2>&1 | tee reports/V95-bootstrap.log
          test -s /tmp/v95-execute.py
          test -s /tmp/v95-outer-stages.py
          python3 -m py_compile /tmp/v95-execute.py

      - name: "V95 | Restore original map and SDL build scripts"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/restore.sh 2>&1 | tee reports/V95-restore.log
          test -s /tmp/v95-extract.sh
          test -s /tmp/v95-build.sh

      - name: "V95 | Prepare original male knight SPR resources"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/sprites.sh 2>&1 | tee reports/V95-sprites.log
          test -s /tmp/v95-extract.sh

      - name: "V95 | Repair original ZIP central records before SPR lookup"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v95-zip-repair.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path

          path=Path('/tmp/v95-extract.sh')
          assert path.is_file(), 'Original archive extractor was not generated'
          source=path.read_text(encoding='utf-8')

          # V92 used 'records' for the ZIP central-directory dictionaries,
          # then reused it for packed tile index bytes. The subsequent SPR
          # lookup must use the original dictionary records, never tile bytes.
          anchor='assert len(records)==nitems,(len(records),nitems)'
          assert source.count(anchor)==1, ('ZIP directory anchor',source.count(anchor))
          source=source.replace(anchor,anchor+'\nzip_records=tuple(records)',1)
          lookup=(
              r"r for r in records(?=\n[ \t]*if r\['name'\]"
              r"\.lower\(\)\.endswith\()"
          )
          matches=list(re.finditer(lookup,source))
          assert len(matches)==1,('SPR lookup count',len(matches))
          source=re.sub(lookup,'r for r in zip_records',source,count=1)

          assert source.index('zip_records=tuple(records)') < source.index('compact=bytearray()')
          assert source.count('r for r in zip_records')==1
          assert source.count("bank='Sprite'")==1
          assert source.count('sources=extract_selected(source_bank,needed)')==1
          m=re.search(
              r"(?ms)^cat > /tmp/v95-extract\.py <<'PY'\n(.*?)\nPY$",
              source
          )
          assert m,'Generated ZIP extractor source not found'
          ast.parse(m.group(1),filename='/tmp/v95-extract.py')
          path.write_text(source,encoding='utf-8')
          subprocess.run(['bash','-n',str(path)],check=True)

          # Minimal regression check for the actual V92 error type.
          records=[{'name':'Original/Sprite.pak'}]
          zip_records=tuple(records)
          records=[b'packed tile index bytes']
          assert isinstance(records[0],bytes)
          assert next(r for r in zip_records if r['name'].endswith('Sprite.pak'))
          print('V95: ZIP directory dictionaries are independent of tile index bytes.',flush=True)
          print('V95: genuine original Sprite.pak lookup repaired before download.',flush=True)
          PY
          python3 -m py_compile /tmp/v95-zip-repair.py
          python3 -u /tmp/v95-zip-repair.py \
            2>&1 | tee reports/V95-zip-repair.log
          test -s /tmp/v95-extract.sh

      - name: "V95 | Wire original C++ actor and keyboard movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/wire.sh 2>&1 | tee reports/V95-wiring.log
          test -s /tmp/v95-native.py

      - name: "V95 | Separate offline entry from native actor patch"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/separate.sh 2>&1 | tee reports/V95-separation.log
          test -s /tmp/v95-actor.py
          test ! -e /tmp/v95-native.py
          grep -Fq '/tmp/v95-actor.py' /tmp/v95-build.sh

      - name: "V95 | Fix original C++ sprite_data shadowing before native build"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v95-fix-actor.py <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          actor=Path('/tmp/v95-actor.py')
          assert actor.is_file(),'V95 actor injection script not generated'
          code=actor.read_text(encoding='utf-8')
          before='sprite_data.override(v95actor,v95def);'
          after='this->sprite_data.override(v95actor,v95def);'
          assert code.count(before)==1,('V93 C++ compiler failure site',code.count(before))
          code=code.replace(before,after,1)
          assert code.count(after)==1
          ast.parse(code,filename=str(actor))
          actor.write_text(code,encoding='utf-8')
          subprocess.run(['python3','-m','py_compile',str(actor)],check=True)

          header=Path('upstream-l1j/src/sdl_user.h').read_text(encoding='utf-8')
          cpp=Path('upstream-l1j/src/sdl_user.cpp').read_text(encoding='utf-8')
          assert 'server_resource<sprite_definition> sprite_data;' in header
          assert 'unsigned char *sprite_data;' in cpp
          assert 'this->sprite_data.override(v95actor,v95def);' in code
          print('V95: original C++ sprite resource is now accessed via this->.',flush=True)
          PY
          python3 -m py_compile /tmp/v95-fix-actor.py
          python3 -u /tmp/v95-fix-actor.py 2>&1 | tee reports/V95-fix-actor.log
          grep -Fq 'this->sprite_data.override(v95actor,v95def);' /tmp/v95-actor.py

      - name: "V95 | Run actual final Python generator before archive downloads"
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/v95-outer-stages.py
          bash /tmp/v95/runner.sh 2>&1 | tee reports/V95-runner-preflight.log
          test -s /tmp/v95-run.py
          test -s /tmp/v95-actor.py
          python3 -m py_compile /tmp/v95-run.py /tmp/v95-actor.py
          grep -Fq 'final generated Python syntax passed' reports/V95-runner-preflight.log
          echo 'V95: real generated runner syntax verified.'

      - name: "V95 | Extract authentic map and SPR then build native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v95/build.sh 2>&1 | tee reports/V95-build-and-browser.log

      - name: "V95 | Require actual SPR pixels and player movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/smoke.sh 2>&1 | tee reports/V95-native-player-test.log

      - name: "V95 | Save all generated build scripts"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v95/preserve.sh; then
            bash /tmp/v95/preserve.sh
          fi
          mkdir -p reports
          for file in /tmp/v95-stages.py /tmp/v95-outer-stages.py \
                      /tmp/v95-loader.py /tmp/v95-zip-repair.py \
                      /tmp/v95-extract.sh /tmp/v95-extract.py \
                      /tmp/v95-actor.py /tmp/v95-fix-actor.py; do
            if test -s "$file"; then
              cp "$file" "reports/V95-generated-$(basename "$file")"
            fi
          done

      - name: "V95 | Upload diagnostics regardless of outcome"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V95-Native-Player
          path: |
            reports/V95-*.log
            reports/V95-*.json
            reports/V95-*.png
            reports/V95-*.txt
            reports/V95-generated-*
            assets/v95/v95-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V95 | Publish only verified original sprite and movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v95/publish.sh 2>&1 | tee reports/V95-deploy.log

      - name: "V95 | Report actual validation scope"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v95/report.sh; then
            bash /tmp/v95/report.sh
          fi
          {
            echo 'V93 generated the final runner and extracted original Tile.pak and SPR resources.'
            echo 'V93 C++ compile stopped because a local sprite_data byte pointer hid its class member.'
            echo 'V95 preserves V93 archive extraction and qualifies this->sprite_data in the actor patch.'
            echo 'Original SDL sprite pixels and keyboard movement remain required for deployment.'
            echo 'Unverified: full native compilation, authentic original character animation and collision.'
          } >> "$GITHUB_STEP_SUMMARY"
