
name: "build-web.yml | V28 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V28 | Original Sanctuary engine verification"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read

concurrency:
  group: build-web-yml-v28-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v28:
    name: "build-web.yml | V28 | Inspect and test ORIGINAL engine"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V28 | Checkout game2"
        uses: actions/checkout@v4

      - name: "V28 | Download 46 original Sanctuary archive volumes"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gowellsik-hue/game2'
          mkdir -p original reports original-runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full binutils file
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original --clobber
          test "$(find original -maxdepth 1 -type f | wc -l)" -eq 46
          for i in $(seq -w 1 45); do
            test -s "original/Sanctuary.of.Aden.-.Copy.z${i}"
          done
          test -s original/Sanctuary.of.Aden.-.Copy.zip
          echo 'V28 | All 46 original archive volumes downloaded.'

      - name: "V28 | Extract original executable and engine dependencies"
        shell: bash
        run: |
          set -euo pipefail
          archive='original/Sanctuary.of.Aden.-.Copy.zip'
          7z l -slt "$archive" > reports/original-file-list.txt
          7z x "$archive" -ooriginal-runtime -y \
            '-ir!*.exe' '-ir!*.dll' '-ir!*.ocx' \
            '-ir!*.so' '-ir!*.dylib' '-ir!*.wasm' \
            '-ir!*.jar' '-ir!*.ini' '-ir!*.cfg' \
            '-ir!*.config' '-ir!*.manifest' \
            '-ir!*.js' '-ir!*.lua' '-ir!*.rb' \
            '-ir!*.cpp' '-ir!*.c' '-ir!*.h' '-ir!*.cs' \
            '-ir!*.html' '-ir!*.htm' \
            > reports/original-runtime-extraction.log
          find original-runtime -type f | sort > reports/original-runtime-files.txt
          echo 'V28 | Original executable and dependencies extracted.'

      - name: "V28 | Identify engine, PE imports, source, and browser components"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v28_original_engine.py <<'PY_V28'
          import json
          import re
          import subprocess
          from collections import Counter
          from pathlib import Path

          root = Path('original-runtime')
          reports = Path('reports')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          entries = []

          for path in files:
              rel = path.relative_to(root).as_posix()
              kind = subprocess.run(
                  ['file', '-b', str(path)],
                  capture_output=True,
                  text=True,
                  timeout=15
              ).stdout.strip()

              row = {
                  'path': rel,
                  'bytes': path.stat().st_size,
                  'file_type': kind
              }

              if path.suffix.lower() in {'.exe', '.dll', '.ocx'}:
                  result = subprocess.run(
                      ['objdump', '-p', str(path)],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )
                  row['imports'] = re.findall(
                      r'^\s*DLL Name:\s*(\S+)',
                      result.stdout,
                      re.M
                  )

              entries.append(row)

          executable = [
              x for x in entries
              if x['path'].lower().endswith('.exe')
          ]

          imports = Counter(
              d.lower()
              for x in entries
              for d in x.get('imports', [])
          )

          suffixes = Counter(
              Path(x['path']).suffix.lower()
              for x in entries
          )

          names = '\n'.join(x['path'].lower() for x in entries)

          signatures = {
              'windows_executable': bool(executable),
              'unity_player': 'unityplayer.dll' in names,
              'rpg_maker_rgss': (
                  'rgss' in names or 'rpg_rt.exe' in names
              ),
              'dotnet_clr': any(
                  'mscoree.dll' in d.lower()
                  for x in entries
                  for d in x.get('imports', [])
              ),
              'directx_import': any(
                  re.search(r'(d3d|ddraw|dinput|dxgi)', d)
                  for d in imports
              ),
              'opengl_import': any(
                  'opengl32' in d for d in imports
              ),
              'wasm_present': suffixes['.wasm'] > 0,
              'script_or_source_present': any(
                  suffixes[s] > 0
                  for s in [
                      '.cpp', '.c', '.h',
                      '.cs', '.lua', '.js', '.rb'
                  ]
              )
          }

          report = {
              'version': 'V28',
              'project': 'Original Sanctuary Engine',
              'engine_substitution': False,
              'scope': (
                  'Original executable inventory '
                  'and restricted Wine smoke test'
              ),
              'original_executable_count': len(executable),
              'original_executables': executable,
              'other_files': entries,
              'imports': imports.most_common(100),
              'extensions': dict(suffixes),
              'signatures': signatures,
              'browser_original_engine_execution': 'NOT_TESTED',
              'warning': (
                  'Wine is not a browser. '
                  'Runtime-only extraction may omit game data.'
              )
          }

          (reports / 'V28-original-engine-report.json').write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding='utf-8'
          )

          excluded = re.compile(
              r'(setup|install|unins|patch|updat|config|crash|redist|dxsetup)',
              re.I
          )

          def rank(x):
              path = x['path'].lower()
              basename = Path(path).name
              return (
                  bool(excluded.search(basename)),
                  not bool(re.search(
                      r'(sanctuary|aden|game|client)',
                      basename
                  )),
                  '/' in path,
                  len(path)
              )

          candidates = sorted(executable, key=rank)
          selected = next(
              (
                  x for x in candidates
                  if not excluded.search(Path(x['path']).name)
              ),
              None
          )

          (reports / 'V28-selected-executable.txt').write_text(
              selected['path'] if selected else '',
              encoding='utf-8'
          )

          with (reports / 'V28-summary.md').open(
              'w',
              encoding='utf-8'
          ) as f:
              f.write(
                  '# build-web.yml | V28 | '
                  'Original Engine Verification\n\n'
              )
              f.write(
                  f'- Original EXE files: {len(executable)}\n'
              )
              f.write(
                  '- Selected runtime: '
                  + (selected['path'] if selected else 'none')
                  + '\n'
              )
              f.write(
                  '- Engine signals: '
                  + json.dumps(
                      signatures,
                      ensure_ascii=False
                  )
                  + '\n\n'
              )
              f.write('## Native executables\n')

              for row in executable:
                  f.write(
                      '- ' + row['path']
                      + ' | ' + row['file_type']
                      + ' | imports: '
                      + ', '.join(row.get('imports', []))
                      + '\n'
                  )

              f.write(
                  '\n**Browser execution of original game '
                  'engine: not yet proven.**\n'
              )

          print(
              (reports / 'V28-summary.md').read_text(
                  encoding='utf-8'
              )
          )
          PY_V28

          python3 /tmp/v28_original_engine.py
          cat reports/V28-summary.md >> "$GITHUB_STEP_SUMMARY"
          rm -rf original

      - name: "V28 | Attempt to run the original executable (Wine, not HTML engine)"
        shell: bash
        run: |
          set -euo pipefail

          executable="$(cat reports/V28-selected-executable.txt)"

          if [ -z "$executable" ]; then
            echo 'NO_ORIGINAL_EXE_FOUND' \
              | tee reports/V28-native-smoke-result.txt
            echo 'No native EXE was found; review original-engine-report.json.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          test -f "original-runtime/$executable"

          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq \
            wine wine64 wine32:i386 xvfb

          selected_dir="$(dirname "original-runtime/$executable")"
          selected_name="$(basename "$executable")"
          prefix="$RUNNER_TEMP/v28-wine-prefix"

          mkdir -p "$prefix"

          set +e
          (
            cd "$selected_dir"
            timeout --kill-after=5s 35s xvfb-run -a \
              env WINEPREFIX="$prefix" WINEDEBUG=-all \
              wine "./$selected_name"
          ) > reports/V28-native-runtime.log 2>&1
          status=$?
          set -e

          {
            echo "original_exe=$executable"
            echo "wine_exit_code=$status"
            echo 'runtime=Wine on Linux with Xvfb'
            echo 'browser_test=NOT_PERFORMED'
            echo 'note=Wine start or timeout does not prove browser compatibility or gameplay.'
            echo 'note=Missing PAK/other game files can invalidate a negative startup test.'
          } | tee reports/V28-native-smoke-result.txt

          tail -n 35 reports/V28-native-runtime.log || true

          {
            echo '### V28 Original executable smoke test'
            echo "- EXE: $executable"
            echo "- Wine exit code: $status (124 indicates timeout)"
            echo '- This is NOT proof that the original engine runs in a browser.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "V28 | Upload evidence; do not modify game or GitHub Pages"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Engine-V28-Evidence
          path: reports/
          retention-days: 90
          if-no-files-found: error
