
name: "build-web.yml | V72 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V72 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v72-native-map
  cancel-in-progress: false

jobs:
  original_client_v72:
    name: "build-web.yml | V72 | Correct native map patch and RGB555 pixels"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "V72 | Checkout game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V72 | Checkout last successful V70 deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V72 | Checkout exact original Sanctuary C++"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V72 | Setup Emscripten used by successful V70"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V72 | Reuse verified archive extraction; repair map and build"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports
          cat > /tmp/v72-orchestrate.py <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          import yaml

          # Reuse the exact V71 extraction that succeeded on GitHub.
          baseline = 'dc173f5af493f37360b6ae997f2fce43a8ab28b1'
          original = subprocess.check_output(
              ['git', 'show', baseline + ':.github/workflows/build-web.yml'],
              text=True
          )
          doc = yaml.safe_load(original)
          steps = doc['jobs']['original_client_v71']['steps']
          by_name = {s['name']: s for s in steps}
          extraction_name = 'V71 | Extract original start-map tiles and sections from split ZIP'
          build_name = 'V71 | Build and test the original native map renderer'
          publish_name = 'V71 | Publish only after authentic native map pixels are visible'
          assert all(name in by_name for name in
                     [extraction_name, build_name, publish_name])

          def reversion(source):
              return source.replace('V71','V72').replace('v71','v72')

          def replace_exact(source, old, new, expected=1):
              actual = source.count(old)
              assert actual == expected, (repr(old), actual, expected)
              return source.replace(old, new, expected)

          def run_shell(label, script):
              print('\nV72 STAGE:', label, flush=True)
              subprocess.run(
                  ['bash', '-e', '-o', 'pipefail', '-c', script],
                  check=True,
                  env=os.environ.copy()
              )

          extraction = reversion(by_name[extraction_name]['run'])
          assert "cat > /tmp/v72-extract.py <<'PY'" in extraction
          run_shell('Original split ZIP and compact tiles', extraction)

          manifest_file = Path('assets/v72/v72-map-manifest.json')
          manifest = json.loads(manifest_file.read_text())
          assert len(manifest['segments']) >= 4
          assert 2 in manifest['selected_tile_ids']
          assert (Path('assets/v72/lineage/Tile.pak')).stat().st_size > 0
          print('V72 original map segments:',len(manifest['segments']),flush=True)
          print('V72 original tile banks:',len(manifest['selected_tile_ids']),flush=True)

          build = reversion(by_name[build_name]['run'])

          # V71 reused the same name for two scripts.
          # Separate character initialization from the map patch.
          build = replace_exact(
              build,
              "cat > /tmp/v72-native.py <<'PY'",
              "cat > /tmp/v72-map-patch.py <<'PY'"
          )
          build = replace_exact(
              build,
              "subprocess.run(['python3','/tmp/v72-native.py'],check=True)",
              "subprocess.run(['python3','/tmp/v72-map-patch.py'],check=True)"
          )
          build = replace_exact(
              build,
              'python3 -m py_compile /tmp/v72-native.py /tmp/v72-tile-graphics.py /tmp/v72-driver.py',
              'python3 -m py_compile /tmp/v72-map-patch.py /tmp/v72-tile-graphics.py /tmp/v72-driver.py'
          )

          # Keep the original 4145 tile slots so that map objects
          # with IDs outside the compact floor set cannot index beyond
          # the native tile table.
          build = replace_exact(build, '{max_bank+1}',
                                '{max(max_bank + 1, 4145)}')

          # Correct RGB555: divide by 31 before converting to uint8.
          for channel, bits in [(0,'color>>10'),(1,'color>>5'),(2,'color')]:
              old = f'dst[{channel}]=(unsigned char)(((({bits})&31)*255+15)/31);'
              new = f'dst[{channel}]=(unsigned char)((((({bits})&31)*255+15)/31));'
              build = replace_exact(build,old,new)

          assert "cat > /tmp/v72-map-patch.py <<'PY'" in build
          assert "cat > /tmp/v72-tile-graphics.py <<'PY'" in build
          assert "cat > /tmp/v72-driver.py <<'PY'" in build
          assert "'/tmp/v72-map-patch.py'" in build

          # Existing native sprites already exceed 100 MB.
          # Do not reject the combined data file on this arbitrary limit.
          assert 'stat().st_size < 100000000' not in build
          run_shell('Patch original C++ map renderer and browser test',build)

          result = json.loads(Path('reports/V72-browser.json').read_text())
          assert result['character_saved'] and result['character_restored']
          assert result['native_game_ready'] and result['passed']
          assert result.get('native_map_nonblack_fraction',0) > 0.02
          assert result.get('native_map_unique_colors',0) >= 8
          print('V72 native map rendering VERIFIED:',
                result['native_map_nonblack_fraction'],flush=True)
          PY
          python3 -m py_compile /tmp/v72-orchestrate.py
          python3 -u /tmp/v72-orchestrate.py 2>&1 | tee reports/V72-execution.log

      - name: "V72 | Save actual map and browser diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V72-Original-Map
          path: |
            reports/V72-execution.log
            reports/V72-extract.log
            reports/V72-build-test.log
            reports/V72-build.txt
            reports/V72-browser.json
            reports/V72-mobile.png
            reports/V72-http.txt
            assets/v72/v72-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V72 | Deploy only real native map pixels, never HTML fallback"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V72-browser.json').read_text())
          assert r['passed'] and r['native_game_ready']
          assert r['character_saved'] and r['character_restored']
          assert r['native_map_nonblack_fraction']>0.02
          assert r['native_map_unique_colors']>=8
          original=Path('published/lineage-v70.data').stat().st_size
          current=Path('published/lineage-v72.data').stat().st_size
          map_bytes=sum(p.stat().st_size for p in Path('assets/v72/lineage').rglob('*')
                        if p.is_file())
          assert original<current<=original+map_bytes+2000000, (original,current,map_bytes)
          print('V72 real original-map package size:',current,'delta:',current-original)
          PY
          git -C published add -- index.html v72.html \
            lineage-v72.js lineage-v72.wasm lineage-v72.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'build-web.yml V72: restore authentic map with separate native patch and full-color tiles'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V72 | Record verified scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V72 | Sanctuary game2 GitHub Pages'
            echo 'Reuses original V71 ZIP extraction confirmed successful in actual GitHub Actions.'
            echo 'Separates V70 character initializer and V72 map patch script filenames.'
            echo 'Corrects RGB555 tile colors before uint8 conversion.'
            echo 'Retains V70 character save, select and native game entry.'
            echo 'Retains original audio file and current SDL proxy fixes.'
            echo 'Deploy requires actual native map parse and canvas pixel verification.'
            echo 'Movement and combat remain outside the verified scope.'
          } >> "$GITHUB_STEP_SUMMARY"
