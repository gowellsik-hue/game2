
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R65
# BASE: successful V229R64 deployed full game, run 40093849653.
# FIX: foreground wall faces must NOT be treated as solid ground.
# LOGIC: original native ground tile 384/385 and original S32 directions;
# only actual bottom/side edge of a painted vertical wall blocks movement.
# 1F screenshot: allow 94,78 -> 94,82 behind wall; stop on solid floor below.
# 1F old issue: prohibit 97,70 -> 97,69 across lower wall face edge.
# PRESERVE: R64 foreground z/fade, all map PNGs, monster spawns, drops,
# 491EV balance, saved games, movement engine and all other 135 scripts.
name: build-slknight-web.yml | V229R65 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R65 Restore successful R64 full game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40093849653
          name: github-pages
          github-token: ${{ github.token }}
          path: r64

      - name: V229R65 Set up native image analysis
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: V229R65 Install pinned image processing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow==11.3.0 numpy==2.2.6

      - name: V229R65 Recover 5517-file successful R64 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r64/artifact.tar
          tar -xf r64/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          assert 'V229R64' in (root/'index.html').read_text('utf-8')
          p=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='02e472171f7af3e96f843a8b3f4374779018052bfcae98a52c1b9221857d15b0'
          original={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(original)==5517,len(original)
          Path('build/r65-baseline.json').write_text(json.dumps(original,sort_keys=True))
          print('PASS R64 exact 5517-file baseline')
          PY_BASE

      - name: V229R65 Extract original ground tiles, S32 directions, and spawns
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r65_export.rb <<'RB_EXPORT'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          class Table
            def self._load(raw); obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
            def [](x,y,z)
              w,h=@raw.byteslice(4,8).unpack('L<L<')
              @raw.byteslice(20+((z*h+y)*w+x)*2,2).unpack('v')[0]
            end
          end
          module RPG
            class Map;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Tone;def self._load(_raw);allocate;end;end
          class Color;def self._load(_raw);allocate;end;end
          src='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(src))
          raise 'Wrong R64 script count' unless a.size==136
          text=Zlib::Inflate.inflate(a[21][2]).force_encoding('UTF-8')
          x=text.index('module SLTI_V229R42')
          y=text.index('module SLTI_V229R44',x)
          raise 'Original S32 graph missing' unless x && y
          eval(text[x...y])
          pre='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          spawns={}
          [45,46].each do |mid|
            w,h=mid==45 ? [288,144]:[336,168]
            raw=SLTI_V229R42.const_get("EDGES_#{mid}")
            raise "Unexpected native S32 length #{mid}" unless raw.bytesize==w*h
            File.binwrite("build/r65-original-#{mid}.bin",raw)
            map=Marshal.load(File.binread(pre+format('Map%03d.rxdata',mid)))
            raise 'Wrong map dimensions' unless map.instance_variable_get(:@width)==w && map.instance_variable_get(:@height)==h
            data=map.instance_variable_get(:@data)
            base=Array.new(w*h){|i|data[i%w,i/w,0]}
            raise 'Unexpected floor tile' unless base.all?{|v|v==384 || v==385}
            File.binwrite("build/r65-floor-#{mid}.bin",base.pack('S<*'))
            monsters=map.instance_variable_get(:@events).values.select{|v|v.instance_variable_get(:@name).to_s.start_with?('[ID')}
            spawns[mid.to_s]=monsters.map{|v|[v.instance_variable_get(:@id),v.instance_variable_get(:@x),v.instance_variable_get(:@y)]}
            puts "PASS Map#{mid} S32 graph, floor tiles and #{monsters.length} monster spawn events"
          end
          File.write('build/r65-spawns.json',JSON.generate(spawns))
          RB_EXPORT
          ruby -c /tmp/r65_export.rb
          ruby /tmp/r65_export.rb

      - name: V229R65 Build real ground and wall-foot direction graph
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r65_graph.py <<'PY_GRAPH'
          from pathlib import Path
          from PIL import Image
          import numpy as np,json
          base=Path('build');gfx=Path('site/knight/gameasync/Graphics/Panoramas')
          spawn=json.loads((base/'r65-spawns.json').read_text())
          report={'version':'V229R65','base':'V229R64','basis':'original 384/385 ground + original S32 directional edges, separate painted wall face and physical wall bottom boundary','maps':{}}
          for mid,w,h in [(45,288,144),(46,336,168)]:
              t=np.fromfile(base/f'r65-floor-{mid}.bin',dtype='<u2').reshape(h,w)
              src=np.fromfile(base/f'r65-original-{mid}.bin',dtype=np.uint8).reshape(h,w)
              walk=t==384
              density=np.zeros((h,w),dtype=np.float32)
              foot=np.zeros_like(density)
              top=np.zeros_like(density)
              center=np.zeros_like(density)
              # These are PRESENTATION pixels, not a collision mask.
              # Only the lower edge of an opaque vertical wall FACE forms a barrier.
              for cy in range((h+31)//32):
                for cx in range((w+31)//32):
                  p=gfx/f'SLTI_{mid}_W_C{cx}_{cy}.png'
                  if not p.exists():continue
                  im=np.asarray(Image.open(p).convert('RGBA').getchannel('A'),np.float32)/255.0
                  assert im.shape==(512,512)
                  a=im.reshape(32,16,32,16).transpose(0,2,1,3)
                  rh=min(32,h-cy*32);rw=min(32,w-cx*32)
                  sl=np.s_[cy*32:cy*32+rh,cx*32:cx*32+rw]
                  density[sl]=a[:rh,:rw].mean((2,3))
                  foot[sl]=a[:rh,:rw,12:16,5:11].mean((2,3))
                  top[sl]=a[:rh,:rw,0:4,5:11].mean((2,3))
                  center[sl]=a[:rh,:rw,4:12,4:12].mean((2,3))
              if mid==45:
                  # Previously confirmed actual double doorway; permit only this opening.
                  assert (t[57,133:135]==384).all() and (t[61,133:135]==384).all()
                  assert (t[58:60,133:135]==385).all()
                  walk[58:61,133:135]=True
              edges=np.zeros((h,w),np.uint8)
              xlink=walk[:,:-1]&walk[:,1:]&((src[:,:-1]&8)>0)&((src[:,1:]&4)>0)
              edges[:,:-1][xlink]|=8;edges[:,1:][xlink]|=4
              ylink=walk[:-1,:]&walk[1:,:]&((src[:-1,:]&2)>0)&((src[1:,:]&1)>0)
              edges[:-1,:][ylink]|=2;edges[1:,:][ylink]|=1
              if mid==45:
                  for x in (133,134):
                    for y in (57,58,59,60):
                      assert walk[y,x] and walk[y+1,x]
                      edges[y,x]|=2;edges[y+1,x]|=1
                  for y in (58,59,60):
                    edges[y,133]|=8;edges[y,134]|=4
              # DO NOT make a solid wall simply because its foreground picture covers
              # the player's floor. A vertical face belongs to the foreground renderer.
              # Block only movement crossing the BOTTOM LIP of that face.
              vertical=(density[:-1,:]>=.65)&(foot[:-1,:]<.35)&(density[1:,:]<.23)&(top[1:,:]<.35)
              vertical &= ((edges[:-1,:]&2)>0)&((edges[1:,:]&1)>0)
              edges[:-1,:][vertical]&=np.uint8(253)
              edges[1:,:][vertical]&=np.uint8(254)
              lateral=(((density[:,:-1]>=.70)&(density[:,1:]<=.20)&(center[:,:-1]>=.6)&(top[:,1:]<.35)) |
                       ((density[:,1:]>=.70)&(density[:,:-1]<=.20)&(center[:,1:]>=.6)&(top[:,:-1]<.35)))
              lateral &= ((edges[:,:-1]&8)>0)&((edges[:,1:]&4)>0)
              edges[:,:-1][lateral]&=np.uint8(247)
              edges[:,1:][lateral]&=np.uint8(251)
              # Keep original ground impassable; verify every 4-way pair is reciprocal.
              assert not edges[~walk].any()
              assert np.array_equal((edges[:,:-1]&8)>0,(edges[:,1:]&4)>0)
              assert np.array_equal((edges[:-1,:]&2)>0,(edges[1:,:]&1)>0)
              assert not (edges[:,0]&4).any() and not (edges[:,-1]&8).any()
              assert not (edges[0,:]&1).any() and not (edges[-1,:]&2).any()
              bad=[(eid,x,y) for eid,x,y in spawn[str(mid)] if edges[y,x]==0]
              assert not bad, ('Original monster spawn blocked',mid,bad)
              if mid==45:
                  # REAL SCREENSHOT: hero behind foreground wall must walk down under it.
                  for y in (78,79,80,81):
                      assert edges[y,94]&2 and edges[y+1,94]&1,('behind wall blocked',94,y)
                  assert not(edges[82,94]&2), 'No walking through solid floor below facade'
                  # OLD SCREENSHOT: character must not climb UP THROUGH visible wall base.
                  assert not(edges[70,97]&1) and not(edges[69,97]&2),'Lower wall edge still open'
                  for x in (133,134):
                      for y in (57,58,59,60):
                          assert edges[y,x]&2 and edges[y+1,x]&1
                  assert not edges[59,132] and not edges[59,135]
              else:
                  assert edges[94,81] and edges[100,156]
              edges.tofile(base/f'r65-repaired-{mid}.bin')
              report['maps'][str(mid)]={'tiles':w*h,'native_walkable_tiles':int((t==384).sum()),
                  'final_directional_cells':int(np.count_nonzero(edges)),
                  'actual_wall_bottom_vertical_barriers':int(vertical.sum()),
                  'actual_wall_side_barriers':int(lateral.sum()),
                  'monster_spawn_positions_checked':len(spawn[str(mid)]),
                  'painted_wall_faces_used_as_impassable_floor':False}
              print('PASS',mid,report['maps'][str(mid)])
          assert report['maps']['45']['final_directional_cells']==3677
          assert report['maps']['46']['final_directional_cells']==7004
          (base/'r65-map-audit.json').write_text(json.dumps(report,indent=2))
          PY_GRAPH
          python3 /tmp/r65_graph.py

      - name: V229R65 Patch only native collision graph script 21
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r65_patch.rb <<'RB_PATCH'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          p='site/knight/gameasync/Data/Scripts.rxdata'
          items=Marshal.load(File.binread(p))
          old=Marshal.load(File.binread(p))
          raise 'Unexpected RPG scripts' unless items.size==136
          source=Zlib::Inflate.inflate(items[21][2]).force_encoding('UTF-8')
          pos=source.index('module SLTI_V229R44')
          raise 'Missing current 4-way mask' if pos.nil?
          head=source[0...pos]
          tail=source[pos..-1]
          [45,46].each do |mid|
            newmap=File.binread("build/r65-repaired-#{mid}.bin")
            expected=mid==45 ? 288*144 : 336*168
            raise 'Bad grid size' unless newmap.bytesize==expected
            regex=/^  EDGES_#{mid} = \[\r?\n.*?\r?\n  \]\.join\.unpack\('m'\)\[0\]/m
            raise "No unique mask #{mid}" unless tail.scan(regex).length==1
            lines=[newmap].pack('m0').scan(/.{1,120}/).map{|s|'    '+s.inspect}.join(",\n")
            tail=tail.sub(regex,"  EDGES_#{mid} = [\n#{lines}\n  ].join.unpack('m')[0]")
          end
          items[21][2]=Zlib::Deflate.deflate((head+tail).b)
          raise 'Unrelated script changed' unless items.each_index.all?{|i|i==21 || items[i]==old[i]}
          File.binwrite(p,Marshal.dump(items))
          check=Marshal.load(File.binread(p))
          updated=Zlib::Inflate.inflate(check[21][2]).force_encoding('UTF-8')
          a=updated.index('module SLTI_V229R44');b=updated.index("\nclass Game_Map",a)
          raise 'No RGSS runtime bounds' unless a && b
          eval(updated[a...b])
          [45,46].each do |mid|
            actual=SLTI_V229R44.const_get("EDGES_#{mid}")
            raise "R65 mask did not decode: #{mid}" unless actual==File.binread("build/r65-repaired-#{mid}.bin")
          end
          File맞습니다. 어려운 문제가 아니라 **충돌과 표시를 분리해야 하는 문제**였습니다. 이전에는 벽면 그림 자체를 통행 차단에 사용해서 계속 오류가 났습니다.

이번 R65 수정에서는 세 부분을 다음처럼 구분했습니다.

| 구분 | 이동 | 화면 표시 |
|---|---|---|
| 벽 앞 | 가능 | 캐릭터가 벽보다 앞에 표시 |
| 벽 뒤 | 가능 | 캐릭터를 벽이 가림 |
| **벽바닥** | **불가능** | 실제 벽이 서 있는 자리 |
| 문 | 가능 | 정상 통행 |

**벽 앞·뒤 이미지의 측면을 추가로 차단하던 코드를 제거했습니다.** 바닥의 불통행 타일과 벽이 실제로 닿는 하단 경계만 충돌에 사용합니다.

R64 실제 배포본으로 다시 검사한 결과, 사진에서 막혔던 **벽 뒤 아래 방향 이동**과 이전에 발생한 **아래쪽에서 벽 밑면을 뚫고 올라가는 이동 차단**을 모두 확인했습니다. 1·2층 몬스터 배치와 5,517개 원본 파일 보존 검사도 통과했습니다.

### `build-slknight-web.yml` — V229R65 전문

앞·뒤 벽면은 **표시용**, 실제 벽바닥만 **이동 차단용**으로 구분한 수정본입니다. 기존 벽 이미지 파일은 유지하고, 게임 내부에서 세 역할을 분리했습니다.

