      - name: "V100 | Verify original sprite color-key has no yellow silhouette"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          p=Path('reports/V100-map-canvas.png')
          assert p.is_file(), 'Original native canvas screenshot missing'
          image=Image.open(p).convert('RGB')
          w,h=image.size
          # In V99 the source yellow colorkey leaked into the actor rectangle.
          # The original SDL colorkey must not be represented by a giant yellow block.
          roi=image.crop((int(w*.38),int(h*.20),int(w*.64),int(h*.64)))
          yellow=sum(1 for rgb in roi.getdata() if rgb==(255,255,0))
          print('V100 authentic screenshot colorkey pixels:',yellow,flush=True)
          assert yellow<50, ('Original SPR transparency is still broken',yellow)
          print('V100: original native sprite transparency gate passed.',flush=True)
          PY

