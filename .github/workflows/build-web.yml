# FILE: .github/workflows/build-web.yml
# VERSION: V90
# V89: Sprite.pak extraction passed, but the second native.py call reran
# the offline character entry patch after it had already changed sdl_user.cpp.
# Preserve the generated actor patch under a different filename before build.
# Reuse tested V89 stages without modifying map extraction or ZIP streaming.
name: "build-web.yml | V90 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V90 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v90-native-player
  cancel-in-progress: false

jobs:
  original_client_v90:
    name: "build-web.yml | V90 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V90 | Checkout complete game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V90 | Preserve previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V90 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V90 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V90 | Recover verified V89 stage scripts"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports
          cat > /tmp/v90-stages.py <<'PY'
          import ast
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          BASE='fe2cb3e0dd2b139fef63a897270ee84f97bbe198'
          raw=subprocess.check_output(
              ['git','show',BASE+':.github/workflows/build-web.yml'],
              text=True
          )
          workflow=yaml.safe_load(raw)
          assert workflow['name']=='build-web.yml | V89 | Sanctuary game2 GitHub Pages'
          scripts={s['name']:s['run'] for s in
              workflow['jobs']['original_client_v89']['steps'] if 'run' in s}
          names={
              'prepare':'V89 | Restore complete V87 working stage chain',
              'bootstrap':'V89 | Execute V85 bootstrap to create real stage runner',
              'restore':'V89 | Restore V83 map and native build scripts',
              'sprites':'V89 | Prepare original male-knight sprite bank',
              'slice':'V89 | Preserve ZIP central records and indexed Sprite.pak slicing',
              'wire':'V89 | Wire original C++ actor and keyboard movement',
              'preflight':'V89 | Fix native hook and precompile final runner before ZIP downloads',
              'build':'V89 | Extract original map and SPR then compile native client',
              'smoke':'V89 | Require original sprite pixels and actual player movement',
              'publish':'V89 | Publish only after real sprite and movement tests pass'
          }
          assert all(name in scripts for name in names.values())

          def stage_script(stage):
              assert stage in names,stage
              script=scripts[names[stage]].replace('V89','V90').replace('v89','v90')
              if stage=='preflight':
                  # V89's validation follows the same hook we renamed below.
                  old='actor_call="subprocess.run([\'python3\',\'/tmp/v90-native.py\'],check=True)"'
                  new='actor_call="subprocess.run([\'python3\',\'/tmp/v90-actor.py\'],check=True)"'
                  assert script.count(old)==1, 'V90 preflight actor hook missing'
                  script=script.replace(old,new,1)
              return script

          if len(sys.argv)!=2:
              raise SystemExit('Usage: v90-stages.py preflight|stage')
          phase=sys.argv[1]
          if phase=='preflight':
              for key in names:
                  script=stage_script(key)
                  subprocess.run(['bash','-n'],input=script,text=True,check=True)
                  print('V90 stage verified:',key,flush=True)
          else:
              print('V90 executing:',phase,flush=True)
              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',stage_script(phase)],
                  check=True
              )
              print('V90 completed:',phase,flush=True)
          PY
          python3 -m py_compile /tmp/v90-stages.py
          python3 -u /tmp/v90-stages.py preflight \
            2>&1 | tee reports/V90-preflight.log

      - name: "V90 | Generate original stage executor"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py prepare \
            2>&1 | tee reports/V90-prepare.log
          python3 -u /tmp/v90-stages.py bootstrap \
            2>&1 | tee reports/V90-bootstrap.log
          test -s /tmp/v90-execute.py
          python3 -m py_compile /tmp/v90-execute.py

      - name: "V90 | Restore source map and SDL pipeline"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py restore \
            2>&1 | tee reports/V90-restore.log
          test -s /tmp/v90-extract.sh
          test -s /tmp/v90-build.sh

      - name: "V90 | Prepare genuine male knight SPR extraction"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py sprites \
            2>&1 | tee reports/V90-sprites.log
          python3 -u /tmp/v90-stages.py slice \
            2>&1 | tee reports/V90-sprite-index.log

      - name: "V90 | Create native actor implementation"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py wire \
            2>&1 | tee reports/V90-wiring.log

      - name: "V90 | Separate offline initialization from actor injection"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v90-separate.py <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          original=Path('/tmp/v90-native.py')
          actor=Path('/tmp/v90-actor.py')
          build=Path('/tmp/v90-build.sh')
          assert original.is_file(),'V90 actor patch source was not generated'
          assert not actor.exists(),'V90 actor patch destination already exists'
          source=original.read_text()
          assert "target='game->set_selected_char(local);'" in source
          assert 'V90: native player spawned' in source
          ast.parse(source,filename=str(original))
          original.rename(actor)

          code=build.read_text()
          old="subprocess.run(['python3','/tmp/v90-native.py'],check=True)"
          new="subprocess.run(['python3','/tmp/v90-actor.py'],check=True)"
          assert code.count(old)==1,('V90 original actor hook count',code.count(old))
          code=code.replace(old,new,1)
          assert code.count(new)==1
          build.write_text(code)
          subprocess.run(['bash','-n',str(build)],check=True)
          subprocess.run(['python3','-m','py_compile',str(actor)],check=True)
          assert not original.exists()
          print('V90: /tmp/v90-native.py is now reserved for V67 offline entry.')
          print('V90: /tmp/v90-actor.py holds the separate native SPR actor patch.')
          print('V90: build hook points to the actor patch exactly once.')
          PY
          python3 -u /tmp/v90-separate.py \
            2>&1 | tee reports/V90-script-separation.log

      - name: "V90 | Precompile actual generated native runner before resource download"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py preflight \
            2>&1 | tee reports/V90-runner-preflight.log
          test -s /tmp/v90-run.py
          test -s /tmp/v90-actor.py
          python3 -m py_compile /tmp/v90-run.py /tmp/v90-actor.py
          grep -Fq "/tmp/v90-actor.py" /tmp/v90-build.sh
          echo 'V90: distinct offline and actor scripts and final runner preflight passed.'

      - name: "V90 | Extract real SPR and map and compile native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py build \
            2>&1 | tee reports/V90-build-and-browser.log

      - name: "V90 | Verify real SPR pixels and directional movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py smoke \
            2>&1 | tee reports/V90-native-player-test.log

      - name: "V90 | Save generated sources and failure logs"
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          for file in /tmp/v90-actor.py /tmp/v90-native.py \
                      /tmp/v90-driver.py /tmp/v90-run.py \
                      /tmp/v90-build.sh /tmp/v90-extract.py \
                      /tmp/v90-execute.py; do
            if test -f "$file"; then
              cp "$file" "reports/V90-generated-$(basename "$file")"
            fi
          done

      - name: "V90 | Upload debug logs and generated scripts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V90-Native-Player
          path: |
            reports/V90-*.log
            reports/V90-*.json
            reports/V90-*.png
            reports/V90-*.txt
            reports/V90-generated-*
            assets/v90/v90-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V90 | Publish only after authentic player tests pass"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v90-stages.py publish \
            2>&1 | tee reports/V90-deploy.log

      - name: "V90 | Record verified scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V90 | Sanctuary game2 GitHub Pages'
            echo 'V89 restored real Sprite.pak contents and four male-knight SPR files.'
            echo 'V89 then re-ran its already-applied offline patch due to filename collision.'
            echo 'V90 keeps v90-native.py for V67 offline entry and v90-actor.py for sprite injection.'
            echo 'Complete C++ compilation, actual pixel visibility and movement are mandatory.'
            echo 'Existing L1J adapter using Sanctuary resources; not the Sanctuary executable.'
          } >> "$GITHUB_STEP_SUMMARY"
