# FILE: .github/workflows/build-web.yml
# VERSION: V85
# V84's first-stage failure: a6296642 is V82, not V83.
# V85 reuses the pinned V84 game implementation with corrected V83 history.
# Replays each full prior step in order; no partial patch needs to be pasted.
# Native player, visible SPR, and movement tests must pass before deployment.
name: "build-web.yml | V85 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V85 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v85-native-player
  cancel-in-progress: false

jobs:
  original_client_v85:
    name: "build-web.yml | V85 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V85 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V85 | Keep last GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V85 | Checkout pinned original L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V85 | Set up V83 Emscripten compiler"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V85 | Validate prior commits and prepare full build stages"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports

          cat > /tmp/v85-execute.py <<'PY'
          import ast
          import re
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          V84='90b2b8d02ecf38b1e5da0e5a64fae97c27619542'
          V83='779b4f65b9f8a4e6c40300724f6575d7a123fda8'
          WRONG_V82='a6296642f08028b2d92ad5b43ff3c054ec7d8ea3'

          STAGES={
              'restore':'V84 | Restore V83 exact map-rendering pipeline',
              'sprites':'V84 | Prepare original sprite banks from exact archive indices',
              'wire':'V84 | Wire native C++ spawn, directional movement and complete SDL compositing',
              'build':'V84 | Extract original map and SPR, then compile native client',
              'smoke':'V84 | Browser gate for actual actor sprite and movement',
              'publish':'V84 | Publish only an actually moving original-SPR character',
          }

          def file_at(revision):
              return subprocess.check_output(
                  ['git','show',revision+':.github/workflows/build-web.yml'],
                  text=True
              )

          prior=yaml.safe_load(file_at(V84))
          assert prior['name']=='build-web.yml | V84 | Sanctuary game2 GitHub Pages'
          assert 'original_client_v84' in prior['jobs']
          source_steps={
              s['name']:s['run']
              for s in prior['jobs']['original_client_v84']['steps']
              if 'run' in s
          }
          assert all(s in source_steps for s in STAGES.values())

          previous=yaml.safe_load(file_at(V83))
          assert previous['name']=='build-web.yml | V83 | Sanctuary game2 GitHub Pages'
          assert 'original_client_v83' in previous['jobs']

          # Never make a guessed success claim from the legacy map-only test.
          def prepare(which):
              if which not in STAGES:
                  raise RuntimeError('Unknown V85 stage: '+which)
              stage=STAGES[which]
              script=source_steps[stage]
              script=script.replace('V84','V85').replace('v84','v85')

              if which=='restore':
                  assert script.count(WRONG_V82)==1, 'V84 bad commit not found exactly once'
                  script=script.replace(WRONG_V82,V83,1)
                  assert WRONG_V82 not in script
                  assert "workflow['name']=='build-web.yml | V83 | Sanctuary game2 GitHub Pages'" in script

              if which=='sprites':
                  # The browser test is for male knight only. Do not preload
                  # ten unrelated or unverified actors into mobile resources.
                  old='actors=[0,1,61,48,138,37,734,1186,2786,2796]'
                  assert script.count(old)==1, 'V84 actor selection changed'
                  script=script.replace(old,'actors=[61]',1)
                  assert "assert not missing['61']" in script

              if which=='wire':
                  # Do not allow other classes to be marked as verified just
                  # because the one knight smoke test passed.
                  old='if (cls<0 || cls>4) throw "V85: sprite mapping not verified for this class";'
                  new='if (cls!=1 || gender!=0) throw "V85: only male knight SPR verified";'
                  assert script.count(old)==1, 'V84 native class guard changed'
                  script=script.replace(old,new,1)

              if which=='smoke':
                  # A generic 'movement' log is insufficient: require the
                  # exact destination for one press of the RIGHT key.
                  old="document.querySelector('#logbox').textContent.includes('V85: native movement x=')"
                  new="document.querySelector('#logbox').textContent.includes('V85: native movement x=32550 y=32925 heading=2')"
                  assert script.count(old)==1, 'V84 movement test changed'
                  script=script.replace(old,new,1)

              # Preflight the actual embedded Python sources, rather than only
              # testing YAML parse. No GitHub service calls are hidden here.
              pattern=(
                  r"(?ms)^(?:cat >|cat >>) (/tmp/[\w-]+\.py) <<'PY'\n"
                  r"(.*?)\nPY$"
              )
              found=list(re.finditer(pattern,script))
              for match in found:
                  ast.parse(match.group(2),filename=match.group(1))
              if which in ('restore','sprites','wire','smoke'):
                  assert found,('Missing embedded Python',which)
              return script

          if len(sys.argv)!=2:
              raise SystemExit('Usage: v85-execute.py stage')
          stage=sys.argv[1]
          if stage=='preflight':
              for name in STAGES:
                  script=prepare(name)
                  subprocess.run(
                      ['bash','-n'],input=script,text=True,check=True
                  )
                  print('V85 preflight:',name,'OK',flush=True)
              print('V85: V82/V83 commit confusion corrected and stages validated.')
          else:
              code=prepare(stage)
              print('V85 executing:',STAGES[stage],flush=True)
              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',code],check=True
              )
              print('V85 completed:',stage,flush=True)
          PY

          python3 -m py_compile /tmp/v85-execute.py
          python3 -u /tmp/v85-execute.py preflight \
            2>&1 | tee reports/V85-preflight.log

      - name: "V85 | Restore exact V83 extraction and native SDL scripts"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v85-execute.py restore \
            2>&1 | tee reports/V85-restore.log

      - name: "V85 | Prepare verified male-knight SPR archive extraction"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v85-execute.py sprites \
            2>&1 | tee reports/V85-sprites-preparation.log

      - name: "V85 | Wire native spawn, movement and SDL display"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v85-execute.py wire \
            2>&1 | tee reports/V85-native-wiring.log

      - name: "V85 | Extract real SPR and map; build and test browser"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u /tmp/v85-execute.py build \
            2>&1 | tee reports/V85-build-and-browser.log

      - name: "V85 | Verify real sprite pixels and directional movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v85-execute.py smoke \
            2>&1 | tee reports/V85-native-player-test.log

      - name: "V85 | Save failure-stage logs and runtime evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V85-Native-Player
          path: |
            reports/V85-*.log
            reports/V85-*.json
            reports/V85-*.png
            reports/V85-*.txt
            assets/v85/v85-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V85 | Deploy only verified native sprite and movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v85-execute.py publish \
            2>&1 | tee reports/V85-deploy.log

      - name: "V85 | Record actual implementation scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V85 | Sanctuary game2 GitHub Pages'
            echo 'V84 failed because its restore stage pointed to the V82 commit.'
            echo 'V85 uses actual V83 commit 779b4f65b9f8a4e6c40300724f6575d7a123fda8.'
            echo 'The runtime remains an L1J C++ adapter using Sanctuary source assets.'
            echo 'Only the original male-knight SPR is being tested in this version.'
            echo 'SPR pixel evidence and SDL movement must pass before deployment.'
            echo 'No deployment occurs on extraction, build, browser, or sprite-test failure.'
          } >> "$GITHUB_STEP_SUMMARY"
