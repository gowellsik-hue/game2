
name: "build-web.yml | V63 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V63 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v63-v45-graphics-rwops
  cancel-in-progress: false

jobs:
  original_client_v63:
    name: "build-web.yml | V63 | Repair original PNG and IMG reading"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "V63 | Checkout game2 history including V45 success"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V63 | Checkout deployed original music and V59 graphics"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          persist-credentials: true

      - name: "V63 | Checkout exact C++ source used by successful V45"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V63 | Set up original V45 Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V63 | Reuse V59 resource bytes and original V45 audio without conversion"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime reports build/objects dist
          for f in lineage-v45.js lineage-v45.data lineage-v45.wasm \
                   lineage-v59.js lineage-v59.data v60.html \
                   coi-serviceworker-v45.js v45-paks.json; do
            test -s "published/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('published')
          src=(root/'lineage-v59.js').read_text()
          anchor='  loadPackage({'
          assert src.count(anchor)==1
          start=src.index(anchor)+len('  loadPackage(')
          metadata,_=json.JSONDecoder().raw_decode(src[start:])
          data=(root/'lineage-v59.data').read_bytes()
          assert len(data)==metadata['remote_package_size']
          seen=set()
          music=None
          for item in metadata['files']:
              name=item['filename']
              assert name.startswith('/lineage/') and name not in seen,name
              seen.add(name)
              output=Path('runtime')/name.lstrip('/')
              output.parent.mkdir(parents=True,exist_ok=True)
              part=data[item['start']:item['end']]
              output.write_bytes(part)
              if name=='/lineage/sound/music0.mp3':
                  music=hashlib.sha256(part).hexdigest()
                  assert len(part)==1632319
          required=['Sprite.idx','Sprite00.idx','Sprite09.idx','Sprite13.idx',
                    'Sprite.pak','Sprite00.pak','Sprite09.pak','Sprite13.pak',
                    'Text.idx','Text.pak','Font/eng.fnt','Font/SMALL.FNT']
          assert all((Path('runtime/lineage')/f).is_file() for f in required)
          assert music
          (Path('reports')/'V63-original-audio.sha256').write_text(music+'  music0.mp3\n')
          print('V63 original sound unchanged:',music)
          print('V63 original V59 package members:',len(seen))
          PY
          cat > runtime/Lineage.ini <<'INI'
          Path = /lineage/
          NumServers = 1
          Original Client Test
              Port = 2001
              GamePort = 2000
              Names = 127.0.0.1
          INI
          test -s upstream-l1j/src/sprite_table.txt

      - name: "V63 | Compile original client with synchronous startup graphics"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v63-compile.py <<'PY'
          from pathlib import Path
          import re,subprocess

          source_root=Path('upstream-l1j')
          text=(source_root/'Makefile.am').read_text()
          match=re.search(r'^Lineage_SOURCES\s*=\s*\\\s*\n(.*?)\nif MAC',text,re.M|re.S)
          assert match,'Original source list changed'
          sources=re.findall(r'src/[\w./-]+\.(?:cpp|c)\b',match.group(1))
          assert len(sources)==60,len(sources)

          flags=['-O1','-g0','-pthread','-fexceptions',
                 '-sUSE_SDL=1','-sUSE_SDL_IMAGE=1','-sUSE_SDL_MIXER=1',
                 '-Iupstream-l1j/src','-Iupstream-l1j/src/resources',
                 '-Iupstream-l1j/include']

          objects=[]
          for i,rel in enumerate(sources):
              src=source_root/rel
              assert src.is_file(),rel
              path=src
              code=None

              if rel=='src/sdl_master.cpp':
                  code=src.read_text()
                  waiting='\t\twhile (!clients[0]->are_you_ready()) {};'
                  assert code.count(waiting)==1
                  code=code.replace(waiting,
                      '\t\twhile (!clients[0]->are_you_ready()) { SDL_Delay(5); }',1)

                  timer='\tadd_draw_timer(50);\t//20 fps'
                  assert code.count(timer)==1
                  code=code.replace(timer,
                      timer+'\n\tprintf("V63: SDL event loop started\\n");',1)

                  drawing='\t\tclients[0]->draw(cdisplay[0]);'
                  assert code.count(drawing)==1
                  code=code.replace(drawing,
                      drawing+
                      '\n\t\tstatic bool first_draw = false;'
                      '\n\t\tif (!first_draw) {'
                      '\n\t\t\tprintf("V63: first SDL draw call finished\\n");'
                      '\n\t\t\tfirst_draw = true;'
                      '\n\t\t}',1)

              elif rel=='src/drawmode/draw_loading.cpp':
                  # Use the genuine original assets before the first frame.
                  # No replacement images or simulated loading screen.
                  code=src.read_text()

                  original_png='\tgfx[0] = new sdl_graphic();\n\tgfx[0]->delay_load(811, 0, 0, GRAPH_PNG, owner);'
                  original_img='\tgfx[1] = new sdl_graphic();\n\tgfx[1]->delay_load(330, 241, 385, GRAPH_IMG, owner);'

                  assert code.count(original_png)==1
                  assert code.count(original_img)==1

                  code=code.replace(original_png,
                      '\tgfx[0] = new sdl_graphic(811, 0, 0, GRAPH_PNG, owner);',1)

                  code=code.replace(original_img,
                      '\tgfx[1] = new sdl_graphic(330, 241, 385, GRAPH_IMG, owner);'
                      '\n\tprintf("V63: loading PNG 811=%s IMG 330=%s\\n",'
                      'gfx[0]->valid() ? "ok" : "missing",'
                      'gfx[1]->valid() ? "ok" : "missing");',1)

              elif rel=='src/resources/pack.cpp':
                  code=src.read_text()
                  old='\topen_data();\t//open the data file it is not already\n\tint num_invalid = 0;'
                  assert code.count(old)==1
                  code=code.replace(old,
                      '\topen_data();\t//open the data file it is not already\n\tif (!data_buf) return 1;\n\tint num_invalid = 0;',1)

                  old='unsigned char* pack::load_file(int which, int decrypting)\n{\n\tunsigned char *buf;\n\topen_data();\n'
                  assert code.count(old)==1
                  code=code.replace(old,old+'\tif (!data_buf) return 0;\n',1)

              elif rel=='src/resources/music.cpp':
                  # Keep the V45 nonfatal music guard.
                  code=src.read_text()
                  old='\t\t\tMix_PlayMusic(cur_music, -1);'
                  assert code.count(old)==1
                  new=('\t\t\tif (cur_music) {\n'
                       '\t\t\t\tif (Mix_PlayMusic(cur_music, -1) < 0)\n'
                       '\t\t\t\t\tprintf("V45: Audio playback unavailable; continuing game.\\n");\n'
                       '\t\t\t} else {\n'
                       '\t\t\t\tprintf("V45: Music load unavailable; continuing game.\\n");\n'
                       '\t\t\t}')
                  code=code.replace(old,new,1)

              elif rel=='src/resources/sdl_graphic.cpp':
                  # Preserve the V61 PNG/IMG reading fix.
                  code=src.read_text()
                  code='#include <SDL/SDL_image.h>\n'+code

                  start=code.index('SDL_Surface *sdl_graphic::get_img(int num, sdl_user *who)')
                  end=code.index('SDL_Surface *sdl_graphic::get_image(SDL_RWops *buf)',start)

                  raw_img='''SDL_Surface *sdl_graphic::get_img(int num, sdl_user *who)
          {
              if (!who) return 0;
              char name[32];
              int size=0;
              sprintf(name,"%de.img",num);
              unsigned char *buffer=who->getfiles->load_file(name,&size,FILE_SPRITESPACK,0);
              if (!buffer) buffer=who->getfiles->load_file(name,&size,FILE_SPRITEPACK,0);
              if (!buffer) {
                  sprintf(name,"%d.img",num);
                  buffer=who->getfiles->load_file(name,&size,FILE_SPRITESPACK,0);
              }
              if (!buffer) buffer=who->getfiles->load_file(name,&size,FILE_SPRITEPACK,0);
              if (!buffer) return 0;
              SDL_Surface *image=0;
              if (size>=8) {
                  const unsigned width=(unsigned(buffer[0])<<8)|buffer[1];
                  const unsigned height=(unsigned(buffer[2])<<8)|buffer[3];
                  const unsigned colorKey=(unsigned(buffer[6])<<8)|buffer[7];
                  const unsigned long long pixels=1ULL*width*height;
                  if (width>0 && height>0 && width<=2048 && height<=2048 &&
                      8ULL+pixels*2ULL<=static_cast<unsigned long long>(size)) {
                      unsigned short *rgb=new unsigned short[pixels];
                      for (unsigned long long i=0;i<pixels;i++)
                          rgb[i]=(unsigned(buffer[8+2*i])<<8)|buffer[8+2*i+1];
                      image=SDL_CreateRGBSurfaceFrom(rgb,width,height,16,width*2,
                              0x7C00,0x03E0,0x001F,0);
                      if (image) SDL_SetColorKey(image,SDL_SRCCOLORKEY,colorKey);
                      else delete [] rgb;
                  }
              }
              delete [] buffer;
              return image;
          }

          '''
                  code=code[:start]+raw_img+code[end:]

                  old='\t\t\tsdl_buf = SDL_RWFromConstMem(buffer, size);\n\t\t\tret = get_image(sdl_buf);\n\t\t\tSDL_RWclose(sdl_buf);'
                  assert code.count(old)==1
                  code=code.replace(old,
                      '\t\t\tsdl_buf = SDL_RWFromConstMem(buffer, size);\n\t\t\tret = IMG_Load_RW(sdl_buf, 1);',1)
                  assert 'SDL_RWclose(sdl_buf)' not in code

              if code is not None:
                  path=Path('build')/('v63-'+src.name)
                  path.write_text(code)

              obj=Path('build/objects')/f'{i:03d}.o'
              subprocess.run(
                  ['emcc' if rel.endswith('.c') else 'em++',
                   *flags,'-I'+str(src.parent),
                   '-c',str(path),'-o',str(obj)],
                  check=True
              )
              objects.append(str(obj))
              print('V63 compiled',rel,flush=True)

          Path('build/objects-list.txt').write_text('\n'.join(objects)+'\n')
          assert len(objects)==60
          PY
          python3 /tmp/v63-compile.py 2>&1 | tee reports/V63-compile.txt
          test -z "$(git -C upstream-l1j status --porcelain)"

      - name: "V63 | Link with the exact successful V45 SDL compatibility source"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,textwrap
          commit='9dfbf5df2a8476397303237098e18301685bfe3b'
          original=subprocess.check_output(
              ['git','show',commit+':.github/workflows/build-web.yml'],text=True)
          opening="          cat > build/v45-sdl12-compat.cpp <<'CPP_COMPAT'\n"
          assert original.count(opening)==1
          begin=original.index(opening)+len(opening)
          end=original.index('\n          CPP_COMPAT',begin)
          source=textwrap.dedent(original[begin:end])+'\n'
          assert 'v45_register_original_paks' in source
          assert 'SDL_WaitEvent' in source
          pathlib.Path('build/v63-sdl12-compat.cpp').write_text(source)
          PY

          em++ -O1 -pthread -fexceptions \
            -Iupstream-l1j/src \
            -Iupstream-l1j/src/resources \
            -Iupstream-l1j/include \
            -sUSE_SDL=1 -sUSE_SDL_IMAGE=1 -sUSE_SDL_MIXER=1 \
            -c build/v63-sdl12-compat.cpp -o build/v63-sdl12-compat.o

          mapfile -t objects < build/objects-list.txt
          test "${#objects[@]}" -eq 60

          em++ "${objects[@]}" build/v63-sdl12-compat.o \
            -o dist/lineage-v63.js \
            -O1 -pthread -fexceptions \
            -sUSE_SDL=1 -sUSE_SDL_IMAGE=1 -sUSE_SDL_MIXER=1 \
            -sSTB_IMAGE=1 \
            -sMODULARIZE=1 -sEXPORT_NAME=createLineage \
            -sENVIRONMENT=web,worker -sPROXY_TO_PTHREAD=1 \
            -sPTHREAD_POOL_SIZE=5 -sALLOW_MEMORY_GROWTH=1 \
            -sINITIAL_MEMORY=201326592 -sSTACK_SIZE=5242880 \
            -sEXIT_RUNTIME=0 -sFORCE_FILESYSTEM=1 -sASSERTIONS=1 \
            --profiling-funcs -sEXPORTED_RUNTIME_METHODS=FS \
            --embed-file runtime/Lineage.ini@/Lineage.ini \
            --embed-file upstream-l1j/src/sprite_table.txt@/sprite_table.txt \
            --preload-file runtime/lineage@/lineage \
            2>&1 | tee reports/V63-link.txt

          test -s dist/lineage-v63.wasm
          test -s dist/lineage-v63.js
          test -s dist/lineage-v63.data

      - name: "V63 | Keep V59 timer and RGB555 conversion"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v63-js.py <<'PY'
          from pathlib import Path
          import json,hashlib

          base=Path('published')
          original=(base/'lineage-v59.js').read_text()
          target=Path('dist/lineage-v63.js')
          js=target.read_text()

          def transplant(current,ref,start,end):
              assert current.count(start)==1 and ref.count(start)==1,start
              i=current.index(start)
              j=current.index(end,i)
              a=ref.index(start)
              b=ref.index(end,a)
              return current[:i]+ref[a:b]+current[j:]

          v59_start='var v59Timers = new Map();'
          anchor='function _SDL_CreateRGBSurface('
          assert original.count(v59_start)==1

          begin=original.index(v59_start)
          end=original.index(anchor,begin)
          timer=original[begin:end].replace('v59Timers','v63Timers').replace(
              'v59TimerID','v63TimerID')

          old_start='var _SDL_AddTimer = function('
          assert js.count(old_start)==1
          at=js.index(old_start)
          end_at=js.index(anchor,at)
          js=js[:at]+timer+js[end_at:]

          js=transplant(
              js,original,
              'function _SDL_CreateRGBSurfaceFrom(',
              'var _SDL_Delay ='
          )

          i=js.index('function _SDL_RemoveTimer(')
          j=js.index('var _SDL_SaveBMP_RW',i)
          a=original.index('function _SDL_RemoveTimer(')
          b=original.index('var _SDL_SaveBMP_RW',a)
          js=js[:i]+original[a:b].replace('v59Timers','v63Timers')+js[j:]

          assert 'lineage-v63.data' in js
          assert 'lineage-v63.wasm' in js
          target.write_text(js)

          def music_digest(jsfile,datafile):
              txt=Path(jsfile).read_text()
              anchor='  loadPackage({'
              assert txt.count(anchor)==1
              start=txt.index(anchor)+len('  loadPackage(')
              metadata,_=json.JSONDecoder().raw_decode(txt[start:])
              data=Path(datafile).read_bytes()
              assert len(data)==metadata['remote_package_size']
              item=next(
                  f for f in metadata['files']
                  if f['filename']=='/lineage/sound/music0.mp3'
              )
              sound=data[item['start']:item['end']]
              assert len(sound)==1632319
              return hashlib.sha256(sound).hexdigest()

          before=music_digest(
              base/'lineage-v59.js',base/'lineage-v59.data')
          after=music_digest(
              target,Path('dist/lineage-v63.data'))
          assert before==after,'Original music data changed'
          print('V63 original music SHA256 unchanged:',after)
          PY

          python3 /tmp/v63-js.py
          node --check dist/lineage-v63.js
          sha256sum dist/lineage-v63.* > reports/V63-build-sha256.txt

      - name: "V63 | Build page using existing mobile controls and log"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('published')
          page=(p/'v60.html').read_text()
          assert page.count('lineage-v60.js')>=2

          page=page.replace('lineage-v60.js','lineage-v63.js')
          page=page.replace('lineage-v45.wasm','lineage-v63.wasm')
          page=page.replace(
              'V60 Original Client Web Runtime',
              'V63 Original Client Web Runtime')
          page=page.replace(
              'V60 (V45 original audio preserved)',
              'V63 (V45 original audio preserved)')

          assert 'coi-serviceworker-v45.js' in page
          assert 'v45-paks.json' in page
          assert 'pointer-events:auto;touch-action:pan-y' in page
          assert 'boxedwine' not in page.lower()

          (p/'v63.html').write_text(page)
          (p/'index.html').write_text(page)
          PY

          cp dist/lineage-v63.js dist/lineage-v63.wasm dist/lineage-v63.data published/
          node --check published/lineage-v63.js
          cmp published/index.html published/v63.html

      - name: "V63 | Install Chromium for actual screen test"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'playwright==1.56.0' 'pillow>=10,<13'
          python3 -m playwright install --with-deps chromium

      - name: "V63 | Verify original images and canvas before deployment"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/site-root
          ln -s "$GITHUB_WORKSPACE/published" reports/site-root/game2

          cat > /tmp/v63-server.py <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from pathlib import Path

          class H(SimpleHTTPRequestHandler):
              def end_headers(self):
                  for key,value in [
                      ('Cross-Origin-Opener-Policy','same-origin'),
                      ('Cross-Origin-Embedder-Policy','require-corp'),
                      ('Cross-Origin-Resource-Policy','same-origin')
                  ]:
                      self.send_header(key,value)
                  super().end_headers()

          root=Path('reports/site-root').resolve()
          ThreadingHTTPServer(
              ('127.0.0.1',8765),
              partial(H,directory=str(root))
          ).serve_forever()
          PY

          cat > /tmp/v63-browser.py <<'PY'
          import asyncio,io,json
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright

          report={
              'version':'V63',
              'messages':[],
              'errors':[],
              'failed_requests':[]
          }

          async def check():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=await browser.new_page(
                      viewport={'width':1024,'height':768})

                  page.on('console',lambda x:
                      report['messages'].append(x.text[-1000:])
                      if len(report['messages'])<500 else None)
                  page.on('pageerror',lambda x:
                      report['errors'].append(str(x)))
                  page.on('requestfailed',lambda x:
                      report['failed_requests'].append(x.url))

                  try:
                      await page.goto(
                          'http://127.0.0.1:8765/game2/v63.html',
                          wait_until='domcontentloaded')
                      await page.wait_for_function(
                          'crossOriginIsolated && typeof SharedArrayBuffer==="function"',
                          timeout=25000)
                      await page.wait_for_timeout(70000)

                      report['state']=await page.locator('#state').inner_text()
                      report['log']=(await page.locator('#logbox').inner_text())[-14000:]
                      await page.screenshot(path='reports/V63-screen.png')

                      log=report['log']
                      report['event_loop_started']='V63: SDL event loop started' in log
                      report['draw_called']='V63: first SDL draw call finished' in log
                      report['original_background_loaded']='V63: loading PNG 811=ok' in log
                      report['original_progress_loaded']='IMG 330=ok' in log

                      await page.add_style_tag(
                          content='#overlay,#logbox,#tools,#controls{display:none!important}')

                      raw=await page.locator('#canvas').screenshot(
                          path='reports/V63-canvas.png')
                      img=Image.open(io.BytesIO(raw)).convert('RGB').resize((128,96))
                      pixels=list(img.getdata())

                      report['nonblack_fraction']=round(
                          sum(max(x)>30 for x in pixels)/len(pixels),4)

                      report['graphics_rendered']=(
                          report['original_background_loaded']
                          and report['nonblack_fraction']>0.02
                      )

                      assert report['original_background_loaded'], \
                          'Original 811.png was not successfully decoded'
                      assert report['graphics_rendered'], \
                          'Original SDL canvas remained blank'
                      assert not any(
                          'function signature mismatch' in x
                          for x in report['errors']
                      ),report['errors']

                  except Exception as exc:
                      report['test_exception']=str(exc)
                      report['graphics_rendered']=False
                  finally:
                      await browser.close()

              Path('reports/V63-browser.json').write_text(
                  json.dumps(report,indent=2,ensure_ascii=False))

              print('Original PNG 811 loaded:',
                    report.get('original_background_loaded'),flush=True)
              print('Original IMG 330 loaded:',
                    report.get('original_progress_loaded'),flush=True)
              print('SDL event loop:',
                    report.get('event_loop_started'),flush=True)
              print('SDL draw:',
                    report.get('draw_called'),flush=True)
              print('Canvas nonblack fraction:',
                    report.get('nonblack_fraction'),flush=True)
              print('Game log:',
                    report.get('log','')[-3500:],flush=True)

              for error in report['errors'][-5:]:
                  print('ERROR:',error,flush=True)

              if not report.get('graphics_rendered'):
                  raise SystemExit(
                      'V63 original graphics not rendered; deployment blocked')

          asyncio.run(check())
          PY

          python3 /tmp/v63-server.py > reports/V63-http.txt 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              http://127.0.0.1:8765/game2/v63.html; then break; fi
            sleep 1
          done

          python3 /tmp/v63-browser.py

      - name: "V63 | Save diagnostics and actual screenshot"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V63-Original-Startup-Graphics
          path: |
            reports/V63-browser.json
            reports/V63-screen.png
            reports/V63-canvas.png
            reports/V63-compile.txt
            reports/V63-link.txt
            reports/V63-original-audio.sha256
            reports/V63-http.txt
          retention-days: 30
          if-no-files-found: warn

      - name: "V63 | Publish only after original graphics are visible"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('reports/V63-browser.json') as f:
              report=json.load(f)
          assert report['graphics_rendered']
          assert report['original_background_loaded']
          PY

          git -C published add -- index.html v63.html \
            lineage-v63.js lineage-v63.wasm lineage-v63.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V63: load genuine startup graphics synchronously'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V63 | Record actual result"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V63 | Sanctuary game2 GitHub Pages'
            echo 'Keeps original V45 music handling and V59 resource data.'
            echo 'Loads genuine 811.png and 330.img directly during loading screen construction.'
            echo 'Records SDL event loop, first drawing call and asset load results.'
            echo 'Does not deploy unless the original PNG and visible canvas pixels are verified.'
            echo 'A successful loading screen does not demonstrate completed gameplay.'
          } >> "$GITHUB_STEP_SUMMARY"
