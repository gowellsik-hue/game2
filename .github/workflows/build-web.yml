# FILE: .github/workflows/build-web.yml
# VERSION: V82
# BASE: V81, commit f2539964659dc7fdf8ecea9cefaf84989154fe0e
# Keeps the original Sanctuary C++ engine and the V81 native tile renderer.
# Removes the five upstream chat-window sample lines and restores mobile top alignment.
# Reports original-player sprite status instead of claiming it is rendered.
name: "build-web.yml | V82 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V82 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v82-native-client
  cancel-in-progress: false

jobs:
  original_client_v82:
    name: "build-web.yml | V82 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V82 | Checkout game2 full history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V82 | Preserve last successful Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V82 | Checkout exact original Sanctuary C++ client"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V82 | Set up unchanged Emscripten toolchain"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V82 | Recover complete V81 native extraction and build scripts"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports
          cat > /tmp/v82-restore.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          revision='f2539964659dc7fdf8ecea9cefaf84989154fe0e'
          content=subprocess.check_output(
              ['git','show',revision+':.github/workflows/build-web.yml'],
              text=True
          )
          workflow=yaml.safe_load(content)
          assert workflow['name']=='build-web.yml | V81 | Sanctuary game2 GitHub Pages'
          steps=workflow['jobs']['original_client_v81']['steps']
          scripts={step['name']:step['run'] for step in steps if 'run' in step}
          originals=[
              'V81 | Restore V80 original resource and C++ stages',
              'V81 | Repair the original SDL_Rect memory layout',
          ]
          assert all(name in scripts for name in originals)
          for name in originals:
              script=scripts[name].replace('V81','V82').replace('v81','v82')
              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',script],
                  check=True
              )
              print('Recovered:',name,flush=True)

          for name in ('/tmp/v82-extract.sh','/tmp/v82-build.sh'):
              assert Path(name).is_file(),name
              subprocess.run(['bash','-n',name],check=True)

          for name in ('/tmp/v82-sdl-bridge.py','/tmp/v82-native-viewport.py'):
              assert Path(name).is_file(),name
              subprocess.run(['python3','-m','py_compile',name],check=True)

          assert '/tmp/v82-sdl-bridge.py' in Path('/tmp/v82-build.sh').read_text()
          print('V82: V81 original map, SDL_Rect and character stages preserved.')
          PY
          python3 -m py_compile /tmp/v82-restore.py
          python3 -u /tmp/v82-restore.py 2>&1 | tee reports/V82-restore.log

      - name: "V82 | Remove only original chat demonstration text"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('upstream-l1j/src/widgets/chat_window.cpp')
          source=p.read_text(encoding='utf-8')
          marker='text_box *tb = (text_box*)widgets[3];'
          assert source.count(marker)==1
          old=r'(?m)^[ \t]*tb->add_line\("[^"\n]*"\);[ \t]*\r?\n'
          cleaned,count=re.subn(old,'',source)
          assert count==5,('Expected five upstream demo chat lines',count)
          assert 'This is a test of displaying text' not in cleaned
          assert 'The number 42 is required' not in cleaned
          p.write_text(cleaned,encoding='utf-8')
          Path('reports/V82-chat-audit.txt').write_text(
              'Removed exactly five hardcoded test messages from original '
              'chat_window.cpp; real chat_window and text_box remain.\n'
          )
          print('V82: removed five original sample chat messages.')
          PY
          bash -n /tmp/v82-build.sh

      - name: "V82 | Build original C++ client and verify real map pixels"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v82-extract.sh 2>&1 | tee reports/V82-extract-stage.log
          bash /tmp/v82-build.sh 2>&1 | tee reports/V82-build-stage.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('reports/V82-browser.json').read_text())
          for name in ('character_saved','character_restored','native_game_ready','passed'):
              assert report[name],(name,report.get(name))
          assert report['native_map_unique_colors']>=8
          assert report['native_map_nonblack_fraction']>0.02
          assert Path('reports/V82-map-canvas.png').stat().st_size>500

          native=Path('upstream-l1j/src/sdl_user.cpp').read_text()
          assert 'game->set_selected_char(local);' in native
          draw=Path('upstream-l1j/src/drawmode/draw_game.cpp').read_text()
          assert 'themap->move_sprite(info->id' in draw
          entry=native.split('game->set_selected_char(local);',1)[1]
          spawn_in_entry='game->place_character(' in entry.split('delete [] local->name;',1)[0]
          state=('native player spawn called' if spawn_in_entry
                 else 'native character metadata set; no player spawn call')
          Path('reports/V82-character-audit.txt').write_text(
              state+'\nReal sprite graphics not verified by this browser test.\n'
          )
          print('V82:',state)
          print('V82: original map colors',report['native_map_unique_colors'])
          PY

      - name: "V82 | Correct mobile stage alignment without covering native HUD"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html','v82.html'):
              target=Path('published')/name
              source=target.read_text(encoding='utf-8')
              assert 'V82' in source,('Wrong version',name)
              old='#stage{position:relative;display:flex;align-items:center;justify-content:center;'
              new='#stage{position:relative;display:flex;align-items:flex-start;justify-content:center;'
              assert source.count(old)==1,('Stage CSS changed',name)
              source=source.replace(old,new,1)
              assert 'sanctuary-game2-characters-v1' in source
              assert 'lineage-v82.js' in source
              target.write_text(source,encoding='utf-8')
          print('V82: map aligned to top; original bottom HUD stays available.')
          PY

      - name: "V82 | Upload original runtime and character diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V82-Original-Runtime
          path: |
            reports/V82-restore.log
            reports/V82-chat-audit.txt
            reports/V82-character-audit.txt
            reports/V82-preflight.log
            reports/V82-bridge-preflight.log
            reports/V82-extract-stage.log
            reports/V82-build-stage.log
            reports/V82-browser.json
            reports/V82-map-canvas.png
            reports/V82-mobile.png
            reports/V82-http.txt
            assets/v82/v82-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V82 | Publish only after original native map verification"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/V82-browser.json').read_text())
          assert report['passed'] and report['native_game_ready']
          assert report['character_saved'] and report['character_restored']
          assert report['native_map_unique_colors']>=8
          assert report['native_map_nonblack_fraction']>0.02
          assert (Path('published')/'lineage-v82.js').is_file()
          assert (Path('published')/'lineage-v82.wasm').is_file()
          assert (Path('published')/'lineage-v82.data').is_file()
          assert Path('published/v82.html').is_file()
          before=Path('published/lineage-v70.data').stat().st_size
          after=Path('published/lineage-v82.data').stat().st_size
          assets=sum(
              p.stat().st_size
              for p in Path('assets/v82/lineage').rglob('*') if p.is_file()
          )
          assert before<after<=before+assets+2000000
          PY
          git -C published add -- \
            index.html \
            v82.html \
            lineage-v82.js \
            lineage-v82.wasm \
            lineage-v82.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V82: retain original map and remove demo chat'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V82 | Report exact implementation status"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V82 | Sanctuary game2 GitHub Pages'
            echo 'Builds the pinned original Sanctuary C++ engine, not a substitute engine.'
            echo 'Reuses complete V81 SDL_Rect and native tile pipeline.'
            echo 'Removes the original chat widget five hardcoded test lines.'
            echo 'Aligns the real map to the top of the mobile stage.'
            echo 'Character selection persists; native player sprite is separately audited.'
            echo 'Actual character movement and rendering have not been established.'
            echo 'Previous Pages remains deployed if the native build fails.'
          } >> "$GITHUB_STEP_SUMMARY"
