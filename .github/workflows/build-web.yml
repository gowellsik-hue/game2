# FILE: .github/workflows/build-web.yml
# VERSION: V88
# V87 run 40156525035: actual original SPR extraction succeeded.
# The generated /tmp/v87-run.py failed because V84 native hook used
# excessive indentation relative to the existing map source patch.
# Correct hook indentation and precompile the final runner before archive extraction.
name: "build-web.yml | V88 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V88 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v88-native-player
  cancel-in-progress: false

jobs:
  original_client_v88:
    name: "build-web.yml | V88 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V88 | Checkout complete game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V88 | Preserve last GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V88 | Checkout pinned L1J C++ client adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V88 | Set up verified Emscripten compiler"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V88 | Load complete V87 pipeline and syntax-check stages"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports
          cat > /tmp/v88-stages.py <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          PIN='88f7c1c372eb8876826e68c2eef3a4dd97817034'
          raw=subprocess.check_output(
              ['git','show',PIN+':.github/workflows/build-web.yml'],
              text=True
          )
          prior=yaml.safe_load(raw)
          assert prior['name']=='build-web.yml | V87 | Sanctuary game2 GitHub Pages'
          steps=prior['jobs']['original_client_v87']['steps']
          scripts={s['name']:s['run'] for s in steps if 'run' in s}
          stages={
              'bootstrap':'V87 | Load exact V86 pipeline and validate script structure',
              'restore':'V87 | Restore V85 native build and browser stages',
              'map':'V87 | Restore native map, SDL and chat cleanup',
              'sprites':'V87 | Prepare indexed original male knight SPR',
              'slice':'V87 | Repair V86 ZIP central records and SPR slicing',
              'wire':'V87 | Connect original C++ player and keyboard movement',
              'build':'V87 | Extract original map and SPR then compile native client',
              'smoke':'V87 | Require original SPR pixels and real directional movement',
              'publish':'V87 | Publish only when original character and movement pass'
          }
          assert all(name in scripts for name in stages.values())

          def source(which):
              assert which in stages,which
              return scripts[stages[which]].replace('V87','V88').replace('v87','v88')

          if len(sys.argv)!=2:
              raise SystemExit('V88 stage required')
          phase=sys.argv[1]
          if phase=='preflight':
              for key in stages:
                  subprocess.run(['bash','-n'],input=source(key),text=True,check=True)
                  print('V88 verified stage:',key,flush=True)
          else:
              print('V88 executing:',phase,flush=True)
              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',source(phase)],
                  check=True
              )
              print('V88 completed:',phase,flush=True)
          PY
          python3 -m py_compile /tmp/v88-stages.py
          python3 -u /tmp/v88-stages.py preflight \
            2>&1 | tee reports/V88-preflight.log

      - name: "V88 | Restore verified V85 compiler and test scripts"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py bootstrap \
            2>&1 | tee reports/V88-bootstrap.log

      - name: "V88 | Restore C++ native map and SDL scripts"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py restore \
            2>&1 | tee reports/V88-restore.log
          python3 -u /tmp/v88-stages.py map \
            2>&1 | tee reports/V88-map-setup.log

      - name: "V88 | Prepare verified original knight SPRs"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py sprites \
            2>&1 | tee reports/V88-sprites-preparation.log
          python3 -u /tmp/v88-stages.py slice \
            2>&1 | tee reports/V88-sprite-index.log

      - name: "V88 | Wire original C++ character and movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py wire \
            2>&1 | tee reports/V88-player-wiring.log

      - name: "V88 | Fix generated native runner indentation and test before download"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v88-fix-runner.py <<'PY'
          from pathlib import Path
          import re,subprocess

          p=Path('/tmp/v88-build.sh')
          lines=p.read_text(encoding='utf-8').splitlines()
          mapping="subprocess.run(['python3','/tmp/v88-map-patch.py'],check=True)"
          native="subprocess.run(['python3','/tmp/v88-native.py'],check=True)"
          a=[i for i,s in enumerate(lines) if s.strip()==mapping]
          b=[i for i,s in enumerate(lines) if s.strip()==native]
          assert len(a)==1 and len(b)==1,('C++ hook anchors',a,b)
          assert b[0]==a[0]+1,('Expected adjacent native hook',a,b)
          original=re.match(r'^[ \t]*',lines[b[0]]).group()
          correct=re.match(r'^[ \t]*',lines[a[0]]).group()
          assert len(original)>len(correct),('Unexpected indentation',len(original),len(correct))
          lines[b[0]]=correct+native
          script='\n'.join(lines)+'\n'

          runner="subprocess.run(['python3','-u',str(script)],check=True)"
          assert script.count(runner)==1,('Driver launch anchor',script.count(runner))
          before=(
              "if __import__('os').environ.get('V88_RUNNER_PREFLIGHT')=='1':\n"
              "    print('V88: final generated runner syntax verified',flush=True)\n"
              "    raise SystemExit(0)\n"
          )
          script=script.replace(runner,before+runner,1)
          p.write_text(script,encoding='utf-8')
          subprocess.run(['bash','-n',str(p)],check=True)
          print('V88 native hook indentation:',len(original),'to',len(correct),flush=True)
          PY
          python3 /tmp/v88-fix-runner.py 2>&1 | tee reports/V88-runner-fix.log

          trap 'if test -f /tmp/v88-run.py; then cp /tmp/v88-run.py reports/V88-generated-run.py; fi; if test -f /tmp/v88-driver.py; then cp /tmp/v88-driver.py reports/V88-driver.py; fi' EXIT
          V88_RUNNER_PREFLIGHT=1 bash /tmp/v88-build.sh \
            2>&1 | tee reports/V88-runner-preflight.log
          python3 -m py_compile /tmp/v88-run.py

      - name: "V88 | Extract source SPR and compile native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py build \
            2>&1 | tee reports/V88-build-and-browser.log

      - name: "V88 | Verify sprite visibility and real player movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py smoke \
            2>&1 | tee reports/V88-native-player-test.log

      - name: "V88 | Upload diagnostics on all outcomes"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V88-Native-Player
          path: |
            reports/V88-*.log
            reports/V88-*.json
            reports/V88-*.png
            reports/V88-*.txt
            reports/V88-*.py
            assets/v88/v88-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V88 | Deploy only actual SPR pixels and movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v88-stages.py publish \
            2>&1 | tee reports/V88-publish.log

      - name: "V88 | Report validated scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V88 | Sanctuary game2 GitHub Pages'
            echo 'V87 extracted the original male-knight SPR bank successfully.'
            echo 'V87 failed because the generated native runner had unexpected indentation.'
            echo 'V88 fixes C++ native hook indentation to match the existing map patch.'
            echo 'V88 compiles the final generated runner before downloading the source archive.'
            echo 'Original SDL sprite pixels and keyboard movement remain required to publish.'
            echo 'This is the existing L1J C++ adapter using Sanctuary assets.'
          } >> "$GITHUB_STEP_SUMMARY"
