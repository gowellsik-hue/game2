
name: "build-web.yml | V32 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V32 | Original Sanctuary engine runtime test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read

concurrency:
  group: build-web-yml-v32-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v32:
    name: "build-web.yml | V32 | Run ORIGINAL Lineage client, no HTML replacement"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V32 | Checkout game2"
        uses: actions/checkout@v4

      - name: "V32 | Download original Sanctuary archive (46 volumes)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gowellsik-hue/game2'
          mkdir -p original native reports
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original --clobber
          test "$(find original -maxdepth 1 -type f | wc -l)" -eq 46
          for i in $(seq -w 1 45); do
            test -s "original/Sanctuary.of.Aden.-.Copy.z${i}"
          done
          test -s original/Sanctuary.of.Aden.-.Copy.zip

      - name: "V32 | Install original Windows runtime and inspection tools"
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            p7zip-full file binutils wine wine64 wine32:i386 \
            xvfb x11-utils imagemagick locales fonts-nanum
          sudo locale-gen ko_KR.UTF-8
          wine --version > reports/V32-wine-version.txt
          df -h . > reports/V32-free-space-before.txt

      - name: "V32 | Restore ALL unmodified original files"
        shell: bash
        run: |
          set -euo pipefail
          archive='original/Sanctuary.of.Aden.-.Copy.zip'
          7z x "$archive" -onative -y \
            > reports/V32-original-extraction.log
          root='native/Sanctuary of Aden - Copy'
          for f in Lineage.exe lin.bin Login.exe Redemption.exe \
                   TW13032701.exe Sprite.pak Sprite.idx Tile.pak Tile.idx; do
            test -s "$root/$f"
          done
          test -d "$root/map"
          test -d "$root/sound"
          find "$root" -type f | wc -l \
            > reports/V32-original-file-count.txt
          du -sh "$root" > reports/V32-original-data-size.txt
          df -h . > reports/V32-free-space-after.txt
          rm -rf original

      - name: "V32 | Record PE signatures and loader references"
        shell: bash
        run: |
          set -euo pipefail
          root='native/Sanctuary of Aden - Copy'
          : > reports/V32-pe-types.txt
          : > reports/V32-pe-imports.txt
          : > reports/V32-pe-sha256.txt
          for f in Lineage.exe lin.bin Login.exe Redemption.exe \
                   TW13032701.exe; do
            file "$root/$f" >> reports/V32-pe-types.txt
            sha256sum "$root/$f" >> reports/V32-pe-sha256.txt
            {
              echo "### $f"
              objdump -p "$root/$f" 2>/dev/null | \
                grep -E 'ImageBase|AddressOfEntryPoint|Subsystem|DLL Name:' || true
            } >> reports/V32-pe-imports.txt
          done
          {
            echo 'ASCII references:'
            strings -a "$root/Lineage.exe" | \
              grep -Ei 'lin[.]bin|login[.]exe|redemption[.]exe' | \
              head -n 60 || true
            echo 'UTF-16LE references:'
            strings -a -el "$root/Lineage.exe" | \
              grep -Ei 'lin[.]bin|login[.]exe|redemption[.]exe' | \
              head -n 60 || true
          } > reports/V32-launcher-file-references.txt

      - name: "V32 | Test original Lineage.exe and lin.bin separately"
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export WINEARCH=win32
          export LANG=ko_KR.UTF-8
          export LC_ALL=ko_KR.UTF-8
          export WINEDEBUG=+process,+loaddll,+seh
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp \
            > reports/V32-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'wineserver -k >/dev/null 2>&1 || true; kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 3
          root="$PWD/native/Sanctuary of Aden - Copy"

          for test_case in Lineage.exe:Lineage lin.bin:LinBin; do
            exe="${test_case%%:*}"
            label="${test_case#*:}"
            export WINEPREFIX="$RUNNER_TEMP/v32-${label}-wine"
            mkdir -p "$WINEPREFIX"
            timeout --kill-after=5s 90s wineboot --init \
              > "reports/V32-${label}-wineboot.log" 2>&1 || true

            (
              cd "$root"
              timeout --kill-after=5s 55s wine "./$exe"
            ) > "reports/V32-${label}-wine.log" 2>&1 &
            pid=$!
            sleep 20
            alive=no
            if kill -0 "$pid" 2>/dev/null; then alive=yes; fi
            ps -eo pid,ppid,comm,args \
              > "reports/V32-${label}-processes.txt"
            xwininfo -root -tree \
              > "reports/V32-${label}-windows.txt" 2>&1 || true
            import -window root "reports/V32-${label}-screen.png" \
              > "reports/V32-${label}-screenshot.log" 2>&1 || true
            colors=0
            if test -s "reports/V32-${label}-screen.png"; then
              colors=$(identify -format '%k' \
                "reports/V32-${label}-screen.png" 2>/dev/null || echo 0)
            fi
            {
              echo "original_executable=$exe"
              echo 'observation_seconds=20'
              echo "wine_wrapper_alive_at_capture=$alive"
              echo "screenshot_unique_colors=$colors"
            } > "reports/V32-${label}-observed.txt"
            {
              grep -Eim 100 'err:|Unhandled|exception|failed|c0000135|c0000005' \
                "reports/V32-${label}-wine.log" || true
            } > "reports/V32-${label}-errors.txt"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            wineserver -k >/dev/null 2>&1 || true
            sleep 3
          done

      - name: "V32 | Compare original client startup evidence"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REPORT'
          from pathlib import Path
          import json
          import os
          import re

          out = Path('reports')
          out.mkdir(exist_ok=True)
          candidates = [('Lineage', 'Lineage.exe'), ('LinBin', 'lin.bin')]
          rows = []
          for label, exe in candidates:
              observed = out / f'V32-{label}-observed.txt'
              info = {}
              if observed.is_file():
                  for line in observed.read_text().splitlines():
                      if '=' in line:
                          key, value = line.split('=', 1)
                          info[key] = value
              path = out / f'V32-{label}-windows.txt'
              windows = []
              if path.is_file():
                  for line in path.read_text(errors='replace').splitlines():
                      size = re.search(r'\b(\d+)x(\d+)\+-?\d+\+-?\d+', line)
                      if size and int(size[1]) >= 300 and int(size[2]) >= 200:
                          windows.append(line.strip())
              own_window = any(exe.lower() in line.lower() for line in windows)
              screenshot = out / f'V32-{label}-screen.png'
              row = {
                  'original_file': exe,
                  'wine_wrapper_alive': info.get('wine_wrapper_alive_at_capture', 'unknown'),
                  'screenshot_colors': info.get('screenshot_unique_colors', '0'),
                  'screenshot_captured': screenshot.is_file() and screenshot.stat().st_size > 0,
                  'large_windows': windows,
                  'own_executable_window': own_window,
              }
              rows.append(row)
          (out / 'V32-runtime-comparison.json').write_text(
              json.dumps(rows, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          lines = [
              '# build-web.yml | V32 | ORIGINAL engine direct-execution investigation',
              '',
              'The original files were not patched or replaced.',
              'Lineage.exe is the launcher/EULA baseline.',
              'lin.bin was started directly from the original game directory.',
              '',
              '| Original binary | Wrapper alive | Window matching file | Screenshot colors |',
              '|---|---|---|---:|',
          ]
          for row in rows:
              lines.append(
                  f"| {row['original_file']} | {row['wine_wrapper_alive']} | "
                  f"{row['own_executable_window']} | {row['screenshot_colors']} |"
              )
          lines += [
              '',
              '## Native windows (at 20 seconds)',
          ]
          for row in rows:
              lines.append(f"### {row['original_file']}")
              lines += [f'- `{s}`' for s in row['large_windows']]
              if not row['large_windows']:
                  lines.append('- No large native window detected')
          lines += [
              '',
              '**A captured window is not proof of gameplay, server access, or a working map.**',
              '**Failure of standalone lin.bin is not proof the engine is unusable:**',
              'it may require arguments or an authorized launch sequence.',
              'No EULA acceptance, credentials, or server selection was automated.',
              'The runtime remains Windows PE under Wine, NOT a browser port.',
              'No replacement HTML engine was created.',
          ]
          result = '\n'.join(lines) + '\n'
          (out / 'V32-summary.md').write_text(result, encoding='utf-8')
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write(result)
          PY_REPORT

      - name: "V32 | Upload native client launch evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Engine-V32-Runtime-Evidence
          path: reports/
          retention-days: 90
          if-no-files-found: error

      - name: "V32 | Verify direct original-client tests were recorded"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/V32-pe-types.txt
          test -s reports/V32-pe-imports.txt
          test -s reports/V32-runtime-comparison.json
          test -s reports/V32-summary.md
          for label in Lineage LinBin; do
            test -s "reports/V32-${label}-observed.txt"
            test -s "reports/V32-${label}-processes.txt"
            test -s "reports/V32-${label}-windows.txt"
            test -s "reports/V32-${label}-screen.png"
          done
          echo 'V32 PASS: direct original-client startup evidence collected.'
          echo 'Actual gameplay and browser operation are still unverified.'
