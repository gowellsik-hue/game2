
name: "build-web.yml | V77 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V77 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v77-original-map
  cancel-in-progress: false

jobs:
  original_client_v77:
    name: "build-web.yml | V77 | Restore authentic SDL map presentation"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V77 | Checkout complete game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V77 | Preserve successful V70 Pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V77 | Checkout original Sanctuary C++ source"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V77 | Set up known working Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V77 | Reuse confirmed V76 extraction and original C++ compilation"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports
          cat > /tmp/v77-prepare.py <<'PY'
          from pathlib import Path
          import ast
          import re
          import subprocess
          import yaml

          # V76 succeeded in extracting 16 original .s32 sections,
          # 196 authentic tile banks, and compiling the C++ client.
          # Do not modify or rebuild those processing scripts from scratch.
          sha='f57eada1c465eb8efc1370288f0f966b5b360d4d'
          raw=subprocess.check_output(
              ['git','show',sha+':.github/workflows/build-web.yml'],text=True)
          workflow=yaml.safe_load(raw)
          original=workflow['jobs']['original_client_v76']['steps']
          prep=next(s['run'] for s in original
                    if s['name']=='V76 | Prepare and precompile original map patches')
          prep=prep.replace('V76','V77').replace('v76','v77')
          match=re.search(r"(?m)^cat > /tmp/v77-prepare.py <<'PY'\n([\s\S]*?)\nPY$",prep)
          assert match,'V77 original preflight script not found'
          ast.parse(match.group(1),filename='v77-original-prepare.py')
          subprocess.run(['bash','-e','-o','pipefail','-c',prep],check=True)
          for f in ('/tmp/v77-extract.sh','/tmp/v77-build.sh'):
              assert Path(f).is_file(),f
              subprocess.run(['bash','-n',f],check=True)
          print('V77: original V76 extraction and build scripts preserved.',flush=True)
          PY
          python3 -m py_compile /tmp/v77-prepare.py
          python3 -u /tmp/v77-prepare.py | tee reports/V77-preflight.log

      - name: "V77 | Correct native map viewport and SDL browser bridge"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v77-native-viewport.py <<'PY'
          from pathlib import Path
          p=Path('upstream-l1j/src/widgets/sdl_lin_map.cpp')
          s=p.read_text()
          def one(old,new,n=1):
              global s
              assert s.count(old)==n,('V77 map anchor',old,s.count(old))
              s=s.replace(old,new,n)
          # The original 3072x1535 offscreen section caches were repeatedly
          # copied through SDL1's browser shim; their pixels never reached
          # the page canvas in V76. Draw original native cells into a bounded
          # viewport, not an HTML substitute map.
          one('ret->graphic = new sdl_graphic(0, 0, 3072, 1535, 75);',
              'ret->graphic = new sdl_graphic(0, 0, one->getw(), one->geth(), 75);')
          one('dx = tempmap.get_screen().get_x() + offsetx;',
              'dx = tempmap.get_screen().get_x() + master_offsetx;',2)
          one('dy = tempmap.get_screen().get_y() + offsety;',
              'dy = tempmap.get_screen().get_y() + master_offsety;',2)
          one('ret->offsetx = offsetx;', 'ret->offsetx = master_offsetx;')
          one('ret->offsety = offsety;', 'ret->offsety = master_offsety;')
          one('ret->map = mapnum;',
              'printf("V77: native map viewport %d x %d\\n",one->getw(),one->geth());\n\tret->map = mapnum;')
          p.write_text(s)
          print('V77: original native SDL map now renders into a viewport-sized surface.',flush=True)
          PY
          cat > /tmp/v77-sdl-bridge.py <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('dist/lineage-v77.js')
          s=p.read_text(encoding='utf-8')
          def one(old,new):
              global s
              assert s.count(old)==1,('V77 SDL anchor',old,s.count(old))
              s=s.replace(old,new,1)
          # Observe real native SDL surfaces when the map blits into its
          # 640x380 viewport. No invented tiles and no static HTML image.
          marker='    var oldAlpha = dstData.ctx.globalAlpha;'
          one(marker, '''    if (dstData.width === 640 && dstData.height === 380) {
                  SDL.v77NativeMapViewport = dstData.canvas;
                  SDL.v77MapBlits = (SDL.v77MapBlits || 0) + 1;
                  if (SDL.v77MapBlits <= 4) {
                    var v77Bright=0, v77Opaque=0;
                    try {
                      var v77Pixels=dstData.ctx.getImageData(0,0,640,380).data;
                      for (var v77I=0; v77I<v77Pixels.length; v77I+=512) {
                        if (v77Pixels[v77I+3]>0) v77Opaque++;
                        if (v77Pixels[v77I]>35 || v77Pixels[v77I+1]>35 ||
                            v77Pixels[v77I+2]>35) v77Bright++;
                      }
                    } catch (v77E) { out("V77 SDL viewport sample: " + v77E); }
                    out("V77: native SDL map viewport blit " + SDL.v77MapBlits +
                        " source=" + srcData.width + "x" + srcData.height +
                        " opaque=" + v77Opaque + " bright=" + v77Bright);
                  }
                }
          '''+marker)
          # The V65 bridge only mirrored the 640x480 backing surface.
          # Present the real 640x380 native map canvas as well, so a blank
          # backbuffer cannot hide a correctly decoded native map.
          marker='        Module.v65Copies=(Module.v65Copies||0)+1;'
          one(marker, '''        if (SDL.v77NativeMapViewport) {
                    pageContext.drawImage(SDL.v77NativeMapViewport,
                      0,0,640,380,0,0,pageCanvas.width,
                      Math.round(pageCanvas.height*380/480));
                    if (!SDL.v77Presented) {
                      SDL.v77Presented=true;
                      out("V77: original native SDL viewport presented to page canvas");
                    }
                  }
          '''+marker)
          # Leave the existing SDL surface readback logic untouched.
          # This changes only original SDL map presentation and diagnostics.
          p.write_text(s,encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          print('V77: SDL native map-to-page bridge and syntax verified.',flush=True)
          PY
          python3 -m py_compile /tmp/v77-native-viewport.py /tmp/v77-sdl-bridge.py
          cat > /tmp/v77-wire.py <<'PY'
          from pathlib import Path
          import re
          import ast
          import subprocess
          build_file=Path('/tmp/v77-build.sh')
          s=build_file.read_text()
          # Both hooks run after the proven V76 source preparation / JS
          # proxy-index correction, before assets are packaged into the page.
          orig="subprocess.run(['python3','/tmp/v77-tile-graphics.py'],check=True)"
          assert s.count(orig)==1,('V77 C++ hook',s.count(orig))
          s=s.replace(orig,orig+"\n        subprocess.run(['python3','/tmp/v77-native-viewport.py'],check=True)",1)
          anchor="code=code.replace(needle,hooks+needle,1)"
          assert s.count(anchor)==1,('V77 JS hook',s.count(anchor))
          injection='''
          bridge_anchor="        align_sdl_proxy_indices('dist/lineage-v77.js')"
          assert code.count(bridge_anchor)==1,('V77 proxy hook',code.count(bridge_anchor))
          code=code.replace(bridge_anchor,
              bridge_anchor+"\\n        subprocess.run(['python3','/tmp/v77-sdl-bridge.py'],check=True)",1)
          '''
          s=s.replace(anchor,anchor+'\n'+injection.strip('\n'),1)
          matches=list(re.finditer(r"(?m)^cat > (/tmp/[\w-]+\.py) <<'PY'\n([\s\S]*?)\nPY$",s))
          assert len(matches)>=3,('V77 nested Python scripts',len(matches))
          for m in matches:
              ast.parse(m.group(2),filename=m.group(1))
          build_file.write_text(s)
          subprocess.run(['bash','-n',str(build_file)],check=True)
          print('V77: native and JavaScript hooks inserted; Python and bash pass syntax checks.',flush=True)
          PY
          python3 -m py_compile /tmp/v77-wire.py
          python3 /tmp/v77-wire.py | tee reports/V77-bridge-preflight.log

      - name: "V77 | Extract original assets, compile and test browser"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v77-extract.sh 2>&1 | tee reports/V77-extraction.log
          bash /tmp/v77-build.sh 2>&1 | tee reports/V77-build-test.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V77-browser.json').read_text())
          assert r['passed'] and r['native_game_ready']
          assert r['character_saved'] and r['character_restored']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          assert Path('reports/V77-map-canvas.png').stat().st_size>500
          print('V77 authentic native map visible:',r['native_map_nonblack_fraction'])
          PY

      - name: "V77 | Upload build, map and browser diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V77-Native-Map
          path: |
            reports/V77-preflight.log
            reports/V77-bridge-preflight.log
            reports/V77-extraction.log
            reports/V77-build-test.log
            reports/V77-extract.log
            reports/V77-browser.json
            reports/V77-map-canvas.png
            reports/V77-mobile.png
            reports/V77-http.txt
            assets/v77/v77-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V77 | Publish only after authentic SDL canvas test"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('reports/V77-browser.json').read_text())
          assert r['passed'] and r['character_saved'] and r['character_restored']
          assert r['native_game_ready'] and r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          assert Path('reports/V77-map-canvas.png').stat().st_size>500
          original=Path('published/lineage-v70.data').stat().st_size
          current=Path('published/lineage-v77.data').stat().st_size
          assets=sum(p.stat().st_size for p in Path('assets/v77/lineage').rglob('*') if p.is_file())
          assert original<current<=original+assets+2000000
          PY
          git -C published add -- index.html v77.html \
            lineage-v77.js lineage-v77.wasm lineage-v77.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'build-web.yml V77: repair authentic SDL viewport presentation'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V77 | Record exact scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V77 | Sanctuary game2 GitHub Pages'
            echo 'V76 extracted 16 authentic maps and 196 banks and entered native game.'
            echo 'V76 canvas was uniformly RGB(5,5,5), confirmed by actual screenshot.'
            echo 'V77 uses the original native SDL viewport rather than a fake image.'
            echo 'V77 attempts a viewport-size native cache and patches the SDL browser bridge.'
            echo 'The patched JavaScript reports native SDL map blits and page presentation.'
            echo 'V70 character persistence and source assets are retained.'
            echo 'The map must pass actual Chromium pixel verification before publishing.'
            echo 'Movement, other maps and combat are not verified.'
          } >> "$GITHUB_STEP_SUMMARY"
