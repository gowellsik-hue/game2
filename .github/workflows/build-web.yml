# FILE: .github/workflows/build-web.yml
# VERSION: V86
# BASE: V85 pinned commit 955980d2f6222a87795648dc80cec2f0e2a586bc
# Fix V85: 61-0/2/4/6.spr were sought only in hashed SpriteNN.idx.
# Extract just indexed SPR byte ranges from the original split ZIP Sprite.pak.
# No map-only or source-log-only success; only verified sprites and movement publish.
name: "build-web.yml | V86 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V86 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-web.yml]

permissions:
  contents: write

concurrency:
  group: game2-v86-native-player
  cancel-in-progress: false

jobs:
  original_client_v86:
    name: "build-web.yml | V86 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V86 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V86 | Keep last GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V86 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V86 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V86 | Restore exact V85 staged build and preflight"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports
          cat > /tmp/v86-bootstrap.py <<'PY'
          import subprocess,yaml
          from pathlib import Path

          revision='955980d2f6222a87795648dc80cec2f0e2a586bc'
          raw=subprocess.check_output(
              ['git','show',revision+':.github/workflows/build-web.yml'],
              text=True
          )
          workflow=yaml.safe_load(raw)
          assert workflow['name']=='build-web.yml | V85 | Sanctuary game2 GitHub Pages'
          steps=workflow['jobs']['original_client_v85']['steps']
          title='V85 | Validate prior commits and prepare full build stages'
          stage=next(s['run'] for s in steps if s.get('name')==title)
          stage=stage.replace('V85','V86').replace('v85','v86')
          subprocess.run(['bash','-n'],input=stage,text=True,check=True)
          subprocess.run(['bash','-e','-o','pipefail','-c',stage],check=True)
          assert Path('/tmp/v86-execute.py').is_file()
          print('V86: V85 complete staged source recovered, versions aligned.')
          PY
          python3 -m py_compile /tmp/v86-bootstrap.py
          python3 -u /tmp/v86-bootstrap.py 2>&1 | tee reports/V86-bootstrap.log

      - name: "V86 | Restore proven V83 map and SDL source"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v86-execute.py restore \
            2>&1 | tee reports/V86-restore.log

      - name: "V86 | Prepare original SPR extraction"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v86-execute.py sprites \
            2>&1 | tee reports/V86-sprites-preparation.log

      - name: "V86 | Fix correct Sprite.idx and streaming PAK extraction"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v86-slice-helper.py <<'PY'
          import struct,zlib

          def extract_selected(record, needed):
              """Read exact indexed SPR spans; never allocate the whole 1.9GB PAK."""
              d,o=record['disk'],record['offset']
              header=fetch_bytes(d,o,30)
              if header[:4]!=b'PK\x03\x04' and d==0 and o==0:
                  o=4
                  header=fetch_bytes(d,o,30)
              if header[:4]!=b'PK\x03\x04':
                  raise RuntimeError('Sprite.pak local ZIP header missing')
              name_len,extra_len=struct.unpack_from('<HH',header,26)
              sd,so=step(d,o,30+name_len+extra_len)
              spans={
                  name:(off,size) for name,(off,_raw,size) in needed.items()
              }
              for name,(off,size) in spans.items():
                  if off<0 or size<=0 or off+size>record['uncompressed']:
                      raise RuntimeError('Invalid SPR IDX range: '+name)

              if record['method']==0:
                  result={}
                  for name,(off,size) in spans.items():
                      disk,offset=step(sd,so,off)
                      result[name]=fetch_bytes(disk,offset,size)
                  return result

              if record['method']!=8:
                  raise RuntimeError('Unsupported Sprite.pak ZIP method: '+str(record['method']))

              result={name:bytearray(size) for name,(_off,size) in spans.items()}
              decompressor=zlib.decompressobj(-15)
              zipped=0
              unpacked=0
              checksum=0
              block_size=2*1024*1024

              def accept(data):
                  nonlocal unpacked,checksum
                  if not data:
                      return
                  begin=unpacked
                  end=begin+len(data)
                  for name,(off,size) in spans.items():
                      left=max(begin,off)
                      right=min(end,off+size)
                      if right>left:
                          result[name][left-off:right-off]=data[left-begin:right-begin]
                  checksum=zlib.crc32(data,checksum)
                  unpacked=end

              while zipped<record['compressed']:
                  n=min(block_size,record['compressed']-zipped)
                  disk,offset=step(sd,so,zipped)
                  compressed=fetch_bytes(disk,offset,n)
                  if len(compressed)!=n:
                      raise RuntimeError('Truncated original Sprite.pak')
                  accept(decompressor.decompress(compressed))
                  zipped+=n
              accept(decompressor.flush())
              if not decompressor.eof:
                  raise RuntimeError('Sprite.pak raw DEFLATE stream incomplete')
              if unpacked!=record['uncompressed']:
                  raise RuntimeError('Sprite.pak uncompressed size mismatch')
              if (checksum&0xffffffff)!=record['crc']:
                  raise RuntimeError('Sprite.pak CRC mismatch')
              for name,(off,size) in spans.items():
                  if len(result[name])!=size:
                      raise RuntimeError('SPR extracted length mismatch: '+name)
              print('V86: streamed original Sprite.pak bytes=',unpacked,flush=True)
              return {name:bytes(value) for name,value in result.items()}
          PY

          python3 -m py_compile /tmp/v86-slice-helper.py

          python3 - <<'PY'
          from pathlib import Path
          import ast,re,subprocess
          p=Path('/tmp/v86-extract.sh')
          script=p.read_text()

          changes=[
              ("bank='Sprite%02d'%(sum(name.encode('ascii')) & 15)",
               "bank='Sprite'"),
              ('complete=extract_record(source_bank)',
               'sources=extract_selected(source_bank,needed)'),
              ('offset+size<=len(complete)',
               "offset+size<=source_bank['uncompressed']"),
              ('raw=complete[offset:offset+size]',
               'raw=sources[filename]'),
              ('del complete','del sources'),
              ("from pathlib import Path\n\nsource=Path('published')",
               "from pathlib import Path\nexec(Path('/tmp/v86-slice-helper.py').read_text(),globals())\n\nsource=Path('published')")
          ]
          for before,after in changes:
              count=script.count(before)
              assert count==1,('V86 exact extractor anchor',before,count)
              script=script.replace(before,after,1)

          assert 'assert not missing[\'61\']' in script
          m=re.search(
              r"(?ms)^cat > /tmp/v86-extract\.py <<'PY'\n(.*?)\nPY$",
              script
          )
          assert m,'V86 extractor heredoc not found'
          ast.parse(m.group(1),filename='v86-real-extractor.py')
          p.write_text(script)
          subprocess.run(['bash','-n',str(p)],check=True)
          print('V86: use original Sprite.idx / Sprite.pak; bounded ZIP extraction verified.')
          PY

      - name: "V86 | Connect original C++ character and movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v86-execute.py wire \
            2>&1 | tee reports/V86-native-wiring.log

      - name: "V86 | Extract original SPR and compile native game"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u /tmp/v86-execute.py build \
            2>&1 | tee reports/V86-build-and-browser.log

      - name: "V86 | Verify real sprite visibility and movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v86-execute.py smoke \
            2>&1 | tee reports/V86-native-player-test.log

      - name: "V86 | Preserve complete diagnostics on failure"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V86-Native-Player
          path: |
            reports/V86-*.log
            reports/V86-*.json
            reports/V86-*.png
            reports/V86-*.txt
            assets/v86/v86-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V86 | Deploy only original sprite pixels plus movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v86-execute.py publish \
            2>&1 | tee reports/V86-deploy.log

      - name: "V86 | Report validated scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V86 | Sanctuary game2 GitHub Pages'
            echo 'V85 failed before compilation: it did not inspect generic Sprite.idx.'
            echo 'V86 tries original Sprite.idx and original Sprite.pak selective extraction.'
            echo 'The runtime is the existing L1J C++ adapter, not the Sanctuary executable.'
            echo 'Publishing requires native sprite pixels, real movement and browser checks.'
            echo 'Original collision and all-class support remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
