
name: "build-web.yml | V60 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V60 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v60-v59-error-diagnostics
  cancel-in-progress: false

jobs:
  repair_v60_error_reporting:
    name: "build-web.yml | V60 | Repair log scrolling and reveal actual worker errors"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: "V60 | Checkout deployed V59 success baseline"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V60 | Lock original V45 music, V59 sprite data and WebAssembly"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gowellsik-hue/game2'
          for f in v59.html lineage-v59.js lineage-v59.data \
                   lineage-v45.wasm lineage-v45.js lineage-v45.data \
                   v45-paks.json coi-serviceworker-v45.js; do
            test -s "published/$f" || { echo "Missing original file $f" >&2; exit 1; }
          done
          mkdir -p reports
          sha256sum published/lineage-v59.data published/lineage-v45.wasm \
                    published/lineage-v45.js published/lineage-v45.data \
                    published/coi-serviceworker-v45.js > reports/V60-unchanged-assets.sha256
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('published')
          source=(root/'lineage-v59.js').read_text(encoding='utf-8')
          anchor='  loadPackage({'
          assert source.count(anchor)==1
          start=source.index(anchor)+len('  loadPackage(')
          metadata,_=json.JSONDecoder().raw_decode(source[start:])
          binary=(root/'lineage-v59.data').read_bytes()
          assert len(binary)==metadata['remote_package_size']
          music=next(f for f in metadata['files']
                     if f['filename']=='/lineage/sound/music0.mp3')
          raw=binary[music['start']:music['end']]
          assert len(raw)==1632319
          digest=hashlib.sha256(raw).hexdigest()
          (Path('reports')/'V60-original-music.sha256').write_text(digest+'  music0.mp3\n')
          print('Unmodified original sound data:',len(raw),'bytes; SHA256:',digest)
          PY

      - name: "V60 | Remove log flood, enable touch scrolling and expose thread failures"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v60-update.py <<'PY'
          from pathlib import Path
          import re
          root=Path('published')

          def once(source, old, new, label):
              count=source.count(old)
              assert count==1, f'V59 {label} anchor changed ({count} matches)'
              return source.replace(old,new,1)

          original_js=(root/'lineage-v59.js').read_text(encoding='utf-8')
          worker_old='''    worker.onerror = e => {
                var message = "worker sent an error!";
                if (worker.pthread_ptr) {
                  message = `Pthread ${ptrToString(worker.pthread_ptr)} sent an error!`;
                }
                err(`${message} ${e.filename}:${e.lineno}: ${e.message}`);
                throw e;
              };'''
          # Keep everything except the worker error-reporting branch byte-identical.
          worker_new='''    worker.onerror = e => {
                var message = "worker sent an error!";
                if (worker.pthread_ptr) {
                  message = `Pthread ${ptrToString(worker.pthread_ptr)} sent an error!`;
                }
                var reason = e.error?.stack || e.error?.message || e.message || e.type;
                err(`${message} ${e.filename}:${e.lineno}:${e.colno || 0} ${reason}`);
                throw e.error || e;
              };'''
          original_js=once(original_js,worker_old,worker_new,'worker error handler')
          assert 'lineage-v45.wasm' in original_js
          assert 'lineage-v59.data' in original_js
          (root/'lineage-v60.js').write_text(original_js,encoding='utf-8')

          page=(root/'v59.html').read_text(encoding='utf-8')
          css_start=page.index('#logbox{')
          css_end=page.index('}',css_start)+1
          css=page[css_start:css_end]
          assert 'pointer-events:none' in css
          revised_css=css.replace('pointer-events:none',
              'pointer-events:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch')
          revised_css=revised_css.replace('max-height:25vh','max-height:40vh')
          page=once(page,css,revised_css,'logbox scrolling CSS')

          log_old=r"function log(message){const line=String(message??'');logbox.textContent+=(line+'\n');if(logbox.textContent.length>24000)logbox.textContent=logbox.textContent.slice(-16000);logbox.scrollTop=logbox.scrollHeight;console.log('[Lineage]',line);}"
          log_new=r'''function log(message){
            const line=String(message??'');
            const visible=logbox.classList.contains('visible');
            const follow=!visible || logbox.scrollTop+logbox.clientHeight>=logbox.scrollHeight-32;
            logbox.textContent+=(line+'\n');
            if(logbox.textContent.length>64000)logbox.textContent=logbox.textContent.slice(-52000);
            if(visible && follow)logbox.scrollTop=logbox.scrollHeight;
            console.log('[Lineage]',line);
          }
          let filteredSpriteLines=0;
          function enginePrint(message){
            const line=String(message??'');
            if(/^(?:mspdf for sprite \d+ is \d+|Sprite \d+ has .*|Weapon on sprite \d+.*|\s*\d{2,7}\s*)$/.test(line)){
              filteredSpriteLines++;
              if(filteredSpriteLines%1000===0)log('스프라이트 디버그 출력 '+filteredSpriteLines+'행 생략');
              return;
            }
            log(line);
          }
          function errorDetail(value,depth=0){
            if(value==null)return String(value);
            if(typeof value==='string')return value;
            if(depth>3)return String(value);
            const parts=[];
            for(const key of ['type','name','message','filename','lineno','colno','stack','status']){
              const item=value[key];
              if(item!==undefined && item!==null && item!=='')parts.push(key+': '+String(item));
            }
            if(value.error && value.error!==value)parts.push('cause: '+errorDetail(value.error,depth+1));
            if(value.reason && value.reason!==value)parts.push('reason: '+errorDetail(value.reason,depth+1));
            return parts.join('\n')||String(value);
          }'''
          page=once(page,log_old,log_new,'log output and diagnostic filtering')

          old_problem="function problem(message){status('실행 장애');head.textContent='클라이언트 실행 실패';desc.textContent=message;overlay.classList.remove('hidden');launched=false;log(message);logbox.classList.add('visible');}"
          new_problem="""function problem(message){
            const detail=String(message??'실행 오류');
            status('실행 장애');
            head.textContent='클라이언트 실행 실패';
            desc.textContent=detail.slice(0,1500);
            overlay.classList.remove('hidden');
            launched=false;
            log(detail);
            logbox.classList.add('visible');
            requestAnimationFrame(()=>{logbox.scrollTop=logbox.scrollHeight;});
          }"""
          page=once(page,old_problem,new_problem,'fatal error log auto-scroll')

          old_print="print:(...x)=>log(x.join(' ')), printErr:(...x)=>log('STDERR '+x.join(' ')),"
          new_print="print:(...x)=>enginePrint(x.join(' ')), printErr:(...x)=>log('STDERR '+x.join(' ')),"
          page=once(page,old_print,new_print,'sprite debug log filter')

          old_error="window.addEventListener('error',event=>{if(launched)problem(event.message||'알 수 없는 런타임 오류');});"
          new_error="window.addEventListener('error',event=>{if(launched)problem('브라우저/작업 스레드 오류\\n'+errorDetail(event));});"
          page=once(page,old_error,new_error,'browser worker detailed error')

          old_reject="if(launched)problem(reason?.message||String(reason));"
          new_reject="if(launched)problem('비동기 작업 오류\\n'+errorDetail(reason));"
          page=once(page,old_reject,new_reject,'promise rejection detailed error')

          old_button="document.getElementById('logBtn').addEventListener('click',()=>logbox.classList.toggle('visible'));"
          new_button="document.getElementById('logBtn').addEventListener('click',()=>{if(logbox.classList.toggle('visible'))requestAnimationFrame(()=>{logbox.scrollTop=logbox.scrollHeight;});});"
          page=once(page,old_button,new_button,'manual log toggle')

          page=once(page,'V59 Original Client Web Runtime','V60 Original Client Web Runtime','page title')
          page=once(page,'V59 (V45 original audio preserved)','V60 (V45 original audio preserved)','visible version')
          assert page.count('lineage-v59.js')>=2
          page=page.replace('lineage-v59.js','lineage-v60.js')
          assert 'lineage-v60.js' in page and 'lineage-v45.wasm' in page
          assert 'coi-serviceworker-v45.js' in page
          assert 'music0.mp3' in page
          assert 'boxedwine' not in page.lower()
          (root/'index.html').write_text(page,encoding='utf-8')
          (root/'v60.html').write_text(page,encoding='utf-8')
          code=re.search(r'<script>\n(.*?)\n</script>',page,re.S)
          assert code,'Unable to extract V60 inline JavaScript'
          Path('/tmp/v60-inline.js').write_text(code.group(1)+'\n',encoding='utf-8')
          print('V60 only changes: worker exception detail, inline log display and error detail')
          PY
          python3 /tmp/v60-update.py
          node --check published/lineage-v60.js
          node --check /tmp/v60-inline.js
          cmp published/index.html published/v60.html
          sha256sum -c reports/V60-unchanged-assets.sha256
          test ! -f published/lineage-v60.wasm
          test ! -f published/lineage-v60.data

      - name: "V60 | Publish repaired page, not another engine build"
        shell: bash
        run: |
          set -euo pipefail
          git -C published add -- index.html v60.html lineage-v60.js
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'build-web.yml V60: repair mobile log scroll and reveal WASM worker errors'
            git -C published push origin HEAD:gh-pages
          fi
          echo 'V60 pushed to gh-pages; Pages publication is asynchronous.'

      - name: "V60 | Upload unchanged resource verification"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V60-log-and-error-diagnostics
          path: |
            reports/V60-original-music.sha256
            reports/V60-unchanged-assets.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: "V60 | Report separately what changed and what is not yet fixed"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V60 | Sanctuary game2 GitHub Pages'
            echo 'Starts directly from the successfully published V59 code; no original archive download or recompilation.'
            echo 'V45 WebAssembly, the existing V59 data containing original music and graphics, and the PAK service worker are unchanged.'
            echo 'Mobile log now scrolls, opens at the latest failure, and avoids flooding the DOM with repetitive sprite messages.'
            echo 'A single worker error-reporting branch reveals the underlying stack when the browser provides it.'
            echo 'This is a diagnostics and UI repair, not a claim that gameplay or rendering is fixed.'
          } >> "$GITHUB_STEP_SUMMARY"
