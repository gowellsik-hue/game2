      - name: "V67 | Install real browser test"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "playwright==1.56.0"
          python3 -m playwright install --with-deps chromium

      - name: "V67 | Test character creation, persistence and native entry"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/site-root
          ln -s "$GITHUB_WORKSPACE/published" reports/site-root/game2

          cat > /tmp/v67-server.py <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from pathlib import Path

          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  for k,v in [
                      ("Cross-Origin-Opener-Policy","same-origin"),
                      ("Cross-Origin-Embedder-Policy","require-corp"),
                      ("Cross-Origin-Resource-Policy","same-origin")
                  ]:
                      self.send_header(k,v)
                  super().end_headers()

          root=Path("reports/site-root").resolve()
          ThreadingHTTPServer(
              ("127.0.0.1",8765),
              partial(Handler,directory=str(root))
          ).serve_forever()
          PY

          cat > /tmp/v67-test.py <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright

          result={
              "version":"V67",
              "errors":[],
              "character_saved":False,
              "character_restored":False,
              "native_game_ready":False
          }

          async def test():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-dev-shm-usage"]
                  )
                  context=await browser.new_context(
                      viewport={"width":393,"height":852},
                      is_mobile=True,
                      has_touch=True
                  )
                  page=await context.new_page()
                  page.on(
                      "pageerror",
                      lambda e:result["errors"].append(str(e))
                  )

                  try:
                      await page.goto(
                          "http://127.0.0.1:8765/game2/v67.html",
                          wait_until="domcontentloaded"
                      )

                      await page.get_by_role(
                          "button",name="새 캐릭터"
                      ).first.click()

                      await page.locator("#v67Name").fill(
                          "OfflineKnight"
                      )
                      await page.locator("#v67Auto").click()
                      await page.locator("#v67Save").click()

                      await page.get_by_text(
                          "OfflineKnight",exact=True
                      ).wait_for(timeout=10000)

                      result["character_saved"]=True

                      await page.reload(
                          wait_until="domcontentloaded"
                      )

                      await page.get_by_text(
                          "OfflineKnight",exact=True
                      ).wait_for(timeout=10000)

                      result["character_restored"]=True

                      await page.wait_for_function(
                          "crossOriginIsolated && "
                          "typeof SharedArrayBuffer==='function'",
                          timeout=30000
                      )

                      await page.get_by_role(
                          "button",name="선택·입장"
                      ).first.click()

                      await page.wait_for_function(
                          "() => document.querySelector('#logbox')"
                          ".textContent.includes("
                          "'V67: offline native game ready:')",
                          timeout=100000
                      )

                      result["native_game_ready"]=True
                      result["recent_log"]=(
                          await page.locator("#logbox").inner_text()
                      )[-7000:]

                      await page.screenshot(
                          path="reports/V67-mobile.png"
                      )

                  except Exception as error:
                      result["test_exception"]=str(error)
                      try:
                          result["recent_log"]=(
                              await page.locator("#logbox").inner_text()
                          )[-7000:]
                      except Exception:
                          pass

                  finally:
                      await browser.close()

              result["passed"]=(
                  result["character_saved"]
                  and result["character_restored"]
                  and result["native_game_ready"]
                  and not result["errors"]
              )

              Path("reports/V67-browser.json").write_text(
                  json.dumps(result,indent=2,ensure_ascii=False)
              )

              print("Character saved:",result["character_saved"])
              print("Character restored:",result["character_restored"])
              print("Native game ready:",result["native_game_ready"])
              print("Browser errors:",result["errors"])
              print("Test exception:",result.get("test_exception"))
              print("Log:",result.get("recent_log","")[-3500:])

              if not result["passed"]:
                  raise SystemExit(
                      "V67 offline character path failed"
                  )

          asyncio.run(test())
          PY

          python3 /tmp/v67-server.py \
            > reports/V67-http.txt 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              http://127.0.0.1:8765/game2/v67.html; then
              break
            fi
            sleep 1
          done

          python3 /tmp/v67-test.py

