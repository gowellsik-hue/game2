
name: "build-web.yml | V66 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V66 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v66-sdl-surface-repair
  cancel-in-progress: false

jobs:
  original_client_v66:
    name: "build-web.yml | V66 | Repair SDL surface crash"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "V66 | Checkout successful deployed V65"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1
          persist-credentials: true

      - name: "V66 | Protect original V65 graphics and music"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gowellsik-hue/game2"
          mkdir -p reports

          for file in \
            index.html \
            v65.html \
            lineage-v65.js \
            lineage-v65.wasm \
            lineage-v65.data \
            v65-811.png \
            v65-music0.mp3 \
            v45-paks.json \
            coi-serviceworker-v45.js; do
            test -s "published/$file" || {
              echo "Missing V65 file: $file"
              exit 1
            }
          done

          sha256sum \
            published/lineage-v65.js \
            published/lineage-v65.wasm \
            published/lineage-v65.data \
            published/v65-811.png \
            published/v65-music0.mp3 \
            published/coi-serviceworker-v45.js \
            > reports/V66-preserved-assets.sha256

          test "$(stat -c %s published/v65-music0.mp3)" -eq 1632319

          echo "V65 original WASM, data and music locked."

      - name: "V66 | Repair undefined SDL destination surfaces"
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v66-patch.py <<'PY'
          from pathlib import Path

          root=Path('published')
          source=(root/'lineage-v65.js').read_text(
              encoding='utf-8'
          )

          original="""    var srcData = SDL.surfaces[src];
              var dstData = SDL.surfaces[dst];
              var sr, dr;"""

          replacement=r"""    var srcData = SDL.surfaces[src];
              var dstData = SDL.surfaces[dst];

              // V66: validate both surfaces before accessing clipRect.
              // The native client can pass a surface that has already
              // disappeared from Emscripten's JavaScript SDL registry.
              if (!srcData || !dstData) {
                var requestedSrc = src;
                var requestedDst = dst;
                var originalWidth = -1;
                var originalHeight = -1;
                var recovered = false;

                var addr = dst >>> 0;
                var memory = GROWABLE_HEAP_U8();

                // Read dimensions only when the native surface
                // pointer is within WebAssembly linear memory.
                if (dst && Number.isInteger(dst) &&
                    addr > 0 && addr + 24 <= memory.length) {
                  var heap32 = GROWABLE_HEAP_I32();
                  originalWidth = heap32[(addr + 8) >> 2];
                  originalHeight = heap32[(addr + 12) >> 2];
                }

                var screenData = SDL.screen ?
                    SDL.surfaces[SDL.screen] : null;

                // When the lost destination is a full-sized
                // backbuffer, draw into the currently active
                // original SDL screen instead.
                if (srcData && !dstData && screenData &&
                    originalWidth === screenData.width &&
                    originalHeight === screenData.height) {
                  dst = SDL.screen;
                  dstData = screenData;
                  recovered = true;
                }

                SDL.v66SurfaceMismatchCount =
                    (SDL.v66SurfaceMismatchCount || 0) + 1;

                var count = SDL.v66SurfaceMismatchCount;

                // Report early occurrences and exponential
                // checkpoints without flooding mobile logs.
                if (count <= 8 ||
                    (count & (count - 1)) === 0) {
                  err(
                    "V66 SDL surface mismatch #" + count +
                    " src=" + requestedSrc +
                    " dst=" + requestedDst +
                    " screen=" + SDL.screen +
                    " srcValid=" + !!srcData +
                    " dstValid=" + !!dstData +
                    " nativeSize=" +
                    originalWidth + "x" + originalHeight +
                    " recovered=" + recovered
                  );
                }

                // Never pass an undefined surface into
                // clipRect, drawImage or SDL_LockSurface.
                // SDL's native convention is -1 on blit failure.
                if (!srcData || !dstData) {
                  return -1;
                }
              }

              var sr, dr;"""

          assert source.count(original)==1, \
              'Unexpected SDL.blitSurface implementation'

          patched=source.replace(
              original,replacement,1
          )

          # Deliberately preserve V65 binary references.
          # V66 is a JavaScript-only runtime repair.
          assert 'lineage-v65.wasm' in patched
          assert 'lineage-v65.data' in patched
          assert 'SDL.v66SurfaceMismatchCount' in patched

          (root/'lineage-v66.js').write_text(
              patched,encoding='utf-8'
          )

          page=(root/'v65.html').read_text(
              encoding='utf-8'
          )

          assert page.count('lineage-v65.js')>=2
          assert 'V65 Original Client Web Runtime' in page
          assert 'V65 (original music and graphics)' in page

          page=page.replace(
              'lineage-v65.js','lineage-v66.js'
          )
          page=page.replace(
              'V65 Original Client Web Runtime',
              'V66 Original Client Web Runtime'
          )
          page=page.replace(
              'V65 (original music and graphics)',
              'V66 (SDL surface repair)'
          )

          # Retain the original V65 loading image,
          # original MP3, controls and error logs.
          for name in [
              'v65-811.png',
              'v65-music0.mp3',
              'coi-serviceworker-v45.js',
              'v45-paks.json',
              'lineage-v66.js'
          ]:
              assert name in page,name

          (root/'v66.html').write_text(
              page,encoding='utf-8'
          )
          (root/'index.html').write_text(
              page,encoding='utf-8'
          )

          print('V66 SDL guard added.')
          print('V65 original graphics and music preserved.')
          print('V65 WASM and DATA are reused unchanged.')
          PY

          python3 /tmp/v66-patch.py
          node --check published/lineage-v66.js
          cmp published/index.html published/v66.html

          sha256sum -c reports/V66-preserved-assets.sha256

      - name: "V66 | Install real desktop and mobile browser tests"
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet \
            "playwright==1.56.0" \
            "pillow>=10,<13"

          python3 -m playwright install --with-deps chromium

      - name: "V66 | Test original SDL engine without fatal errors"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/site-root
          ln -s "$GITHUB_WORKSPACE/published" \
            reports/site-root/game2

          cat > /tmp/v66-server.py <<'PY'
          from functools import partial
          from http.server import (
              SimpleHTTPRequestHandler,
              ThreadingHTTPServer
          )
          from pathlib import Path

          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  for key,value in [
                      ('Cross-Origin-Opener-Policy','same-origin'),
                      ('Cross-Origin-Embedder-Policy','require-corp'),
                      ('Cross-Origin-Resource-Policy','same-origin')
                  ]:
                      self.send_header(key,value)
                  super().end_headers()

          root=Path('reports/site-root').resolve()

          ThreadingHTTPServer(
              ('127.0.0.1',8765),
              partial(Handler,directory=str(root))
          ).serve_forever()
          PY

          cat > /tmp/v66-test.py <<'PY'
          import asyncio
          import io
          import json
          from pathlib import Path

          from PIL import Image
          from playwright.async_api import async_playwright

          URL='http://127.0.0.1:8765/game2/v66.html'

          async def probe(browser,label,mobile):
              errors=[]
              result={'environment':label}

              options={
                  'viewport':(
                      {'width':393,'height':852}
                      if mobile
                      else {'width':1024,'height':768}
                  ),
                  'device_scale_factor':2 if mobile else 1,
                  'is_mobile':mobile,
                  'has_touch':mobile
              }

              context=await browser.new_context(**options)
              page=await context.new_page()

              page.on(
                  'pageerror',
                  lambda e:errors.append(str(e))
              )

              try:
                  await page.goto(
                      URL,wait_until='domcontentloaded'
                  )

                  await page.wait_for_function(
                      'crossOriginIsolated && '
                      'typeof SharedArrayBuffer==="function"',
                      timeout=30000
                  )

                  # Keep the client running long enough to
                  # detect delayed SDL surface failures.
                  await page.wait_for_timeout(85000)

                  result['state']=await page.locator(
                      '#state'
                  ).inner_text()

                  result['heading']=await page.locator(
                      '#head'
                  ).inner_text()

                  game_log=await page.locator(
                      '#logbox'
                  ).inner_text()

                  result['recent_log']=game_log[-12000:]
                  result['page_errors']=errors

                  screenshot=await page.locator(
                      '#canvas'
                  ).screenshot(
                      path='reports/V66-'+label+'-canvas.png'
                  )

                  image=Image.open(
                      io.BytesIO(screenshot)
                  ).convert('RGB').resize((128,96))

                  pixels=list(image.getdata())

                  ratio=sum(
                      max(pixel)>30 for pixel in pixels
                  )/len(pixels)

                  result['native_canvas_nonblack']=round(
                      ratio,4
                  )

                  result['engine_started']=(
                      'V65: event loop started' in game_log
                  )

                  result['original_png_loaded']=(
                      'V65: PNG 811=ok' in game_log
                  )

                  result['original_img_loaded']=(
                      'IMG 330=ok' in game_log
                  )

                  result['surface_diagnostics']=[
                      line
                      for line in game_log.splitlines()
                      if 'V66 SDL surface mismatch' in line
                  ][-20:]

                  result['fatal']=(
                      '클라이언트 실행 실패'
                      in result['heading']
                      or '실행 장애'
                      in result['state']
                      or any(
                          'Cannot read properties of undefined'
                          in error
                          for error in errors
                      )
                  )

                  # A fallback HTML image does NOT pass
                  # the native SDL canvas test.
                  result['passed']=(
                      result['engine_started']
                      and result['original_png_loaded']
                      and result['original_img_loaded']
                      and ratio>0.02
                      and not result['fatal']
                      and not errors
                  )

                  await page.screenshot(
                      path='reports/V66-'+label+'-page.png'
                  )

              except Exception as error:
                  result['test_exception']=str(error)
                  result['passed']=False

              finally:
                  await context.close()

              return result

          async def main():
              async with async_playwright() as playwright:
                  browser=await playwright.chromium.launch(
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-dev-shm-usage'
                      ]
                  )

                  try:
                      desktop,mobile=await asyncio.gather(
                          probe(browser,'desktop',False),
                          probe(browser,'mobile',True)
                      )
                  finally:
                      await browser.close()

              results={
                  'version':'V66',
                  'desktop':desktop,
                  'mobile':mobile,
                  'passed':(
                      desktop.get('passed',False)
                      and mobile.get('passed',False)
                  )
              }

              Path('reports/V66-browser.json').write_text(
                  json.dumps(
                      results,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              for entry in [desktop,mobile]:
                  print('Environment:',
                        entry['environment'],flush=True)
                  print('Native canvas:',
                        entry.get(
                            'native_canvas_nonblack'
                        ),flush=True)
                  print('SDL surface diagnostics:',
                        entry.get(
                            'surface_diagnostics'
                        ),flush=True)
                  print('Fatal:',entry.get('fatal'),flush=True)
                  print('Passed:',entry.get('passed'),flush=True)
                  print('Browser errors:',
                        entry.get('page_errors'),flush=True)
                  print('Exception:',
                        entry.get('test_exception'),flush=True)
                  print('Recent log:',
                        entry.get('recent_log','')[-2500:],
                        flush=True)

              if not results['passed']:
                  raise SystemExit(
                      'V66 SDL test failed; public deployment blocked'
                  )

          asyncio.run(main())
          PY

          python3 -m py_compile /tmp/v66-test.py

          python3 /tmp/v66-server.py \
            > reports/V66-http.txt 2>&1 &

          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              http://127.0.0.1:8765/game2/v66.html; then
              break
            fi
            sleep 1
          done

          python3 /tmp/v66-test.py

      - name: "V66 | Upload actual mobile and desktop diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V66-SDL-Surface-Repair
          path: |
            reports/V66-browser.json
            reports/V66-desktop-canvas.png
            reports/V66-desktop-page.png
            reports/V66-mobile-canvas.png
            reports/V66-mobile-page.png
            reports/V66-http.txt
            reports/V66-preserved-assets.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: "V66 | Deploy only after real SDL rendering survives"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open('reports/V66-browser.json') as f:
              report=json.load(f)

          assert report['passed']
          assert report['desktop']['passed']
          assert report['mobile']['passed']
          assert report['desktop']['native_canvas_nonblack']>0.02
          assert report['mobile']['native_canvas_nonblack']>0.02

          print('V66 native SDL desktop and mobile checks passed.')
          PY

          sha256sum -c reports/V66-preserved-assets.sha256

          git -C published add -- \
            index.html \
            v66.html \
            lineage-v66.js

          git -C published config user.name \
            'github-actions[bot]'

          git -C published config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V66: repair SDL invalid surface crash'

            git -C published push origin HEAD:gh-pages
          fi

      - name: "V66 | Report exact verification status"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V66 | Sanctuary game2 GitHub Pages'
            echo
            echo 'V65 WebAssembly and game resource data remain unchanged.'
            echo 'Original music0.mp3 remains unchanged.'
            echo 'Repairs undefined SDL source and destination surface references.'
            echo 'Attempts screen-surface recovery only when original dimensions match.'
            echo 'Otherwise returns an SDL blit error without crashing JavaScript.'
            echo 'Desktop and mobile must both show genuine SDL canvas pixels.'
            echo 'The original HTML image fallback is not counted as engine success.'
          } >> "$GITHUB_STEP_SUMMARY"
