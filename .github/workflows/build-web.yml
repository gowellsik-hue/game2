# FILE: .github/workflows/build-web.yml
# VERSION: V92
# V91 failed because nested bootstrap overwrote /tmp/v91-stages.py.
# Keep a separate outer V90 dispatcher for the real runner preflight.
# Preserve previous verified original SPR archive extraction and gating.
name: "build-web.yml | V92 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V92 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v92-native-player
  cancel-in-progress: false

jobs:
  original_client_v92:
    name: "build-web.yml | V92 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V92 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V92 | Preserve previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V92 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V92 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V92 | Restore V90 stage definitions with separate runner dispatcher"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports /tmp/v92
          cat > /tmp/v92-loader.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          import yaml

          PIN='9e78c0bc899fb3c30d24634294e1324a8b1e565c'
          raw=subprocess.check_output(
              ['git','show',PIN+':.github/workflows/build-web.yml'],text=True
          )
          previous=yaml.safe_load(raw)
          assert previous['name']=='build-web.yml | V90 | Sanctuary game2 GitHub Pages'
          original={s['name']:s['run'] for s in
              previous['jobs']['original_client_v90']['steps'] if 'run' in s}
          stages={
              'prepare':'V90 | Recover verified V89 stage scripts',
              'bootstrap':'V90 | Generate original stage executor',
              'restore':'V90 | Restore source map and SDL pipeline',
              'sprites':'V90 | Prepare genuine male knight SPR extraction',
              'wire':'V90 | Create native actor implementation',
              'separate':'V90 | Separate offline initialization from actor injection',
              'runner':'V90 | Precompile actual generated native runner before resource download',
              'build':'V90 | Extract real SPR and map and compile native client',
              'smoke':'V90 | Verify real SPR pixels and directional movement',
              'preserve':'V90 | Save generated sources and failure logs',
              'publish':'V90 | Publish only after authentic player tests pass',
              'report':'V90 | Record verified scope',
          }
          assert len(stages)==len(set(stages.values()))
          assert all(name in original for name in stages.values())
          root=Path('/tmp/v92')
          for stage,title in stages.items():
              source=original[title].replace('V90','V92').replace('v90','v92')
              if stage=='prepare':
                  old="if phase=='preflight':"
                  assert source.count(old)==1,('V90 dispatcher',source.count(old))
                  source=source.replace(old,"if phase=='check':",1)
                  old='python3 -u /tmp/v92-stages.py preflight'
                  assert source.count(old)==1,('Initial check command',source.count(old))
                  source=source.replace(old,'python3 -u /tmp/v92-stages.py check',1)
                  assert "if stage=='preflight':" in source
              if stage=='runner':
                  # /tmp/v92-stages.py is overwritten by the nested V89 bootstrap.
                  # The saved outer dispatcher alone knows V89's real 'preflight'.
                  old='python3 -u /tmp/v92-stages.py preflight'
                  assert source.count(old)==1,('Real runner command',source.count(old))
                  source=source.replace(
                      old,'python3 -u /tmp/v92-outer-stages.py preflight',1
                  )
              matches=list(re.finditer(
                  r"(?ms)^(?:cat >|cat >>) (/tmp/[\w-]+\.py) <<'PY'\n(.*?)\nPY$",
                  source
              ))
              for match in matches:
                  ast.parse(match.group(2),filename=match.group(1))
              path=root/(stage+'.sh')
              path.write_text(source,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
              print('V92 verified:',stage,'Python:',len(matches),flush=True)
          print('V92: saved outer executor will perform real preflight.',flush=True)
          PY
          python3 -m py_compile /tmp/v92-loader.py
          python3 -u /tmp/v92-loader.py 2>&1 | tee reports/V92-loader.log
          test -s /tmp/v92/runner.sh
          test -s /tmp/v92/prepare.sh
          grep -Fq '/tmp/v92-outer-stages.py preflight' /tmp/v92/runner.sh

      - name: "V92 | Preserve outer dispatcher before nested bootstrap overwrites it"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/prepare.sh 2>&1 | tee reports/V92-prepare.log
          test -s /tmp/v92-stages.py
          grep -Fq "if phase=='check':" /tmp/v92-stages.py
          grep -Fq "'preflight':'V89 | Fix native hook" /tmp/v92-stages.py
          cp /tmp/v92-stages.py /tmp/v92-outer-stages.py
          python3 -m py_compile /tmp/v92-outer-stages.py
          bash /tmp/v92/bootstrap.sh 2>&1 | tee reports/V92-bootstrap.log
          test -s /tmp/v92-execute.py
          test -s /tmp/v92-outer-stages.py
          python3 -m py_compile /tmp/v92-execute.py

      - name: "V92 | Restore original map and SDL build scripts"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/restore.sh 2>&1 | tee reports/V92-restore.log
          test -s /tmp/v92-extract.sh
          test -s /tmp/v92-build.sh

      - name: "V92 | Prepare original male knight SPR resources"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/sprites.sh 2>&1 | tee reports/V92-sprites.log
          test -s /tmp/v92-extract.sh

      - name: "V92 | Wire original C++ actor and keyboard movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/wire.sh 2>&1 | tee reports/V92-wiring.log
          test -s /tmp/v92-native.py

      - name: "V92 | Separate offline entry from native actor patch"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/separate.sh 2>&1 | tee reports/V92-separation.log
          test -s /tmp/v92-actor.py
          test ! -e /tmp/v92-native.py
          grep -Fq '/tmp/v92-actor.py' /tmp/v92-build.sh

      - name: "V92 | Run actual final Python generator before archive downloads"
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/v92-outer-stages.py
          bash /tmp/v92/runner.sh 2>&1 | tee reports/V92-runner-preflight.log
          test -s /tmp/v92-run.py
          test -s /tmp/v92-actor.py
          python3 -m py_compile /tmp/v92-run.py /tmp/v92-actor.py
          grep -Fq 'final generated Python syntax passed' reports/V92-runner-preflight.log
          echo 'V92: real generated runner syntax verified.'

      - name: "V92 | Extract authentic map and SPR then build native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v92/build.sh 2>&1 | tee reports/V92-build-and-browser.log

      - name: "V92 | Require actual SPR pixels and player movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/smoke.sh 2>&1 | tee reports/V92-native-player-test.log

      - name: "V92 | Save all generated build scripts"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v92/preserve.sh; then
            bash /tmp/v92/preserve.sh
          fi
          mkdir -p reports
          for file in /tmp/v92-stages.py /tmp/v92-outer-stages.py /tmp/v92-loader.py; do
            if test -s "$file"; then
              cp "$file" "reports/V92-generated-$(basename "$file")"
            fi
          done

      - name: "V92 | Upload diagnostics regardless of outcome"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V92-Native-Player
          path: |
            reports/V92-*.log
            reports/V92-*.json
            reports/V92-*.png
            reports/V92-*.txt
            reports/V92-generated-*
            assets/v92/v92-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V92 | Publish only verified original sprite and movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v92/publish.sh 2>&1 | tee reports/V92-deploy.log

      - name: "V92 | Report actual validation scope"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v92/report.sh; then
            bash /tmp/v92/report.sh
          fi
          {
            echo 'V91 failed because the nested bootstrap overwrote the outer stage dispatcher.'
            echo 'V92 preserves the outer V90 dispatcher for the real Python runner preflight.'
            echo 'Original Sanctuary Sprite.pak male knight resource extraction succeeded in V89.'
            echo 'Original SDL sprite pixels and keyboard movement remain required for deployment.'
            echo 'Unverified: full native compilation, authentic original character animation and collision.'
          } >> "$GITHUB_STEP_SUMMARY"
