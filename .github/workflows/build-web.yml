              character.stats.join(' ')+'\n';

            document.getElementById('v67Menu').hidden=true;
            document.getElementById('v65Original').style.display='none';

            status(
              character.name+' · 원본 오프라인 게임 화면 초기화'
            );

            startEngine();
          }
