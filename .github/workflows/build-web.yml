
name: "build-web.yml | V29 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V29 | Original Sanctuary engine runtime test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read

concurrency:
  group: build-web-yml-v29-original-engine
  cancel-in-progress: false

jobs:
  original_engine_v29:
    name: "build-web.yml | V29 | Run ORIGINAL Lineage client, no HTML replacement"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V29 | Checkout game2"
        uses: actions/checkout@v4

      - name: "V29 | Download original Sanctuary archive (46 volumes)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gowellsik-hue/game2'
          mkdir -p original native reports
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.*' -D original --clobber
          test "$(find original -maxdepth 1 -type f | wc -l)" -eq 46
          for i in $(seq -w 1 45); do
            test -s "original/Sanctuary.of.Aden.-.Copy.z${i}"
          done
          test -s original/Sanctuary.of.Aden.-.Copy.zip

      - name: "V29 | Restore ORIGINAL Windows client and startup assets"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full file binutils
          archive='original/Sanctuary.of.Aden.-.Copy.zip'
          7z l -slt "$archive" > reports/V29-original-archive-list.txt
          7z x "$archive" -onative -y -r \
            '-ir!*.exe' '-ir!*.dll' '-ir!*.ocx' \
            '-ir!*.ini' '-ir!*.cfg' '-ir!*.config' \
            '-ir!*.manifest' '-ir!*.xml' '-ir!*.idx' \
            '-ir!*.des' '-ir!*.ttf' '-ir!*.fnt' \
            > reports/V29-binaries-extract.log
          7z x "$archive" -onative -y \
            'Sanctuary of Aden - Copy/Sprite.pak' \
            'Sanctuary of Aden - Copy/Tile.pak' \
            'Sanctuary of Aden - Copy/Text.pak' \
            'Sanctuary of Aden - Copy/launcher.Pak' \
            > reports/V29-base-assets-extract.log
          root='native/Sanctuary of Aden - Copy'
          for exe in Lineage.exe Login.exe Launcher.exe Redemption.exe; do
            test -s "$root/$exe"
            file "$root/$exe" | tee -a reports/V29-original-binary-types.txt
            objdump -p "$root/$exe" 2>/dev/null \
              | grep -E 'DLL Name:|Subsystem' \
              >> reports/V29-original-imports.txt || true
          done
          for f in Sprite.pak Tile.pak Text.pak Sprite.idx Tile.idx; do
            test -s "$root/$f"
          done
          du -sh native > reports/V29-extracted-size.txt
          df -h . > reports/V29-free-space-before-wine.txt
          rm -rf original

      - name: "V29 | Run REAL Lineage.exe, Login.exe and Launcher.exe under Wine"
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            wine wine64 wine32:i386 xvfb x11-utils imagemagick
          export DISPLAY=:99
          export WINEARCH=win32
          export WINEPREFIX="$RUNNER_TEMP/v29-original-wine"
          export WINEDEBUG=+loaddll
          mkdir -p "$WINEPREFIX"
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp \
            > reports/V29-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'wineserver -k >/dev/null 2>&1 || true; kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 3
          timeout --kill-after=5s 60s wineboot --init \
            > reports/V29-wineboot.log 2>&1 || true
          root="$PWD/native/Sanctuary of Aden - Copy"
          test -d "$root"
          for exe in Lineage.exe Login.exe Launcher.exe; do
            label="${exe%.exe}"
            echo "V29: inspecting ORIGINAL ${exe}"
            (
              cd "$root"
              timeout --kill-after=5s 40s wine "./$exe"
            ) > "reports/V29-${label}-wine.log" 2>&1 &
            pid=$!
            sleep 15
            alive=no
            if kill -0 "$pid" 2>/dev/null; then alive=yes; fi
            ps -eo pid,ppid,comm,args > "reports/V29-${label}-processes.txt"
            xwininfo -root -tree > "reports/V29-${label}-windows.txt" 2>&1 || true
            import -window root "reports/V29-${label}-screen.png" \
              > "reports/V29-${label}-screenshot.log" 2>&1 || true
            if test ! -s "reports/V29-${label}-screen.png"; then
              echo 'SCREENSHOT_CAPTURE_FAILED' \
                >> "reports/V29-${label}-screenshot.log"
            fi
            echo "original_executable=${exe}" \
              > "reports/V29-${label}-observed.txt"
            echo 'observation_seconds=15' \
              >> "reports/V29-${label}-observed.txt"
            echo "process_alive_at_capture=${alive}" \
              >> "reports/V29-${label}-observed.txt"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            wineserver -k >/dev/null 2>&1 || true
          done

      - name: "V29 | Report exact test limits (native is NOT browser)"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REPORT'
          from pathlib import Path
          root=Path('reports')
          summary=[
            '# build-web.yml | V29 | ORIGINAL engine runtime evidence',
            '',
            'V28 selected eat.exe by mistake; V29 explicitly targets the original client.',
            '',
            '| Executable | Process alive at 15 s | Screenshot |',
            '|---|---|---|',
          ]
          for label in ('Lineage','Login','Launcher'):
              observation=root/f'V29-{label}-observed.txt'
              details={}
              if observation.exists():
                  for s in observation.read_text().splitlines():
                      if '=' in s:
                          k,v=s.split('=',1);details[k]=v
              pic=root/f'V29-{label}-screen.png'
              captured=pic.is_file() and pic.stat().st_size>0
              summary.append(f'| {label}.exe | {details.get("process_alive_at_capture","not tested")} | {"captured" if captured else "not captured"} |')
          summary += [
            '',
            '**This test DOES NOT prove original browser execution, gameplay,',
            'correct rendering, successful authentication, or server availability.**',
            '',
            'Original game logic was not replaced or reimplemented.',
            'The original program is 32-bit Windows PE; direct GitHub Pages',
            'execution is not supported without a compatible runtime/port.',
            'Some original assets (e.g. maps and audio) are intentionally',
            'excluded in this startup smoke test. A failed login or map load',
            'cannot be used alone to reject the original engine.',
          ]
          result='\n'.join(summary)+'\n'
          (root/'V29-summary.md').write_text(result,encoding='utf-8')
          print(result)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(result)
          PY_REPORT

      - name: "V29 | Upload original native runtime screenshots and logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Engine-V29-Runtime-Evidence
          path: reports/
          retention-days: 90
          if-no-files-found: error
