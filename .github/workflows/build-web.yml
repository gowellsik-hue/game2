# FILE: .github/workflows/build-web.yml
# VERSION: V97
# V96 built WebAssembly and started the browser, but the genuine sprite loader
# trapped when placing the real male knight in the map.
# Preserve V96 build and renderer; instrument original SPR decoding without
# substituting placeholders or suppressing runtime failures.
name: "build-web.yml | V97 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V97 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v97-native-player
  cancel-in-progress: false

jobs:
  original_client_v97:
    name: "build-web.yml | V97 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V97 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V97 | Preserve previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V97 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V97 | Set up Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V97 | Restore V90 stage definitions with separate runner dispatcher"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports /tmp/v97
          cat > /tmp/v97-loader.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          import yaml

          PIN='9e78c0bc899fb3c30d24634294e1324a8b1e565c'
          raw=subprocess.check_output(
              ['git','show',PIN+':.github/workflows/build-web.yml'],text=True
          )
          previous=yaml.safe_load(raw)
          assert previous['name']=='build-web.yml | V90 | Sanctuary game2 GitHub Pages'
          original={s['name']:s['run'] for s in
              previous['jobs']['original_client_v90']['steps'] if 'run' in s}
          stages={
              'prepare':'V90 | Recover verified V89 stage scripts',
              'bootstrap':'V90 | Generate original stage executor',
              'restore':'V90 | Restore source map and SDL pipeline',
              'sprites':'V90 | Prepare genuine male knight SPR extraction',
              'wire':'V90 | Create native actor implementation',
              'separate':'V90 | Separate offline initialization from actor injection',
              'runner':'V90 | Precompile actual generated native runner before resource download',
              'build':'V90 | Extract real SPR and map and compile native client',
              'smoke':'V90 | Verify real SPR pixels and directional movement',
              'preserve':'V90 | Save generated sources and failure logs',
              'publish':'V90 | Publish only after authentic player tests pass',
              'report':'V90 | Record verified scope',
          }
          assert len(stages)==len(set(stages.values()))
          assert all(name in original for name in stages.values())
          root=Path('/tmp/v97')
          for stage,title in stages.items():
              source=original[title].replace('V90','V97').replace('v90','v97')
              if stage=='prepare':
                  old="if phase=='preflight':"
                  assert source.count(old)==1,('V90 dispatcher',source.count(old))
                  source=source.replace(old,"if phase=='check':",1)
                  old='python3 -u /tmp/v97-stages.py preflight'
                  assert source.count(old)==1,('Initial check command',source.count(old))
                  source=source.replace(old,'python3 -u /tmp/v97-stages.py check',1)
                  assert "if stage=='preflight':" in source
              if stage=='runner':
                  # /tmp/v97-stages.py is overwritten by the nested V89 bootstrap.
                  # The saved outer dispatcher alone knows V89's real 'preflight'.
                  old='python3 -u /tmp/v97-stages.py preflight'
                  assert source.count(old)==1,('Real runner command',source.count(old))
                  source=source.replace(
                      old,'python3 -u /tmp/v97-outer-stages.py preflight',1
                  )
              matches=list(re.finditer(
                  r"(?ms)^(?:cat >|cat >>) (/tmp/[\w-]+\.py) <<'PY'\n(.*?)\nPY$",
                  source
              ))
              for match in matches:
                  ast.parse(match.group(2),filename=match.group(1))
              path=root/(stage+'.sh')
              path.write_text(source,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
              print('V97 verified:',stage,'Python:',len(matches),flush=True)
          print('V97: saved outer executor will perform real preflight.',flush=True)
          PY
          python3 -m py_compile /tmp/v97-loader.py
          python3 -u /tmp/v97-loader.py 2>&1 | tee reports/V97-loader.log
          test -s /tmp/v97/runner.sh
          test -s /tmp/v97/prepare.sh
          grep -Fq '/tmp/v97-outer-stages.py preflight' /tmp/v97/runner.sh

      - name: "V97 | Preserve outer dispatcher before nested bootstrap overwrites it"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/prepare.sh 2>&1 | tee reports/V97-prepare.log
          test -s /tmp/v97-stages.py
          grep -Fq "if phase=='check':" /tmp/v97-stages.py
          grep -Fq "'preflight':'V89 | Fix native hook" /tmp/v97-stages.py
          cp /tmp/v97-stages.py /tmp/v97-outer-stages.py
          python3 -m py_compile /tmp/v97-outer-stages.py
          bash /tmp/v97/bootstrap.sh 2>&1 | tee reports/V97-bootstrap.log
          test -s /tmp/v97-execute.py
          test -s /tmp/v97-outer-stages.py
          python3 -m py_compile /tmp/v97-execute.py

      - name: "V97 | Restore original map and SDL build scripts"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/restore.sh 2>&1 | tee reports/V97-restore.log
          test -s /tmp/v97-extract.sh
          test -s /tmp/v97-build.sh

      - name: "V97 | Prepare original male knight SPR resources"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/sprites.sh 2>&1 | tee reports/V97-sprites.log
          test -s /tmp/v97-extract.sh

      - name: "V97 | Repair original ZIP central records before SPR lookup"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v97-zip-repair.py <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path

          path=Path('/tmp/v97-extract.sh')
          assert path.is_file(), 'Original archive extractor was not generated'
          source=path.read_text(encoding='utf-8')

          # Preserve ZIP records independently from tile index bytes.
          anchor='assert len(records)==nitems,(len(records),nitems)'
          assert source.count(anchor)==1
          source=source.replace(anchor,anchor+'\nzip_records=tuple(records)',1)

          lookup=(
              r"r for r in records(?=\n[ \t]*if r\['name'\]"
              r"\.lower\(\)\.endswith\()"
          )
          matches=list(re.finditer(lookup,source))
          assert len(matches)==1
          source=re.sub(lookup,'r for r in zip_records',source,count=1)

          assert source.index('zip_records=tuple(records)') < source.index('compact=bytearray()')
          assert source.count('r for r in zip_records')==1
          assert source.count("bank='Sprite'")==1
          assert source.count('sources=extract_selected(source_bank,needed)')==1

          m=re.search(
              r"(?ms)^cat > /tmp/v97-extract\.py <<'PY'\n(.*?)\nPY$",
              source
          )
          assert m
          ast.parse(m.group(1),filename='/tmp/v97-extract.py')
          path.write_text(source,encoding='utf-8')
          subprocess.run(['bash','-n',str(path)],check=True)

          records=[{'name':'Original/Sprite.pak'}]
          zip_records=tuple(records)
          records=[b'packed tile index bytes']
          assert isinstance(records[0],bytes)
          assert next(r for r in zip_records if r['name'].endswith('Sprite.pak'))
          print('V97: original ZIP records preserved for SPR lookup.',flush=True)
          PY
          python3 -m py_compile /tmp/v97-zip-repair.py
          python3 -u /tmp/v97-zip-repair.py \
            2>&1 | tee reports/V97-zip-repair.log
          test -s /tmp/v97-extract.sh

      - name: "V97 | Wire original C++ actor and keyboard movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/wire.sh 2>&1 | tee reports/V97-wiring.log
          test -s /tmp/v97-native.py

      - name: "V97 | Separate offline entry from native actor patch"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/separate.sh 2>&1 | tee reports/V97-separation.log
          test -s /tmp/v97-actor.py
          test ! -e /tmp/v97-native.py
          grep -Fq '/tmp/v97-actor.py' /tmp/v97-build.sh

      - name: "V97 | Fix original C++ sprite_data shadowing before native build"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v97-fix-actor.py <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          actor=Path('/tmp/v97-actor.py')
          assert actor.is_file()
          code=actor.read_text(encoding='utf-8')
          before='sprite_data.override(v97actor,v97def);'
          after='this->sprite_data.override(v97actor,v97def);'
          assert code.count(before)==1
          code=code.replace(before,after,1)
          assert code.count(after)==1

          ast.parse(code,filename=str(actor))
          actor.write_text(code,encoding='utf-8')
          subprocess.run(['python3','-m','py_compile',str(actor)],check=True)

          header=Path('upstream-l1j/src/sdl_user.h').read_text(encoding='utf-8')
          cpp=Path('upstream-l1j/src/sdl_user.cpp').read_text(encoding='utf-8')
          assert 'server_resource<sprite_definition> sprite_data;' in header
          assert 'unsigned char *sprite_data;' in cpp
          print('V97: original C++ sprite resource member access verified.',flush=True)
          PY
          python3 -m py_compile /tmp/v97-fix-actor.py
          python3 -u /tmp/v97-fix-actor.py 2>&1 | tee reports/V97-fix-actor.log

      - name: "V97 | Instrument native original SPR loader before compiling"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v97-spr-diagnostics.py <<'PY'
          from pathlib import Path
          import subprocess

          path=Path('upstream-l1j/src/widgets/sprite_motion.cpp')
          source=path.read_text(encoding='utf-8')
          start=source.index('void sprite_motion::load(int x, int y, char *filename, sdl_user *loader)')
          finish=source.index('\n//arg2 + frames[frame_num]',start)
          code=source[start:finish]

          def replace_one(old,new):
              global code
              assert code.count(old)==1,('Original SPR decoder anchor',old,code.count(old))
              code=code.replace(old,new,1)

          replace_one(
              '\twhile (SDL_mutexP(delay_mtx) == -1) {};',
              r'''printf("V97_SPR stage=enter file=%s\n",filename);
              fflush(stdout);
              while (SDL_mutexP(delay_mtx) == -1) {};'''
          )

          replace_one(
              '\tif (data == 0)\n\t\tdata = (char*)loader->getfiles->load_file(filename, &size, FILE_SPRITEPACK, 0);',
              r'''printf("V97_SPR stage=checked_split file=%s found=%d\n",filename,data?1:0);
              fflush(stdout);
              if (data == 0)
                  data = (char*)loader->getfiles->load_file(filename, &size, FILE_SPRITEPACK, 0);
              printf("V97_SPR stage=checked_base file=%s found=%d\n",filename,data?1:0);
              fflush(stdout);'''
          )

          replace_one(
              '\tSDL_RWops *file = SDL_RWFromMem(data, size);',
              r'''if (size<8) {
                  printf("V97_SPR_FATAL stage=invalid_length file=%s bytes=%d\n",filename,size);
                  fflush(stdout);
                  SDL_mutexV(delay_mtx);
                  throw "V97 genuine SPR file length invalid";
              }
              printf("V97_SPR stage=loaded file=%s bytes=%d header=%02x,%02x,%02x,%02x,%02x\n",
                     filename,size,(unsigned char)data[0],(unsigned char)data[1],
                     (unsigned char)data[2],(unsigned char)data[3],(unsigned char)data[4]);
              fflush(stdout);

              SDL_RWops *file = SDL_RWFromMem(data, size);
              printf("V97_SPR stage=rwops file=%s allocated=%d seek=%d read=%d close=%d\n",
                     filename,file?1:0,file&&file->seek?1:0,
                     file&&file->read?1:0,file&&file->close?1:0);
              fflush(stdout);

              if (!file || !file->seek || !file->read || !file->close) {
                  printf("V97_SPR_FATAL stage=missing_rwops_callbacks file=%s\n",filename);
                  fflush(stdout);
                  SDL_mutexV(delay_mtx);
                  throw "V97 genuine SPR SDL reader has missing callbacks";
              }'''
          )

          replace_one(
              '\tSDL_RWread(file, &mystery1, 1, 1);\n\t\n\tif (mystery1 < 0)',
              r'''printf("V97_SPR stage=before_first_read file=%s\n",filename);
              fflush(stdout);
              SDL_RWread(file, &mystery1, 1, 1);
              printf("V97_SPR stage=after_first_read file=%s byte=%d\n",filename,(int)mystery1);
              fflush(stdout);
              if (mystery1 < 0)'''
          )

          replace_one(
              '\tnum_frames = mystery1;',
              r'''num_frames = mystery1;
              printf("V97_SPR stage=frame_count file=%s frames=%d\n",filename,num_frames);
              fflush(stdout);'''
          )

          replace_one(
              '\tSDL_RWread(file, &num_tiles, 4, 1);',
              r'''printf("V97_SPR stage=before_tile_count file=%s\n",filename);
              fflush(stdout);
              SDL_RWread(file, &num_tiles, 4, 1);
              printf("V97_SPR stage=after_tile_count file=%s raw=%d\n",filename,num_tiles);
              fflush(stdout);'''
          )

          source=source[:start]+code+source[finish:]
          path.write_text(source,encoding='utf-8')
          print('V97: native original SPR reader instrumentation installed.',flush=True)
          PY

          python3 -m py_compile /tmp/v97-spr-diagnostics.py

          python3 - <<'PY'
          from pathlib import Path
          import ast

          actor=Path('/tmp/v97-actor.py')
          assert actor.is_file()
          source=actor.read_text(encoding='utf-8')

          marker="subprocess.run(['python3','/tmp/v97-spr-diagnostics.py'],check=True)"
          assert marker not in source
          source += '\nimport subprocess\n'+marker+'\n'

          ast.parse(source,filename=str(actor))
          actor.write_text(source,encoding='utf-8')
          print('V97: native SPR probes attached before C++ compilation.',flush=True)
          PY

          python3 -m py_compile /tmp/v97-actor.py
          grep -Fq '/tmp/v97-spr-diagnostics.py' /tmp/v97-actor.py

      - name: "V97 | Accept two SDL tile compositor anchors in the generated bridge"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v97-fix-compositor.py <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          bridge=Path('/tmp/v97-sdl-bridge.py')
          assert bridge.is_file()
          code=bridge.read_text(encoding='utf-8')

          check="assert part.count(needle)==1,("
          fixed="assert part.count(needle) in (1,2),("
          assert code.count(check)==1
          assert code.count("'Original tile compositor missing'")==1
          assert code.count("part=part.replace(needle,native+needle,1)")==1
          assert code.count("needle='if (srcData.width===24 && srcData.height===24 &&'")==1

          code=code.replace(check,fixed,1)
          ast.parse(code,filename=str(bridge))
          bridge.write_text(code,encoding='utf-8')
          subprocess.run(['python3','-m','py_compile',str(bridge)],check=True)
          print('V97: original SDL tile compositor hook preserved.',flush=True)
          PY

          python3 -m py_compile /tmp/v97-fix-compositor.py
          python3 -u /tmp/v97-fix-compositor.py \
            2>&1 | tee reports/V97-compositor-fix.log
          test -s /tmp/v97-sdl-bridge.py

      - name: "V97 | Run actual final Python generator before archive downloads"
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/v97-outer-stages.py
          bash /tmp/v97/runner.sh 2>&1 | tee reports/V97-runner-preflight.log
          test -s /tmp/v97-run.py
          test -s /tmp/v97-actor.py
          python3 -m py_compile /tmp/v97-run.py /tmp/v97-actor.py
          grep -Fq 'final generated Python syntax passed' reports/V97-runner-preflight.log
          echo 'V97: final native runner syntax verified.'

      - name: "V97 | Extract authentic map and SPR then build native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v97/build.sh 2>&1 | tee reports/V97-build-and-browser.log

      - name: "V97 | Require actual SPR pixels and player movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/smoke.sh 2>&1 | tee reports/V97-native-player-test.log

      - name: "V97 | Save all generated build scripts"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v97/preserve.sh; then
            bash /tmp/v97/preserve.sh
          fi
          mkdir -p reports
          for file in /tmp/v97-stages.py /tmp/v97-outer-stages.py \
                      /tmp/v97-loader.py /tmp/v97-zip-repair.py \
                      /tmp/v97-extract.sh /tmp/v97-extract.py \
                      /tmp/v97-actor.py /tmp/v97-fix-actor.py \
                      /tmp/v97-sdl-bridge.py /tmp/v97-fix-compositor.py \
                      /tmp/v97-spr-diagnostics.py \
                      /tmp/v97-run.py /tmp/v97-build.sh; do
            if test -s "$file"; then
              cp "$file" "reports/V97-generated-$(basename "$file")"
            fi
          done

      - name: "V97 | Upload diagnostics regardless of outcome"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V97-Native-Player
          path: |
            reports/V97-*.log
            reports/V97-*.json
            reports/V97-*.png
            reports/V97-*.txt
            reports/V97-generated-*
            assets/v97/v97-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V97 | Publish only verified original sprite and movement"
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v97/publish.sh 2>&1 | tee reports/V97-deploy.log

      - name: "V97 | Report actual validation scope"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/v97/report.sh; then
            bash /tmp/v97/report.sh
          fi
          {
            echo 'V96 reached the browser and failed inside sprite_motion::load.'
            echo 'V97 records original SPR file lookup, data length, SDL reader state and frame decoding.'
            echo 'No replacement actor, fabricated image or runtime-error bypass was added.'
            echo 'Original SPR rendering and directional movement remain required for deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
