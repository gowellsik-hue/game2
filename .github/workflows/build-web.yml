      - name: "V100 | Repair mobile directional button keyboard events"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v100-mobile-input.py <<'PY'
          from pathlib import Path
          import re,subprocess

          old=("function keyEvent(key,type){const code=key==='Escape'?'Escape':"
               "key==='Enter'?'Enter':key;const ev=new KeyboardEvent(type,{key,code,"
               "bubbles:true,cancelable:true});window.dispatchEvent(ev);"
               "document.dispatchEvent(ev);canvas.dispatchEvent(ev);}")
          new=r'''function keyEvent(key,type){
            const keyCodes={ArrowUp:38,ArrowRight:39,ArrowDown:40,
                            ArrowLeft:37,Escape:27,Enter:13};
            const ev=new KeyboardEvent(type,{key,code:key,
                                          bubbles:true,cancelable:true});
            // Synthetic mobile controls must carry the DOM keyCode that the
            // actual Emscripten SDL keyboard mapper consumes.
            Object.defineProperty(ev,'keyCode',{value:keyCodes[key]||0});
            Object.defineProperty(ev,'which',{value:keyCodes[key]||0});
            // Dispatch once; bubbling reaches the original SDL document handler.
            canvas.dispatchEvent(ev);
          }'''
          for name in ('index.html','v100.html'):
              path=Path('published')/name
              html=path.read_text(encoding='utf-8')
              assert html.count(old)==1,('mobile keyboard wiring',name,html.count(old))
              html=html.replace(old,new,1)
              path.write_text(html,encoding='utf-8')
              m=re.search(r'(?s)<script>\s*(.*?)\s*</script>',html)
              assert m,('inline JS',name)
              temp=Path('/tmp/v100-'+name+'.js')
              temp.write_text(m.group(1),encoding='utf-8')
              subprocess.run(['node','--check',str(temp)],check=True)
          print('V100: mobile arrow buttons emit genuine single SDL keyboard events.',flush=True)
          PY
          python3 -m py_compile /tmp/v100-mobile-input.py
          python3 /tmp/v100-mobile-input.py 2>&1 | tee reports/V100-mobile-input.log

