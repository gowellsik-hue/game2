
name: "build-web.yml | V49 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V49 | Original Windows client legacy-clock bypass test"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v49-original-client
  cancel-in-progress: false

jobs:
  original_windows_client_browser_v49:
    name: "build-web.yml | V49 | Automatically run deployed original client"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: "V49 | Checkout existing game2 gh-pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          persist-credentials: false

      - name: "V49 | Use the already-built V48 Windows client"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports site
          for file in index.html Lineage-launcher.html boxedwine.html boxedwine.js \
            boxedwine.wasm boxedwine.css boxedwine-shell.js boxedwine.zip sanctuary-boot.zip; do
            test -s "published/v48/$file" || {
              echo "Missing deployed V48 file: $file" >&2
              exit 1
            }
          done
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary | Original Windows Client V48</title>
          <meta http-equiv="refresh" content="0;url=./v48/">
          </head><body>
          <p>Sanctuary V48 원본 Windows 실행 화면으로 이동합니다.</p>
          <a href="./v48/">원본 게임 실행 화면</a>
          </body></html>
          HTML
          touch site/.nojekyll
          echo 'V49 uses the exact V48 original Windows emulator and EXE release files.' > reports/V49-input.txt
          sha256sum published/v48/boxedwine.wasm published/v48/sanctuary-boot.zip >> reports/V49-input.txt

      - name: "V49 | Set up Python for browser execution"
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "V49 | Install Chromium for automatic browser execution"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium

      - name: "V49 | Launch original lin.bin and Lineage.exe automatically"
        shell: bash
        run: |
          set -euo pipefail
          cat > probe-v49.py <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from playwright.async_api import async_playwright

          ROOT = 'http://127.0.0.1:8765/v48/'
          out = Path('reports')
          out.mkdir(exist_ok=True)

          async def inspect(browser, label, url, seconds):
              result = {'label': label, 'url': url, 'messages': [], 'errors': []}
              ctx = await browser.new_context(viewport={'width': 1080, 'height': 760},
                                              device_scale_factor=1)
              page = await ctx.new_page()
              def note(kind, value):
                  entries = result['errors'] if kind in ('pageerror', 'requestfailed', 'http') else result['messages']
                  if len(entries) < 300:
                      entries.append(f'{kind}: {str(value)[:600]}')
              page.on('console', lambda m: note('console', m.text))
              page.on('pageerror', lambda e: note('pageerror', e))
              page.on('requestfailed', lambda req: note('requestfailed', req.url))
              page.on('response', lambda res: note('http', f'{res.status} {res.url}') if res.status >= 400 else None)
              try:
                  await asyncio.wait_for(page.goto(url, wait_until='domcontentloaded', timeout=25000), timeout=35)
                  await asyncio.sleep(seconds)
                  result['final_url'] = page.url
                  try:
                      result['browser_state'] = await asyncio.wait_for(page.evaluate('''() => ({
                        title: document.title,
                        canvas: (() => {
                          const c = document.querySelector('canvas');
                          return c ? {width:c.width,height:c.height,display:getComputedStyle(c).display} : null;
                        })(),
                        loading: document.querySelector('#status')?.textContent || '',
                        output: (document.querySelector('#output')?.value || '').slice(-18000)
                      })'''), timeout=8)
                  except Exception as e:
                      note('pageerror', 'Cannot read emulator state: ' + str(e))
                  try:
                      await asyncio.wait_for(page.screenshot(path=str(out/f'V49-{label}.png'),
                                                             full_page=True, timeout=12000), timeout=18)
                      result['screenshot'] = f'V49-{label}.png'
                  except Exception as e:
                      note('pageerror', 'Screenshot unavailable: ' + str(e))
              except Exception as e:
                  note('pageerror', 'Navigation or startup failed: ' + str(e))
              finally:
                  try:
                      await asyncio.wait_for(ctx.close(), timeout=10)
                  except Exception:
                      pass
              return result

          async def main():
              results = []
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage',
                            '--enable-webgl','--use-gl=angle','--use-angle=swiftshader',
                            '--enable-unsafe-swiftshader'])
                  try:
                      results.append(await inspect(browser, 'lin-bin', ROOT, 55))
                      results.append(await inspect(browser, 'lineage-launcher',
                                                   ROOT+'Lineage-launcher.html', 35))
                  finally:
                      await browser.close()
              (out/'V49-browser-results.json').write_text(
                  json.dumps(results, indent=2, ensure_ascii=False), encoding='utf-8')
              for result in results:
                  print('RESULT', result['label'], 'URL', result.get('final_url', 'unavailable'))
                  for item in result['errors'][:20]:
                      print('BROWSER_ERROR', item)
                  for item in result['messages'][-20:]:
                      print('BROWSER_LOG', item)
                  state = result.get('browser_state', {})
                  print('BROWSER_STATE', json.dumps(state, ensure_ascii=False)[-1800:])
              print('V49 browser execution evidence saved. This is not proof of game play.')

          asyncio.run(main())
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 --directory published \
            > reports/V49-http-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/v48/index.html; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/v48/index.html
          python probe-v49.py 2>&1 | tee reports/V49-browser-run.log
          test -s reports/V49-browser-results.json

      - name: "V49 | Always preserve original-client browser evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Windows-Client-Browser-V49
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: "V49 | Make the original Windows client the default game2 page"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          enable_jekyll: false

      - name: "V49 | Explicit result and next blocker"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V49 | Original Windows client browser execution'
            echo 'This workflow reused the already-built V48 original Windows EXE runtime.'
            echo 'The homepage now redirects to v48/ instead of the unrelated V45 client.'
            echo 'Screenshots, browser errors, and Wine console text are in the V49 artifact.'
            echo 'A successful GitHub Action does not prove protected EXE startup or gameplay.'
          } >> "$GITHUB_STEP_SUMMARY"
