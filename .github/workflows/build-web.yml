      - name: V229R65 Build wall-base collision independent of front and back
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r65_graph.py <<'PY_GRAPH'
          from pathlib import Path
          from PIL import Image
          import numpy as np,json

          base=Path('build')
          gfx=Path('site/knight/gameasync/Graphics/Panoramas')
          spawn=json.loads((base/'r65-spawns.json').read_text())
          report={
              'version':'V229R65',
              'base':'V229R64',
              'roles':{
                  'wall_front':'visual only',
                  'wall_back':'visual only',
                  'wall_base':'collision only'
              },
              'maps':{}
          }

          for mid,w,h in [(45,288,144),(46,336,168)]:
              t=np.fromfile(base/f'r65-floor-{mid}.bin',dtype='<u2').reshape(h,w)
              src=np.fromfile(base/f'r65-original-{mid}.bin',dtype=np.uint8).reshape(h,w)

              # Only the native physical floor and wall-base decide
              # whether a tile itself can be occupied.
              walk=t==384

              density=np.zeros((h,w),dtype=np.float32)
              foot=np.zeros_like(density)
              top=np.zeros_like(density)

              # FRONT and BACK are display roles, not collision masks.
              # Sample the painted layer only to find the narrow point
              # where the physical wall base contacts the ground.
              for cy in range((h+31)//32):
                for cx in range((w+31)//32):
                  p=gfx/f'SLTI_{mid}_W_C{cx}_{cy}.png'
                  if not p.exists():
                      continue

                  im=np.asarray(
                      Image.open(p).convert('RGBA').getchannel('A'),
                      np.float32
                  )/255.0
                  assert im.shape==(512,512)

                  a=im.reshape(32,16,32,16).transpose(0,2,1,3)
                  rh=min(32,h-cy*32)
                  rw=min(32,w-cx*32)
                  sl=np.s_[cy*32:cy*32+rh,cx*32:cx*32+rw]
                  density[sl]=a[:rh,:rw].mean((2,3))
                  foot[sl]=a[:rh,:rw,12:16,5:11].mean((2,3))
                  top[sl]=a[:rh,:rw,0:4,5:11].mean((2,3))

              if mid==45:
                  # Preserve the actual double doorway.
                  assert (t[57,133:135]==384).all()
                  assert (t[61,133:135]==384).all()
                  assert (t[58:60,133:135]==385).all()
                  walk[58:61,133:135]=True

              # Directional movement from native floor and original S32.
              # Do not create movement from visible wall-face pixels.
              edges=np.zeros((h,w),np.uint8)

              xlink=(
                  walk[:,:-1]&walk[:,1:]&
                  ((src[:,:-1]&8)>0)&
                  ((src[:,1:]&4)>0)
              )
              edges[:,:-1][xlink]|=8
              edges[:,1:][xlink]|=4

              ylink=(
                  walk[:-1,:]&walk[1:,:]&
                  ((src[:-1,:]&2)>0)&
                  ((src[1:,:]&1)>0)
              )
              edges[:-1,:][ylink]|=2
              edges[1:,:][ylink]|=1

              if mid==45:
                  for x in (133,134):
                    for y in (57,58,59,60):
                      assert walk[y,x] and walk[y+1,x]
                      edges[y,x]|=2
                      edges[y+1,x]|=1
                  for y in (58,59,60):
                    edges[y,133]|=8
                    edges[y,134]|=4

              # The visual front/back of a wall never blocks movement.
              # Restrict only the physical lower contact line of a wall.
              wall_base_contact=(
                  (density[:-1,:]>=.65)&
                  (foot[:-1,:]<.35)&
                  (density[1:,:]<.23)&
                  (top[1:,:]<.35)
              )
              wall_base_contact &= (
                  ((edges[:-1,:]&2)>0)&
                  ((edges[1:,:]&1)>0)
              )

              edges[:-1,:][wall_base_contact]&=np.uint8(253)
              edges[1:,:][wall_base_contact]&=np.uint8(254)

              # No extra side-wall image collision.
              # Original S32 provides existing directional restrictions.
              assert not edges[~walk].any()
              assert np.array_equal(
                  (edges[:,:-1]&8)>0,(edges[:,1:]&4)>0
              )
              assert np.array_equal(
                  (edges[:-1,:]&2)>0,(edges[1:,:]&1)>0
              )
              assert not (edges[:,0]&4).any()
              assert not (edges[:,-1]&8).any()
              assert not (edges[0,:]&1).any()
              assert not (edges[-1,:]&2).any()

              blocked_spawns=[
                  (eid,x,y)
                  for eid,x,y in spawn[str(mid)]
                  if edges[y,x]==0
              ]
              assert not blocked_spawns,(
                  'Monster spawn blocked',mid,blocked_spawns
              )

              if mid==45:
                  # Screenshot: player must be able to walk BEHIND wall.
                  for y in (78,79,80,81):
                      assert edges[y,94]&2
                      assert edges[y+1,94]&1

                  # The true wall-base/floor boundary must block.
                  assert not (edges[82,94]&2)

                  # Old wall-breaking position must stay blocked.
                  assert not (edges[70,97]&1)
                  assert not (edges[69,97]&2)

                  # Actual doorway must remain traversable.
                  for x in (133,134):
                      for y in (57,58,59,60):
                          assert edges[y,x]&2
                          assert edges[y+1,x]&1

                  assert not edges[59,132]
                  assert not edges[59,135]
              else:
                  assert edges[94,81]
                  assert edges[100,156]

              edges.tofile(base/f'r65-repaired-{mid}.bin')

              report['maps'][str(mid)]={
                  'tiles':w*h,
                  'native_walkable_tiles':int((t==384).sum()),
                  'final_directional_cells':int(np.count_nonzero(edges)),
                  'physical_wall_base_contacts':int(wall_base_contact.sum()),
                  'extra_wall_face_barriers':0,
                  'monster_spawns_checked':len(spawn[str(mid)]),
                  'front_and_back_are_visual_only':True
              }

              print('PASS Map',mid,report['maps'][str(mid)])

          assert 3500<=report['maps']['45']['final_directional_cells']<=3728
          assert 6800<=report['maps']['46']['final_directional_cells']<=7120

          (base/'r65-map-audit.json').write_text(
              json.dumps(report,indent=2)
          )
          PY_GRAPH
          python3 /tmp/r65_graph.py

      - name: V229R65 Patch only native collision graph script 21
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r65_patch.rb <<'RB_PATCH'
          require 'zlib'
          require 'json'

          p='site/knight/gameasync/Data/Scripts.rxdata'
          items=Marshal.load(File.binread(p))
          old=Marshal.load(File.binread(p))

          raise 'Unexpected RPG scripts' unless items.size==136
          source=Zlib::Inflate.inflate(items[21][2]).force_encoding('UTF-8')
          pos=source.index('module SLTI_V229R44')
          raise 'Missing current 4-way mask' if pos.nil?

          head=source[0...pos]
          tail=source[pos..-1]

          [45,46].each do |mid|
            newmap=File.binread("build/r65-repaired-#{mid}.bin")
            expected=mid==45 ? 288*144 : 336*168
            raise 'Bad grid size' unless newmap.bytesize==expected

            regex=/^  EDGES_#{mid} = \[\r?\n.*?\r?\n  \]\.join\.unpack\('m'\)\[0\]/m
            raise "No unique mask #{mid}" unless tail.scan(regex).length==1

            lines=[newmap].pack('m0').scan(/.{1,120}/).map{|s|
              '    '+s.inspect
            }.join(",\n")
            tail=tail.sub(
              regex,
              "  EDGES_#{mid} = [\n#{lines}\n  ].join.unpack('m')[0]"
            )
          end

          items[21][2]=Zlib::Deflate.deflate((head+tail).b)
          raise 'Unrelated script changed' unless
            items.each_index.all?{|i|i==21 || items[i]==old[i]}

          File.binwrite(p,Marshal.dump(items))

          check=Marshal.load(File.binread(p))
          updated=Zlib::Inflate.inflate(check[21][2]).force_encoding('UTF-8')
          a=updated.index('module SLTI_V229R44')
          b=updated.index("\nclass Game_Map",a)
          raise 'No RGSS runtime bounds' unless a && b

          eval(updated[a...b])

          [45,46].each do |mid|
            actual=SLTI_V229R44.const_get("EDGES_#{mid}")
            raise "R65 mask did not decode: #{mid}" unless
              actual==File.binread("build/r65-repaired-#{mid}.bin")
          end

          File.binwrite('build/r65-script21.rb',updated)

          # Do not alter R64 front/back depth rendering or fade.
          raise 'Wall foreground depth modified' unless
            check[134]==old[134]

          puts 'PASS collision-only script changed'
          puts 'PASS front/back rendering and AI unchanged'
          RB_PATCH
          ruby -c /tmp/r65_patch.rb
          ruby /tmp/r65_patch.rb
          ruby -c build/r65-script21.rb

      - name: V229R65 Verify wall-behind movement and wall-base collision
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RB_TEST'
          require 'zlib'

          scripts=Marshal.load(
              File.binread('site/knight/gameasync/Data/Scripts.rxdata')
          )
          raise 'Wrong script count' unless scripts.length==136

          source=Zlib::Inflate.inflate(scripts[21][2]).force_encoding('UTF-8')
          a=source.index('module SLTI_V229R44')
          b=source.index("\nclass Game_Map",a)
          raise 'No live map collision' unless a && b
          eval(source[a...b])

          char=Zlib::Inflate.inflate(scripts[23][2]).force_encoding('UTF-8')
          raise 'Character collision bypass' unless
              char.include?('SLTI_V229R44.allowed?')
          raise 'Map collision bypass' unless
              source.include?('SLTI_V229R44.allowed?(@map_id, x, y, d)')

          # Behind wall: passable even when painted wall overlaps actor.
          (78..81).each do |y|
            raise "Hero blocked behind wall y=#{y}" unless
                SLTI_V229R44.allowed?(45,94,y,2) &&
                SLTI_V229R44.allowed?(45,94,y+1,8)
          end

          # Physical wall base: impassable.
          raise 'Walking through solid floor' if
              SLTI_V229R44.allowed?(45,94,82,2)
          raise 'Lower wall breakthrough open' if
              SLTI_V229R44.allowed?(45,97,70,8)

          # Verified real doorway.
          (57..60).each do |y|
            raise 'Doorway blocked' unless
                SLTI_V229R44.allowed?(45,133,y,2)
          end

          raise '2F entry or boss floor blocked' unless
              SLTI_V229R44.allowed?(46,81,94,6) &&
              SLTI_V229R44.allowed?(46,156,100,6)

          # Front/back drawing remains a separate visual operation.
          wall=Zlib::Inflate.inflate(scripts[134][2]).force_encoding('UTF-8')
          raise 'Depth rendering overwritten' unless
              wall.include?('covered=overlap && actor_depth<wall_depth')

          puts 'PASS shared player and monster collision graph'
          puts 'PASS movement BEHIND wall'
          puts 'PASS physical wall BASE blocks movement'
          puts 'PASS front/back depth rendering preserved'
          RB_TEST

      - name: V229R65 Update script cache and verify original game preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          engine=root/'knight/gameasync'
          mapping=engine/'mapping.js'
          content=mapping.read_text('utf-8')

          key='Data/Scripts.rxdata'
          digest=hashlib.md5((engine/key).read_bytes()).hexdigest()
          content,count=re.subn(
              re.escape(key)+r'\?h=[0-9a-f]{32}',
              lambda m:key+'?h='+digest,
              content
          )
          assert count==1,count
          mapping.write_text(content,encoding='utf-8')

          for filename in ('index.html','knight/index.html'):
              file=root/filename
              v=file.read_text('utf-8')
              assert 'V229R64' in v
              file.write_text(
                  v.replace('V229R64','V229R65').replace(
                      'v229r64','v229r65'
                  ),
                  encoding='utf-8'
              )

          orig=json.loads(
              Path('build/r65-baseline.json').read_text()
          )
          now={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(now)==len(orig)==5517
          assert now.keys()==orig.keys()

          changes={x for x in now if orig[x]!=now[x]}
          expected={
              'index.html',
              'knight/index.html',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js'
          }
          assert changes==expected,(
              'Unexpected changes:',changes^expected
          )

          print('PASS all 5517 original files preserved')
          print('PASS only collision, script cache and version labels changed')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R65 Upload wall-base collision audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R65-Three-Wall-Roles
          path: build/r65-map-audit.json
          retention-days: 30
          if-no-files-found: error

