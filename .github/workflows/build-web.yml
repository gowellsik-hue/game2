
name: "build-web.yml | V69 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V69 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v69-offline-character
  cancel-in-progress: false

jobs:
  original_client_v69:
    name: "build-web.yml | V69 | Repair WebAssembly character bridge"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "V69 | Checkout game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V69 | Checkout unchanged V66 public resources"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V69 | Checkout exact original C++ client"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V69 | Set up working V65 Emscripten compiler"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V69 | Reuse V67 successful build, repair only WASM file bridge, run browser tests"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          cat > /tmp/v69-run.py <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          import yaml

          # The V65 Emscripten runtime explicitly passes Module into preRun.
          # Verify the export and callback contract before running anything.
          compiled = Path("published/lineage-v65.js").read_text()
          assert "callbacks.shift()(Module);" in compiled
          assert 'Module["FS"] = FS;' in compiled

          # V67 compiled successfully and passed character creation and
          # persistence tests. It failed only when the browser's preRun tried
          # to use a nonexistent global FS. Reuse those exact working steps.
          baseline = 'e7d56cbe5e5986328a38de6e02686b492e681d40'
          old = subprocess.check_output(
              ['git', 'show', baseline + ':.github/workflows/build-web.yml'],
              text=True
          )
          workflow = yaml.safe_load(old)
          original_steps = workflow['jobs']['original_client_v67']['steps']
          available = {item['name']: item['run'] for item in original_steps if 'run' in item}
          stages = [
              'V67 | Restore unchanged V59 game resources',
              'V67 | Bypass server and prepare native character entry',
              'V67 | Compile original engine with offline entry',
              'V67 | Preserve V65 image decoder and repair invalid SDL blits',
              'V67 | Build offline character creation and selection',
              'V67 | Install real browser test',
              'V67 | Test character creation, persistence and native entry',
          ]
          assert len(stages) == len(set(stages))
          assert all(stage in available for stage in stages)

          # Confirm the exact V67 workflow yields the patch anchors BEFORE
          # starting the costly native compilation.
          parsed_page = available['V67 | Build offline character creation and selection']
          assert parsed_page.count('preRun:[function(){') == 1
          assert parsed_page.count('FS.writeFile(') == 1
          assert parsed_page.count("const v67Key='sanctuary-game2-v67-characters';") == 1

          for step_number, title in enumerate(stages, 1):
              script = available[title].replace('V67', 'V69').replace('v67', 'v69')
              if title == 'V67 | Build offline character creation and selection':
                  # Emscripten MODULARIZE hides FS inside the instance.
                  # preRun receives Module as its first argument; FS is exported
                  # as Module.FS before preRun callbacks run.
                  assert script.count('preRun:[function(){') == 1
                  assert script.count('FS.writeFile(') == 1
                  script = script.replace(
                      'preRun:[function(){', 'preRun:[function(module){', 1
                  ).replace('FS.writeFile(', 'module.FS.writeFile(', 1)
                  # No whitespace-sensitive checks or diagnostic additions here.
                  # The already patched module.FS.writeFile is sufficient.
                  # Keep the browser save key stable across future versions.
                  prior_key = "const v69Key='sanctuary-game2-v69-characters';"
                  assert script.count(prior_key) == 1
                  script = script.replace(
                      prior_key, "const v69Key='sanctuary-game2-characters-v1';", 1
                  )
              if title == 'V67 | Test character creation, persistence and native entry':
                  # Preserve V67's actual test gate: character data must reach
                  # the real C++ game drawmode, not merely the HTML fallback.
                  assert 'result["native_game_ready"]' in script
                  assert 'timeout=100000' in script
                  assert 'V69: offline native game ready:' in script

              print('\n' + '=' * 72, flush=True)
              print(f'V69 [{step_number}/{len(stages)}] {title}', flush=True)
              print('=' * 72, flush=True)
              subprocess.run(
                  ['bash', '-e', '-o', 'pipefail', '-c', script],
                  check=True,
                  env=os.environ.copy(),
              )
              if title == 'V67 | Build offline character creation and selection':
                  html = Path('published/v69.html').read_text(encoding='utf-8')
                  assert html.count('preRun:[function(module){') == 1
                  assert html.count('module.FS.writeFile(') == 1
                  assert 'sanctuary-game2-characters-v1' in html
                  native = Path('upstream-l1j/src/sdl_user.cpp').read_text()
                  assert 'fopen("/v69-character.txt","rb")' in native
                  assert '"/v69-character.txt"' in html
                  assert 'lineage-v69.wasm' in html

          report = json.loads(Path('reports/V69-browser.json').read_text())
          assert report['character_saved']
          assert report['character_restored']
          assert report['native_game_ready']
          assert report['passed']
          print('V69: character creation, persistent storage and native game entry verified.', flush=True)
          PY
          python3 -m py_compile /tmp/v69-run.py
          python3 -u /tmp/v69-run.py 2>&1 | tee V69-execution.log

      - name: "V69 | Upload native game diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V69-Offline-Character
          path: |
            V69-execution.log
            reports/V69-browser.json
            reports/V69-mobile.png
            reports/V69-build.txt
            reports/V69-http.txt
            reports/V69-original-music.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: "V69 | Publish only when actual C++ character entry succeeds"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('reports/V69-browser.json').read_text())
          assert result['passed'] and result['character_saved']
          assert result['character_restored'] and result['native_game_ready']
          page = Path('published/v69.html').read_text()
          assert 'module.FS.writeFile(' in page
          PY
          git -C published add -- index.html v69.html \
            lineage-v69.js lineage-v69.wasm lineage-v69.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'build-web.yml V69: fix browser to WASM character file transfer'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V69 | Record real result"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V69 | Sanctuary game2 GitHub Pages'
            echo 'V67 character save and reload had passed; FS was undefined in preRun.'
            echo 'Uses Module.FS passed to the Emscripten preRun callback.'
            echo 'Reuses V67 C++ and V65 SDL build scripts from the exact Git commit.'
            echo 'Uses the stable browser character key sanctuary-game2-characters-v1.'
            echo 'Original music data is retained and verified by the V67 build stages.'
            echo 'Deployment requires creation, browser persistence and real C++ entry.'
            echo 'Map, movement and combat remain outside this version.'
          } >> "$GITHUB_STEP_SUMMARY"
