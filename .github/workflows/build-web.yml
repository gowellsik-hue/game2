# FILE: .github/workflows/build-web.yml
# VERSION: V87
# V86 run 40126656999 failed in original ZIP lookup because records
# had been overwritten by packed tile-index bytes.
# Preserve the central-directory records independently before tile packing.
# Reuse V86's unchanged resource, SDL, C++ and browser verification stages.
name: "build-web.yml | V87 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V87 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v87-native-player
  cancel-in-progress: false

jobs:
  original_client_v87:
    name: "build-web.yml | V87 | Restore original client and clean game display"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V87 | Checkout full game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V87 | Keep previous GitHub Pages deployment"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V87 | Checkout pinned L1J C++ adapter"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V87 | Set up compatible Emscripten"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V87 | Load exact V86 pipeline and validate script structure"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'Pillow==11.3.0'
          mkdir -p reports
          cat > /tmp/v87-stages.py <<'PY'
          import ast
          import re
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          REV='5b927fc55b87e70c8e22a18ebea62b6387525448'
          SOURCE=subprocess.check_output(
              ['git','show',REV+':.github/workflows/build-web.yml'],
              text=True
          )
          workflow=yaml.safe_load(SOURCE)
          assert workflow['name']=='build-web.yml | V86 | Sanctuary game2 GitHub Pages'
          assert workflow['run-name']==workflow['name']
          steps=workflow['jobs']['original_client_v86']['steps']
          scripts={s['name']:s['run'] for s in steps if 'run' in s}
          names={
              'bootstrap':'V86 | Restore exact V85 staged build and preflight',
              'restore':'V86 | Restore proven V83 map and SDL source',
              'sprites':'V86 | Prepare original SPR extraction',
              'slice':'V86 | Fix correct Sprite.idx and streaming PAK extraction',
              'wire':'V86 | Connect original C++ character and movement',
              'build':'V86 | Extract original SPR and compile native game',
              'smoke':'V86 | Verify real sprite visibility and movement',
              'publish':'V86 | Deploy only original sprite pixels plus movement'
          }
          assert all(n in scripts for n in names.values())

          def versioned(stage):
              script=scripts[names[stage]]
              return script.replace('V86','V87').replace('v86','v87')

          def repair_archive_lookup():
              path=Path('/tmp/v87-extract.sh')
              source=path.read_text(encoding='utf-8')
              # The V71 source uses `records` for ZIP entries and later
              # reassigns `records=[]` for packed tile index bytes.
              # V86's late-injected sprite code therefore iterates bytes.
              marker='assert len(records)==nitems,(len(records),nitems)'
              assert source.count(marker)==1,('ZIP central list anchor',source.count(marker))
              source=source.replace(
                  marker,marker+'\nzip_records=tuple(records)',1
              )
              lookup=(
                  r"r for r in records(?=\n[ \t]*if r\['name'\]"
                  r"\.lower\(\)\.endswith\()"
              )
              assert len(re.findall(lookup,source))==1, 'SPR archive lookup must be unique'
              source=re.sub(lookup,'r for r in zip_records',source,count=1)
              assert source.index('zip_records=tuple(records)') < source.index('compact=bytearray()')
              assert source.count('r for r in zip_records')==1
              assert source.count("bank='Sprite'")==1
              assert source.count('sources=extract_selected(source_bank,needed)')==1
              match=re.search(
                  r"(?ms)^cat > /tmp/v87-extract\.py <<'PY'\n(.*?)\nPY$",
                  source
              )
              assert match,'Generated ZIP extractor heredoc was not found'
              ast.parse(match.group(1),filename='/tmp/v87-extract.py')
              path.write_text(source,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
              # Verify the same type confusion cannot occur after tile packing.
              zip_records=({'name':'Original/Sprite.pak'},)
              tile_records=[b'packed tile index']
              assert isinstance(tile_records[0],bytes)
              assert next(r for r in zip_records if r['name'].lower().endswith('/sprite.pak'))
              print('V87: central ZIP list preserved separately from tile index bytes.',flush=True)

          if len(sys.argv)!=2:
              raise SystemExit('Usage: v87-stages.py preflight|stage|repair')
          phase=sys.argv[1]
          if phase=='preflight':
              for name in names:
                  script=versioned(name)
                  subprocess.run(['bash','-n'],input=script,text=True,check=True)
                  print('V87 verified prior stage:',name,flush=True)
          elif phase=='repair':
              repair_archive_lookup()
          elif phase in names:
              print('V87 executing:',phase,flush=True)
              subprocess.run(
                  ['bash','-e','-o','pipefail','-c',versioned(phase)],
                  check=True
              )
              print('V87 completed:',phase,flush=True)
          else:
              raise RuntimeError('Unknown V87 stage: '+phase)
          PY
          python3 -m py_compile /tmp/v87-stages.py
          python3 -u /tmp/v87-stages.py preflight \
            2>&1 | tee reports/V87-stage-preflight.log

      - name: "V87 | Restore V85 native build and browser stages"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py bootstrap \
            2>&1 | tee reports/V87-bootstrap.log

      - name: "V87 | Restore native map, SDL and chat cleanup"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py restore \
            2>&1 | tee reports/V87-restore.log

      - name: "V87 | Prepare indexed original male knight SPR"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py sprites \
            2>&1 | tee reports/V87-sprite-preparation.log

      - name: "V87 | Repair V86 ZIP central records and SPR slicing"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py slice \
            2>&1 | tee reports/V87-slice-setup.log
          python3 -u /tmp/v87-stages.py repair \
            2>&1 | tee reports/V87-archive-repair.log

      - name: "V87 | Connect original C++ player and keyboard movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py wire \
            2>&1 | tee reports/V87-player-wiring.log

      - name: "V87 | Extract original map and SPR then compile native client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py build \
            2>&1 | tee reports/V87-build-and-browser.log

      - name: "V87 | Require original SPR pixels and real directional movement"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py smoke \
            2>&1 | tee reports/V87-native-player-test.log

      - name: "V87 | Preserve failure and sprite diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V87-Native-Player
          path: |
            reports/V87-*.log
            reports/V87-*.json
            reports/V87-*.png
            reports/V87-*.txt
            assets/v87/v87-player-sprites.json
          retention-days: 30
          if-no-files-found: warn

      - name: "V87 | Publish only when original character and movement pass"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u /tmp/v87-stages.py publish \
            2>&1 | tee reports/V87-deploy.log

      - name: "V87 | State exact verified scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V87 | Sanctuary game2 GitHub Pages'
            echo 'V86 failed on a Python TypeError after the original map and tile extraction.'
            echo 'V87 captures ZIP central-directory dictionaries before tile IDX bytes reuse the records variable.'
            echo 'Original Sprite.idx / Sprite.pak and native SDL pipeline remain in place.'
            echo 'The adapter is L1J C++, not the proprietary Sanctuary executable.'
            echo 'Real sprite visibility and player movement are mandatory deployment checks.'
            echo 'Collision, original spawn location, and other classes are not verified.'
          } >> "$GITHUB_STEP_SUMMARY"
