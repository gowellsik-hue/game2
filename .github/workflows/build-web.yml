
name: "build-web.yml | V76 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V76 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v76-original-map
  cancel-in-progress: false

jobs:
  original_client_v76:
    name: "build-web.yml | V76 | Restore first native map pixels"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V76 | Checkout complete game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V76 | Preserve successful V70 GitHub Pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V76 | Checkout original Sanctuary C++ source"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V76 | Set up working V70 Emscripten compiler"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V76 | Prepare and precompile original map patches"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports
          cat > /tmp/v76-prepare.py <<'PY'
          import ast
          import re
          import subprocess
          import textwrap
          from pathlib import Path
          import yaml

          V71='dc173f5af493f37360b6ae997f2fce43a8ab28b1'
          raw=subprocess.check_output(
              ['git','show',V71+':.github/workflows/build-web.yml'],text=True)
          steps=yaml.safe_load(raw)['jobs']['original_client_v71']['steps']
          scripts={s['name']:s['run'] for s in steps if 'run' in s}
          def version(value):
              return value.replace('V71','V76').replace('v71','v76')
          def once(value,old,new):
              found=value.count(old)
              if found!=1: raise ValueError('V76 replacement count '+str(found)+': '+repr(old))
              return value.replace(old,new,1)
          def extract_python(shell,label):
              matches=list(re.finditer(r"(?m)^cat > (/tmp/[\w-]+\.py) <<'PY'\n([\s\S]*?)\nPY$",shell))
              if not matches: raise ValueError('No Python source found: '+label)
              for m in matches:
                  ast.parse(m.group(2),filename=m.group(1))
              print('V76 syntax checked:',label,[m.group(1) for m in matches],flush=True)

          extract=version(scripts[
              'V71 | Extract original start-map tiles and sections from split ZIP'])
          # V72 proved the floor-bank extraction works, but object tile 42 was
          # omitted. Decode all object tile references and bank-list references.
          nonfloor=r'''
          def v76_add_nonfloor_banks():
              before=set(selected)
              absent=set()
              for filename,record in wanted:
                  if not filename.endswith('.s32'): continue
                  data=(OUT_DIR/'map'/'4'/filename).read_bytes()
                  if len(data)<49158: continue
                  pos=32768
                  unknown=struct.unpack_from('<H',data,pos)[0]
                  pos+=2+unknown*6+64*64*4
                  if pos+4>len(data): continue
                  objects=struct.unpack_from('<i',data,pos)[0]
                  pos+=4
                  if objects<0 or objects>20000: continue
                  for _ in range(objects):
                      if pos+4>len(data): break
                      tiles=struct.unpack_from('<H',data,pos+2)[0]
                      pos+=4
                      if tiles>4096: break
                      n=0
                      while n<tiles and pos+2<=len(data):
                          xx,yy=struct.unpack_from('BB',data,pos)
                          pos+=2
                          if xx==0xcd and yy==0xcd:
                              pos+=5
                              tiles-=1
                              continue
                          if pos+5>len(data): break
                          pos+=1
                          code=struct.unpack_from('<I',data,pos)[0]
                          pos+=4
                          bank=code>>8
                          if bank in indices and bank<4145:
                              selected.add(bank)
                          else:
                              absent.add(bank)
                          n+=1
                  if pos+4>len(data): continue
                  hidden=struct.unpack_from('<i',data,pos)[0]
                  pos+=4
                  if hidden<0 or hidden>100000: continue
                  pos+=hidden*5
                  if pos+4>len(data): continue
                  sets=struct.unpack_from('<i',data,pos)[0]
                  pos+=4
                  if sets<0 or sets>4096: continue
                  for _ in range(sets):
                      if pos+4>len(data): break
                      bank=struct.unpack_from('<I',data,pos)[0]
                      pos+=4
                      if bank in indices and bank<4145:
                          selected.add(bank)
              if 42 in indices: selected.add(42)
              print('V76 extra map tile banks:',sorted(selected-before),flush=True)
              print('V76 unknown map tile banks:',sorted(absent)[:20],flush=True)
          v76_add_nonfloor_banks()
          '''
          extract=once(extract,
              "print('V76 original map referenced tile banks:',",
              textwrap.dedent(nonfloor)+"\nprint('V76 original map referenced tile banks:',")

          build=version(scripts[
              'V71 | Build and test the original native map renderer'])
          # The character entry patch already writes /tmp/v76-native.py.
          # The map patch must use its own filename to prevent running the
          # character patch twice (V71's actual failure).
          build=once(build,
              "cat > /tmp/v76-native.py <<'PY'",
              "cat > /tmp/v76-map-patch.py <<'PY'")
          build=once(build,
              "subprocess.run(['python3','/tmp/v76-native.py'],check=True)",
              "subprocess.run(['python3','/tmp/v76-map-patch.py'],check=True)")
          build=once(build,
              'python3 -m py_compile /tmp/v76-native.py /tmp/v76-tile-graphics.py /tmp/v76-driver.py',
              'python3 -m py_compile /tmp/v76-map-patch.py /tmp/v76-tile-graphics.py /tmp/v76-driver.py')
          build=once(build,'{max_bank+1}','{max(max_bank+1,4145)}')

          # Retain V72's corrected RGB555 scaling.
          for channel,bits in [(0,'color>>10'),(1,'color>>5'),(2,'color')]:
              old=f'dst[{channel}]=(unsigned char)(((({bits})&31)*255+15)/31);'
              new=f'dst[{channel}]=(unsigned char)((((({bits})&31)*255+15)/31));'
              build=once(build,old,new)

          # In native C++, decode only the original map cells surrounding the
          # initial spawn (radius 15). This avoids tens of thousands of SDL
          # blits during startup. No tile is invented or redrawn in HTML.
          map_opt=r'''
          before='map_coord tempmap(x + tx, y + ty);'
          assert s.count(before)==2,('map tile loops',s.count(before))
          skip='\n\t\t\tif (std::abs(x + tx - 32549)>15 || std::abs(y + ty - 32925)>15) continue;'
          s=s.replace(before,before+skip,2)
          s='#include <cstdlib>\n'+s
          cache='ret->graphic = new sdl_graphic(0, 0, 3072, 1535, 0);'
          assert s.count(cache)==1
          s=s.replace(cache,'ret->graphic = new sdl_graphic(0, 0, 3072, 1535, 75);',1)
          print('V76 native start-region floor and object cells selected',flush=True)
          '''
          build=once(build,'mp.write_text(s)',textwrap.dedent(map_opt)+'\nmp.write_text(s)')

          # Transparent RGBA map caches prevent one large unpainted segment
          # from covering the preceding segment with white or black.
          cache_opt=r"""
          old='\timg = SDL_CreateRGBSurface(SDL_SWSURFACE, w, h, 16,\n\t\t0x7C00, 0x03E0, 0x001F, 0);'
          assert s.count(old)==1,('SDL cache constructor',s.count(old))
          fresh='''\tif (dummy == 75) {
          \t\timg = SDL_CreateRGBSurface(SDL_SWSURFACE, w, h, 32,
          \t\t\t0x000000FF, 0x0000FF00, 0x00FF0000, 0xFF000000);
          \t} else {
          \t\timg = SDL_CreateRGBSurface(SDL_SWSURFACE, w, h, 16,
          \t\t\t0x7C00, 0x03E0, 0x001F, 0);
          \t}'''
          s=s.replace(old,fresh,1)
          fill='SDL_FillRect(img, NULL, SDL_MapRGB(img->format, 255,255,255));'
          assert s.count(fill)==1
          s=s.replace(fill,'if (dummy != 75) '+fill,1)
          print('V76 transparent original native map caches enabled',flush=True)
          """
          # The shell build script has two different p.write_text(s) strings;
          # constrain this insert to the graphics script's final print line.
          graphics_done="p.write_text(s)\nprint('V76: real RGB555 map colors decoded into RGBA32, preserving tile transparency.')"
          build=once(build,graphics_done,
              textwrap.dedent(cache_opt)+"\np.write_text(s)\nprint('V76: real RGB555 map colors decoded into RGBA32, preserving tile transparency.')")

          # Keep the genuine C++ canvas test; snapshot it before any assertion.
          build=once(build,'await page.wait_for_timeout(4000)',
              'await page.wait_for_timeout(18000)')
          build=once(build,'rows=Math.min(380,c.height)','rows=c.height')
          bad='assert map_sample["colors"]>=8, "V76 map image lacks original tile colors"'
          # Insert diagnostics with the 12-space indent already present at the
          # original browser-test assertion. Do not duplicate result assignments.
          pre=(
              'print("V76 actual SDL colors:",map_sample,flush=True)\n'
              '            await page.locator("#canvas").screenshot(path="reports/V76-map-canvas.png")\n'
              '            '
          )
          build=once(build,bad,pre+bad)

          # Verify syntax of every actual generated .py file. This preflight
          # catches V73's nested quoting error and V74's wrong end delimiter.
          extract_python(extract,'archive extractor')
          extract_python(build,'native map and browser builder')

          # Prior build passed a shallow preflight yet created invalid test code
          # because the test is assembled by a SECOND Python script at runtime.
          # Compile that final injected test body here, before downloading data.
          driver_match=re.search(
              r"(?m)^cat > /tmp/v76-driver\.py <<'PY'\n([\s\S]*?)\nPY$",
              build
          )
          assert driver_match, 'Missing V76 nested driver source'
          driver_tree=ast.parse(driver_match.group(1),filename='v76-driver.py')
          test_fragments=[]
          for node in ast.walk(driver_tree):
              if isinstance(node,ast.Assign):
                  if any(isinstance(t,ast.Name) and t.id=='extra_test'
                         for t in node.targets):
                      test_fragments.append(ast.literal_eval(node.value))
          assert len(test_fragments)==1, 'Expected one dynamically injected test'
          fragment=test_fragments[0]
          assert 'V76-map-canvas.png' in fragment
          assert 'V76 actual SDL colors:' in fragment
          ast.parse('async def v76_test_body():\n'+fragment+'\n            pass\n',
                    filename='assembled-v76-browser-test.py')
          print('V76: generated browser-test Python indentation verified',flush=True)
          Path('/tmp/v76-extract.sh').write_text(extract)
          Path('/tmp/v76-build.sh').write_text(build)
          subprocess.run(['bash','-n','/tmp/v76-extract.sh'],check=True)
          subprocess.run(['bash','-n','/tmp/v76-build.sh'],check=True)
          print('V76 all nested Python and shell source syntax passed',flush=True)
          PY
          python3 -m py_compile /tmp/v76-prepare.py
          python3 -u /tmp/v76-prepare.py 2>&1 | tee reports/V76-preflight.log

      - name: "V76 | Extract genuine map and compile original client"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v76-extract.sh 2>&1 | tee reports/V76-extraction.log
          bash /tmp/v76-build.sh 2>&1 | tee reports/V76-build-and-test.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V76-browser.json').read_text())
          assert r['character_saved'] and r['character_restored']
          assert r['native_game_ready'] and r['passed']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          assert Path('reports/V76-map-canvas.png').stat().st_size>500
          print('V76 native original map verified:',r['native_map_nonblack_fraction'])
          PY

      - name: "V76 | Save mobile canvas and failure diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V76-Original-Map
          path: |
            reports/V76-preflight.log
            reports/V76-extraction.log
            reports/V76-build-and-test.log
            reports/V76-extract.log
            reports/V76-browser.json
            reports/V76-mobile.png
            reports/V76-map-canvas.png
            reports/V76-http.txt
            assets/v76/v76-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V76 | Publish only after genuine canvas map verification"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V76-browser.json').read_text())
          assert r['passed'] and r['native_game_ready']
          assert r['character_saved'] and r['character_restored']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          assert Path('reports/V76-map-canvas.png').stat().st_size>500
          original=Path('published/lineage-v70.data').stat().st_size
          current=Path('published/lineage-v76.data').stat().st_size
          map_size=sum(x.stat().st_size for x in Path('assets/v76/lineage').rglob('*') if x.is_file())
          assert original < current <= original+map_size+2000000
          PY
          git -C published add -- index.html v76.html \
            lineage-v76.js lineage-v76.wasm lineage-v76.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              'build-web.yml V76: original map object tiles and bounded native first-area rendering'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V76 | Report verified scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V76 | Sanctuary game2 GitHub Pages'
            echo 'V74 failed at a whitespace-sensitive nested heredoc assertion.'
            echo 'V76 uses the V72-proven original archive, C++ build and mobile tests.'
            echo 'Compiles every generated Python and checks bash before downloading.'
            echo 'Includes actual map object bank 42 and other referenced banks.'
            echo 'Draws original map cells surrounding the character at 32549,32925.'
            echo 'Uses transparent native map caches, not a fake browser map.'
            echo 'Preserves V70 character creation, selection, save and audio assets.'
            echo 'Failure leaves successful V70 Pages deployment unchanged.'
            echo 'Movement, additional regions and combat remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
