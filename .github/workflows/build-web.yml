
name: "build-web.yml | V52 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V52 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v52-sanctuary
  cancel-in-progress: false

jobs:
  restore_sanctuary_v52:
    name: "build-web.yml | V52 | Restore Sanctuary original client"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "V52 | Checkout existing game2 GitHub Pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V52 | Restore only original Sanctuary Windows client"
        shell: bash
        run: |
          set -euo pipefail
          for file in boxedwine.html boxedwine.js boxedwine.wasm boxedwine.css boxedwine-shell.js boxedwine.zip sanctuary-candidates-v50.zip; do
            test -s "published/v50/$file"
          done
          mkdir -p published/v52
          for file in boxedwine.html boxedwine.js boxedwine.wasm boxedwine.css boxedwine-shell.js boxedwine.zip; do
            cp "published/v50/$file" "published/v52/$file"
          done
          cp published/v50/sanctuary-candidates-v50.zip published/v52/sanctuary-original-v52.zip

          cat > published/v52/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="refresh" content="0;url=./boxedwine.html?app=sanctuary-original-v52&amp;p=Login.exe&amp;sound=false">
          <title>Sanctuary | Original Windows Client V52</title>
          </head><body>
          <a href="./boxedwine.html?app=sanctuary-original-v52&amp;p=Login.exe&amp;sound=false">Sanctuary 원본 클라이언트 실행</a>
          </body></html>
          HTML

          cat > published/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="refresh" content="0;url=./v52/">
          <title>Sanctuary | game2 | V52</title>
          </head><body>
          <a href="./v52/">Sanctuary V52</a>
          </body></html>
          HTML
          touch published/.nojekyll published/v52/.nojekyll

      - name: "V52 | Remove unrelated V51 Single Lineage deployment"
        shell: bash
        run: |
          set -euo pipefail
          if test -d published/v51; then
            git -C published rm -rq -- v51
          fi
          git -C published add -A
          git -C published -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build-web.yml V52: restore Sanctuary and remove unrelated V51'
          git -C published push origin HEAD:gh-pages

      - name: "V52 | Final status"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V52 | Sanctuary game2 GitHub Pages'
            echo 'game2 gh-pages V50 original Windows client is the only V52 runtime source.'
            echo 'The unrelated V51 Single Lineage directory is removed.'
            echo 'The game2 homepage redirects to /game2/v52/.'
            echo 'Original Windows client browser compatibility is not yet proof of gameplay.'
          } >> "$GITHUB_STEP_SUMMARY"
