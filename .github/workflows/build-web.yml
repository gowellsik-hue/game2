
name: "build-web.yml | V80 | Sanctuary game2 GitHub Pages"
run-name: "build-web.yml | V80 | Sanctuary game2 GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write

concurrency:
  group: game2-v80-native-map
  cancel-in-progress: false

jobs:
  original_client_v80:
    name: "build-web.yml | V80 | Repair original SDL map tile blits"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "V80 | Checkout game2 history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V80 | Preserve successful V70 Pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: "V80 | Checkout original Sanctuary C++"
        uses: actions/checkout@v4
        with:
          repository: uglyoldbob/l1j-client
          ref: 83052f6b1c5bda59d4c4cbaf01aa2e72ea409853
          path: upstream-l1j
          persist-credentials: false

      - name: "V80 | Set up original Emscripten toolchain"
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'

      - name: "V80 | Restore verified V79 archive and native build stages"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          mkdir -p reports
          cat > /tmp/v80-restore.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          # V79 successfully extracted 16 map sections, 196 tile banks and
          # compiled the original C++ engine. Do not reuse its restrictive
          # SDL tile compositor: it was never entered at runtime.
          revision='0bb85ea170faa084081d59a3a72d1920f2a0f6d3'
          previous=subprocess.check_output(
              ['git','show',revision+':.github/workflows/build-web.yml'],
              text=True)
          steps=yaml.safe_load(previous)['jobs']['original_client_v79']['steps']
          name='V79 | Restore successful V78 build and original map extraction'
          script=next(s['run'] for s in steps if s['name']==name)
          script=script.replace('V79','V80').replace('v79','v80')
          subprocess.run(['bash','-e','-o','pipefail','-c',script],check=True)
          for f in ('/tmp/v80-extract.sh','/tmp/v80-build.sh'):
              assert Path(f).is_file(),f
              subprocess.run(['bash','-n',f],check=True)
          for f in ('/tmp/v80-native-viewport.py','/tmp/v80-sdl-bridge.py'):
              assert Path(f).is_file(),f
              subprocess.run(['python3','-m','py_compile',f],check=True)
          print('V80: V79 original assets and C++ build restored',flush=True)
          PY
          python3 -m py_compile /tmp/v80-restore.py
          python3 -u /tmp/v80-restore.py | tee reports/V80-restore.log

      - name: "V80 | Install clipped native SDL tile compositor"
        shell: bash
        run: |
          set -euo pipefail
          cat >> /tmp/v80-sdl-bridge.py <<'PY'
          from pathlib import Path
          import subprocess

          target=Path('dist/lineage-v80.js')
          code=target.read_text(encoding='utf-8')
          begin='  blitSurface(src, srcrect, dst, dstrect, scale) {'
          end='  downFingers: {},'
          assert code.count(begin)==1
          start=code.index(begin)
          stop=code.index(end,start)
          part=code[start:stop]
          needle='    if (dstData.clipRect) {'
          assert part.count(needle)==1

          # The V79 patch required sr=(0,0,24,24) and !scale, so the
          # compositor was never reached. Use the actual native 24x24 SDL
          # surface and the native destination coordinates, without those
          # restrictions. Preserve the original alpha/color bytes.
          compositor=r'''
              if (srcData.width===24 && srcData.height===24 &&
                  dstData.width===640 && dstData.height===380) {
                SDL.v80TileCalls=(SDL.v80TileCalls||0)+1;
                var n=SDL.v80TileCalls;
                var dx=Number(dr.x), dy=Number(dr.y);
                var painted=0, colored=0;
                var left=0, top=0, right=0, bottom=0;
                if (Number.isFinite(dx) && Number.isFinite(dy)) {
                  dx=Math.trunc(dx);
                  dy=Math.trunc(dy);
                  left=Math.max(0,dx);
                  top=Math.max(0,dy);
                  right=Math.min(640,dx+24);
                  bottom=Math.min(380,dy+24);
                }
                if (n<=4) {
                  out('V80: SDL rect '+n+' src='+
                    [sr.x,sr.y,sr.w,sr.h].join(',')+' dst='+
                    [dr.x,dr.y,dr.w,dr.h].join(',')+
                    ' scale='+scale);
                }
                if (right>left && bottom>top) {
                  try {
                    var srcPixels=srcData.ctx.getImageData(0,0,24,24).data;
                    var w=right-left, h=bottom-top;
                    var result=dstData.ctx.getImageData(left,top,w,h);
                    var dstPixels=result.data;
                    for (var y=0;y<h;y++) {
                      for (var x=0;x<w;x++) {
                        var si=((top+y-dy)*24+(left+x-dx))*4;
                        var di=(y*w+x)*4;
                        var a=srcPixels[si+3]/255;
                        if (a<=0) continue;
                        painted++;
                        if (srcPixels[si]>35 || srcPixels[si+1]>35 ||
                            srcPixels[si+2]>35) colored++;
                        var da=dstPixels[di+3]/255;
                        var oa=a+da*(1-a);
                        if (oa<=0) continue;
                        for (var c=0;c<3;c++) {
                          dstPixels[di+c]=Math.round(
                            (srcPixels[si+c]*a+
                             dstPixels[di+c]*da*(1-a))/oa);
                        }
                        dstPixels[di+3]=Math.round(oa*255);
                      }
                    }
                    if (painted) {
                      dstData.ctx.putImageData(result,left,top);
                      SDL.v80Painted=(SDL.v80Painted||0)+painted;
                      SDL.v80Colored=(SDL.v80Colored||0)+colored;
                      SDL.v80NativeMap=dstData.canvas;
                      if (!SDL.v80PresenterStarted) {
                        SDL.v80PresenterStarted=true;
                        var present=function() {
                          var page=Module['canvas'];
                          var map=SDL.v80NativeMap;
                          if (page && map) {
                            page.getContext('2d').drawImage(
                              map,0,0,640,380,0,0,page.width,
                              Math.round(page.height*380/480));
                          }
                          requestAnimationFrame(present);
                        };
                        requestAnimationFrame(present);
                        out('V80: original SDL tile presenter started');
                      }
                    }
                  } catch(e) {
                    if (!SDL.v80Error) {
                      SDL.v80Error=true;
                      err('V80: native tile copy error: '+e);
                    }
                  }
                }
                if (n<=4 || n===32 || n===128 || n%512===0 ||
                    (painted>0 && !SDL.v80FirstPaint)) {
                  out('V80: tile '+n+' dst='+dx+','+dy+
                    ' area='+Math.max(0,right-left)+'x'+
                    Math.max(0,bottom-top)+' pixels='+painted+
                    ' colored='+colored+' total='+(SDL.v80Painted||0));
                }
                if (painted>0) SDL.v80FirstPaint=true;
                // Avoid Emscripten's incompatible SDL1 canvas blit once
                // the genuine tile has been composited successfully.
                if (painted>0) return 0;
              }
          '''
          part=part.replace(needle,compositor+'\n'+needle,1)
          code=code[:start]+part+code[stop:]
          assert code.count('V80: SDL rect ')==1
          assert code.count('V80: original SDL tile presenter started')==1
          target.write_text(code,encoding='utf-8')
          subprocess.run(['node','--check',str(target)],check=True)
          print('V80: actual SDL tile compositor installed',flush=True)
          PY
          python3 -m py_compile /tmp/v80-sdl-bridge.py
          python3 - <<'PY'
          from pathlib import Path
          code=Path('/tmp/v80-build.sh').read_text()
          for required in ('/tmp/v80-sdl-bridge.py',
                           '/tmp/v80-native-viewport.py',
                           'align_sdl_proxy_indices'):
              assert required in code,required
          print('V80: original compiler invokes the SDL patch',flush=True)
          PY
          bash -n /tmp/v80-build.sh

      - name: "V80 | Extract original assets, compile and test native map"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/v80-extract.sh 2>&1 | tee reports/V80-extract-stage.log
          bash /tmp/v80-build.sh 2>&1 | tee reports/V80-build-stage.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V80-browser.json').read_text())
          assert r['character_saved'] and r['character_restored']
          assert r['native_game_ready'] and r['passed']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          assert Path('reports/V80-map-canvas.png').stat().st_size>500
          print('V80: original SDL map verified',r['native_map_nonblack_fraction'])
          PY

      - name: "V80 | Save map and SDL diagnostics on every outcome"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-game2-V80-Native-Map
          path: |
            reports/V80-restore.log
            reports/V80-preflight.log
            reports/V80-bridge-preflight.log
            reports/V80-extract-stage.log
            reports/V80-build-stage.log
            reports/V80-browser.json
            reports/V80-map-canvas.png
            reports/V80-mobile.png
            reports/V80-http.txt
            assets/v80/v80-map-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "V80 | Publish only after real native map pixels pass"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/V80-browser.json').read_text())
          assert r['passed'] and r['native_game_ready']
          assert r['character_saved'] and r['character_restored']
          assert r['native_map_unique_colors']>=8
          assert r['native_map_nonblack_fraction']>0.02
          before=Path('published/lineage-v70.data').stat().st_size
          after=Path('published/lineage-v80.data').stat().st_size
          assets=sum(p.stat().st_size for p in Path('assets/v80/lineage').rglob('*') if p.is_file())
          assert before<after<=before+assets+2000000
          PY
          git -C published add -- index.html v80.html \
            lineage-v80.js lineage-v80.wasm lineage-v80.data
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'build-web.yml V80: render authentic SDL tiles with clipped alpha pixels'
            git -C published push origin HEAD:gh-pages
          fi

      - name: "V80 | Record verified scope"
        if: always()
        shell: bash
        run: |
          {
            echo '# build-web.yml | V80 | Sanctuary game2 GitHub Pages'
            echo 'V79 did not enter its native SDL tile compositor.'
            echo 'V80 records native SDL source and destination rectangle values.'
            echo 'V80 composites authentic RGB555-decoded tile pixels with clipping.'
            echo 'Original C++ source, characters, and 196 extracted tile banks are preserved.'
            echo 'Actual nonblank map pixels are required before publishing.'
            echo 'A failed run leaves the successful V70 deployment unchanged.'
            echo 'Movement, combat and other map regions are still unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
