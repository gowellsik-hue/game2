<script>
(function(){
  var ch={BGM:new Audio(),BGS:new Audio(),SE:new Audio()},pending=[];
  ch.BGM.loop=true;ch.BGS.loop=true;
  function urlFor(n){
    var p=String(n||'').replace(/\\/g,'/').replace(/\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,'');
    return encodeURI('gameasync/'+p+'.ogg?v=v203');
  }
  function safe(a){
    if(!a||!a.src)return;
    try{
      var p=a.play();
      if(p&&p.catch)p.catch(function(){if(pending.indexOf(a)<0)pending.push(a);});
    }catch(e){if(pending.indexOf(a)<0)pending.push(a);}
  }
  function retry(){var a=pending.slice();pending.length=0;a.forEach(safe);}
  ['touchstart','pointerdown','keydown','mousedown'].forEach(function(n){window.addEventListener(n,retry,{passive:true});});
  function stop(k){var a=ch[k];if(!a)return;a.pause();try{a.currentTime=0;}catch(e){}}
  function play(k,n,v,p){
    var a=ch[k];if(!a||!n)return;
    var u=urlFor(n);
    if(a.getAttribute('data-sl-src')!==u){a.pause();a.src=u;a.setAttribute('data-sl-src',u);a.load();}
    var gain=k==='BGS'?0.20:1;
    a.volume=Math.max(0,Math.min(1,Number(v||100)/100*gain));
    a.playbackRate=Math.max(.5,Math.min(1.5,Number(p||100)/100));
    safe(a);
  }
  function marker(t){
    var i=t.indexOf('SLAUDIO|');if(i<0)return;
    var p=t.slice(i).split('|'),cmd=p[1]||'',k=cmd.split('_')[0];
    if(/_PLAY$/.test(cmd))play(k,p.slice(2,-2).join('|'),p[p.length-2],p[p.length-1]);
    else if(/_STOP$/.test(cmd))stop(k);
    else if(/_FADE$/.test(cmd))setTimeout(function(){stop(k);},Number(p[2])||0);
  }
  function err(t){
    var p=document.getElementById('slerr');
    if(!p){
      p=document.createElement('div');p.id='slerr';
      p.style='position:fixed;left:8px;bottom:8px;z-index:999999;max-width:calc(100vw - 16px);height:28px;box-sizing:border-box;padding:5px 7px;border:1px solid #d33;border-radius:4px;background:rgba(0,0,0,.86);color:#ffd0d0;font:12px/16px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none';
      (document.getElementById('main')||document.body).appendChild(p);
    }
    p.textContent=String(t);
  }
  var log=console.log.bind(console),elog=console.error.bind(console);
console.log=function(){var a=[].slice.call(arguments),t=a.join(' ');try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}if(/SLRUNTIMEERR|SLSCRIPTERR| - err/.test(t))err(t);log.apply(console,a);};
console.error=function(){var a=[].slice.call(arguments),t=a.join(' ');if(/SLRUNTIMEERR|SLSCRIPTERR| - err|NO SUCH FILE|PHYSFS/i.test(t))err(t);elog.apply(console,a);};
window.addEventListener('error',function(e){var m=String((e&&e.message)||'');if(/^Uncaught \d+$/.test(m))return;err('JS ERROR | '+m);});
  window.slAudioBridge=ch;
})();
</script>

(function(){

      var p=s.slice(pos).split('|');
      lastFrame=Number(p[1])||lastFrame; phase=p[2]||'-';
      seenAt=Date.now();
    }
    pos=s.indexOf('SLTARGET|');
    if(pos>=0)lastTarget=s.slice(pos,pos+75);
    pos=s.indexOf('SLAUDIO|SE_PLAY|');
    if(pos>=0)lastTarget=s.slice(pos,pos+75);
    pos=s.indexOf('SLV211|SHOT|');
    if(pos>=0)lastTarget=s.slice(pos,pos+75);
    pos=s.indexOf('SLFRAME|');
    if(pos>=0){lastScene=s.slice(pos+8).split(/\s/)[0];
      if(lastScene==='Scene_Map'){
        ['spinner','progress'].forEach(function(id){
          var el=document.getElementById(id);if(el)el.style.display='none';
        });
      }
    }
    prior.apply(console,arguments);
  };
  window.addEventListener('error',function(e){
    var msg=String(e && e.message || 'unknown');
    var stack=e&&e.error&&e.error.stack?String(e.error.stack).split('\n').slice(0,2).join(' '):'';
    lastTarget='JS ERROR: '+msg.slice(0,60)+' '+stack.slice(0,95);
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e && e.reason;
    lastTarget='PROMISE ERROR: '+String(r && r.message || r || '').slice(0,90);
  });
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ensure);
  else ensure();
  setInterval(function(){
    ensure();if(!box)return;
    var lag=seenAt?Math.round((Date.now()-seenAt)/1000):-1;
    var state=(seenAt && lag>7)?'STALL':'RUN';
    var m=window.Module && window.Module.HEAPU8 ? Math.round(window.Module.HEAPU8.byteLength/1048576)+'MB' : '?';
    box.textContent='V219 '+state+' F:'+lastFrame+' '+phase+' '+
      'age:'+lag+'s MEM:'+m+' '+lastScene+' / '+lastTarget;
  },1200);
})();
