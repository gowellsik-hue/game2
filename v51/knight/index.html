<script>
(function(){
  var ch={BGM:new Audio(),BGS:new Audio()},pending=[];
  ch.BGM.loop=true;ch.BGS.loop=true;
  function urlFor(n){
    var p=String(n||'').replace(/\\/g,'/').replace(/\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,'');
    return encodeURI('gameasync/'+p+'.ogg?v=v143z100');
  }
  function safe(a){
    if(!a||!a.src)return;
    try{
      var p=a.play();
      if(p&&p.catch)p.catch(function(){if(pending.indexOf(a)<0)pending.push(a);});
    }catch(e){if(pending.indexOf(a)<0)pending.push(a);}
  }
  function retry(){var a=pending.slice();pending.length=0;a.forEach(safe);}
  ['touchstart','pointerdown','keydown','mousedown'].forEach(function(n){window.addEventListener(n,retry,{passive:true});});
  function stop(k){var a=ch[k];if(!a)return;a.pause();try{a.currentTime=0;}catch(e){}}
  function play(k,n,v,p){
    var a=ch[k];if(!a||!n)return;
    var u=urlFor(n);
    if(a.getAttribute('data-sl-src')!==u){a.pause();a.src=u;a.setAttribute('data-sl-src',u);a.load();}
    var gain=k==='BGS'?0.20:(k==='BGM'?0.60:1);
    a.volume=Math.max(0,Math.min(1,Number(v||100)/100*gain));
    a.playbackRate=Math.max(.5,Math.min(1.5,Number(p||100)/100));
    safe(a);
  }
  function marker(t){
    var i=t.indexOf('SLAUDIO|');if(i<0)return;
    var p=t.slice(i).split('|'),cmd=p[1]||'',k=cmd.split('_')[0];
    if(/_PLAY$/.test(cmd))play(k,p.slice(2,-2).join('|'),p[p.length-2],p[p.length-1]);
    else if(/_STOP$/.test(cmd))stop(k);
    else if(/_FADE$/.test(cmd))setTimeout(function(){stop(k);},Number(p[2])||0);
  }
  var slLastError='',slErrorTrace=[];
  function renderSlError(){
    var p=document.getElementById('slerr');
    if(!p){
      p=document.createElement('div');p.id='slerr';
      p.style='position:fixed;left:8px;bottom:8px;z-index:999999;max-width:calc(100vw - 16px);height:28px;box-sizing:border-box;padding:5px 7px;border:1px solid #d33;border-radius:4px;background:rgba(0,0,0,.90);color:#ffd0d0;font:12px/16px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer';
      p.onclick=function(){p.dataset.expanded=p.dataset.expanded==='1'?'0':'1';renderSlError();};
      (document.getElementById('main')||document.body).appendChild(p);
    }
    if(p.dataset.expanded==='1'){
      p.style.height='auto';p.style.maxHeight='40vh';p.style.whiteSpace='pre-wrap';p.style.overflow='auto';p.style.wordBreak='break-word';
      p.textContent=[slLastError].concat(slErrorTrace).join('\n');
    }else{
      p.style.height='28px';p.style.whiteSpace='nowrap';p.style.overflow='hidden';
      p.textContent=slLastError+'  [TAP:DETAILS]';
    }
  }
  function err(t){
    t=String(t);
    if(t!==slLastError){slLastError=t;slErrorTrace=[];}
    renderSlError();
  }
  function errTrace(t){
    if(!slLastError)return;
    if(slErrorTrace.indexOf(t)<0&&slErrorTrace.length<8)slErrorTrace.push(t);
    var p=document.getElementById('slerr');
    if(p&&p.dataset.expanded==='1')renderSlError();
  }
  var log=console.log.bind(console);
  console.log=function(){
    var a=[].slice.call(arguments),t=a.join(' ');
    try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}
    if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
    if(/^SLRUNTIMEBT\|/.test(t))errTrace(t);
    log.apply(console,a);
  };
  window.addEventListener('error',function(e){var m=String((e&&e.message)||'');if(/^Uncaught \d+$/.test(m))return;err('JS ERROR | '+m);});
  window.slAudioBridge=ch;
})();
</script>
