<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111820">
<title>Sanctuary — V83 Original Client Web Runtime</title>
<style>
:root{color-scheme:dark;font:14px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0c1118;color:#eef3fa}
header{height:49px;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0 14px;background:#182230;border-bottom:1px solid #2b394c}
header strong{font-size:14px}#state{font-size:12px;color:#9db6cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;display:flex;align-items:flex-start;justify-content:center;height:calc(100dvh - 49px - env(safe-area-inset-bottom));overflow:hidden;background:#06090c}
#canvas{display:block;width:min(100%,calc((100dvh - 145px)*4/3));height:auto;max-height:calc(100dvh - 145px);aspect-ratio:4/3;object-fit:contain;image-rendering:pixelated;background:#050505;outline:none;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;padding:22px;text-align:center;background:rgba(6,9,12,.93)}
#overlay.hidden{display:none}#overlay h1{font-size:18px;font-weight:700;margin:0}#overlay p{max-width:440px;margin:0;color:#c1ccda;font-size:13px;word-break:break-word}
#overlay button,.controls button{border:1px solid #61758a;background:#2a3b4f;color:white;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}
#logbox{position:absolute;left:10px;top:8px;width:min(520px,calc(100% - 20px));max-height:40vh;padding:8px 10px;font:11px/1.4 ui-monospace,monospace;overflow:auto;white-space:pre-wrap;background:rgba(0,0,0,.77);border-radius:7px;display:none;pointer-events:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#logbox.visible{display:block}
#controls{display:none;position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));pointer-events:none;justify-content:space-between;padding:0 max(10px,env(safe-area-inset-left))}
.controls{display:grid;grid-template-columns:repeat(3,52px);gap:5px;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.controls button{min-width:51px;min-height:47px;padding:2px;font-weight:700;background:rgba(34,53,75,.76);touch-action:none}
.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
#rightkeys{display:flex;align-items:end;pointer-events:auto;gap:8px}
#rightkeys button{font-size:13px}
#tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}#tools button{font-size:11px;background:rgba(30,49,66,.88);color:#bcd7f0;border:1px solid #40546b;border-radius:6px;padding:5px 8px}
@media (pointer:coarse){#controls{display:flex}#canvas{max-height:calc(100dvh - 49px)}.controls{grid-template-columns:repeat(3,44px)}.controls button{min-width:43px;min-height:44px}}

#v65Original {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(100%,calc((100dvh - 145px)*4/3));
  max-height:calc(100dvh - 145px);
  height:auto;
  aspect-ratio:4/3;
  object-fit:contain;
  image-rendering:pixelated;
  pointer-events:none;
  z-index:1;
}
#overlay,#logbox,#tools,#controls {z-index:3}
@media (pointer:coarse) {
  #v65Original {max-height:calc(100dvh - 49px)}
}

#v83Menu[hidden]{display:none!important}
#v83Menu {
  position:absolute;
  inset:0;
  z-index:7;
  overflow:auto;
  padding:20px 12px 35px;
  background:
    linear-gradient(rgba(6,8,12,.62),rgba(6,8,12,.83)),
    url('./v65-811.png') center/cover no-repeat;
  -webkit-overflow-scrolling:touch;
}
#v83Panel {
  width:min(100%,580px);
  margin:0 auto;
  padding:18px;
  background:rgba(9,14,22,.91);
  border:1px solid #6a5841;
  border-radius:13px;
  box-shadow:0 8px 35px #0009;
}
#v83Panel h2 {margin:0 0 12px;font-size:19px}
#v83Panel h3 {font-size:15px;margin:12px 0 5px}
#v83Panel button,#v83Panel input,#v83Panel select {
  font:inherit;
  min-height:37px;
  border:1px solid #61758a;
  border-radius:6px;
  color:#f1f1f1;
  background:#263445;
  padding:6px 9px;
}
#v83Panel button {cursor:pointer}
#v83Panel input,#v83Panel select {width:100%}
#v83Panel .slot {
  padding:11px 0;
  border-bottom:1px solid #45515d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
#v83Panel .slot-info {flex:1;min-width:0}
#v83Panel .slot-actions {display:flex;gap:6px}
#v83Panel .v83-fields {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
#v83Panel .stat {
  display:grid;
  grid-template-columns:45px 1fr 37px 37px;
  align-items:center;
  gap:5px;
  padding:3px 0;
}
#v83Panel .stat button {padding:3px}
#v83Panel .actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}
#v83Message {min-height:22px;color:#efcc81}
@media(max-width:450px) {
  #v83Menu {padding:9px 8px 25px}
  #v83Panel {padding:11px}
  #v83Panel .slot-actions {flex-direction:column}
}
</style>
</head>
<body>
<header><strong>Sanctuary | Original Client Runtime · V83 (offline characters)</strong><span id="state" role="status" aria-live="polite">초기화 전</span></header>
<main id="stage">
  <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="기존 클라이언트가 그리는 실제 SDL 화면"></canvas>
  <img id="v65Original" src="./v65-811.png" alt="" aria-hidden="true">
  <div id="overlay" role="alert">
    <h1 id="head">원본 클라이언트 자동 실행</h1>
    <p id="desc">원본 C++ 클라이언트를 자동으로 실행합니다. 원본 Text·Sprite00 PAK와 music0.mp3를 사용합니다.</p>
  </div>
  <pre id="logbox"></pre>
  <div id="tools"><button id="logBtn" type="button">로그</button><button id="fullBtn" type="button">전체화면</button></div>
  <div id="controls">
    <div class="controls" aria-label="키보드 방향키">
      <button data-key="ArrowUp" class="up" aria-label="위">▲</button>
      <button data-key="ArrowLeft" class="left" aria-label="왼쪽">◀</button>
      <button data-key="ArrowDown" class="down" aria-label="아래">▼</button>
      <button data-key="ArrowRight" class="right" aria-label="오른쪽">▶</button>
    </div>
    <div id="rightkeys" class="controls"><button data-key="Escape">ESC</button><button data-key="Enter">ENTER</button></div>
  </div>

<section id="v83Menu" aria-label="캐릭터 선택 및 생성">
  <div id="v83Panel">
    <h2>캐릭터 선택</h2>
    <div id="v83Content"></div>
    <p id="v83Message" role="status"></p>
  </div>
</section>
</main>
<audio id="v65Music" src="./v65-music0.mp3" loop preload="auto"></audio>
<script>
'use strict';
const canvas=document.getElementById('canvas');
const overlay=document.getElementById('overlay');
const state=document.getElementById('state');
const head=document.getElementById('head');
const desc=document.getElementById('desc');
const logbox=document.getElementById('logbox');
let launched=false;
function status(message){state.textContent=message;}
function log(message){
  const line=String(message??'');
  const visible=logbox.classList.contains('visible');
  const follow=!visible || logbox.scrollTop+logbox.clientHeight>=logbox.scrollHeight-32;
  logbox.textContent+=(line+'\n');
  if(logbox.textContent.length>64000)logbox.textContent=logbox.textContent.slice(-52000);
  if(visible && follow)logbox.scrollTop=logbox.scrollHeight;
  console.log('[Lineage]',line);
}
let filteredSpriteLines=0;
function enginePrint(message){
  const line=String(message??'');
  if(line.includes('V83: offline native game ready:')){
    status('캐릭터 게임 화면 진입 · 맵 이식 진행 중');
    document.getElementById('v65Original').style.display='none';
    log('V83: native game state entered');
  }
  if(/^(?:mspdf for sprite \d+ is \d+|Sprite \d+ has .*|Weapon on sprite \d+.*|\s*\d{2,7}\s*)$/.test(line)){
    filteredSpriteLines++;
    if(filteredSpriteLines%1000===0)log('스프라이트 디버그 출력 '+filteredSpriteLines+'행 생략');
    return;
  }
  log(line);
}
function errorDetail(value,depth=0){
  if(value==null)return String(value);
  if(typeof value==='string')return value;
  if(depth>3)return String(value);
  const parts=[];
  for(const key of ['type','name','message','filename','lineno','colno','stack','status']){
    const item=value[key];
    if(item!==undefined && item!==null && item!=='')parts.push(key+': '+String(item));
  }
  if(value.error && value.error!==value)parts.push('cause: '+errorDetail(value.error,depth+1));
  if(value.reason && value.reason!==value)parts.push('reason: '+errorDetail(value.reason,depth+1));
  return parts.join('\n')||String(value);
}
function problem(message){
  const detail=String(message??'실행 오류');
  status('실행 장애');
  head.textContent='클라이언트 실행 실패';
  desc.textContent=detail.slice(0,1500);
  overlay.classList.remove('hidden');
  launched=false;
  log(detail);
  logbox.classList.add('visible');
  requestAnimationFrame(()=>{logbox.scrollTop=logbox.scrollHeight;});
}
function showRuntime(){status('WebAssembly 런타임 초기화 완료 (게임 진입 별도 확인)');overlay.classList.add('hidden');canvas.focus({preventScroll:true});}
async function checkCrossOriginIsolation(){
  if(!('serviceWorker' in navigator) || !isSecureContext)return false;
  try{
    await navigator.serviceWorker.register('./coi-serviceworker-v45.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    if(navigator.serviceWorker.controller===null){
      const once='sanctuary-coi-v45-reload';
      if(sessionStorage.getItem(once)!=='1'){
        sessionStorage.setItem(once,'1');
        location.reload();
        return null;
      }
    }
    const ctl=navigator.serviceWorker.controller;
    if(!ctl || !ctl.scriptURL.includes('coi-serviceworker-v45.js')){
      const key='v45-worker-upgrade';
      if(!sessionStorage.getItem(key)){
        sessionStorage.setItem(key,'1'); location.reload(); return null;
      }
      throw Error('V45 Service Worker upgrade pending; close other game2 tabs and reload.');
    }
    sessionStorage.removeItem('v45-worker-upgrade');
    return crossOriginIsolated;
  }catch(err){log('Isolation: '+err);throw err;}
}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error(src+' 파일을 찾거나 실행하지 못했습니다.'));document.head.append(s);});}
async function startEngine(){
  if(launched)return;
  launched=true;status('엔진 로딩 중');head.textContent='원본 C++ 클라이언트 로딩 중';desc.textContent='컴파일된 lineage-v83.js / lineage-v83.wasm 파일을 확인합니다.';
  try{
    if(location.protocol==='file:')throw Error('GitHub Pages 또는 로컬 HTTP 서버에서 실행해야 합니다.');
    const isolated=await checkCrossOriginIsolation();
    if(isolated===null)return;
    if(!isolated)throw Error('WebAssembly 스레드 실행을 위한 브라우저 격리 설정이 필요합니다.');
    const idx=await fetch('./v45-paks.json',{cache:'no-store'});
    if(!idx.ok)throw Error('V45 original PAK manifest is missing');
    const manifest=await idx.json();
    for(const name of Object.keys(manifest.files)){
      const check=await fetch('./v45pak/'+name,{method:'HEAD',cache:'no-store'});
      if(!check.ok || Number(check.headers.get('content-length'))!==manifest.files[name].size)
        throw Error('Original PAK streaming unavailable: '+name);
      log('V45 original '+name+': '+manifest.files[name].size+' bytes (HTTP ranges)');
    }
    const response=await fetch('./lineage-v83.js',{method:'HEAD',cache:'no-store'});
    if(!response.ok)throw Error('lineage-v83.js가 없습니다. 아직 WebAssembly 빌드·배포가 완료되지 않았습니다.');
    if(typeof window.createLineage!=='function')await loadScript('./lineage-v83.js');
    if(typeof window.createLineage!=='function')throw Error('lineage-v83.js에 createLineage() 엔트리 포인트가 없습니다.');
    status('원본 클라이언트 main() 실행 요청');
    await window.createLineage({
      preRun:[function(module){
        if(!v83SelectedText)
          throw Error("No selected character");
        module.FS.writeFile(
          "/v83-character.txt",
          new TextEncoder().encode(v83SelectedText)
        );
      }],
      canvas, noInitialRun:false, locateFile:(file,prefix)=>'./'+file,
      print:(...x)=>enginePrint(x.join(' ')), printErr:(...x)=>log('STDERR '+x.join(' ')),
      setStatus:status,
      onRuntimeInitialized:showRuntime,
      onAbort:(what)=>problem('WebAssembly abort: '+what),
      onExit:(code)=>problem('원본 클라이언트 프로세스 종료 (exit='+code+')'),
      monitorRunDependencies:(n)=>status(n?'원본 데이터 로딩 중 ('+n+')':'데이터 초기화 완료')
    });
  }catch(err){problem(err?.message||String(err));}
}




const originalMusic=document.getElementById('v65Music');
let musicAttempted=false;
function resumeOriginalMusic(){
  if(musicAttempted)return;
  musicAttempted=true;
  originalMusic.play().catch(()=>{
    musicAttempted=false;
  });
}
document.addEventListener('pointerdown',resumeOriginalMusic);
document.addEventListener('keydown',resumeOriginalMusic);

window.addEventListener('load',()=>{v83OpenMenu();checkCrossOriginIsolation().catch(e=>log(String(e)));},{once:true});
window.addEventListener('error',event=>{if(launched)problem('브라우저/작업 스레드 오류\n'+errorDetail(event));});
window.addEventListener('unhandledrejection',event=>{
  const reason=event.reason;
  if(reason?.name==='NotAllowedError'){
    event.preventDefault();
    log('V45: 브라우저에서 음악 자동재생이 제한됐지만 게임은 계속 실행합니다.');
    return;
  }
  if(launched)problem('비동기 작업 오류\n'+errorDetail(reason));
});
document.getElementById('logBtn').addEventListener('click',()=>{if(logbox.classList.toggle('visible'))requestAnimationFrame(()=>{logbox.scrollTop=logbox.scrollHeight;});});
document.getElementById('fullBtn').addEventListener('click',()=>{if(!document.fullscreenElement)document.getElementById('stage').requestFullscreen?.();else document.exitFullscreen?.();});
function keyEvent(key,type){const code=key==='Escape'?'Escape':key==='Enter'?'Enter':key;const ev=new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true});window.dispatchEvent(ev);document.dispatchEvent(ev);canvas.dispatchEvent(ev);}
for(const button of document.querySelectorAll('[data-key]')){
  button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keyEvent(button.dataset.key,'keydown');});
  for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,e=>{e.preventDefault();keyEvent(button.dataset.key,'keyup');});
}

const v83Key='sanctuary-game2-characters-v1';
const v83Names=[
  '군주','기사','요정','마법사',
  '다크엘프','용기사','환술사'
];
const v83StatNames=['STR','DEX','CON','WIS','CHA','INT'];

// Directly transcribed from the original global.cpp.
const v83Base=[
  [13,10,10,11,13,10],
  [16,12,14,9,12,8],
  [11,12,12,12,9,12],
  [8,7,12,12,8,12],
  [12,15,8,10,9,11],
  [13,11,14,12,8,11],
  [11,10,12,12,8,12]
];

const v83Caps=v83Base.map((a,i)=>
  a.map((_,j)=>i===1&&j===0?20:18)
);

let v83Characters=Array(4).fill(null);
let v83Draft=null;
let v83Slot=-1;
let v83SelectedText='';

const v83Content=document.getElementById('v83Content');
const v83Message=document.getElementById('v83Message');

function v83MessageSet(text){
  v83Message.textContent=text||'';
}

function v83Escape(text){
  return String(text).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[c]));
}

function v83Load(){
  try{
    const saved=JSON.parse(localStorage.getItem(v83Key));
    if(Array.isArray(saved)){
      v83Characters=Array.from({length:4},(_,i)=>{
        const x=saved[i];
        if(!x || typeof x.name!=='string' ||
           !Array.isArray(x.stats) ||
           x.stats.length!==6)return null;
        const cls=Number(x.cls),gender=Number(x.gender);
        if(!Number.isInteger(cls)||cls<0||cls>6 ||
           ![0,1].includes(gender))return null;
        const stats=x.stats.map(Number);
        if(stats.some((n,j)=>!Number.isInteger(n) ||
           n<v83Base[cls][j] ||
           n>v83Caps[cls][j]) ||
           stats.reduce((a,b)=>a+b,0)!==75)return null;
        return {
          name:x.name,cls,gender,stats
        };
      });
    }
  }catch(e){
    v83MessageSet('저장 데이터를 읽지 못했습니다.');
  }
}

function v83Store(){
  try{
    localStorage.setItem(
      v83Key,JSON.stringify(v83Characters)
    );
    return true;
  }catch(e){
    v83MessageSet('브라우저 저장소에 기록할 수 없습니다.');
    return false;
  }
}

function v83OpenMenu(){
  v83Load();
  overlay.classList.add('hidden');
  document.getElementById('v83Menu').hidden=false;
  document.getElementById('v65Original').style.display='';
  status('캐릭터 선택 · 서버 로그인 생략');
  v83List();
}

function v83List(){
  v83Draft=null;
  document.querySelector('#v83Panel h2').textContent=
    '캐릭터 선택';
  v83Content.replaceChildren();

  v83Characters.forEach((character,i)=>{
    const row=document.createElement('div');
    row.className='slot';

    const info=document.createElement('div');
    info.className='slot-info';

    if(character){
      const name=document.createElement('strong');
      name.textContent=character.name;
      const details=document.createElement('div');
      details.textContent=
        v83Names[character.cls]+' · '+
        (character.gender?'여':'남')+' · Lv.1';
      info.append(name,details);
    }else{
      info.textContent='빈 캐릭터 슬롯 '+(i+1);
    }

    const actions=document.createElement('div');
    actions.className='slot-actions';

    const button=document.createElement('button');
    button.textContent=character?'선택·입장':'새 캐릭터';
    button.onclick=()=>character?
      v83Play(i):v83Create(i);
    actions.append(button);

    if(character){
      const remove=document.createElement('button');
      remove.textContent='삭제';
      remove.onclick=()=>{
        if(confirm(character.name+' 캐릭터를 삭제할까요?')){
          v83Characters[i]=null;
          if(v83Store())v83List();
        }
      };
      actions.append(remove);
    }
    row.append(info,actions);
    v83Content.append(row);
  });

  v83MessageSet('저장 위치: 현재 브라우저 · 최대 4명');
}

function v83Create(slot){
  v83Slot=slot;
  v83Draft={
    name:'',cls:1,gender:0,
    stats:[...v83Base[1]]
  };
  v83DrawForm();
}

function v83Remaining(){
  return 75-v83Draft.stats.reduce((a,b)=>a+b,0);
}

function v83DrawForm(){
  document.querySelector('#v83Panel h2').textContent=
    '캐릭터 생성';

  const form=document.createElement('div');

  form.innerHTML=`
    <label>캐릭터 이름
      <input id="v83Name" maxlength="20"
        placeholder="캐릭터 이름" autocomplete="off">
    </label>
    <div class="v83-fields">
      <label>클래스
        <select id="v83Class">${v83Names.map((n,i)=>
          `<option value="${i}">${n}</option>`
        ).join('')}</select>
      </label>
      <label>성별
        <select id="v83Gender">
          <option value="0">남성</option>
          <option value="1">여성</option>
        </select>
      </label>
    </div>
    <h3>능력치 배분</h3>
    <div id="v83Stats"></div>
    <div class="actions">
      <button id="v83Auto" type="button">남은 포인트 배분</button>
      <button id="v83Cancel" type="button">취소</button>
      <button id="v83Save" type="button">생성·저장</button>
    </div>
  `;

  v83Content.replaceChildren(form);

  const name=form.querySelector('#v83Name');
  const cls=form.querySelector('#v83Class');
  const gender=form.querySelector('#v83Gender');

  name.value=v83Draft.name;
  cls.value=String(v83Draft.cls);
  gender.value=String(v83Draft.gender);

  name.oninput=()=>v83Draft.name=name.value;
  gender.onchange=()=>v83Draft.gender=Number(gender.value);
  cls.onchange=()=>{
    v83Draft.cls=Number(cls.value);
    v83Draft.stats=[...v83Base[v83Draft.cls]];
    v83DrawStats();
  };

  form.querySelector('#v83Cancel').onclick=v83List;
  form.querySelector('#v83Auto').onclick=()=>{
    let remaining=v83Remaining();
    while(remaining>0){
      let changed=false;
      for(let i=0;i<6 && remaining>0;i++){
        if(v83Draft.stats[i]<v83Caps[v83Draft.cls][i]){
          v83Draft.stats[i]++;
          remaining--;
          changed=true;
        }
      }
      if(!changed)break;
    }
    v83DrawStats();
  };

  form.querySelector('#v83Save').onclick=()=>{
    const draft=v83Draft;
    const text=draft.name.trim();

    if([...text].length<2 || [...text].length>20){
      v83MessageSet('캐릭터 이름은 2~20자로 입력하세요.');
      return;
    }
    if(v83Remaining()!==0){
      v83MessageSet('75포인트를 전부 배분해야 합니다.');
      return;
    }
    if(v83Characters.some(c=>c && c.name===text)){
      v83MessageSet('이미 존재하는 캐릭터 이름입니다.');
      return;
    }

    v83Characters[v83Slot]={
      name:text,
      cls:draft.cls,
      gender:draft.gender,
      stats:[...draft.stats]
    };

    if(v83Store())v83List();
  };

  v83DrawStats();
}

function v83DrawStats(){
  const box=document.getElementById('v83Stats');
  if(!box)return;
  box.replaceChildren();

  v83StatNames.forEach((label,i)=>{
    const row=document.createElement('div');
    row.className='stat';

    const name=document.createElement('span');
    name.textContent=label;

    const value=document.createElement('strong');
    value.textContent=String(v83Draft.stats[i]);

    const minus=document.createElement('button');
    minus.textContent='−';
    minus.disabled=(
      v83Draft.stats[i]===v83Base[v83Draft.cls][i]
    );
    minus.onclick=()=>{
      v83Draft.stats[i]--;
      v83DrawStats();
    };

    const plus=document.createElement('button');
    plus.textContent='+';
    plus.disabled=(
      v83Remaining()<=0 ||
      v83Draft.stats[i]===v83Caps[v83Draft.cls][i]
    );
    plus.onclick=()=>{
      v83Draft.stats[i]++;
      v83DrawStats();
    };

    row.append(name,value,minus,plus);
    box.append(row);
  });

  v83MessageSet(
    '남은 배분 포인트: '+v83Remaining()
  );
}

function v83Play(index){
  const character=v83Characters[index];
  if(!character)return;

  v83SelectedText=
    character.name+'\n'+
    character.cls+' '+character.gender+' '+
    character.stats.join(' ')+'\n';

  document.getElementById('v83Menu').hidden=true;
  document.getElementById('v65Original').style.display='none';

  status(
    character.name+' · 원본 오프라인 게임 화면 초기화'
  );

  startEngine();
}

</script>
</body></html>
